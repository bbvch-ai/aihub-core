---
name: Test Backend
description: Run tests with coverage on Python backend
inputs:
  github_token:
    description: GitHub token for authentication
    required: true
  working_directory:
    description: Working directory for the module
    required: true
  docker_compose_services:
    description: Space-separated list of Docker Compose services (empty if not needed)
    required: false
  install_ffmpeg:
    description: Install ffmpeg
    required: false
    default: 'false'
  python_version:
    description: Python version to install
    required: false
    default: '3.13'
  huggingface_api_key:
    description: HuggingFace API key for model downloads
    required: false
    default: ''
  swiss_llm_cloud_api_base_url:
    description: Swiss LLM Cloud API base URL (text generation)
    required: false
    default: ''
  swiss_llm_cloud_api_key:
    description: Swiss LLM Cloud API key (text generation)
    required: false
    default: ''
  swiss_llm_cloud_embedding_api_base_url:
    description: Swiss LLM Cloud embedding API base URL
    required: false
    default: ''
  swiss_llm_cloud_embedding_api_key:
    description: Swiss LLM Cloud embedding API key
    required: false
    default: ''
  swiss_llm_cloud_reranking_api_base_url:
    description: Swiss LLM Cloud reranking API base URL
    required: false
    default: ''
  swiss_llm_cloud_reranking_api_key:
    description: Swiss LLM Cloud reranking API key
    required: false
    default: ''
  swiss_llm_cloud_whisper_api_base_url:
    description: Swiss LLM Cloud whisper API base URL
    required: false
    default: ''
  swiss_llm_cloud_whisper_api_key:
    description: Swiss LLM Cloud whisper API key
    required: false
    default: ''
  swiss_llm_cloud_ocr_api_base_url:
    description: Swiss LLM Cloud OCR API base URL
    required: false
    default: ''
  swiss_llm_cloud_ocr_api_key:
    description: Swiss LLM Cloud OCR API key
    required: false
    default: ''
  regenerate_compose:
    description: Regenerate Docker Compose files
    required: false
    default: 'false'
  pytest_timeout_seconds:
    description: Per-test timeout; must stay well below the caller's timeout-minutes
    required: false
    default: '300'
  pytest_markers:
    description: Marker expression passed to pytest -m
    required: false
    default: not flaky
  shard_index:
    description: 1-based index of the test shard this job runs (pytest-split group)
    required: false
    default: '1'
  shard_count:
    description: Number of shards the module's tests are split into; above 1 the job
      uploads raw coverage data for a later merge instead of the final reports
    required: false
    default: '1'
  check_name:
    description: Name of the published test-results check (defaults to working_directory)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Sanitize artifact name
      id: sanitize
      shell: bash
      run: echo "artifact_prefix=$(echo '${{ inputs.working_directory }}' | tr '/'
        '-')" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
    - name: Install Dependencies
      shell: bash
      run: uv sync --all-packages --dev --frozen
    - name: Generate Docker Compose files
      if: inputs.docker_compose_services != '' && inputs.regenerate_compose == 'true'
      shell: bash
      run: make generate-compose
    - name: Pre-pull Docker images (if services needed)
      if: inputs.docker_compose_services != ''
      shell: bash
      run: |
        # Login is best-effort: the mirrored images under ghcr.io/bbvch-ai/aihub-core are public,
        # so an expired/absent token must not fail the job — anonymous pulls still succeed.
        echo "${{ inputs.github_token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
          || echo "::warning::ghcr.io login failed (token may be expired); continuing with anonymous pulls"

        # Pre-pull images in parallel to use cache effectively
        echo "Pre-pulling Docker images for faster startup..."
        docker compose -f infra/docker-compose.dev.yml --env-file .env.dev pull --quiet ${{ inputs.docker_compose_services }} || true
    - name: Add secrets to environment variables
      shell: bash
      run: |
        if [ -n "$HUGGINGFACE_API_KEY" ]; then
          echo "HUGGINGFACE_API_KEY=$HUGGINGFACE_API_KEY" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_API_BASE_URL" ]; then
          echo "SWISS_LLM_CLOUD_API_BASE_URL=$SWISS_LLM_CLOUD_API_BASE_URL" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_API_KEY" ]; then
          echo "SWISS_LLM_CLOUD_API_KEY=$SWISS_LLM_CLOUD_API_KEY" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL" ]; then
          echo "SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL=$SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_EMBEDDING_API_KEY" ]; then
          echo "SWISS_LLM_CLOUD_EMBEDDING_API_KEY=$SWISS_LLM_CLOUD_EMBEDDING_API_KEY" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_RERANKING_API_BASE_URL" ]; then
          echo "SWISS_LLM_CLOUD_RERANKING_API_BASE_URL=$SWISS_LLM_CLOUD_RERANKING_API_BASE_URL" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_RERANKING_API_KEY" ]; then
          echo "SWISS_LLM_CLOUD_RERANKING_API_KEY=$SWISS_LLM_CLOUD_RERANKING_API_KEY" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_WHISPER_API_BASE_URL" ]; then
          echo "SWISS_LLM_CLOUD_WHISPER_API_BASE_URL=$SWISS_LLM_CLOUD_WHISPER_API_BASE_URL" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_WHISPER_API_KEY" ]; then
          echo "SWISS_LLM_CLOUD_WHISPER_API_KEY=$SWISS_LLM_CLOUD_WHISPER_API_KEY" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_OCR_API_BASE_URL" ]; then
          echo "SWISS_LLM_CLOUD_OCR_API_BASE_URL=$SWISS_LLM_CLOUD_OCR_API_BASE_URL" >> .env.dev
        fi
        if [ -n "$SWISS_LLM_CLOUD_OCR_API_KEY" ]; then
          echo "SWISS_LLM_CLOUD_OCR_API_KEY=$SWISS_LLM_CLOUD_OCR_API_KEY" >> .env.dev
        fi
      env:
        HUGGINGFACE_API_KEY: ${{ inputs.huggingface_api_key }}
        SWISS_LLM_CLOUD_API_BASE_URL: ${{ inputs.swiss_llm_cloud_api_base_url }}
        SWISS_LLM_CLOUD_API_KEY: ${{ inputs.swiss_llm_cloud_api_key }}
        SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL: ${{ inputs.swiss_llm_cloud_embedding_api_base_url }}
        SWISS_LLM_CLOUD_EMBEDDING_API_KEY: ${{ inputs.swiss_llm_cloud_embedding_api_key }}
        SWISS_LLM_CLOUD_RERANKING_API_BASE_URL: ${{ inputs.swiss_llm_cloud_reranking_api_base_url }}
        SWISS_LLM_CLOUD_RERANKING_API_KEY: ${{ inputs.swiss_llm_cloud_reranking_api_key }}
        SWISS_LLM_CLOUD_WHISPER_API_BASE_URL: ${{ inputs.swiss_llm_cloud_whisper_api_base_url }}
        SWISS_LLM_CLOUD_WHISPER_API_KEY: ${{ inputs.swiss_llm_cloud_whisper_api_key }}
        SWISS_LLM_CLOUD_OCR_API_BASE_URL: ${{ inputs.swiss_llm_cloud_ocr_api_base_url }}
        SWISS_LLM_CLOUD_OCR_API_KEY: ${{ inputs.swiss_llm_cloud_ocr_api_key }}
    - name: Start Docker services (if needed)
      if: inputs.docker_compose_services != ''
      shell: bash
      run: |
        docker compose -f infra/docker-compose.dev.yml --env-file .env.dev up -d ${{ inputs.docker_compose_services }}
    - name: Install FFmpeg
      if: inputs.install_ffmpeg == 'true'
      shell: bash
      run: make install-ffmpeg
      working-directory: ${{ inputs.working_directory }}
    - name: Setup environment variables for tests
      shell: bash
      run: |
        # Copy .env.dev to .env so that Pydantic BaseSettings can find it
        cp .env.dev .env
        echo "Copied .env.dev to .env for test environment"
    - name: Wait for Docker services to become healthy
      if: inputs.docker_compose_services != ''
      shell: bash
      run: |
        # Re-running `up` on the already started services only waits; it fails as soon as a service
        # turns unhealthy or the budget runs out, instead of letting the tests run against a broken stack.
        docker compose -f infra/docker-compose.dev.yml --env-file .env.dev \
          up -d --wait --wait-timeout 600 ${{ inputs.docker_compose_services }} \
          || { docker compose -f infra/docker-compose.dev.yml ps -a; \
               docker compose -f infra/docker-compose.dev.yml logs --tail=50; exit 1; }
    - name: Run Tests with Coverage and Generate Report
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PYTEST_TIMEOUT_SECONDS: ${{ inputs.pytest_timeout_seconds }}
        PYTEST_MARKERS: ${{ inputs.pytest_markers }}
        SHARD_INDEX: ${{ inputs.shard_index }}
        SHARD_COUNT: ${{ inputs.shard_count }}
      run: |
        pytest_exit_code=0
        if [[ "$SHARD_COUNT" -gt 1 ]]; then
          # Each shard keeps raw coverage data; the merge job combines them into the module's coverage.xml.
          export COVERAGE_FILE=".coverage.shard-${SHARD_INDEX}"
          report_args=(--cov-report=
                       --splits "$SHARD_COUNT" --group "$SHARD_INDEX" --splitting-algorithm least_duration)
        else
          report_args=(--cov-report=xml:coverage.xml --cov-report=term-missing)
        fi
        # A hung test must fail itself, not the job: without a per-test budget it consumes the
        # workflow's timeout-minutes, and the forced stop leaves no junit XML, no coverage and no
        # traceback — the run reports only "The operation was canceled".
        uv run pytest -m "$PYTEST_MARKERS" --cov=. \
                         --timeout="${PYTEST_TIMEOUT_SECONDS}" \
                         "${report_args[@]}" \
                         --junitxml=pytest.xml || pytest_exit_code=$?
        if [[ $pytest_exit_code -eq 5 ]]; then
          echo "No tests found! Creating an empty pytest.xml..."
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > pytest.xml
          echo "NO_TESTS_FOUND=true" >> $GITHUB_ENV
        elif [[ $pytest_exit_code -ne 0 ]]; then
          echo "Some tests failed!"
          echo "TEST_FAIL=true" >> $GITHUB_ENV
        fi
    - name: Upload Coverage Report
      if: inputs.shard_count == '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ steps.sanitize.outputs.artifact_prefix }}-coverage-report
        path: ${{ inputs.working_directory }}/coverage.xml
    - name: Upload Pytest Report
      if: inputs.shard_count == '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ steps.sanitize.outputs.artifact_prefix }}-pytest-report
        path: ${{ inputs.working_directory }}/pytest.xml
    - name: Upload Shard Results
      if: inputs.shard_count != '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ steps.sanitize.outputs.artifact_prefix }}-shard-${{ inputs.shard_index }}
        include-hidden-files: true
        path: |
          ${{ inputs.working_directory }}/.coverage.shard-${{ inputs.shard_index }}
          ${{ inputs.working_directory }}/pytest.xml
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
      if: always()
      with:
        files: |
          ${{ inputs.working_directory }}/pytest.xml
        check_name: ${{ inputs.check_name || inputs.working_directory }}${{ inputs.shard_count != '1' && format(' (shard {0}/{1})', inputs.shard_index, inputs.shard_count) || '' }}
        comment_title: Test results for ${{ inputs.check_name || inputs.working_directory }}
    - name: Check if Tests Failed
      if: env.TEST_FAIL == 'true'
      shell: bash
      run: |-
        echo "Tests have failed!"
        exit 1
