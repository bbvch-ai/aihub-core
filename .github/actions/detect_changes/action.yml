---
name: Detect changed scopes
description: Determine which package scopes a PR touches, with fan-out for shared
  code/deps/infra, so downstream jobs can build per-package dynamic matrices.
inputs:
  base_sha:
    description: Base commit to diff against (PR base). Ignored when force_all is
      true.
    required: false
    default: ''
  force_all:
    description: Treat everything as changed (e.g. push to main). Runs all scopes.
    required: false
    default: 'false'
outputs:
  backend_test_pkgs:
    description: JSON array of backend package short-names to test.
    value: ${{ steps.detect.outputs.backend_test_pkgs }}
  backend_lint_pkgs:
    description: JSON array of backend package short-names to lint.
    value: ${{ steps.detect.outputs.backend_lint_pkgs }}
  frontend_pkgs:
    description: JSON array of frontend package short-names to lint.
    value: ${{ steps.detect.outputs.frontend_pkgs }}
  has_backend_test:
    value: ${{ steps.detect.outputs.has_backend_test }}
  has_backend_lint:
    value: ${{ steps.detect.outputs.has_backend_lint }}
  has_frontend:
    value: ${{ steps.detect.outputs.has_frontend }}
  backup:
    value: ${{ steps.detect.outputs.backup }}
  run_env_check:
    value: ${{ steps.detect.outputs.run_env_check }}
  run_lint_actions:
    value: ${{ steps.detect.outputs.run_lint_actions }}
  run_license_check:
    value: ${{ steps.detect.outputs.run_license_check }}
runs:
  using: composite
  steps:
    - name: Detect changed scopes
      id: detect
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base_sha }}
        FORCE_ALL: ${{ inputs.force_all }}
      run: |-
        set -euo pipefail
        if [ "$FORCE_ALL" = "true" ] || [ -z "$BASE_SHA" ]; then
          CHANGED="$(git ls-files)"
        else
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"
        fi
        m() { grep -qE "$1" <<<"$CHANGED"; }
        RUN_ALL_BACKEND_TEST=false
        m '^(packages/core/|pyproject\.toml$|uv\.lock$|infra/|Makefile$|\.github/actions/(test_backend|detect_changes)/|\.github/workflows/analyze-test-pr\.yml$)' && RUN_ALL_BACKEND_TEST=true
        RUN_ALL_BACKEND_LINT=false
        m '^(pyproject\.toml$|uv\.lock$|\.github/actions/(lint_backend|detect_changes)/|\.github/workflows/lint-pr\.yml$)' && RUN_ALL_BACKEND_LINT=true
        RUN_ALL_FRONTEND=false
        m '^(pnpm-lock\.yaml$|\.github/actions/(lint_frontend|detect_changes)/|\.github/workflows/lint-pr\.yml$)' && RUN_ALL_FRONTEND=true
        BACKEND=(core api agent bot pipeline process sysadmin-api)
        FRONTEND=(web sysadmin-web)
        arr() { printf '%s\n' "$@" | jq -R . | jq -cs 'map(select(length>0))'; }
        bt=(); for p in "${BACKEND[@]}"; do { [ "$RUN_ALL_BACKEND_TEST" = true ] || m "^packages/${p}/"; } && bt+=("$p"); done
        bl=(); for p in "${BACKEND[@]}"; do { [ "$RUN_ALL_BACKEND_LINT" = true ] || m "^packages/${p}/"; } && bl+=("$p"); done
        fe=(); for p in "${FRONTEND[@]}"; do
          if [ "$RUN_ALL_FRONTEND" = true ] || m "^packages/${p}/"; then fe+=("$p");
          elif [ "$p" = sysadmin-web ] && m '^packages/web/'; then fe+=("$p"); fi
        done
        BACKUP=false; m '^packages/backup/' && BACKUP=true
        RUN_ENV_CHECK=false;     m '^(infra/|\.env|Makefile$|pyproject\.toml$|uv\.lock$)' && RUN_ENV_CHECK=true
        RUN_LINT_ACTIONS=false;  m '^\.github/' && RUN_LINT_ACTIONS=true
        RUN_LICENSE_CHECK=false; m '^(pyproject\.toml$|uv\.lock$|pnpm-lock\.yaml$|packages/[^/]+/pyproject\.toml$|packages/(web|sysadmin-web)/package\.json$)' && RUN_LICENSE_CHECK=true
        BT=$(arr "${bt[@]:-}"); BL=$(arr "${bl[@]:-}"); FE=$(arr "${fe[@]:-}")
        {
          echo "backend_test_pkgs=$BT"
          echo "backend_lint_pkgs=$BL"
          echo "frontend_pkgs=$FE"
          echo "has_backend_test=$([ "$BT" != '[]' ] && echo true || echo false)"
          echo "has_backend_lint=$([ "$BL" != '[]' ] && echo true || echo false)"
          echo "has_frontend=$([ "$FE" != '[]' ] && echo true || echo false)"
          echo "backup=$BACKUP"
          echo "run_env_check=$RUN_ENV_CHECK"
          echo "run_lint_actions=$RUN_LINT_ACTIONS"
          echo "run_license_check=$RUN_LICENSE_CHECK"
        } >> "$GITHUB_OUTPUT"
