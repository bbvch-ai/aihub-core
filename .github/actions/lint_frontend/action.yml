---
name: Lint frontend
description: Run linter on Nuxt frontend
inputs:
  github_token:
    description: GitHub token for authentication
    required: true
  working_directory:
    description: Working directory for the linter. Required because corepack resolves
      the pinned pnpm from this directory's package.json.
    required: true
  lockfile:
    description: Path to the lockfile
    required: true
runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
      with:
        node-version: 25.x
    - name: Install pnpm via corepack
      shell: bash
      run: |
        npm install -g --ignore-scripts corepack@0.34.7
        corepack enable pnpm
        corepack install
      working-directory: ${{ inputs.working_directory }}
    - name: Get pnpm store path
      id: pnpm-store-dir-path
      shell: bash
      run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      working-directory: ${{ inputs.working_directory }}
    - name: Cache Node Modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: ${{ inputs.working_directory }}
    - name: Prepare Nuxt
      shell: bash
      run: pnpm exec nuxi prepare && pnpm exec nuxi prepare .app
      working-directory: ${{ inputs.working_directory }}
    - name: Lint frontend
      uses: reviewdog/action-eslint@b6303df522851d0e9abaea654da0222037d97e75  # v1.36.0
      with:
        github_token: ${{ inputs.github_token }}
        reporter: github-pr-review
        workdir: ${{ inputs.working_directory }}
