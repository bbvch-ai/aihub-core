---
name: Lint frontend
description: Run linter on Nuxt frontend
inputs:
  github_token:
    description: GitHub token for authentication
    required: true
  working_directory:
    description: Working directory for the linter. Required because corepack resolves
      the pinned pnpm from this directory's package.json.
    required: true
  lockfile:
    description: Path to the lockfile
    required: true
runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: 25.x
    - name: Install pnpm via corepack
      shell: bash
      run: |
        npm install -g --ignore-scripts corepack@0.34.7
        corepack enable pnpm
        corepack install
      working-directory: ${{ inputs.working_directory }}
    - name: Get pnpm store path
      id: pnpm-store-dir-path
      shell: bash
      run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      working-directory: ${{ inputs.working_directory }}
    - name: Cache Node Modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: ${{ inputs.working_directory }}
    - name: Prepare Nuxt
      shell: bash
      run: pnpm exec nuxi prepare && pnpm exec nuxi prepare .app
      working-directory: ${{ inputs.working_directory }}
    - name: Lint frontend
      uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96  # v1.34.0
      with:
        github_token: ${{ inputs.github_token }}
        reporter: github-pr-review
        workdir: ${{ inputs.working_directory }}
