---
name: SonarCloud Scan
description: Runs the SonarCloud scan on the codebase
inputs:
  sonar_token:
    description: SonarCloud token for authentication
    required: true
  sonar_project_key:
    description: SonarCloud project key
    required: true
  working_directory:
    description: Working directory for the SonarCloud scan
    required: true
  github_token:
    description: GitHub token for authentication
    required: true
  report_coverage:
    description: Report coverage to SonarCloud
    required: false
    default: 'true'
  sonar_organization:
    description: SonarCloud organization
    default: bbv-ai
    required: false
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0
    - name: Sanitize artifact name
      id: sanitize
      shell: bash
      run: echo "artifact_prefix=$(echo '${{ inputs.working_directory }}' | tr '/'
        '-')" >> "$GITHUB_OUTPUT"
    - name: Download Coverage (if exists)
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      if: inputs.report_coverage == 'true'
      with:
        name: ${{ steps.sanitize.outputs.artifact_prefix }}-coverage-report
        path: ${{ inputs.working_directory }}
    - name: Run SonarCloud Without Coverage
      if: inputs.report_coverage == 'false'
      uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5.3.2
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{ inputs.working_directory }}
        args: >
          -Dsonar.projectKey=${{ inputs.sonar_project_key }}
          -Dsonar.organization=${{ inputs.sonar_organization }}
    - name: Run SonarCloud With Coverage
      if: inputs.report_coverage == 'true'
      uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5.3.2
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{ inputs.working_directory }}
        args: >-
          -Dsonar.projectKey=${{ inputs.sonar_project_key }}
          -Dsonar.organization=${{ inputs.sonar_organization }}
          -Dsonar.python.coverage.reportPaths=coverage.xml
