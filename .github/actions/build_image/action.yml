---
name: Build Image
version: 1
inputs:
  release_version:
    description: Docker image tag
    required: true
  image_name:
    description: Docker image name
    required: true
  github_repository_owner:
    description: github repository owner (github.repository_owner)
    required: true
  github_event_repository_name:
    description: github repository name (github.event.repository.name)
    required: true
  context:
    description: context path
    required: true
  file:
    description: Dockerfile path
    required: false
  github_token:
    description: GitHub token for authentication
    required: true
  ssh_key:
    description: ssh key to access private Swiss AI Hub repository
    required: false
  secondary_tag:
    description: 'secondary tag for the image, besides the release version (e.g.,
      latest, nightly, ...) (default: nightly)'
    default: nightly
    required: false
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}
    - name: Build and push Docker image with ssh_key
      if: ${{ inputs.ssh_key != '' }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        secrets: |
          "ssh_key=${{ inputs.ssh_key }}"
        tags: ${{ inputs.secondary_tag != '' && format('ghcr.io/{0}/{1}/{2}:{3},ghcr.io/{0}/{1}/{2}:{4}',
          inputs.github_repository_owner, inputs.github_event_repository_name, inputs.image_name,
          inputs.release_version, inputs.secondary_tag) || format('ghcr.io/{0}/{1}/{2}:{3}',
          inputs.github_repository_owner, inputs.github_event_repository_name, inputs.image_name,
          inputs.release_version) }}
    - name: Build and push Docker image
      if: ${{ inputs.ssh_key == '' }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        build-args: |
          VERSION=${{ inputs.release_version }}
        secrets: |
          "ssh_key=${{ inputs.ssh_key }}"
        tags: ${{ inputs.secondary_tag != '' && format('ghcr.io/{0}/{1}/{2}:{3},ghcr.io/{0}/{1}/{2}:{4}',
          inputs.github_repository_owner, inputs.github_event_repository_name, inputs.image_name,
          inputs.release_version, inputs.secondary_tag) || format('ghcr.io/{0}/{1}/{2}:{3}',
          inputs.github_repository_owner, inputs.github_event_repository_name, inputs.image_name,
          inputs.release_version) }}
