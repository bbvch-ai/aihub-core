---
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# DESIGN GOALS (see also: chore/dependabot-tuning rationale)
#
#   1. ONE PR per ecosystem per run, not dozens. Every entry defines a
#      catch-all `*` group. Crucially, each entry ALSO defines a second group
#      with `applies-to: security-updates` — without it, Dependabot security
#      fixes bypass grouping entirely and open one ungrouped PR per CVE
#      (this is what flooded the repo and burned the Actions budget).
#
#   2. NOT bleeding edge. A `cooldown` window holds back freshly published
#      releases so we never pull a version on its release day — supply-chain
#      safety, since most malicious-package incidents are caught and yanked
#      within days. uv/docker/github-actions use Dependabot `cooldown`. ALL
#      THREE npm entries (web/docs/e2e) do NOT: Dependabot cooldown is broken
#      with pnpm — it desyncs package.json from pnpm-lock.yaml, so every
#      grouped PR fails CI with ERR_PNPM_OUTDATED_LOCKFILE (dependabot-core
#      issues 13165 / 14339). npm uses pnpm-native `minimumReleaseAge` (in
#      each project's pnpm-workspace.yaml), applied during both resolution
#      and lockfile generation so it cannot drift.
#
#   3. Low, predictable cadence. `interval: monthly` → one batched PR per
#      ecosystem per month instead of a weekly stream. CI runs full
#      test+analyze on Dependabot PRs (no actor gating), so PR volume IS
#      the budget lever — keep it minimal.
#
#   4. Majors are excluded from VERSION updates (`version-update:semver-major`)
#      — nuxt 3→4, vue 2→3, tailwind 3→4 etc. need deliberate migration on a
#      feature branch. NOTE: this ignore uses the `version-update:` prefix and
#      therefore does NOT block SECURITY updates — a CVE that requires a major
#      bump (e.g. minimatch 3→10) will still be proposed via the security group.
#
#   5. No major/minor/patch labels are applied. The release workflow
#      (.github/workflows/add-tag.yml) defaults to a patch bump when no
#      version label is present, and `check-version-label` is bypassed for
#      `dependabot[bot]` PRs. Reviewers add `minor` manually if warranted.
#
# Dependabot enforces uniqueness on (package-ecosystem, directory,
# target-branch). npm spans three real pnpm projects (the web app lives at
# /packages/web — there is NO npm project at repo root;
# only uv.lock is at root). docker uses `directories:` to fan out per
# Dockerfile within a single entry. Cooldown/schedule are inlined per entry
# because Dependabot's schema rejects unknown top-level keys (no YAML anchors).
version: 2
updates:
  # ============================================================================
  # Python (uv workspace) — single lockfile at repo root covers all packages/*
  # ============================================================================
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      python:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      python-security:
        applies-to: security-updates
        patterns: ['*']

  # ============================================================================
  # Frontend admin/process UI (pnpm workspace) — admin/process UI + sysadmin-web
  # extender. Repo root (/) IS a pnpm workspace post-flatten; that is where
  # the single root pnpm-lock.yaml lives.
  # ============================================================================
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # NO Dependabot cooldown for npm — it is fundamentally broken with pnpm:
    # cooldown makes Dependabot pin an older version in package.json while the
    # regenerated pnpm-lock.yaml resolves the newer one, so every grouped PR
    # fails CI with ERR_PNPM_OUTDATED_LOCKFILE (dependabot-core issues 13165/14339).
    # The supply-chain lag is instead enforced NATIVELY by pnpm via
    # `minimumReleaseAge` in each project's pnpm-workspace.yaml — pnpm applies
    # it during BOTH resolution and lockfile generation, so no drift.
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      web:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      web-security:
        applies-to: security-updates
        patterns: ['*']

  # ============================================================================
  # Docs site (VitePress, pnpm)
  # ============================================================================
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    # No npm cooldown — pnpm `minimumReleaseAge` in docs/pnpm-workspace.yaml
    # enforces the supply-chain lag instead (see web entry above for why).
    open-pull-requests-limit: 5
    labels: [dependencies, docs]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docs:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      docs-security:
        applies-to: security-updates
        patterns: ['*']

  # ============================================================================
  # E2E tests (Playwright, pnpm)
  # ============================================================================
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    # No npm cooldown — pnpm `minimumReleaseAge` in e2e/pnpm-workspace.yaml
    # enforces the supply-chain lag instead (see web entry above for why).
    open-pull-requests-limit: 5
    labels: [dependencies, tests]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      e2e:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      e2e-security:
        applies-to: security-updates
        patterns: ['*']

  # ============================================================================
  # Docker base images — one entry per Dockerfile
  # ============================================================================
  # NOTE: `python` is excluded because Python releases (e.g. 3.13 → 3.14) are
  # classified as semver-minor by Docker tags but really are feature releases.
  # They depend on transitive wheels (e.g. onnxruntime via markitdown→magika)
  # catching up before they can land. Bump Python deliberately in a separate
  # branch once the dep tree supports the target.
  - package-ecosystem: docker
    directories:
      - /packages/api
      - /packages/bot
      - /packages/backup
      - /packages/pipeline
      - /packages/web
      - /packages/sysadmin-api
      - /packages/sysadmin-web
      - /infra/deployment/docker/playwright
      - /infra/deployment/docker/open-terminal
    schedule:
      interval: monthly
    # docker/github-actions ecosystems only support cooldown.default-days —
    # their tags are not semver-decomposable, so semver-*-days are rejected.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: python
    groups:
      docker:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      docker-security:
        applies-to: security-updates
        patterns: ['*']

  # ============================================================================
  # GitHub Actions — pinned action versions in workflows + reusable actions
  # ============================================================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # github-actions only supports cooldown.default-days (see docker note above).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, ci-cd]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
