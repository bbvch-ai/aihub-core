---
# =============================================================================
# Hotfix Promote (straight to latest, no rc / no staging)
# =============================================================================
# For an urgent fix on an ALREADY-RELEASED line. The fix + patch bump live on
# the kept release/X.Y branch; this publishes it straight to production without
# the sprint / rc / staging cycle:
#   1. resolve  - read the patch-bumped version from the branch, guard it, find
#                 the previous stable (changelog base), detect a backport, and
#                 cut the clean vX.Y.Z tag at the branch HEAD.
#   2. build    - fan out the image builds at the tag. For a normal hotfix the
#                 build also applies :latest (secondary_tag=latest); a backport
#                 does not touch :latest.
#   3. publish  - npm + PyPI (OIDC).
#   4. release  - ONLY after publishes are green: create-release marks the
#                 versioned Release Latest (or a plain release for a backport).
#   5. finalize - move the git `latest` pointer (skipped for a backport).
#
# Then forward-port the fix to main (forward-port-check.yml reminds you).
#
# Note: images get :latest at build time (step 2), slightly ahead of the
# publish gate — an accepted trade-off for hotfix urgency. The Release-Latest
# mark and the git `latest` pointer remain gated on npm/PyPI success.
# =============================================================================
name: Hotfix Promote
run-name: Hotfix promote - ${{ github.event.inputs.release_branch }}
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Release branch carrying the patch-bumped fix (e.g., release/0.317)
        required: true
permissions:
  contents: write
  packages: write
  id-token: write
  actions: write
concurrency:
  group: hotfix-${{ github.event.inputs.release_branch }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve & tag the hotfix version
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_backport: ${{ steps.v.outputs.is_backport }}
      notes_from: ${{ steps.v.outputs.notes_from }}
      secondary_tag: ${{ steps.v.outputs.secondary_tag }}
    steps:
      - name: Checkout the release branch (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.release_branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_FINALIZE_DEPLOY_KEY }}
      - name: Resolve version, guard, and tag
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.inputs.release_branch }}
        run: |
          set -euo pipefail
          core="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if ! printf '%s' "$core" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pyproject version '$core' is not clean semver."; exit 1
          fi
          line="${core%.*}"
          if [ "$BRANCH" != "release/${line}" ]; then
            echo "::error::branch '$BRANCH' does not match pyproject line (expected release/${line})."; exit 1
          fi
          VERSION="v${core}"

          # Backport detection against the current 'Latest' release.
          IS_BACKPORT=false
          set +e
          CUR="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null)"
          set -e
          if [ -n "$CUR" ] && [ "$CUR" != "$VERSION" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$VERSION" "$CUR" | sort -V | tail -n1)"
            [ "$HIGHEST" = "$CUR" ] && IS_BACKPORT=true
          fi
          # Changelog base = highest stable strictly below this version (sort -V
          # predecessor), so a backport stays on its own line instead of walking
          # forward to a newer release.
          STABLES="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$VERSION" || true)"
          NOTES_FROM="$(printf '%s\n%s\n' "$STABLES" "$VERSION" | sort -V | grep -B1 -x "$VERSION" | awk 'NR==1')"
          if [ "$NOTES_FROM" = "$VERSION" ]; then NOTES_FROM=""; fi
          if [ "$IS_BACKPORT" = "true" ]; then SECONDARY=""; else SECONDARY="latest"; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HEAD_SHA="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            # Idempotent rerun: reuse the tag if it already points at this HEAD;
            # otherwise it's stale/mismatched and needs a patch bump or cleanup.
            if [ "$(git rev-list -n1 "$VERSION")" = "$HEAD_SHA" ]; then
              echo "::notice::Tag $VERSION already at HEAD; reusing (idempotent rerun)."
            else
              echo "::error::Tag $VERSION exists at a different commit. Bump the patch (or delete the stale tag) before rerunning hotfix-promote."; exit 1
            fi
          elif git ls-remote --tags origin | grep -q "refs/tags/$VERSION$"; then
            echo "::error::Tag $VERSION exists on the remote. Bump the patch before rerunning hotfix-promote."; exit 1
          else
            git tag -a "$VERSION" -m "Release $VERSION" "$HEAD_SHA"
            git push origin "refs/tags/$VERSION"
          fi
          {
            echo "version=$VERSION"
            echo "is_backport=$IS_BACKPORT"
            echo "notes_from=$NOTES_FROM"
            echo "secondary_tag=$SECONDARY"
          } >> "$GITHUB_OUTPUT"
          echo "Hotfix $VERSION (backport=$IS_BACKPORT, notes_from=${NOTES_FROM:-<none>}, secondary=${SECONDARY:-<none>})"
  fan-out:
    name: Build hotfix images at the tag
    needs: resolve
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch build workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SECONDARY: ${{ needs.resolve.outputs.secondary_tag }}
        run: |-
          set -euo pipefail
          BUILDS=(
            build-agents.yml build-pipelines.yml build-api-and-bot.yml
            build-dagster.yml build-web.yml build-backup.yml build-sysadmin.yml
          )
          for wf in "${BUILDS[@]}"; do
            echo "Dispatching $wf @ $VERSION (secondary_tag='${SECONDARY}')"
            gh workflow run "$wf" --ref "$VERSION" \
              -f release_version="$VERSION" -f secondary_tag="$SECONDARY"
          done
  publish-npm:
    name: Publish npm
    needs: resolve
    uses: ./.github/workflows/publish-npm.yml
    with:
      release_version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
  publish-pypi:
    name: Publish PyPI
    needs: resolve
    uses: ./.github/workflows/publish-pypi.yml
    with:
      release_version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
  build-release:
    name: Publish versioned Release (atomic gate)
    needs: [resolve, publish-npm, publish-pypi]
    uses: ./.github/workflows/create-release.yml
    with:
      release_version: ${{ needs.resolve.outputs.version }}
      channel: ${{ needs.resolve.outputs.is_backport == 'true' && 'backport' || 'latest' }}
      notes_from: ${{ needs.resolve.outputs.notes_from }}
    secrets: inherit
  finalize-latest:
    name: Move git latest pointer
    needs: [resolve, build-release]
    if: needs.resolve.outputs.is_backport != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_FINALIZE_DEPLOY_KEY }}
      - name: Move latest git tag to the hotfix commit
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |-
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$VERSION"
          git push origin refs/tags/latest --force
          echo "Moved 'latest' to $VERSION. Remember to forward-port the fix to main."
