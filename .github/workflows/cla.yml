---
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
concurrency:
  group: cla-${{ github.repository }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write
jobs:
  cla:
    name: CLA Signature Check
    runs-on: ubuntu-24.04-arm
    if: >-
      contains(github.event.comment.body, 'I have read the CONTRIBUTOR_AGREEMENT and
      I hereby sign the CLA') ||
      contains(github.event.comment.body, 'recheck') ||
      github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/bbvch-ai/aihub-core/blob/main/CONTRIBUTOR_AGREEMENT.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot],claude[bot],bbvch-ai/*
          remote-organization-name: bbvch-ai
          remote-repository-name: cla-signatures
          custom-pr-sign-comment: I have read the CONTRIBUTOR_AGREEMENT and I hereby
            sign the CLA
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge, please read our
            [Contributor License Agreement](https://github.com/bbvch-ai/aihub-core/blob/main/CONTRIBUTOR_AGREEMENT.md)
            and sign by posting the following exact phrase as a comment on this PR:
            `I have read the CONTRIBUTOR_AGREEMENT and I hereby sign the CLA`
            > **Note for fork contributors:** If this prompt did not appear automatically,
            > please post the phrase above manually — GitHub restricts bot comments on fork PRs.
          custom-allsigned-prcomment: All contributors have signed the CLA ✅
          lock-pullrequest-aftermerge: false
