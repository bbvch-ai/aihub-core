---
# =============================================================================
# Promote a Release Candidate to Latest (atomic)
# =============================================================================
# Promote a QC-approved rc to a flat, stable release and move the production
# `latest` pointer, but ONLY if both npm and PyPI publish succeed.
#
#   1. resolve          - validate the rc tag, derive the clean vX.Y.Z, detect a
#                         backport (older line), and find the previous stable tag
#                         (the cumulative changelog base).
#   2. prepare-tag      - create the clean vX.Y.Z git tag at the rc commit.
#   3. retag-clean      - retag the tested rc images to :vX.Y.Z (exact bits).
#      publish-npm/pypi - OIDC trusted publishing.
#   4. build-release    - ONLY after every step above is green: create-release
#                         (channel=latest) publishes the versioned Release marked
#                         Latest, with the cumulative changelog. Gating it behind
#                         the publishes keeps `latest` from being marked before
#                         both registries are green.
#   5. set-latest       - move git `latest` + retag :latest (+ mark Release Latest).
#
# A backport (version below the current latest) uses channel=backport: it is
# published as a full release but NOT marked Latest, and set-latest is skipped.
# =============================================================================
name: Promote to Latest
run-name: Promote ${{ github.event.inputs.source_tag }}
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: QC-approved rc tag to promote (e.g., v0.317.0-rc.2)
        required: true
permissions:
  contents: write
  packages: write
  id-token: write
  actions: write
concurrency:
  group: promote-${{ github.event.inputs.source_tag }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve & guard version
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      clean: ${{ steps.r.outputs.clean }}
      source_tag: ${{ steps.r.outputs.source_tag }}
      is_backport: ${{ steps.r.outputs.is_backport }}
      notes_from: ${{ steps.r.outputs.notes_from }}
    steps:
      - name: Checkout (full history for tag discovery)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate and resolve
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SRC: ${{ github.event.inputs.source_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SRC" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::source_tag '$SRC' must be an rc tag, e.g. v0.317.0-rc.2."
            exit 1
          fi
          CLEAN="${SRC%-rc.*}"

          # Backport detection against the current 'Latest' GitHub Release.
          IS_BACKPORT=false
          set +e
          CUR="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null)"
          set -e
          if [ -n "$CUR" ] && [ "$CUR" != "$CLEAN" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$CLEAN" "$CUR" | sort -V | tail -n1)"
            [ "$HIGHEST" = "$CUR" ] && IS_BACKPORT=true
          fi

          # Cumulative changelog base: the highest stable tag strictly BELOW this
          # version (via sort -V predecessor), so a backport bases on its own line
          # instead of walking forward to a newer release.
          STABLES="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$CLEAN" || true)"
          NOTES_FROM="$(printf '%s\n%s\n' "$STABLES" "$CLEAN" | sort -V | grep -B1 -x "$CLEAN" | awk 'NR==1')"
          if [ "$NOTES_FROM" = "$CLEAN" ]; then NOTES_FROM=""; fi

          {
            echo "clean=$CLEAN"
            echo "source_tag=$SRC"
            echo "is_backport=$IS_BACKPORT"
            echo "notes_from=$NOTES_FROM"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $SRC -> $CLEAN (backport=$IS_BACKPORT, notes_from=${NOTES_FROM:-<none>})"

  discover-images:
    name: Discover app images
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: resolve
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout at rc tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_tag }}
      - name: Parse custom app images from compose-config.yml
        id: parse
        run: |
          images=$(yq -o=json '.' infra/deployment/compose-config.yml \
            | jq -c '[.image_tags | to_entries[]
                | select((.value | type) == "object"
                  and (.value | has("build"))
                  and (.value.latest == .key + ":latest"))
                | .key]')
          echo "matrix={\"image\":$images}" >> "$GITHUB_OUTPUT"

  prepare-tag:
    name: Create clean tag
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: resolve
    steps:
      - name: Checkout at rc tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.source_tag }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_FINALIZE_DEPLOY_KEY }}
      - name: Create clean release tag
        env:
          CLEAN: ${{ needs.resolve.outputs.clean }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$CLEAN" >/dev/null 2>&1 \
            || git ls-remote --tags origin | grep -q "refs/tags/$CLEAN$"; then
            echo "::notice::Tag $CLEAN already exists; not recreating."
          else
            git tag -a "$CLEAN" -m "Release $CLEAN" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$CLEAN"
          fi

  retag-clean-docker:
    name: Retag rc images to clean version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, discover-images, prepare-tag]
    permissions:
      packages: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull rc image and push clean tag
        env:
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
          CLEAN: ${{ needs.resolve.outputs.clean }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |-
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/$REPO_NAME/${{ matrix.image }}"
          docker pull "${IMAGE}:${SOURCE_TAG}"
          docker tag "${IMAGE}:${SOURCE_TAG}" "${IMAGE}:${CLEAN}"
          docker push "${IMAGE}:${CLEAN}"

  publish-npm:
    name: Publish npm
    needs: [resolve, prepare-tag]
    uses: ./.github/workflows/publish-npm.yml
    with:
      release_version: ${{ needs.resolve.outputs.clean }}
    secrets: inherit

  publish-pypi:
    name: Publish PyPI
    needs: [resolve, prepare-tag]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      release_version: ${{ needs.resolve.outputs.clean }}
    secrets: inherit

  build-release:
    name: Publish versioned Release (atomic gate)
    # Runs ONLY after every publish + retag succeeded, so the release is marked
    # Latest only when both registries are green. channel=backport keeps an
    # older line from being marked Latest.
    needs: [resolve, retag-clean-docker, publish-npm, publish-pypi]
    uses: ./.github/workflows/create-release.yml
    with:
      release_version: ${{ needs.resolve.outputs.clean }}
      channel: ${{ needs.resolve.outputs.is_backport == 'true' && 'backport' || 'latest' }}
      notes_from: ${{ needs.resolve.outputs.notes_from }}
    secrets: inherit

  promote:
    name: Move latest pointers
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [resolve, build-release]
    if: needs.resolve.outputs.is_backport != 'true'
    steps:
      - name: Dispatch set-latest for the clean version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLEAN: ${{ needs.resolve.outputs.clean }}
        run: |-
          set -euo pipefail
          echo "Both registries green. Promoting $CLEAN to latest via set-latest.yml."
          gh workflow run set-latest.yml -f source_tag="$CLEAN"

  backport-note:
    name: Backport (latest not moved)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [resolve, build-release]
    if: needs.resolve.outputs.is_backport == 'true'
    steps:
      - name: Log backport outcome
        env:
          CLEAN: ${{ needs.resolve.outputs.clean }}
        run: echo "::notice::Published $CLEAN as a backport. 'latest' was not moved."
