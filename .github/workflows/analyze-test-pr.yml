name: Analyze & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, initiative/* ]
    types: [ opened, edited, synchronize, reopened, ready_for_review ]

permissions:
  contents: write
  security-events: write
  packages: read

jobs:
  test-modules:
    name: Test Modules
    runs-on: ubuntu-latest-8-cores
    if: ${{ !github.event.pull_request.draft }}

    permissions:
      id-token: write
      contents: write
      issues: read
      checks: write
      pull-requests: write
      packages: read

    outputs:
      test_report_passed: ${{ steps.test_report.outputs.passed }}
      test_report_failed: ${{ steps.test_report.outputs.failed }}
      test_report_skipped: ${{ steps.test_report.outputs.skipped }}
      test_report_time: ${{ steps.test_report.outputs.time }}
      test_report_url_html: ${{ steps.test_report.outputs.url_html }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: aihub_lib
            docker_compose_services: "postgres nats valkey postgres-ferretdb ferretdb llama-cpp llama-cpp-embedding litellm seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init etcd milvus-standalone neo4j"
          - module: aihub_api
            docker_compose_services: "postgres nats valkey postgres-ferretdb ferretdb llama-cpp llama-cpp-embedding litellm neo4j"
          - module: aihub_pipeline
            docker_compose_services: ""
          - module: aihub_agent
            docker_compose_services: "postgres phoenix nats valkey postgres-ferretdb ferretdb llama-cpp llama-cpp-reranker llama-cpp-embedding litellm seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init etcd milvus-standalone neo4j"
          - module: aihub_bot
            docker_compose_services: "nats valkey postgres-ferretdb ferretdb"
          - module: aihub_process
            docker_compose_services: "postgres phoenix nats valkey postgres-ferretdb ferretdb"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Run Tests
        uses: ./aihub_action/test_backend
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          github_token: ${{ secrets.PAT_GITHUB_READ_PACKAGES }}
          working_directory: ${{ matrix.module }}
          docker_compose_services: ${{ matrix.docker_compose_services }}
          use_local_core: "true"
          install_ffmpeg: ${{ matrix.module == 'aihub_api' }}
          huggingface_api_key: ${{ secrets.HUGGINGFACE_API_KEY }}
          regenerate_compose: "true"

      - name: Clean up SSH keys
        run: |
          rm -rf ~/.ssh
          git config --global --unset url."git@github.com:".insteadOf

  pytest-coverage-comment:
    name: Pytest Coverage Comment
    needs: test-modules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft

    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: write

    strategy:
      fail-fast: false
      matrix:
        module: [ aihub_lib, aihub_api, aihub_agent, aihub_pipeline, aihub_bot, aihub_process ]

    steps:
      - name: Coverage comment
        uses: bbvch-ai/aihub-core/aihub_action/pytest_coverage_comment@main
        with:
          working_directory: ${{ matrix.module }}

  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test-modules
    if: ${{ !github.event.pull_request.draft }}

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: aihub_agent
            sonar_project_key: aihub-core_agents-core
            report_coverage: 'true'
          - folder: aihub_api
            sonar_project_key: aihub-core_api-core
            report_coverage: 'true'
          - folder: aihub_lib
            sonar_project_key: aihub-core_lib-core
            report_coverage: 'true'
          - folder: aihub_pipeline
            sonar_project_key: aihub-core_pipelines-core
            report_coverage: 'true'
          - folder: aihub_bot
            sonar_project_key: aihub-core_bot-core
            report_coverage: 'true'
          - folder: aihub_process
            sonar_project_key: aihub-core_process-core
            report_coverage: 'true'
          - folder: aihub_web
            sonar_project_key: aihub-core_aihub-web
            report_coverage: 'false'

    steps:
      - name: SonarCloud Scan
        uses: bbvch-ai/aihub-core/aihub_action/sonarcloud_scan@main
        with:
          working_directory: ${{ matrix.folder }}
          sonar_project_key: ${{ matrix.sonar_project_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          report_coverage: ${{ matrix.report_coverage }}