---
name: Analyze & Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  security-events: write
  packages: read
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    outputs:
      backend_test_modules: ${{ steps.detect.outputs.backend_test_modules }}
      frontend_folders: ${{ steps.detect.outputs.frontend_folders }}
      backup: ${{ steps.detect.outputs.backup }}
      has_backend_test: ${{ steps.detect.outputs.has_backend_test }}
      has_sonar: ${{ steps.detect.outputs.has_sonar }}
      run_env_check: ${{ steps.detect.outputs.run_env_check }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect changed scopes
        id: detect
        uses: ./.github/actions/detect_changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          force_all: ${{ github.event_name != 'pull_request' }}
  test-modules:
    name: Test Modules
    needs: changes
    if: ${{ needs.changes.outputs.has_backend_test == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      issues: read
      checks: write
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: packages/core
            runner: ubuntu-latest
            docker_compose_services: postgres nats valkey postgres-ferretdb ferretdb
              litellm seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3
              seaweedfs-init etcd-init etcd milvus-standalone neo4j keycloak
          - module: packages/api
            runner: ubuntu-latest
            docker_compose_services: postgres nats valkey postgres-ferretdb ferretdb
              litellm seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3
              seaweedfs-init etcd-init etcd milvus-standalone neo4j
          - module: packages/pipeline
            runner: ubuntu-latest
            docker_compose_services: ''
          - module: packages/agent
            runner: ubuntu-latest
            docker_compose_services: postgres clickhouse langfuse-worker langfuse-web
              otel-collector nats valkey postgres-ferretdb ferretdb litellm seaweedfs-master
              seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init etcd-init
              etcd milvus-standalone neo4j
          - module: packages/bot
            runner: ubuntu-latest
            docker_compose_services: nats valkey postgres-ferretdb ferretdb
          - module: packages/process
            runner: ubuntu-latest
            docker_compose_services: postgres nats valkey postgres-ferretdb ferretdb
              litellm seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3
              seaweedfs-init etcd-init etcd milvus-standalone
          - module: packages/sysadmin-api
            runner: ubuntu-latest
            docker_compose_services: postgres-ferretdb ferretdb
    steps:
      - name: Run Tests
        if: ${{ contains(fromJSON(needs.changes.outputs.backend_test_modules), matrix.module) }}
        uses: ./.github/actions/test_backend
        with:
          github_token: ${{ secrets.PAT_GITHUB_READ_PACKAGES }}
          working_directory: ${{ matrix.module }}
          docker_compose_services: ${{ matrix.docker_compose_services }}
          install_ffmpeg: ${{ matrix.module == 'packages/api' }}
          huggingface_api_key: ${{ secrets.HUGGINGFACE_API_KEY }}
          swiss_llm_cloud_api_base_url: ${{ secrets.SWISS_LLM_CLOUD_API_BASE_URL }}
          swiss_llm_cloud_api_key: ${{ secrets.SWISS_LLM_CLOUD_API_KEY }}
          swiss_llm_cloud_embedding_api_base_url: ${{ secrets.SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL }}
          swiss_llm_cloud_embedding_api_key: ${{ secrets.SWISS_LLM_CLOUD_EMBEDDING_API_KEY }}
          swiss_llm_cloud_reranking_api_base_url: ${{ secrets.SWISS_LLM_CLOUD_RERANKING_API_BASE_URL }}
          swiss_llm_cloud_reranking_api_key: ${{ secrets.SWISS_LLM_CLOUD_RERANKING_API_KEY }}
          swiss_llm_cloud_whisper_api_base_url: ${{ secrets.SWISS_LLM_CLOUD_WHISPER_API_BASE_URL }}
          swiss_llm_cloud_whisper_api_key: ${{ secrets.SWISS_LLM_CLOUD_WHISPER_API_KEY }}
          swiss_llm_cloud_ocr_api_base_url: ${{ secrets.SWISS_LLM_CLOUD_OCR_API_BASE_URL }}
          swiss_llm_cloud_ocr_api_key: ${{ secrets.SWISS_LLM_CLOUD_OCR_API_KEY }}
          regenerate_compose: 'true'
  env-check:
    name: Env / Compose Consistency
    needs: changes
    if: ${{ needs.changes.outputs.run_env_check == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen
      - name: Generate compose files
        run: make generate-compose
      - name: Check env consistency (strict)
        run: make check-env
  pytest-coverage-comment:
    name: Pytest Coverage Comment
    needs: [changes, test-modules]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.has_backend_test == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/core
          - packages/api
          - packages/agent
          - packages/pipeline
          - packages/bot
          - packages/process
          - packages/sysadmin-api
    steps:
      - name: Coverage comment
        if: ${{ contains(fromJSON(needs.changes.outputs.backend_test_modules), matrix.module) }}
        uses: bbvch-ai/aihub-core/.github/actions/pytest_coverage_comment@main
        with:
          working_directory: ${{ matrix.module }}
  sonarcloud-scan:
    name: SonarCloud Scan
    needs: [changes, test-modules]
    if: ${{ always() && needs.changes.outputs.has_sonar == 'true' && needs.test-modules.result != 'failure' && needs.test-modules.result != 'cancelled' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: backend, folder: packages/agent, sonar_project_key: aihub-core_agents-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/api, sonar_project_key: aihub-core_api-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/core, sonar_project_key: aihub-core_lib-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/pipeline, sonar_project_key: aihub-core_pipelines-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/bot, sonar_project_key: aihub-core_bot-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/process, sonar_project_key: aihub-core_process-core,
            report_coverage: 'true'}
          - {scope: backend, folder: packages/sysadmin-api, sonar_project_key: aihub-core_sysadmin-api,
            report_coverage: 'true'}
          - {scope: frontend, folder: packages/web, sonar_project_key: aihub-core_aihub-web,
            report_coverage: 'false'}
          - {scope: frontend, folder: packages/sysadmin-web, sonar_project_key: aihub-core_sysadmin-web,
            report_coverage: 'false'}
          - {scope: backup, folder: packages/backup, sonar_project_key: aihub-core_backup-core,
            report_coverage: 'false'}
    steps:
      - name: SonarCloud Scan
        if: ${{ (matrix.scope == 'backend' && contains(fromJSON(needs.changes.outputs.backend_test_modules), matrix.folder)) || (matrix.scope == 'frontend' && contains(fromJSON(needs.changes.outputs.frontend_folders), matrix.folder)) || (matrix.scope == 'backup' && needs.changes.outputs.backup == 'true') }}
        uses: bbvch-ai/aihub-core/.github/actions/sonarcloud_scan@main
        with:
          working_directory: ${{ matrix.folder }}
          sonar_project_key: ${{ matrix.sonar_project_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          report_coverage: ${{ matrix.report_coverage }}
  test-gate:
    name: Test Gate
    needs:
      - changes
      - test-modules
      - env-check
      - pytest-coverage-comment
      - sonarcloud-scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Verify no gating job failed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |-
          echo "needs results: $RESULTS"
          if echo "$RESULTS" | grep -qE '(^|,)(failure|cancelled)(,|$)'; then
            echo "::error::A required Analyze & Test job failed."
            exit 1
          fi
          echo "All gating jobs passed or were skipped."
