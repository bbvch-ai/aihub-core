---
name: Build and Release Pipelines
run-name: Build Pipelines - ${{ github.event.client_payload.release_version || github.event.inputs.release_version || 'manual' }}
on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      release_version:
        description: Docker image release version
        required: true
        default: manual
      secondary_tag:
        description: Secondary tag to apply (optional), [nightly, latest, *empty*]
        required: false
        default: ''
        options: ['', nightly, latest]
permissions:
  contents: write
  packages: write
jobs:
  # ---------------------------------------------------------------------------
  # Discover which pipelines to build by parsing compose-config.yml
  # ---------------------------------------------------------------------------
  discover-pipelines:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Parse pipeline images from compose-config.yml
        id: parse
        run: |
          # Extract image names where build == "localbuild" and name ends with "_pipeline"
          images=$(python3 -c "
          import yaml, json
          with open('infra/deployment/compose-config.yml') as f:
              config = yaml.safe_load(f)
          images = [k for k, v in config['image_tags'].items() if isinstance(v, dict) and v.get('build') == 'localbuild' and k.endswith('_pipeline')]
          print(json.dumps(images))
          ")
          echo "Discovered pipelines: $images"
          echo "matrix={\"image\":$images}" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: discover-pipelines
    timeout-minutes: 45
    strategy:
      matrix: ${{ fromJson(needs.discover-pipelines.outputs.matrix) }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Extract Tag / Version
        id: get_tag
        run: |
          # 1) Prefer workflow_dispatch input
          if [ -n "${{ github.event.inputs.release_version }}" ] && [ "${{ github.event.inputs.release_version }}" != "manual" ]; then
            TAG_NAME="${{ github.event.inputs.release_version }}"
            echo "Using release version from workflow_dispatch input: $TAG_NAME"

          # 2) Then repository_dispatch client_payload
          elif [ -n "${{ github.event.client_payload.release_version }}" ]; then
            TAG_NAME="${{ github.event.client_payload.release_version }}"
            echo "Using release version from repository_dispatch payload: $TAG_NAME"

          # 3) No Fallback
          else
            echo "❌ No release_version provided. Failing."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: build and release docker image
        uses: ./.github/actions/build_image
        with:
          release_version: ${{ inputs.release_version || steps.get_tag.outputs.tag || format('testing-{0}', github.run_number) }}
          image_name: ${{ matrix.image }}
          github_repository_owner: ${{ github.repository_owner }}
          github_event_repository_name: ${{ github.event.repository.name }}
          context: .
          file: ./packages/pipeline/app/${{ matrix.image }}/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secondary_tag: ${{ github.event_name == 'repository_dispatch' && 'nightly' || github.event.inputs.secondary_tag }}
