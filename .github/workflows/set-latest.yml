name: Set latest Tag on Images

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag to copy'
        required: true

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        image:
          - api
          - web
          - dagster
          - llm_wrapping_agent
          - default_rag_pipeline
          - rag_agent

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.image }}"
          
          # Pull the source image
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"
          
          # Tag with {source_tag}-latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          docker push "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          echo "✓ Tagged ${IMAGE_NAME_SUFFIX}:${SOURCE_TAG}-latest"
          
          # Tag with latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "✓ Tagged ${IMAGE_NAME_SUFFIX}:latest"