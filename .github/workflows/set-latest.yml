---
# =============================================================================
# Set Latest Tag on Images
# =============================================================================
#
# PURPOSE:
#   Promotes a release tag to "latest" for both Git and Docker images.
#   This action retags an existing versioned release (e.g., v1.2.3) as "latest"
#   so that docker-compose.latest.yml deployments pull the promoted version.
#
# USAGE:
#   Trigger manually via workflow_dispatch, providing the source tag to promote.
#   Example: source_tag = "v1.2.3" will tag that commit and its images as "latest"
#
# IMAGE SELECTION (automatically synced with compose-config.yml):
#   Images are dynamically discovered from infra/deployment/compose-config.yml.
#   The selection identifies custom application images we build ourselves:
#
#   PATTERN MATCHED - entries with "build: localbuild" (images we build ourselves):
#     api:
#       build: localbuild  # <-- "localbuild" = included
#       local: api:latest
#       nightly: api:nightly
#       latest: api:latest
#
#   PATTERN NOT MATCHED - simple string values (third-party infrastructure):
#     postgres: pgvector:pg17  # Simple string = excluded
#     valkey: valkey:8.0.5
#
#   PATTERN NOT MATCHED - dicts without "build: localbuild" (external images):
#     some_external:
#       latest: external:v1.0  # No "build: localbuild" = excluded
#
#   The Python script selects entries where:
#     - The value is a dict with build == "localbuild"
#   This ensures only images we build ourselves are retagged, never external images.
#
#   Result: api, bot, web, dagster, and all *_agent/*_pipeline images are
#   automatically included. Adding a new agent or pipeline to compose-config.yml
#   with the standard map structure will automatically include it here.
#
# =============================================================================
name: Set latest Tag on Images
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Source tag to copy
        required: true
jobs:
  # ---------------------------------------------------------------------------
  # Discover which images to retag by parsing compose-config.yml
  # ---------------------------------------------------------------------------
  discover-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Parse custom app images from compose-config.yml
        id: parse
        run: |
          # Extract images that follow the per-release publishing convention:
          # latest == "{service}:latest" indicates the image is rebuilt on every
          # release tag. Project-managed images published out-of-band (postgres ->
          # pgvector-repack:pg17, playwright -> playwright:v1.58.0-jammy) carry a
          # literal tag and must NOT be retagged here.
          images=$(python3 -c "
          import yaml, json
          with open('infra/deployment/compose-config.yml') as f:
              config = yaml.safe_load(f)
          images = [
              k for k, v in config['image_tags'].items()
              if isinstance(v, dict)
              and 'build' in v
              and v.get('latest') == f'{k}:latest'
          ]
          print(json.dumps(images))
          ")
          echo "Discovered images: $images"
          echo "matrix={\"image\":$images}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Move the "latest" git tag to point to the source tag's commit
  # ---------------------------------------------------------------------------
  retag-git:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move latest git tag
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verify source tag exists
          if ! git rev-parse "$SOURCE_TAG" >/dev/null 2>&1; then
            echo "❌ Error: Source tag '$SOURCE_TAG' does not exist"
            exit 1
          fi
          echo "Moving 'latest' tag to same commit as '$SOURCE_TAG'..."
          git tag -f latest "$SOURCE_TAG"
          git push origin refs/tags/latest --force
          echo "Moved 'latest' tag to same commit as $SOURCE_TAG"

  # ---------------------------------------------------------------------------
  # Promote the GitHub Release: clear pre-release flag and mark it as Latest.
  # Runs LAST — if retag-git/retag-docker fail, the release stays a pre-release
  # so git tags, container :latest, and the GitHub Release stay consistent.
  # ---------------------------------------------------------------------------
  promote-release:
    runs-on: ubuntu-latest
    needs: [retag-git, retag-docker]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Promote GitHub Release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if ! gh release view "$SOURCE_TAG" >/dev/null 2>&1; then
            echo "❌ Error: GitHub Release for tag '$SOURCE_TAG' does not exist"
            exit 1
          fi
          echo "Promoting release '$SOURCE_TAG' (clearing pre-release, marking latest)..."
          gh release edit "$SOURCE_TAG" --prerelease=false --latest
          echo "✓ Release '$SOURCE_TAG' promoted to latest"

  # ---------------------------------------------------------------------------
  # Retag Docker images: pull source tag, push as "latest" and "{tag}-latest"
  # ---------------------------------------------------------------------------
  retag-docker:
    runs-on: ubuntu-latest
    needs: [discover-images, retag-git]
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and retag image
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |-
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/\$REPO_NAME/${{ matrix.image }}"

          # Pull the source image
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"

          # Tag with {source_tag}-latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          docker push "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          echo "✓ Tagged ${IMAGE_NAME}:${SOURCE_TAG}-latest"

          # Tag with latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "✓ Tagged ${IMAGE_NAME}:latest"
