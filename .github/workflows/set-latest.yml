name: Set latest Tag on Images

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag to copy'
        required: true

jobs:
  retag-git:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest git tag
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verify source tag exists
          if ! git rev-parse "$SOURCE_TAG" >/dev/null 2>&1; then
            echo "❌ Error: Source tag '$SOURCE_TAG' does not exist"
            exit 1
          fi

          echo "Moving 'latest' tag to same commit as '$SOURCE_TAG'..."
          git tag -f latest "$SOURCE_TAG"
          git push origin refs/tags/latest --force
          echo "Moved 'latest' tag to same commit as $SOURCE_TAG"

  retag-docker:
    runs-on: ubuntu-latest
    needs: retag-git
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        image:
          - api
          - bot
          - web
          - dagster
          - llm_wrapping_agent
          - default_rag_pipeline
          - rag_agent
          - expert_rag_agent
          - expert_asking_agent

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.image }}"
          
          # Pull the source image
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"
          
          # Tag with {source_tag}-latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          docker push "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          echo "✓ Tagged ${IMAGE_NAME}:${SOURCE_TAG}-latest"
          
          # Tag with latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "✓ Tagged ${IMAGE_NAME}:latest"