name: Set latest Tag on Images

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag to copy'
        required: true

jobs:
  retag-git:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest git tag
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verify source tag exists
          if ! git rev-parse "$SOURCE_TAG" >/dev/null 2>&1; then
            echo "❌ Error: Source tag '$SOURCE_TAG' does not exist"
            exit 1
          fi

          # Get the commit SHA that the source tag points to
          COMMIT_SHA=$(git rev-parse "$SOURCE_TAG")
          echo "Source tag '$SOURCE_TAG' points to commit: $COMMIT_SHA"

          # Force update the 'latest' tag to point to the same commit
          git tag -f latest "$COMMIT_SHA"
          echo "✓ Updated local 'latest' tag to point to $COMMIT_SHA"

          # Force push the 'latest' tag
          git push origin refs/tags/latest --force
          echo "✓ Force pushed 'latest' tag to remote"

          # Verify the tag was updated
          git fetch origin --tags
          LATEST_SHA=$(git rev-parse latest)
          if [ "$LATEST_SHA" = "$COMMIT_SHA" ]; then
            echo "✅ Successfully moved 'latest' tag from any previous commit to $COMMIT_SHA"
          else
            echo "❌ Error: Failed to update 'latest' tag"
            exit 1
          fi

  retag-docker:
    runs-on: ubuntu-latest
    needs: retag-git
    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        image:
          - api
          - bot
          - web
          - dagster
          - llm_wrapping_agent
          - default_rag_pipeline
          - rag_agent

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.image }}"
          
          # Pull the source image
          docker pull "${IMAGE_NAME}:${SOURCE_TAG}"
          
          # Tag with {source_tag}-latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          docker push "${IMAGE_NAME}:${SOURCE_TAG}-latest"
          echo "✓ Tagged ${IMAGE_NAME}:${SOURCE_TAG}-latest"
          
          # Tag with latest
          docker tag "${IMAGE_NAME}:${SOURCE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "✓ Tagged ${IMAGE_NAME}:latest"