name: Auto Draft PR for New Branch

on:
  create

jobs:
  create_draft_pr:
    # This job only runs for branch creation events, not tags.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REGISTRY_AUTH_APP_ID }}
          private-key: ${{ secrets.REGISTRY_AUTH_APP_PRIVATE_KEY }}

      - name: Validate branch name and parse scope
        id: branch_parser
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          if [[ ! "$BRANCH_NAME" =~ ^([^/]+)/([^/]+)$ ]]; then
            echo "Error: Branch name '${BRANCH_NAME}' does not follow the required 'base/scope' format."
            exit 1
          fi

          BASE_PART="${BRANCH_NAME%/*}"
          FULL_SCOPE_PART="${BRANCH_NAME#*/}"

          ALLOWED_SCOPES=(
            "agent-custom"
            "chat-backend"
            "confidence"
            "workflows"
            "agent-xp"
            "chat-xp"
            "dagster"
            "tracing"
            "avatar"
            "deploy"
            "guards"
            "aihub"
            "ci-cd"
            "local"
            "micro"
            "bots"
            "debt"
            "rag"
            "iac"
            "ui"
          )

          FOUND_SCOPE="..."
          for scope in "${ALLOWED_SCOPES[@]}"; do
              if [[ "$FULL_SCOPE_PART" == "$scope"* ]]; then
                  FOUND_SCOPE="$scope"
                  break
              fi
          done

          echo "base=${BASE_PART}" >> $GITHUB_OUTPUT
          echo "scope=${FOUND_SCOPE}" >> $GITHUB_OUTPUT

          echo "Branch validated: base='${BASE_PART}', scope='${FOUND_SCOPE}' (from full scope '${FULL_SCOPE_PART}')"

      - name: Create Draft PR
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: main
          TITLE: "[WIP] ${{ steps.branch_parser.outputs.base }}(${{ steps.branch_parser.outputs.scope }}): Work in progress by ${{ github.actor }}"
        run: |
          if gh pr view "${HEAD_BRANCH}" --repo "${REPO}" &>/dev/null; then
            echo "A pull request for branch '${HEAD_BRANCH}' already exists."
            exit 0
          fi

          echo "Creating draft PR with title: ${TITLE}"
          gh pr create \
            --repo "${REPO}" \
            --base "${BASE_BRANCH}" \
            --head "${HEAD_BRANCH}" \
            --title "${TITLE}" \
            --fill \
            --draft