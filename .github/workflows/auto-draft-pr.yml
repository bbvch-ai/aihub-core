name: Auto Draft PR for New Branch
on:
  create:
    branches: [ '*' ]
    tags: [ ]
jobs:
  create-draft-pr:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_type, 'branch')
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REGISTRY_AUTH_APP_ID }}
          private-key: ${{ secrets.REGISTRY_AUTH_APP_PRIVATE_KEY }}

      - name: Create draft PR with GitHub CLI
        run: |
          gh auth login --with-token <<< "${{ steps.generate_token.outputs.token }}"
          if gh pr view ${{ github.ref_name }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "PR already exists for this branch"
            exit 0
          fi
          gh pr create \
            --repo ${{ github.repository }} \
            --base main \
            --head ${{ github.ref_name }} \
            --title "[WIP] ${{ github.ref_name }}" \
            --body "This draft PR was automatically created from branch ${{ github.ref_name }}." \
            --draft