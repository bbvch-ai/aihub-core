---
name: Build and Release Web Image
run-name: Build Web - ${{ github.event.inputs.release_version || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Docker image release version
        required: true
        default: manual
      secondary_tag:
        description: Secondary tag to apply (optional), [nightly, latest, *empty*]
        required: false
        default: ''
        options: ['', nightly, staging, latest]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Extract Tag / Version
        id: get_tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "manual" ]; then
            TAG_NAME="$RELEASE_VERSION"
            echo "Using release version from workflow_dispatch input: $TAG_NAME"
          else
            echo "❌ No release_version provided. Failing."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: build and release docker image
        uses: ./.github/actions/build_image
        with:
          release_version: ${{ inputs.release_version || steps.get_tag.outputs.tag || format('testing-{0}', github.run_number) }}
          image_name: web
          github_repository_owner: ${{ github.repository_owner }}
          github_event_repository_name: ${{ github.event.repository.name }}
          context: .
          file: ./packages/web/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secondary_tag: ${{ github.event.inputs.secondary_tag }}
