---
name: Build and Release Agents
run-name: Build Agents - ${{ github.event.client_payload.release_version || github.event.inputs.release_version || 'manual' }}
on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      release_version:
        description: Docker image release version
        required: true
        default: manual
      secondary_tag:
        description: Secondary tag to apply (optional), [nightly, latest, *empty*]
        required: false
        default: ''
        options: ['', nightly, staging, latest]
permissions:
  contents: write
  packages: write
jobs:
  # ---------------------------------------------------------------------------
  # Discover which agents to build by parsing compose-config.yml
  # ---------------------------------------------------------------------------
  discover-agents:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Parse agent images from compose-config.yml
        id: parse
        run: |
          # Extract image names where build == "localbuild" and name ends with "_agent".
          # yq + jq are both preinstalled on ubuntu-slim; PyYAML is not.
          images=$(yq -o=json '.' infra/deployment/compose-config.yml \
            | jq -c '[.image_tags | to_entries[]
                | select((.value | type) == "object"
                  and .value.build == "localbuild"
                  and (.key | endswith("_agent")))
                | .key]')
          echo "Discovered agents: $images"
          echo "matrix={\"image\":$images}" >> $GITHUB_OUTPUT
  # ---------------------------------------------------------------------------
  # Build the dependency layer every agent image shares once, before the matrix starts: otherwise each parallel
  # build misses the cache after a lockfile change and installs the same dependencies itself.
  # ---------------------------------------------------------------------------
  warm-dependency-cache:
    runs-on: ubuntu-latest
    needs: discover-agents
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the shared builder stage into the cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./packages/agent/app/${{ fromJson(needs.discover-agents.outputs.matrix).image[0] }}/Dockerfile
          target: builder
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:agent
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:agent,mode=max,ignore-error=true
  build:
    runs-on: ubuntu-latest
    needs: [discover-agents, warm-dependency-cache]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agents.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - name: Extract Tag / Version
        id: get_tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          # 1) Prefer workflow_dispatch input
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "manual" ]; then
            TAG_NAME="$RELEASE_VERSION"
            echo "Using release version from workflow_dispatch input: $TAG_NAME"

          # 2) Then repository_dispatch client_payload
          elif [ -n "$CLIENT_PAYLOAD_VERSION" ]; then
            TAG_NAME="$CLIENT_PAYLOAD_VERSION"
            echo "Using release version from repository_dispatch payload: $TAG_NAME"

          # 3) No Fallback
          else
            echo "❌ No release_version provided. Failing."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: Locate Dockerfile
        id: dockerfile
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # Enterprise agents live in ee/, the open ones in packages/agent.
          for root in ee/app packages/agent/app; do
            if [ -f "$root/$IMAGE/Dockerfile" ]; then
              echo "path=./$root/$IMAGE/Dockerfile" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "❌ No Dockerfile for $IMAGE in ee/app or packages/agent/app."
          exit 1
      - name: build and release docker image
        uses: ./.github/actions/build_image
        with:
          release_version: ${{ inputs.release_version || steps.get_tag.outputs.tag || format('testing-{0}', github.run_number) }}
          image_name: ${{ matrix.image }}
          cache_scope: agent
          github_repository_owner: ${{ github.repository_owner }}
          github_event_repository_name: ${{ github.event.repository.name }}
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secondary_tag: ${{ github.event_name == 'repository_dispatch' && 'nightly' || github.event.inputs.secondary_tag }}
  # ---------------------------------------------------------------------------
  # Aggregate matrix results: fail the workflow if any agent build failed
  # ---------------------------------------------------------------------------
  build-summary:
    runs-on: ubuntu-slim
    needs: build
    timeout-minutes: 5
    if: always() && needs.build.result != 'skipped'
    steps:
      - name: Check matrix results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |-
          echo "Aggregate build result: $BUILD_RESULT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::One or more agent builds failed"
            exit 1
          fi
          echo "All agent builds succeeded"
