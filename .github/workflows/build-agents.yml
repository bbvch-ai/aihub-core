---
name: Build and Release Agents
run-name: Build Agents - ${{ github.event.client_payload.release_version || github.event.inputs.release_version || 'manual' }}
on:
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      release_version:
        description: Docker image release version
        required: true
        default: manual
      secondary_tag:
        description: Secondary tag to apply (optional), [nightly, latest, *empty*]
        required: false
        default: ''
        options: ['', nightly, latest]
permissions:
  contents: write
  packages: write
jobs:
  # ---------------------------------------------------------------------------
  # Discover which agents to build by parsing compose-config.yml
  # ---------------------------------------------------------------------------
  discover-agents:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Parse agent images from compose-config.yml
        id: parse
        run: |
          # Extract image names where build == "localbuild" and name ends with "_agent".
          # yq + jq are both preinstalled on ubuntu-slim; PyYAML is not.
          images=$(yq -o=json '.' infra/deployment/compose-config.yml \
            | jq -c '[.image_tags | to_entries[]
                | select((.value | type) == "object"
                  and .value.build == "localbuild"
                  and (.key | endswith("_agent")))
                | .key]')
          echo "Discovered agents: $images"
          echo "matrix={\"image\":$images}" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: discover-agents
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agents.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Extract Tag / Version
        id: get_tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          # 1) Prefer workflow_dispatch input
          if [ -n "$RELEASE_VERSION" ] && [ "$RELEASE_VERSION" != "manual" ]; then
            TAG_NAME="$RELEASE_VERSION"
            echo "Using release version from workflow_dispatch input: $TAG_NAME"

          # 2) Then repository_dispatch client_payload
          elif [ -n "$CLIENT_PAYLOAD_VERSION" ]; then
            TAG_NAME="$CLIENT_PAYLOAD_VERSION"
            echo "Using release version from repository_dispatch payload: $TAG_NAME"

          # 3) No Fallback
          else
            echo "❌ No release_version provided. Failing."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
      - name: build and release docker image
        uses: ./.github/actions/build_image
        with:
          release_version: ${{ inputs.release_version || steps.get_tag.outputs.tag || format('testing-{0}', github.run_number) }}
          image_name: ${{ matrix.image }}
          github_repository_owner: ${{ github.repository_owner }}
          github_event_repository_name: ${{ github.event.repository.name }}
          context: .
          file: ./packages/agent/app/${{ matrix.image }}/Dockerfile
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secondary_tag: ${{ github.event_name == 'repository_dispatch' && 'nightly' || github.event.inputs.secondary_tag }}
  # ---------------------------------------------------------------------------
  # Aggregate matrix results: fail the workflow if any agent build failed
  # ---------------------------------------------------------------------------
  build-summary:
    runs-on: ubuntu-slim
    needs: build
    timeout-minutes: 5
    if: always() && needs.build.result != 'skipped'
    steps:
      - name: Check matrix results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |-
          echo "Aggregate build result: $BUILD_RESULT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::One or more agent builds failed"
            exit 1
          fi
          echo "All agent builds succeeded"
