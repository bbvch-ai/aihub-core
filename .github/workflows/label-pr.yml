name: Label PR

on:
  pull_request:
    branches:
      - main
      - initiative/*
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  labeler:
    name: Add labels to PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/labeler@v5