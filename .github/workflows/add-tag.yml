name: Auto Tag, Gen-Changelog & Release

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  compute-and-initial-tag:
    name: Compute Version & Initial Tag
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.create-tag.outputs.version }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: fetch all history for git diff to work

      - name: Create new version number & tag
        id: create-tag
        run: |
          # List all tags that match the pattern 'v*' and check if the list is empty
          tags=$(git tag -l "v*")
          if [ -z "$tags" ]; then
            echo "No version tags found, starting with v0.0.0"
            latest_tag="v0.0.0"
          else
            # Get the latest tag matching 'v*'
            latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)
          fi
          echo "Latest tag: $latest_tag"

          # Remove the 'v' prefix for version manipulation
          version_number=${latest_tag#"v"}

          # Split into components
          major=$(echo "$version_number" | cut -d. -f1)
          minor=$(echo "$version_number" | cut -d. -f2)
          patch=$(echo "$version_number" | cut -d. -f3)

          # Check PR labels to determine version bump type
          # Default to patch if no label is found
          bump_type="patch"
          
          # Get PR labels using GitHub API
          PR_LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          echo "PR Labels: $PR_LABELS"
          
          # Check for version bump labels
          if echo "$PR_LABELS" | grep -q '"major"'; then
            bump_type="major"
            echo "Found 'major' label - will bump major version"
          elif echo "$PR_LABELS" | grep -q '"minor"'; then
            bump_type="minor"
            echo "Found 'minor' label - will bump minor version"
          elif echo "$PR_LABELS" | grep -q '"patch"'; then
            bump_type="patch"
            echo "Found 'patch' label - will bump patch version"
          else
            echo "No version label found - defaulting to patch bump"
          fi

          # Perform the version bump based on the determined type
          case $bump_type in
            major)
              new_major=$((major + 1))
              new_minor=0
              new_patch=0
              ;;
            minor)
              new_major=$major
              new_minor=$((minor + 1))
              new_patch=0
              ;;
            patch)
              new_major=$major
              new_minor=$minor
              new_patch=$((patch + 1))
              ;;
          esac

          new_tag="v$new_major.$new_minor.$new_patch"
          echo "New tag: $new_tag (bump type: $bump_type)"

          # Expose it to subsequent steps via outputs (not just GITHUB_ENV).
          echo "version=$new_tag" >> $GITHUB_OUTPUT

      - name: Tag the commit and push the tag
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG_NAME="${{ steps.create-tag.outputs.version }}"
          TAG_MESSAGE="Initial Tag for: $TAG_NAME"
          
          # Check if tag already exists (locally or remotely)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            echo "Error: Tag $TAG_NAME already exists. Aborting."
            exit 1
          fi
          
          # Create annotated tag
          TARGET_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" == "null" ] ; then
            # For squash/rebase merges, use the base branch tip after merge
            git fetch origin main
            TARGET_SHA="$(git rev-parse origin/main)"
          fi
          git tag -a "$TAG_NAME" -m "$TAG_MESSAGE" "$TARGET_SHA"
      
          # Verify tag exists locally
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Failed to create tag $TAG_NAME."
            exit 1
          fi
          
          # Push the tag
          echo "Pushing tag $TAG_NAME..."
          git push origin "$TAG_NAME"
          
          # Verify the tag was pushed successfully
          echo "Verifying tag was pushed..."
          git fetch origin --tags
          if git tag -l "$TAG_NAME" | grep -q "^$TAG_NAME$"; then
            echo "Success: Tag $TAG_NAME confirmed on remote."
            
            # Show it's now the latest tag (consistent with your tag discovery logic)
            latest_tag=$(git tag -l "v*" | sort -V | tail -n 1)
            echo "Latest tag is now: $latest_tag"
          else
            echo "Error: Tag $TAG_NAME not found after push."
            echo ""
            echo "Available tags (last 10):"
            git tag -l "v*" | sort -V | tail -10
            echo ""
            echo "Expected: $TAG_NAME"
            exit 1
          fi

  changelog:
    name: Generate Changelog
    needs: [compute-and-initial-tag]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure pipx is available
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry install --only dev

      - name: Setup LLM for Changelog Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Installing llm and llm-gemini plugin..."
          pipx install llm
          pipx inject llm llm-gemini
          
          echo "Setting Gemini API key..."
          llm keys set gemini --value "$GEMINI_API_KEY"
          
          echo "Ensuring changelog script is executable..."
          chmod +x ./generate-changelog.sh

      - name: Generate Changelog
        id: changelog_generator
        run: make changelog

      - name: Upload changelog artifact
        if: ${{ hashFiles('CHANGELOG.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  license-report:
    name: Generate License Report
    needs: [compute-and-initial-tag]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install additional dependencies for license check
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g pnpm

      - name: Set up SSH for GitHub private dependencies
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install Poetry
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          pipx install poetry
          poetry install --only dev

      - name: Update License Report
        id: license_generator
        run: |
          chmod +x ./generate-license.sh
          make license-check

      - name: Upload license artifact
        if: ${{ hashFiles('LICENSES.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: LICENSES.md

  sync-docs:
    name: Sync Documentation Translations
    needs: [ compute-and-initial-tag ]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'aihub_doc/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./aihub_doc
        run: pnpm install

      - name: Ensure pipx is available
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Setup LLM for translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Installing llm and llm-gemini plugin..."
          pipx install llm
          pipx inject llm llm-gemini

          echo "Setting Gemini API key..."
          llm keys set gemini --value "$GEMINI_API_KEY"

      - name: Sync documentation
        working-directory: ./aihub_doc
        run: pnpm run docs:sync

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: aihub_doc/

  finalize-release:
    name: Commit Artifacts & Finalize Tag
    needs: [compute-and-initial-tag, changelog, license-report, sync-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download changelog (if any)
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
        continue-on-error: true

      - name: Download licenses (if any)
        uses: actions/download-artifact@v4
        with:
          name: licenses
          path: .
        continue-on-error: true

      - name: Download docs (if any)
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: aihub_doc/
        continue-on-error: true

      - name: Define directories
        id: define-directories
        run: |
          echo "directories=aihub_pipeline aihub_agent aihub_api aihub_bot aihub_process" >> $GITHUB_OUTPUT

      - name: Set up Python 3.13 and Poetry
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Increment version-tag in project files
        run: |
          VERSION="${{ needs.compute-and-initial-tag.outputs.version }}"
          update_version() {
            echo "Update package version in $1"
            sed -i '/\[tool.poetry\]/,/^version =/ s/version = "[^"]*"/version = "'"$VERSION"'"/' $1
          }
          update_lib_tag() {
            echo "Update package version in $1"
            sed -i '/\[tool.poetry.dependencies.aihub_lib\]/,/^tag =/ s/tag = "[^"]*"/tag = "'"$VERSION"'"/' $1
          }
          update_makefile_tag() {
            echo "Update TAG in $1"
            sed -i 's/^TAG ?= .*/TAG ?= '"$VERSION"'/' $1
          }
          
          directories="${{ steps.define-directories.outputs.directories }}"
          IFS=' ' read -r -a dir_array <<< "$directories"
          for dir in "${dir_array[@]}"; do
            update_version "$dir/pyproject.toml"
            update_lib_tag "$dir/pyproject.toml"
          done
          update_version aihub_lib/pyproject.toml
          update_makefile_tag Makefile

      - name: Install Make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install Dependencies
        run: |
          # Use pip to install pipx as it's not on the runner by default
          python -m pip install --user pipx
          python -m pipx ensurepath
          pipx install poetry==2.2.1
          poetry config virtualenvs.in-project true
          pip install setuptools
          poetry install --no-interaction --no-root

      - name: Set up SSH for GitHub bypass
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Use Remote Core
        run: make use-remote-core

      - name: Install dependencies in sub-directories
        run: |
          directories="${{ steps.define-directories.outputs.directories }}"
          IFS=' ' read -r -a dir_array <<< "$directories"
          for dir in "${dir_array[@]}"; do
            cd "$dir"
            poetry lock
            poetry install --with dev
            cd -
          done

      - name: Update lib version tag in poetry.lock
        run: |
          VERSION="${{ needs.compute-and-initial-tag.outputs.version }}"
          update_version_tag() {
              echo "Update version tag in $1"
              sed -i '/name = "aihub-lib"/,/^version =/ s/version = "[^"]*"/version = "'"$VERSION"'"/' "$1"
          }
          directories="${{ steps.define-directories.outputs.directories }}"
          IFS=' ' read -r -a dir_array <<< "$directories"
          for dir in "${dir_array[@]}"; do
              update_version_tag "$dir/poetry.lock"
          done

      - name: Commit Changelog, License Report, Version Update and Finalize Tag
        run: |
          VERSION="${{ needs.compute-and-initial-tag.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Detect changes (only if files exist and differ)
          changed=false
          if [ -f CHANGELOG.md ]; then
            if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
              git add CHANGELOG.md
              changed=true
              echo "Changelog updated."
            fi
          fi
          if [ -f LICENSES.md ]; then
            if [ -n "$(git status --porcelain LICENSES.md)" ]; then
              git add LICENSES.md
              changed=true
              echo "License report updated."
            fi
          fi
          if [ -n "$(git status --porcelain aihub_doc/)" ]; then
            git add aihub_doc/
            changed=true
            echo "Documentation translations updated."
          fi
          
          git add -A
  
          git commit --amend --no-edit || echo "No file changes to commit."
          git push origin HEAD:${{ github.event.pull_request.base.ref }} --force-with-lease
          

          echo "Creating final tag $VERSION and pushing..."
          git tag -a -f "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}" --force

          echo "Setting 'nightly' tag to same commit as $VERSION..."
          git tag -f nightly "${VERSION}"
          git push origin refs/tags/nightly --force


      - name: Clean up SSH keys
        run: |
          rm -rf ~/.ssh
          git config --global --unset url."git@github.com:".insteadOf

  notify-release:
    name: Notify Release Dispatch
    needs: [finalize-release, compute-and-initial-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.compute-and-initial-tag.outputs.version }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -F event_type=release-ready \
            -F client_payload[release_version]=$VERSION
