name: Auto Tag on Push

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  version-and-tag:
    name: Bump Version & Push Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '1.8.3'

      - name: Create new version number & tag for aihub_lib
        id: create-tag
        run: |
          # List all tags that match the pattern 'v*' and check if the list is empty
          tags=$(git tag -l "v*")
          if [ -z "$tags" ]; then
            echo "No version tags found, starting with v0.0.0"
            latest_tag="v0.0.0"
          else
            # Get the latest tag matching 'v*'
            latest_tag=$(git describe --tags --match "v*" --abbrev=0)
          fi
          echo "Latest tag: $latest_tag"

          # Remove the 'v' prefix for version manipulation
          version_number=${latest_tag#"v"}

          # Split into components
          major=$(echo "$version_number" | cut -d. -f1)
          minor=$(echo "$version_number" | cut -d. -f2)
          patch=$(echo "$version_number" | cut -d. -f3)

          # Increment the minor version
          new_minor=$((minor + 1))
          new_tag="v$major.$new_minor.$patch"
          echo "New tag: $new_tag"

          # Expose it to subsequent steps via outputs (not just GITHUB_ENV).
          echo "version=$new_tag" >> $GITHUB_OUTPUT

      - name: Tag the commit and push the tag
        run: |
          git tag ${{ steps.create-tag.outputs.version }}
          git push origin ${{ steps.create-tag.outputs.version }}
          git pull --rebase origin main

      - name: Increment version-tag in pyproject.toml
        run: |
          VERSION="${{ steps.create-tag.outputs.version }}"
          update_version() {
            echo "Update package version in $1"
            sed -i '/\[tool.poetry\]/,/^version =/ s/version = "[^"]*"/version = "'"$VERSION"'"/' $1
          }
          update_lib_tag() {
            echo "Update package version in $1"
            sed -i '/\[tool.poetry.dependencies.aihub_lib\]/,/^tag =/ s/tag = "[^"]*"/tag = "'"$VERSION"'"/' $1
          }
          update_makefile_tag() {
            echo "Update TAG in $1"
            sed -i 's/^TAG ?= .*/TAG ?= '"$VERSION"'/' $1
          }

          update_version aihub_pipeline/pyproject.toml
          update_lib_tag aihub_pipeline/pyproject.toml
          update_version aihub_agent/pyproject.toml
          update_lib_tag aihub_agent/pyproject.toml
          update_version aihub_api/pyproject.toml
          update_lib_tag aihub_api/pyproject.toml
          update_version aihub_lib/pyproject.toml
          update_makefile_tag Makefile

      - name: Delete existing tag (in case we re-tag)
        run: |
          # Remove local tag if exists
          git tag -d ${{ steps.create-tag.outputs.version }} || true
          # Remove remote tag
          git push origin --delete ${{ steps.create-tag.outputs.version }} || true

      - name: Install Make & tomlkit
        run: |
          sudo apt-get update && sudo apt-get install -y make
          pip install tomlkit

      - name: Set up SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Use Remote Core
        run: |
          make use-remote-core

      - name: Install Poetry in different directories
        run: |
          directories=("aihub_pipeline" "aihub_agent" "aihub_api")
          for dir in "${directories[@]}"; do
            cd "$dir"
            pip install poetry
            poetry lock --no-update
            poetry install --with dev
            cd -
          done

      - name: Clean up SSH keys
        run: |
          rm -rf ~/.ssh
          git config --global --unset url."git@github.com:".insteadOf

      - name: Commit and push changes
        run: |
          VERSION="${{ steps.create-tag.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add aihub_pipeline/pyproject.toml
          git add aihub_pipeline/poetry.lock
          git add aihub_agent/pyproject.toml
          git add aihub_agent/poetry.lock
          git add aihub_api/pyproject.toml
          git add aihub_api/poetry.lock
          git add aihub_lib/pyproject.toml
          git commit -m "ops(bot): Update tag number to ${VERSION} [skip ci]" || true
          git push origin --force

      - name: Create Tag (final)
        run: |
          VERSION="${{ steps.create-tag.outputs.version }}"
          git tag $VERSION
          git push origin $VERSION