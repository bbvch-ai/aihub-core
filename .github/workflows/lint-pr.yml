---
name: Lint Code
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder:
          - packages/agent
          - packages/api
          - packages/core
          - packages/pipeline
          - packages/bot
          - packages/process
          - packages/sysadmin-api
    steps:
      - name: Lint backend
        uses: bbvch-ai/aihub-core/.github/actions/lint_backend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.folder }}
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: [packages/web, packages/sysadmin-web]
    steps:
      - name: Lint frontend
        uses: bbvch-ai/aihub-core/.github/actions/lint_frontend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.folder }}
          lockfile: pnpm-lock.yaml
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Verify GitHub Actions are pinned
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6  # v2.0.0
        with:
          skip_push: 'true'
          verify: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
  license-check:
    name: License Check
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq make
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --all-packages --dev --frozen
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 25.x
      - name: Install pnpm via corepack
        run: |
          npm install -g --ignore-scripts corepack@0.34.7
          corepack enable pnpm
          corepack install
        working-directory: packages/web
      - name: Make license check script executable
        run: chmod +x ./generate-license.sh
      - name: Run license check
        run: make license-check
