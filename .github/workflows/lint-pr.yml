---
name: Lint Code
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    outputs:
      has_backend_lint: ${{ steps.detect.outputs.has_backend_lint }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
      run_lint_actions: ${{ steps.detect.outputs.run_lint_actions }}
      run_license_check: ${{ steps.detect.outputs.run_license_check }}
      backend_lint_folders: ${{ steps.matrix.outputs.backend_lint_folders }}
      frontend_lint_folders: ${{ steps.matrix.outputs.frontend_lint_folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect changed scopes
        id: detect
        uses: ./.github/actions/detect_changes
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          force_all: ${{ github.event_name != 'pull_request' }}
      - name: Build matrices
        id: matrix
        env:
          BL: ${{ steps.detect.outputs.backend_lint_pkgs }}
          FE: ${{ steps.detect.outputs.frontend_pkgs }}
        run: |
          set -euo pipefail
          {
            echo "backend_lint_folders=$(jq -cn --argjson a "$BL" '$a | map("packages/" + .)')"
            echo "frontend_lint_folders=$(jq -cn --argjson a "$FE" '$a | map("packages/" + .)')"
          } >> "$GITHUB_OUTPUT"
  lint-backend:
    name: Lint Backend
    needs: changes
    if: ${{ needs.changes.outputs.has_backend_lint == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.backend_lint_folders) }}
    steps:
      - name: Lint backend
        uses: bbvch-ai/aihub-core/.github/actions/lint_backend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.folder }}
  lint-frontend:
    name: Lint Frontend
    needs: changes
    if: ${{ needs.changes.outputs.has_frontend == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.frontend_lint_folders) }}
    steps:
      - name: Lint frontend
        uses: bbvch-ai/aihub-core/.github/actions/lint_frontend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.folder }}
          lockfile: pnpm-lock.yaml
  lint-actions:
    name: Lint Actions
    needs: changes
    if: ${{ needs.changes.outputs.run_lint_actions == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Verify GitHub Actions are pinned
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6  # v2.0.0
        with:
          skip_push: 'true'
          verify: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
  license-check:
    name: License Check
    needs: changes
    if: ${{ needs.changes.outputs.run_license_check == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq make
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --all-packages --dev --frozen
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 25.x
      - name: Install pnpm via corepack
        run: |
          npm install -g --ignore-scripts corepack@0.34.7
          corepack enable pnpm
          corepack install
        working-directory: packages/web
      - name: Make license check script executable
        run: chmod +x ./generate-license.sh
      - name: Run license check
        run: make license-check
  lint-gate:
    name: Lint Gate
    needs:
      - changes
      - lint-backend
      - lint-frontend
      - lint-actions
      - license-check
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Verify no lint job failed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |-
          echo "needs results: $RESULTS"
          if echo "$RESULTS" | grep -qE '(^|,)(failure|cancelled)(,|$)'; then
            echo "::error::A required Lint job failed."
            exit 1
          fi
          echo "All gating jobs passed or were skipped."
