name: Lint Code

on:
  pull_request:
    branches: [ main, initiative/* ]
    types: [ opened, edited, synchronize, reopened, ready_for_review ]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    strategy:
      matrix:
        folder: [ aihub_agent, aihub_api, aihub_lib, aihub_pipeline, aihub_bot ]

    steps:
      - name: Lint backend
        uses: bbvch-ai/aihub-core/aihub_action/lint_backend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.folder }}

  lint-frontend:
    name: Lint Web
    runs-on: ubuntu-latest

    steps:
      - name: Lint frontend
        uses: bbvch-ai/aihub-core/aihub_action/lint_frontend@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: aihub_web/aihub_web
          lockfile: aihub_web/aihub_web/pnpm-lock.yaml