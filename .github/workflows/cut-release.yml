---
# =============================================================================
# Cut Release Branch (freeze) + bump main
# =============================================================================
# The end-of-sprint freeze, as ONE automated action:
#   1. Cut release/X.Y at a chosen nightly build. Creating the branch triggers
#      build-rc.yml (rc.1 = the frozen snapshot) and forward-port-check.yml.
#   2. Bump main to the next minor, committed DIRECTLY to main via the deploy
#      key (main is protected, but RELEASE_FINALIZE_DEPLOY_KEY has bypass), so
#      no bump PR and no manual merge — nightly resumes on the new minor at once.
#
# After the cut, drop out-of-scope tickets with `git revert` on the branch and
# fix remaining bugs — each push builds the next rc. Promote a QC-approved rc
# with promote.yml.
#
# RELEASE_FINALIZE_DEPLOY_KEY bypasses main's branch protection. It is CI-owned,
# stored as a repo secret, used only by release workflows, and rotated on the
# standard cadence; the bump is a mechanical version-only commit, so bypassing
# the PR gate for it is acceptable. Both the branch cut and the bump are
# idempotent, so rerunning this workflow to finish a partial run is safe.
# =============================================================================
name: Cut Release Branch
run-name: Cut release from ${{ github.event.inputs.source_tag }}
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Nightly build to freeze from (e.g., v0.317.0-nightly.891)
        required: true
permissions:
  contents: write
concurrency:
  group: cut-release
  cancel-in-progress: false
jobs:
  cut:
    name: Create release/X.Y & bump main
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      # Deploy key: the pushed branch must trigger CI, and the bump commit must
      # bypass main's branch protection. GITHUB_TOKEN can do neither.
      - name: Checkout main (full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_FINALIZE_DEPLOY_KEY }}
      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
      - name: Cut the release branch at the nightly commit
        id: cut
        env:
          SRC: ${{ github.event.inputs.source_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SRC" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$'; then
            echo "::error::source_tag '$SRC' must be a nightly tag, e.g. v0.317.0-nightly.891."
            exit 1
          fi
          if ! git rev-parse "$SRC" >/dev/null 2>&1; then
            echo "::error::nightly tag $SRC not found."; exit 1
          fi
          core="${SRC#v}"; core="${core%%-*}"      # 0.317.0
          major="${core%%.*}"; rest="${core#*.}"; minor="${rest%%.*}"
          line="${major}.${minor}"                   # 0.317
          branch="release/${line}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent: a rerun (e.g. after the bump step failed) must not abort
          # just because the branch is already there — skip the cut, finish the bump.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::branch $branch already exists; skipping cut, continuing to the bump."
          else
            TARGET="$(git rev-list -n 1 "$SRC")"
            git branch "$branch" "$TARGET"
            git push origin "refs/heads/${branch}"
            echo "Cut $branch at $TARGET (from $SRC)."
          fi
          {
            echo "line=$line"
            echo "next=${major}.$((minor + 1)).0"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
      - name: Bump main to the next minor (direct, deploy-key bypass, idempotent)
        env:
          NEXT: ${{ steps.cut.outputs.next }}
          BRANCH: ${{ steps.cut.outputs.branch }}
          LINE: ${{ steps.cut.outputs.line }}
        run: |-
          set -euo pipefail
          main_core="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          # Idempotent + minor-skip guard: only bump when main is still on the cut
          # line. If it already moved (rerun after a successful bump, or someone
          # bumped it), skip cleanly rather than skipping a minor or erroring.
          if [ "$main_core" = "$NEXT" ] || [ "${main_core%.*}" != "$LINE" ]; then
            echo "::notice::main is on '$main_core' (not on cut line '$LINE'); bump already done — skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          make version-bump VERSION="$NEXT"
          git add -A
          git commit -m "chore(swiss-ai-hub): Bump main to v${NEXT} after cutting ${BRANCH}"
          # Retry rebase+push to survive a human pushing to main in the same window.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Bumped main to v${NEXT}. Nightly resumes on the new minor."
              exit 0
            fi
            echo "::warning::push to main failed (attempt ${attempt}/3); retrying..."
            sleep 5
          done
          echo "::error::could not push the bump after 3 attempts. ${BRANCH} is cut; rerun to finish the bump."
          exit 1
