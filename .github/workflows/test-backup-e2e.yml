---
name: Backup E2E Tests
on:
  push:
    branches: [main]
    paths:
      - packages/backup/**
      - infra/deployment/templates/docker-compose.yml.j2
      - infra/deployment/compose-config.yml
  pull_request:
    branches: [main, initiative/*]
    paths:
      - packages/backup/**
      - infra/deployment/templates/docker-compose.yml.j2
      - infra/deployment/compose-config.yml
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  packages: read
jobs:
  e2e-backup:
    name: Backup E2E
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Generate Docker Compose files
        run: make generate-compose
      - name: Login to GHCR
        run: echo "${{ secrets.PAT_GITHUB_READ_PACKAGES }}" | docker login ghcr.io
          -u ${{ github.actor }} --password-stdin
      - name: Build backup image
        run: docker compose -f infra/docker-compose.dev.yml --env-file .env.dev build
          backup-code
      - name: Pull infrastructure images
        run: |
          docker compose -f infra/docker-compose.dev.yml --env-file .env.dev pull --quiet \
            postgres postgres-ferretdb ferretdb neo4j clickhouse valkey nats \
            seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init \
            etcd etcd-init milvus-standalone
      - name: Start services
        run: |
          docker compose -f infra/docker-compose.dev.yml --env-file .env.dev up -d \
            backup-code backup-webserver backup-daemon postgres postgres-ferretdb ferretdb neo4j clickhouse valkey nats \
            seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init \
            etcd etcd-init milvus-standalone
      - name: Wait for services to become healthy
        run: |
          echo "Waiting for backup container to become healthy..."
          MAX_WAIT=600
          INTERVAL=10
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' backup-code 2>/dev/null || echo "not_found")
            echo "  backup container status: $STATUS ($ELAPSED/${MAX_WAIT}s)"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backup container is healthy — all dependencies ready."
              docker ps --format "table {{.Names}}\t{{.Status}}"
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Backup container is unhealthy. Logs:"
              docker logs backup-code --tail=50
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Timed out waiting for backup container after ${MAX_WAIT}s"
            docker ps --format "table {{.Names}}\t{{.Status}}"
            docker logs backup-code --tail=50
            exit 1
          fi
      - name: Verify service connectivity
        run: |
          wait_for_port() {
            local name=$1 url=$2 max_wait=${3:-120}
            local elapsed=0
            echo "Waiting for $name at $url..."
            while [ $elapsed -lt $max_wait ]; do
              if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
                echo "  $name is reachable (${elapsed}s)"
                return 0
              fi
              sleep 5
              elapsed=$((elapsed + 5))
            done
            echo "  ERROR: $name not reachable after ${max_wait}s"
            return 1
          }
          wait_for_port "Dagster" "http://127.0.0.1:3004/server_info"
          wait_for_port "Milvus REST API" "http://127.0.0.1:9091/healthz" 180
          wait_for_port "S3 (SeaweedFS)" "http://127.0.0.1:9000/status"
          echo "All services reachable from host."
      - name: Copy env for tests
        run: cp .env.dev .env
      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen
      - name: Run E2E tests
        id: pytest
        continue-on-error: true
        working-directory: packages/backup
        run: uv run pytest -m integration -v --timeout=600 --junitxml=e2e-pytest.xml
      - name: Stop services
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml --env-file .env.dev down
          --remove-orphans
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backup-e2e-test-report
          path: packages/backup/e2e-pytest.xml
      - name: Check test results
        if: steps.pytest.outcome == 'failure'
        run: exit 1
