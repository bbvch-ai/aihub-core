---
name: Backup E2E Tests
on:
  push:
    branches: [main]
    paths:
      - aihub_backup/**
      - deployment/templates/docker-compose.yml.j2
      - deployment/compose-config.yml
  pull_request:
    branches: [main, initiative/*]
    paths:
      - aihub_backup/**
      - deployment/templates/docker-compose.yml.j2
      - deployment/compose-config.yml
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  packages: read
jobs:
  e2e-backup:
    name: Backup E2E
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Configure Git Authentication
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: Generate Docker Compose files
        run: make generate-compose
      - name: Login to GHCR
        run: echo "${{ secrets.PAT_GITHUB_READ_PACKAGES }}" | docker login ghcr.io
          -u ${{ github.actor }} --password-stdin
      - name: Build backup image
        run: docker compose -f docker-compose.build.yml --env-file .env.dev build
          backup
      - name: Pull infrastructure images
        run: |
          docker compose -f docker-compose.build.yml --env-file .env.dev pull --quiet \
            postgres postgres-ferretdb neo4j clickhouse valkey nats \
            seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init \
            etcd etcd-init milvus-standalone
      - name: Start services
        run: |
          docker compose -f docker-compose.build.yml --env-file .env.dev up -d \
            backup postgres postgres-ferretdb neo4j clickhouse valkey nats \
            seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3 seaweedfs-init \
            etcd etcd-init milvus-standalone
      - name: Wait for services to become healthy
        run: |
          echo "Waiting for Docker services to become healthy..."
          MAX_WAIT=600
          INTERVAL=5
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            UNHEALTHY=$(docker ps --format "{{.Names}}: {{.Status}}" | grep -i "unhealthy" || true)
            STARTING=$(docker ps --format "{{.Names}}: {{.Status}}" | grep -i "starting" || true)
            if [ -z "$UNHEALTHY" ] && [ -z "$STARTING" ]; then
              echo "All Docker services are healthy!"
              docker ps
              break
            fi
            echo "Still waiting ($ELAPSED/${MAX_WAIT}s)..."
            [ -n "$UNHEALTHY" ] && echo "  unhealthy: $UNHEALTHY"
            [ -n "$STARTING" ] && echo "  starting: $STARTING"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Timed out waiting for services after ${MAX_WAIT}s"
            docker ps
            docker compose -f docker-compose.build.yml logs --tail=50
            exit 1
          fi
      - name: Copy env for tests
        run: cp .env.dev .env
      - name: Install dependencies
        run: uv sync --all-packages --dev --frozen
      - name: Run E2E tests
        id: pytest
        continue-on-error: true
        working-directory: aihub_backup
        run: uv run pytest tests/test_e2e.py -v --timeout=600 --junitxml=e2e-pytest.xml
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.build.yml --env-file .env.dev down --remove-orphans
      - name: Clean up SSH keys
        if: always()
        run: |
          rm -rf ~/.ssh
          git config --global --unset url."git@github.com:".insteadOf || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-e2e-test-report
          path: aihub_backup/e2e-pytest.xml
      - name: Check test results
        if: steps.pytest.outcome == 'failure'
        run: exit 1
