---
name: Create GitHub Release
run-name: Create Release - ${{ github.event.client_payload.release_version || github.event.inputs.release_version || 'manual' }}
on:
  workflow_call:
    inputs:
      release_version:
        description: Release version (e.g., v0.264.0)
        required: true
        type: string
  repository_dispatch:
    types: [release-ready]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (e.g., v0.264.0)
        required: true
permissions:
  contents: write
jobs:
  create-release:
    name: Create GitHub Release with Deployment Bundles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Extract version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ -n "$CLIENT_PAYLOAD_VERSION" ]; then
            VERSION="$CLIENT_PAYLOAD_VERSION"
          else
            echo "No release_version provided. Failing."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Checkout at release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0
      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Generate release compose files
        run: make generate-release TAG="${{ steps.version.outputs.version }}"
      - name: Verify release bundles
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in "swissaihub-${VERSION}" "swissaihub-${VERSION}-gpu"; do
            DEST="dist/release/${variant}"
            echo "Checking ${variant}..."
            test -f "${DEST}/docker-compose.yml"
            test -f "${DEST}/.env.template"
            test -f "${DEST}/setup-env.sh"
            echo "  OK"
          done
      - name: Format release YAML files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in "swissaihub-${VERSION}" "swissaihub-${VERSION}-gpu"; do
            DEST="dist/release/${variant}"
            echo "Formatting YAML files in ${variant}..."
            find "${DEST}" -name '*.yml' -o -name '*.yaml' | xargs uv run yamlfix
            echo "  OK"
          done
      - name: Create tar.gz archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "swissaihub-${VERSION}.tar.gz" -C "dist/release" "swissaihub-${VERSION}"
          tar -czf "swissaihub-${VERSION}-gpu.tar.gz" -C "dist/release" "swissaihub-${VERSION}-gpu"
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Auto-generate the "What's Changed" PR list (title + #number + author
          # + full-changelog compare link) so release managers can trace each PR
          # back to its ticket and see the features/bugs in the release.
          #
          # Baseline matters: for STAGING and STABLE releases we start the notes
          # at the last STABLE tag, so they list EVERY PR in the release, not
          # just the delta since the previous pre-release. Nightly keeps the
          # default baseline (delta since the previous nightly).
          ARGS=(--generate-notes)
          case "$VERSION" in
            *-nightly.*) : ;;
            *)
              core="${VERSION%-*}"
              last_stable="$(git tag -l 'v*' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -vx "$core" \
                | sort -V | tail -1)"
              if [ -n "$last_stable" ]; then
                ARGS+=(--notes-start-tag "$last_stable")
                echo "Release-scope notes: ${last_stable}..${VERSION}"
              fi
              ;;
          esac

          gh release create "${VERSION}" \
            --title "Swiss AI Hub ${VERSION}" \
            "${ARGS[@]}" \
            --prerelease \
            --latest=false \
            "swissaihub-${VERSION}.tar.gz" \
            "swissaihub-${VERSION}-gpu.tar.gz"
