name: Create GitHub Release
run-name: "Create Release — ${{ github.event.client_payload.release_version || github.event.inputs.release_version || 'manual' }}"

on:
  repository_dispatch:
    types: [ release-ready ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v0.264.0)'
        required: true
  # TODO: Remove before merging — temporary trigger for testing
  push:
    branches: [ feat/gh-releases ]

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release with Deployment Bundles
    runs-on: ubuntu-latest
    # TODO: Restore original condition before merging: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    steps:
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          elif [ -n "${{ github.event.client_payload.release_version }}" ]; then
            VERSION="${{ github.event.client_payload.release_version }}"
          else
            # TODO: Remove before merging — fallback for push-triggered test runs
            VERSION="v0.0.0-test"
            echo "No release_version provided. Using test version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          # TODO: Restore to steps.version.outputs.version before merging
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install jinja2 pyyaml yamlfix

      - name: Generate release compose files
        run: |
          python deployment/generate_compose.py \
            --release \
            --tag "${{ steps.version.outputs.version }}" \
            --output-dir dist/release

      - name: Verify release bundles
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in "swissaihub-${VERSION}" "swissaihub-${VERSION}-gpu"; do
            DEST="dist/release/${variant}"
            echo "Checking ${variant}..."
            test -f "${DEST}/docker-compose.yml"
            test -f "${DEST}/.env.template"
            test -f "${DEST}/setup-env.py"
            echo "  OK"
          done

      - name: Format release YAML files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in "swissaihub-${VERSION}" "swissaihub-${VERSION}-gpu"; do
            DEST="dist/release/${variant}"
            echo "Formatting YAML files in ${variant}..."
            find "${DEST}" -name '*.yml' -o -name '*.yaml' | xargs yamlfix
            echo "  OK"
          done

      - name: Create tar.gz archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "swissaihub-${VERSION}.tar.gz" -C "dist/release/swissaihub-${VERSION}" .
          tar -czf "swissaihub-${VERSION}-gpu.tar.gz" -C "dist/release/swissaihub-${VERSION}-gpu" .

      - name: Extract changelog for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk '/^## \['"${VERSION}"'\]/{found=1; next} /^---$/{if(found) exit} found{print}' CHANGELOG.md > release-notes.md

          # If no changelog section found, provide a fallback
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${VERSION}" \
            --title "Swiss AI Hub ${VERSION}" \
            --notes-file release-notes.md \
            "swissaihub-${VERSION}.tar.gz" \
            "swissaihub-${VERSION}-gpu.tar.gz"
