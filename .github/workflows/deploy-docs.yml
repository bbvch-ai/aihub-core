name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feat/aihub-claude-code'
    paths:
      - 'aihub_doc/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'aihub_doc/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./aihub_doc
        run: pnpm install

      - name: Setup LLM for translation
        run: |
          pip install llm llm-gemini
          llm keys set gemini --key ${{ secrets.GEMINI_API_KEY }}

      - name: Sync documentation
        working-directory: ./aihub_doc
        run: pnpm run docs:sync

      - name: Build documentation
        working-directory: ./aihub_doc
        run: pnpm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./aihub_doc/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4