services:
  llama-cpp:
    container_name: llama-cpp
    platform: "linux/amd64"
    image: ghcr.io/bbvch-ai/aihub-core/llama.cpp:server-cuda-b6894
    restart: always
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/llamacpp-data:/data
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/llamacpp-cache:/root/.cache/llama.cpp
    environment:
      HF_HOME: /root/.cache/huggingface
    command: >
      -hf google/gemma-3-12b-it-qat-q4_0-gguf
      --hf-token ${HUGGINGFACE_API_KEY}
      --alias gemma-3-12b
      --port 8182
      --host 0.0.0.0
      -c 8196
      -ngl -1