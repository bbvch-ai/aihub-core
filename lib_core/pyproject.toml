[tool.poetry]
name = "lib_core"
version = "0.1.0"
description = ""
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <3.12"
mongoengine = "^0.29.1"
azure-cognitiveservices-speech = "^1.41.1"
azure-mgmt-cosmosdb = "^9.7.0"
azure-mgmt-resource = "^23.2.0"
azure-mgmt-search = "^9.1.0"
azure-mgmt-datalake-store = "^0.5.0"
azure-mgmt-storage = "^21.2.1"
llama-index-core = "^0.12.3"
llama-index-vector-stores-azureaisearch = "^0.3.0"
llama-index-storage-docstore-mongodb = "^0.3.0"
networkx = "^3.4.2"
flatdict = "^4.0.1"
azure-ai-documentintelligence = "^1.0.0b4"
pydantic-settings = "^2.6.1"
python-i18n = "^0.3.9"
nats-py = "^2.9.0"
pyyaml = "^6.0.2"
llama-index-vector-stores-milvus = "^0.3.0"
fsspec = "^2024.10.0"
llama-index-readers-file = "^0.4.1"
bson = "^0.5.10"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
isort = "^5.13.2"
matplotlib = "^3.9.3"
pytest-bdd = "^8.1.0"
toml-sort = "^0.24.2"
black = {extras = ["jupyter"], version = "^24.10.0"}
mypy = "^1.13.0"
types-pyyaml = "^6.0.12.20240917"
types-networkx = "^3.4.2.20241115"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
plugins = ['pydantic.mypy']

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''