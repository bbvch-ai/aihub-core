---
# ===================================================================
# Single Source of Truth for Docker Compose Generation (v2)
# ===================================================================
# This lean configuration file contains ONLY the values that change
# between stages. All static structure and rendering logic now lives
# in the Jinja2 template.
#
# CONVENTIONS:
# 1. A service is ONLY included if an image_tag is defined for the
#    current stage/hardware. No tag = no service.
# 2. To build a service from source, use the special tag 'localbuild'.
# ===================================================================
global:
  registry_prefix: ghcr.io/bbvch-ai/aihub-core/
  volume_root: ${VOLUME_ROOT:-./.docker-volumes}
# -------------------------------------------------------------------
# Centralized Image Tag Management
# Defines which services exist in which stage and their versions.
# -------------------------------------------------------------------
image_tags:
  # --- Core Infrastructure (mostly static) ---
  seaweedfs: seaweedfs:4.01
  aws_cli: aws-cli-alpine:3.22.1
  etcd: etcd:v3.5.25
  milvus: milvus:v2.6.7
  attu: attu:v2.5.12
  postgres: pgvector-repack:pg17
  clickhouse: clickhouse/clickhouse-server:25.8
  langfuse_web: langfuse/langfuse:3
  langfuse_worker: langfuse/langfuse-worker:3
  nats: nats:2.11.4
  valkey: valkey:8.0.5
  ferretdb: ferretdb:2.5.0
  neo4j: neo4j:5.26.16-community
  litellm: litellm:v1.83.10-stable
  mineru_api: mineru-api:v2.7.5
  mineru_vlm: mineru-vlm:v2.7.5
  jupyter: minimal-notebook:notebook-7.0.6
  open_terminal: open-terminal-office:0.11.34
  otel_collector: otel/opentelemetry-collector-contrib:0.154.0
  traefik: traefik:v3.6.2
  docker_socket_proxy: tecnativa/docker-socket-proxy:0.3
  postgres_ferretdb: postgres-documentdb:17.0.106.0-ferretdb-2.5.0
  presidio_analyzer: presidio-analyzer:2.2.359
  presidio_anonymizer: presidio-anonymizer:2.2.359
  oauth2proxy: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
  open_webui: open-webui:v0.11.3
  open_webui_init: postgres:17
  playwright: playwright:v1.58.0-jammy
  vllm: vllm-openai:v0.15.1
  speaches: speaches-ai/speaches:latest-cuda-12.6.3
  pgbouncer: pgbouncer:v1.24.1-p1
  rclone: rclone:1.71.2
  keycloak: keycloak:26.5.5
  keycloak_config_cli: keycloak-config-cli:6.5.1-26.5.5
  searxng: searxng:2026.4.29-cba0cffa8

  # --- Custom Application Services ---
  api:
    build: localbuild
    local: api:latest
    nightly: api:nightly
    latest: api:latest
  web:
    build: localbuild
    local: web:latest
    nightly: web:nightly
    latest: web:latest
  sysadmin-api:
    build: localbuild
    local: sysadmin-api:latest
    nightly: sysadmin-api:nightly
    latest: sysadmin-api:latest
  sysadmin-web:
    build: localbuild
    local: sysadmin-web:latest
    nightly: sysadmin-web:nightly
    latest: sysadmin-web:latest
  dagster:
    build: localbuild
    local: dagster:latest
    nightly: dagster:nightly
    latest: dagster:latest
  llm_wrapping_agent:
    build: localbuild
    local: llm_wrapping_agent:latest
    nightly: llm_wrapping_agent:nightly
    latest: llm_wrapping_agent:latest
  rag_agent:
    build: localbuild
    local: rag_agent:latest
    nightly: rag_agent:nightly
    latest: rag_agent:latest
  expert_rag_agent:
    build: localbuild
    local: expert_rag_agent:latest
    nightly: expert_rag_agent:nightly
    latest: expert_rag_agent:latest
  expert_asking_agent:
    build: localbuild
    local: expert_asking_agent:latest
    nightly: expert_asking_agent:nightly
    latest: expert_asking_agent:latest
  retrieval_agent:
    build: localbuild
    local: retrieval_agent:latest
    nightly: retrieval_agent:nightly
    latest: retrieval_agent:latest
  few_shot_agent:
    build: localbuild
    local: few_shot_agent:latest
    nightly: few_shot_agent:nightly
    latest: few_shot_agent:latest
  namespace_selection_agent:
    build: localbuild
    local: namespace_selection_agent:latest
    nightly: namespace_selection_agent:nightly
    latest: namespace_selection_agent:latest
  memory_writer_agent:
    build: localbuild
    local: memory_writer_agent:latest
    nightly: memory_writer_agent:nightly
    latest: memory_writer_agent:latest
  imap_agent:
    build: localbuild
    local: imap_agent:latest
    nightly: imap_agent:nightly
    latest: imap_agent:latest
  email_classification_agent:
    build: localbuild
    local: email_classification_agent:latest
    nightly: email_classification_agent:nightly
    latest: email_classification_agent:latest
  default_rag_pipeline:
    build: localbuild
    local: default_rag_pipeline:latest
    nightly: default_rag_pipeline:nightly
    latest: default_rag_pipeline:latest
  shared_rag_pipeline:
    build: localbuild
    local: shared_rag_pipeline:latest
    nightly: shared_rag_pipeline:nightly
    latest: shared_rag_pipeline:latest
  bot:
    build: localbuild
    local: bot:latest
    nightly: bot:nightly
    latest: bot:latest
  backup:
    dev: localbuild
    build: localbuild
    local: backup:latest
    nightly: backup:nightly
    latest: backup:latest
# -------------------------------------------------------------------
# Pipeline Run-Failure Notification Defaults
# Operator-supplied secrets (NOTIFICATION_URLS) remain in .env files;
# these are platform defaults baked into the generated compose.
# -------------------------------------------------------------------
notifications:
  title_prefix: Swiss AI Hub Pipeline
  min_interval_seconds: 30
# -------------------------------------------------------------------
# Keycloak realm token and session lifespans (seconds), shared by the
# merged aihub-realm.{stage}.json (first-start import) and
# keycloak-entrypoint.sh.j2 (kcadm update on every start, so existing
# deployments converge without re-importing the realm).
# Keycloak defaults (30 min idle / 10 h max) force daily re-logins.
# The 5 min access token default forces a silent renew every ~3 min.
# -------------------------------------------------------------------
keycloak:
  sso_session_idle_timeout: 432000  # 5 days
  sso_session_max_lifespan: 2592000  # 30 days
  access_token_lifespan: 3600  # 1 hour
