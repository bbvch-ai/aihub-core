# browser-proxy: the Playwright server's only way out of the platform. Squid resolves each name
# itself, refuses the request when any of its addresses is not public, and connects to an address
# it checked, so the name cannot lead elsewhere between the check and the connection.
http_port 3128
pid_filename none
cache deny all
cache_mem 0 MB
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0

# Sites see neither the platform's addresses nor the proxy.
forwarded_for delete
via off
httpd_suppress_version_string on

# The Dockerfile empties these pages. Playwright replays only what it read together with the
# headers of a refused CONNECT, so a body arriving separately surfaced as "Route.fetch: aborted".
error_directory /usr/share/squid/errors/templates
email_err_data off

# Squid's defaults already leave these off. Stating them keeps a version that changes a default from
# opening a listener the advisories for ICP, HTCP and SNMP depend on.
icp_port 0
htcp_port 0
snmp_port 0

acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535

# Every address that is not global. IPv4-mapped IPv6 (::ffff:0:0/96) is left out on purpose:
# Squid stores IPv4 in that form, so the range would mean all of IPv4. The IPv4 ranges cover it.
acl not_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl not_public dst 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl not_public dst 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl not_public dst ::/127 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/23 2001:db8::/32
acl not_public dst 2002::/16 fc00::/7 fe80::/10 ff00::/8

# Playwright's route.fetch tunnels plain http:// with CONNECT as well, so CONNECT is allowed to
# the same ports as any other request, not only to 443.
http_access deny manager
http_access deny !Safe_ports
http_access deny not_public
http_access allow all
