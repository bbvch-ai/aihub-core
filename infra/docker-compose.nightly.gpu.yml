---
# This file is auto-generated from a Jinja2 template.
# DO NOT EDIT THIS FILE DIRECTLY.
#
# To make changes, edit the following files and then run the generator script:
#   - deployment/compose-config.yml (for changing values and versions)
#   - deployment/templates/docker-compose.yml.j2 (for changing structure and logic)
# ===================================================================
# TRAEFIK PRIORITY RULES
# ===================================================================
#
# This file follows state-of-the-art Traefik routing priority best practices:
#
# RULE: Higher priority numbers = more specific routes (evaluated first)
# RULE: Leave gaps of 100-500 between priority tiers for future expansion
# RULE: Use consistent ranges for similar route types across services
#
# PRIORITY HIERARCHY (10000 → 1):
#
# 10000-9000: SYSTEM & INFRASTRUCTURE
#   - 10000: Emergency overrides
#   - 9500:  Health checks, monitoring endpoints
#   - 9000:  ACME/Let's Encrypt challenges
#
# 8000-7000: SECURITY & AUTHENTICATION
#   - 8000:  Rate limiting, IP blocking
#   - 7500:  OAuth callbacks, OIDC endpoints
#   - 7000:  Authentication APIs, login endpoints
#
# 6000-5000: APPLICATION APIs
#   - 6000:  Specific API endpoints (e.g., /api/v1/auth)
#   - 5500:  Versioned API routes (e.g., /api/v2)
#   - 5000:  General API routes (e.g., /api)
#
# 4000-3000: APPLICATION FEATURES
#   - 4000:  Admin interfaces, management UIs
#   - 3500:  User-specific routes (e.g., /user/profile)
#   - 3000:  Feature-specific paths (e.g., /reports, /dashboard)
#
# 2500-1500: STATIC CONTENT & ASSETS
#   - 2500:  CDN, external assets
#   - 2000:  Static files (JS, CSS, images)
#   - 1500:  Application-specific assets, uploads
#
# 1000-500: GENERAL ROUTES
#   - 1000:  Service-specific catch-all routes
#   - 750:   Language/locale routing (e.g., /en, /de)
#   - 500:   Subdomain routing (service.domain.com)
#
# 400-1: FALLBACK & DEFAULT
#   - 400:   Domain catch-all with path restrictions
#   - 100:   Default domain catch-all
#   - 50:    Global fallback handlers
#   - 10:    HTTP to HTTPS redirect (non-ACME)
#
# NAMING CONVENTIONS:
#   - Router names: {service}-{type}-{variant}
#   - Examples: openwebui-api-auth, web-static-assets, minio-admin-ui
#   - Middleware chains: {service}-{purpose}-middleware
#
# ===================================================================
services:
  # ===================================================================
  # SeaweedFS Stack (Distributed Object Storage)
  # ===================================================================
  # This stack provides S3-compatible storage for the entire platform.
  # ===================================================================
  seaweedfs-master:
    container_name: seaweedfs-master
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    command: >
      master
      -ip=seaweedfs-master
      -ip.bind=0.0.0.0
      -defaultReplication=000
      -volumeSizeLimitMB=29000
      -volumePreallocate=false
    environment:
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-master:/data']
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9333/dir/status
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [storage]
  seaweedfs-volume:
    container_name: seaweedfs-volume
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    command: >
      volume
      -mserver="seaweedfs-master:9333"
      -ip.bind=0.0.0.0
      -port=8080
      -max=100
      -dataCenter=dc1
    environment:
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-volume:/data']
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8080'
      healthcheck.path: /status
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [storage]
  seaweedfs-filer:
    container_name: seaweedfs-filer
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    command: >
      filer
      -master="seaweedfs-master:9333"
      -ip.bind=0.0.0.0
    environment:
      # Internal JWT Authentication
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}

      # Etcd Configuration (SeaweedFS reads WEED_ETCD_* env vars)
      WEED_ETCD_ENABLED: 'true'
      WEED_ETCD_SERVERS: http://etcd:2379
      WEED_ETCD_TIMEOUT: 3s
      WEED_ETCD_USERNAME: root
      WEED_ETCD_PASSWORD: ${ETCD_TOKEN}

      # Disable default leveldb2 store when using etcd
      WEED_LEVELDB2_ENABLED: 'false'
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-filer:/data']
    depends_on:
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started
      etcd-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8888/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - storage
      - data  # For etcd access
  seaweedfs-s3:
    container_name: seaweedfs-s3
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    volumes:
      - ./configs/seaweedfs/s3-entrypoint.sh:/usr/local/bin/s3-entrypoint.sh:ro
    entrypoint: [/bin/sh, /usr/local/bin/s3-entrypoint.sh]
    environment:
      # S3 Authentication
      SEAWEEDFS_S3_USER: ${S3_STORAGE_ACCESS_KEY}
      SEAWEEDFS_S3_PASSWORD: ${S3_STORAGE_SECRET_KEY}

      # Internal JWT Authentication
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}

      # S3 Service Configuration
      S3_PORT: '9000'
      S3_FILER: seaweedfs-filer:8888
      S3_BIND_IP: 0.0.0.0
      S3_ALLOW_EMPTY_FOLDER: true
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9000/status
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.seaweedfs-s3.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.seaweedfs-s3.priority=4000
      - traefik.http.routers.seaweedfs-s3.entrypoints=websecure
      - traefik.http.routers.seaweedfs-s3.tls.certresolver=letsencrypt
      - traefik.http.routers.seaweedfs-s3.middlewares=security-headers@file
      - traefik.http.services.seaweedfs-s3.loadbalancer.server.port=9000
    networks:
      - storage
      - backend  # Internal access from application services
      - proxy  # External S3 API access via Traefik
  seaweedfs-init:
    container_name: seaweedfs-init
    image: ghcr.io/bbvch-ai/aihub-core/aws-cli-alpine:3.22.1
    restart: 'no'
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_ENDPOINT: http://seaweedfs-s3:9000
      AIHUB_CREATE_DEFAULT_BUCKETS: ${AIHUB_CREATE_DEFAULT_BUCKETS}
      AIHUB_DEFAULT_BUCKET_NAME: ${AIHUB_DEFAULT_BUCKET_NAME}
      AIHUB_SHARED_BUCKET_NAME: ${AIHUB_SHARED_BUCKET_NAME}
    volumes:
      - ./configs/seaweedfs/init-buckets.sh:/usr/local/bin/init-buckets.sh:ro
    entrypoint: [/bin/sh, /usr/local/bin/init-buckets.sh]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [storage, backend]
  oauth2proxy-seaweed:
    container_name: oauth2proxy-seaweed
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    restart: always
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4181
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://seaweedfs-filer:8888
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OAUTH_ALLOWED_GROUPS_SEAWEEDFS}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_SCOPE: openid email profile roles
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy-datalake
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}/realms/aihub
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN}/realms/aihub/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/certs
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET_SEAWEEDFS}
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DATALAKE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: ${OAUTH_CUSTOM_SIGN_IN_LOGO}
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: https://datalake.${DOMAIN}
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.seaweedfs-filer.rule=Host(`datalake.${DOMAIN}`)
      - traefik.http.routers.seaweedfs-filer.priority=4000
      - traefik.http.routers.seaweedfs-filer.entrypoints=websecure
      - traefik.http.routers.seaweedfs-filer.tls.certresolver=letsencrypt
      - traefik.http.routers.seaweedfs-filer.middlewares=security-headers@file
      - traefik.http.services.seaweedfs-filer.loadbalancer.server.port=4181
    networks:
      - proxy
      - storage

  # ===================================================================
  # Milvus Stack (Vector Database)
  # ===================================================================
  # This stack provides vector storage and search for RAG capabilities.
  # ===================================================================
  etcd:
    container_name: etcd
    image: ghcr.io/bbvch-ai/aihub-core/etcd:v3.5.25
    restart: always
    command:
      - etcd
      - --name=s1
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=s1=http://127.0.0.1:2380
      - --auth-token=simple
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
      # Token for healthcheck (used after auth is enabled by etcd-init)
      ETCD_TOKEN: ${ETCD_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/etcd-data:/etcd']
    healthcheck:
      # Use credentials for healthcheck to work after auth is enabled
      test: [CMD, etcdctl, '--user=root:${ETCD_TOKEN}', endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Milvus metadata storage
      - storage  # SeaweedFS filer metadata
  etcd-init:
    container_name: etcd-init
    build:
      context: ./configs/etcd
      dockerfile: init.Dockerfile
    restart: 'no'
    depends_on:
      etcd:
        condition: service_started
    environment:
      ETCDCTL_ENDPOINTS: http://etcd:2379
      ETCDCTL_API: '3'
      ETCD_ROOT_PASSWORD: ${ETCD_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data
      - storage  # Used by SeaweedFS filer for metadata
  milvus-standalone:
    container_name: milvus
    image: ghcr.io/bbvch-ai/aihub-core/milvus:v2.6.7
    restart: always
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      # Etcd Configuration (dots in YAML become underscores in env vars)
      ETCD_ENDPOINTS: etcd:2379
      ETCD_ROOTPATH: milvus
      ETCD_AUTH_USERNAME: root
      ETCD_AUTH_PASSWORD: ${ETCD_TOKEN}
      # MinIO/S3 Storage Configuration
      MINIO_ADDRESS: seaweedfs-s3:9000
      MINIO_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      # Token-based authentication - root password for Milvus
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/milvus-data:/var/lib/milvus
      - ./configs/milvus/milvus-config.nightly.gpu.yml:/milvus/configs/milvus.yaml
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      start_period: 90s
    depends_on:
      etcd-init:
        condition: service_completed_successfully
      seaweedfs-s3:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data
      - storage  # For S3 access to SeaweedFS
  attu:
    container_name: attu
    image: ghcr.io/bbvch-ai/aihub-core/attu:v2.5.12
    restart: always
    depends_on: [milvus-standalone]
    environment:
      MILVUS_URL: milvus-standalone:19530
      # Milvus authentication credentials (root username is hardcoded in Milvus)
      ATTU_LOGIN_USERNAME: root
      ATTU_LOGIN_PASSWORD: ${MILVUS_ROOT_PASSWORD}
    healthcheck:
      test: [NONE]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data]
  oauth2proxy-attu:
    container_name: oauth2proxy-attu
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    restart: always
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4182
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://attu:3000
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OAUTH_ALLOWED_GROUPS_ATTU}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_SCOPE: openid email profile roles
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy-attu
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}/realms/aihub
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN}/realms/aihub/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/certs
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET_ATTU}
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_OAUTH2_PROXY_ATTU_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: ${OAUTH_CUSTOM_SIGN_IN_LOGO}
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: https://attu.${DOMAIN}
    depends_on: [attu]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.attu.rule=Host(`attu.${DOMAIN}`)
      - traefik.http.routers.attu.priority=4000
      - traefik.http.routers.attu.entrypoints=websecure
      - traefik.http.routers.attu.tls.certresolver=letsencrypt
      - traefik.http.routers.attu.middlewares=security-headers@file
      - traefik.http.services.attu.loadbalancer.server.port=4182
    networks:
      - proxy
      - data

  # ===================================================================
  # Postgres Stack (SQL Database)
  # ===================================================================
  # PostgreSQL instance for application relational data.
  # ===================================================================
  postgres:
    container_name: postgres
    image: ghcr.io/bbvch-ai/aihub-core/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: openwebui,langfuse,dagster,litellm,keycloak
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER}']
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # PgBouncer (Connection Pooler for Dagster)
  # ===================================================================
  pgbouncer:
    container_name: pgbouncer
    image: ghcr.io/bbvch-ai/aihub-core/pgbouncer:v1.24.1-p1
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: dagster
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-2}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-3}
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: '6432'
      ADMIN_USERS: ${POSTGRES_USER}
      LOG_CONNECTIONS: '0'
      LOG_DISCONNECTIONS: '0'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -p
        - '6432'
        - -U
        - ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # FerretDB Stack (MongoDB Compatibility)
  # ===================================================================
  # FerretDB provides MongoDB-compatible API backed by PostgreSQL.
  # ===================================================================
  postgres-ferretdb:
    container_name: postgres-ferretdb
    image: ghcr.io/bbvch-ai/aihub-core/postgres-documentdb:17.0.106.0-ferretdb-2.5.0
    restart: always
    environment:
      POSTGRES_USER: ${MONGO_USERNAME}
      POSTGRES_PASSWORD: ${MONGO_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/ferretdb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${MONGO_USERNAME} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data]
  ferretdb:
    container_name: ferretdb
    image: ghcr.io/bbvch-ai/aihub-core/ferretdb:2.5.0
    restart: always
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://${MONGO_USERNAME}:${MONGO_PASSWORD}@postgres-ferretdb:5432/postgres
    depends_on:
      postgres-ferretdb:
        condition: service_healthy
    healthcheck:
      test: [NONE]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8088'
      healthcheck.path: /debug/livez
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # Neo4j Stack (Graph Database)
  # ===================================================================
  # Neo4j provides graph database capabilities for relationship-based
  # data modeling and querying.
  # ===================================================================
  neo4j:
    container_name: neo4j
    image: ghcr.io/bbvch-ai/aihub-core/neo4j:5.26.16-community
    restart: always
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/logs:/logs
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/config:/config
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/data:/data
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:7474
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Graph database for Mem0 memory storage

  # ===================================================================
  # Langfuse Stack (LLM Observability & Evaluation)
  # ===================================================================
  # Langfuse provides tracing, evaluation, and observability for LLM apps.
  # Open-source alternative with MIT license for self-hosted deployments.
  # ===================================================================
  clickhouse:
    container_name: clickhouse
    image: ghcr.io/bbvch-ai/aihub-core/clickhouse/clickhouse-server:25.8
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/clickhouse-data:/var/lib/clickhouse
      - ${VOLUME_ROOT:-./.docker-volumes}/clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit
        1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data]
  langfuse-worker:
    container_name: langfuse-worker
    image: ghcr.io/bbvch-ai/aihub-core/langfuse/langfuse-worker:3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      clickhouse:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Use SeaweedFS for S3-compatible storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend
      - data  # For PostgreSQL access
      - storage  # For SeaweedFS S3 access
  langfuse-web:
    container_name: langfuse-web
    image: ghcr.io/bbvch-ai/aihub-core/langfuse/langfuse:3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      clickhouse:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Use SeaweedFS for S3-compatible storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_TOKEN}
      # Auto-initialize default project for API access
      LANGFUSE_INIT_ORG_ID: aihub-org
      LANGFUSE_INIT_ORG_NAME: AI-Hub
      LANGFUSE_INIT_PROJECT_ID: aihub-project
      LANGFUSE_INIT_PROJECT_NAME: AI-Hub
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: AI-Hub Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      # Keycloak SSO — uses Keycloak as the OIDC provider for Langfuse login
      AUTH_KEYCLOAK_CLIENT_ID: langfuse
      AUTH_KEYCLOAK_CLIENT_SECRET: ${LANGFUSE_KEYCLOAK_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/aihub
      AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING: 'true'
      # Auto-provisioning — SSO users get MEMBER in the AI-Hub org/project
      LANGFUSE_DEFAULT_ORG_ID: aihub-org
      LANGFUSE_DEFAULT_ORG_ROLE: MEMBER
      LANGFUSE_DEFAULT_PROJECT_ID: aihub-project
      LANGFUSE_DEFAULT_PROJECT_ROLE: MEMBER
      # Auth controls
      AUTH_DISABLE_USERNAME_PASSWORD: 'true'
      AUTH_DISABLE_SIGNUP: 'false'
      LANGFUSE_ALLOWED_ORGANIZATION_CREATORS: ${LANGFUSE_ALLOWED_ORGANIZATION_CREATORS}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://$(hostname):3000/api/public/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse.rule=Host(`langfuse.${DOMAIN}`)
      - traefik.http.routers.langfuse.priority=4000
      - traefik.http.routers.langfuse.entrypoints=websecure
      - traefik.http.routers.langfuse.middlewares=security-headers@file
      - traefik.http.services.langfuse.loadbalancer.server.port=3000
      - traefik.http.routers.langfuse.tls.certresolver=letsencrypt
    networks:
      - backend
      - data  # For PostgreSQL access
      - storage  # For SeaweedFS S3 access
      - proxy  # For Traefik access

  # ===================================================================
  # Keycloak Stack (Identity and Access Management)
  # ===================================================================
  # Keycloak provides OIDC/OAuth2 authentication for all services.
  # In dev: Local users for development and E2E testing.
  # In prod: Identity broker for Azure AD and other providers.
  # ===================================================================
  keycloak:
    container_name: keycloak
    image: ghcr.io/bbvch-ai/aihub-core/keycloak:26.5.4
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - /opt/keycloak/scripts/keycloak-entrypoint.sh
      - start
      - --hostname=https://auth.${DOMAIN}
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      DOMAIN: ${DOMAIN}
      # Superuser (interactive Keycloak-seeded admin) — passed to realm template
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_FIRSTNAME: ${SUPERUSER_FIRSTNAME}
      SUPERUSER_LASTNAME: ${SUPERUSER_LASTNAME}
      SUPERUSER_ROLES_JSON: ${SUPERUSER_ROLES_JSON}
      AIHUB_DEFAULT_TENANT_ID: ${AIHUB_DEFAULT_TENANT_ID}
      # Client secrets (used by bash_envsubst in realm template)
      KEYCLOAK_OPENWEBUI_CLIENT_SECRET: ${KEYCLOAK_OPENWEBUI_CLIENT_SECRET}
      KEYCLOAK_OAUTH2_PROXY_DAGSTER_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DAGSTER_SECRET}
      KEYCLOAK_OAUTH2_PROXY_DATALAKE_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DATALAKE_SECRET}
      KEYCLOAK_OAUTH2_PROXY_ATTU_SECRET: ${KEYCLOAK_OAUTH2_PROXY_ATTU_SECRET}
      KEYCLOAK_LANGFUSE_CLIENT_SECRET: ${LANGFUSE_KEYCLOAK_CLIENT_SECRET}
      # Azure Entra ID configuration (for identity provider federation)
      KEYCLOAK_AZURE_CLIENT_ID: ${KEYCLOAK_AZURE_CLIENT_ID}
      KEYCLOAK_AZURE_CLIENT_SECRET: ${KEYCLOAK_AZURE_CLIENT_SECRET}
      KEYCLOAK_AZURE_TENANT_ID: ${KEYCLOAK_AZURE_TENANT_ID}
      KEYCLOAK_API_SERVICE_CLIENT_SECRET: ${KEYCLOAK_API_SERVICE_CLIENT_SECRET}
    volumes:
      - ./configs/keycloak/keycloak-entrypoint.sh:/opt/keycloak/scripts/keycloak-entrypoint.sh:ro
      - ./configs/keycloak/aihub-realm.nightly.gpu.json:/opt/keycloak/data/import-templates/aihub-realm.json:ro
      - ./configs/keycloak/identity-providers.nightly.gpu.json:/opt/keycloak/data/import-templates/identity-providers.json:ro
      - ./configs/keycloak/themes/aihub:/opt/keycloak/themes/aihub:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\n\
          host: localhost\r\nConnection: close\r\n\r\n' >&3;grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.keycloak.rule=Host(`auth.${DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls=true
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.routers.keycloak.priority=7000
      - traefik.http.routers.keycloak.middlewares=keycloak-security-headers
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      # Keycloak manages its own X-Frame-Options per realm (master: SAMEORIGIN
      # for admin console session iframes, aihub: empty for parent app embedding).
      # We only add non-frame security headers here to avoid overriding Keycloak's
      # native per-realm frame policy — DENY breaks the admin console.
      - traefik.http.middlewares.keycloak-security-headers.headers.sslRedirect=false
      - traefik.http.middlewares.keycloak-security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.keycloak-security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.keycloak-security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.keycloak-security-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.keycloak-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
    networks:
      - data  # PostgreSQL access for Keycloak database
      - proxy  # Traefik routing for auth.${DOMAIN}

  # ===================================================================
  # Nats & Valkey Stack (Messaging and Caching)
  # ===================================================================
  # Nats provides the messaging bus for asynchronous communication
  # between agents, and Valkey provides in-memory caching.
  # ===================================================================
  nats:
    container_name: nats
    image: ghcr.io/bbvch-ai/aihub-core/nats:2.11.4
    restart: always
    command: -c /etc/nats/nats-server.conf
    environment:
      # Token-based authentication for NATS clients
      NATS_TOKEN: ${NATS_TOKEN}
    volumes:
      - ./configs/nats/nats-config.nightly.gpu.conf:/etc/nats/nats-server.conf
      - ${VOLUME_ROOT:-./.docker-volumes}/nats:/data/nats
    healthcheck:
      test: [NONE]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8222'
      healthcheck.path: /healthz
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Message broker is part of data infrastructure
  valkey:
    container_name: valkey
    image: ghcr.io/bbvch-ai/aihub-core/valkey:8.0.5
    restart: always
    # Password authentication enabled via --requirepass.
    # --appendonly yes enables AOF persistence for durability between RDB snapshots.
    command: valkey-server --save 30 1 --loglevel warning --requirepass ${REDIS_TOKEN}
      --appendonly yes --appendfsync everysec
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/valkey-data:/data']
    healthcheck:
      # Use REDISCLI_AUTH to authenticate for health check
      test: [CMD-SHELL, 'REDISCLI_AUTH=${REDIS_TOKEN} valkey-cli ping']
      start_period: 5s
    environment:
      REDIS_TOKEN: ${REDIS_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Cache is part of data infrastructure

  # ===================================================================
  # Rclone (Universal Cloud Storage Sync)
  # ===================================================================
  # Provides RC API for syncing files from 70+ cloud providers
  # (OneDrive, SharePoint, S3, Google Drive, Dropbox, etc.)
  # ===================================================================
  rclone:
    container_name: rclone
    image: ghcr.io/bbvch-ai/aihub-core/rclone:1.71.2
    restart: unless-stopped
    command:
      - rcd
      - --rc-addr=0.0.0.0:5572
      - --rc-serve
      - --rc-user=${RCLONE_RC_USER}
      - --rc-pass=${RCLONE_RC_PASS}
      - --log-level=INFO
      - --config=/dev/null  # Disable config file, use environment variables only
    networks: [default]
    healthcheck:
      test:
        - CMD
        - rclone
        - rc
        - --rc-addr=localhost:5572
        - --rc-user=${RCLONE_RC_USER}
        - --rc-pass=${RCLONE_RC_PASS}
        - core/version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
  # ===================================================================
  # Backup Services (Dagster-based Automated Database Backups)
  # ===================================================================
  # Independent 3-container Dagster deployment: gRPC code server, daemon,
  # webserver. Dagster UI on port 3004 for monitoring and manual triggers.
  # ===================================================================
  backup-code:
    container_name: backup-code
    image: ghcr.io/bbvch-ai/aihub-core/backup:nightly
    restart: unless-stopped
    entrypoint:
      - dagster
      - api
      - grpc
      - -m
      - swiss_ai_hub.backup.dagster
      - -h
      - 0.0.0.0
      - -p
      - '4266'
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD}
      LANGFUSE_CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      REDIS_TOKEN: ${REDIS_TOKEN}
      NATS_TOKEN: ${NATS_TOKEN}
      S3_STORAGE_ACCESS_KEY: ${S3_STORAGE_ACCESS_KEY}
      S3_STORAGE_SECRET_KEY: ${S3_STORAGE_SECRET_KEY}
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/backup-dagster-home:/dagster_home
      - ./configs/backup/backup-dagster.nightly.gpu.yml:/dagster_home/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        - CMD
        - dagster
        - api
        - grpc-health-check
        - --host
        - localhost
        - --port
        - '4266'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data, storage]
  oauth2proxy-backup:
    container_name: oauth2proxy-backup
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    restart: always
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://backup-webserver:3000
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy-backup
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}/realms/aihub
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN}/realms/aihub/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/certs
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET_BACKUP}
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_OAUTH2_PROXY_BACKUP_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: https://backup.${DOMAIN}
      OAUTH2_PROXY_SCOPE: openid email profile roles
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OAUTH_ALLOWED_GROUPS_BACKUP}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: ${OAUTH_CUSTOM_SIGN_IN_LOGO}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backup.rule=Host(`backup.${DOMAIN}`)
      - traefik.http.routers.backup.entrypoints=websecure
      - traefik.http.routers.backup.middlewares=security-headers@file
      - traefik.http.services.backup.loadbalancer.server.port=4180
      - traefik.http.routers.backup.tls.certresolver=letsencrypt
    networks: [proxy, backend]
  backup-webserver:
    container_name: backup-webserver
    image: ghcr.io/bbvch-ai/aihub-core/backup:nightly
    restart: unless-stopped
    depends_on:
      backup-code:
        condition: service_healthy
    entrypoint:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - '3000'
      - -w
      - /etc/dagster/workspace.yaml
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/backup-dagster-home:/dagster_home
      - ./configs/backup/backup-dagster.nightly.gpu.yml:/dagster_home/dagster.yaml:ro
      - ./configs/backup/backup-workspace.nightly.gpu.yml:/etc/dagster/workspace.yaml:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/server_info]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [proxy, data]
  backup-daemon:
    container_name: backup-daemon
    image: ghcr.io/bbvch-ai/aihub-core/backup:nightly
    restart: unless-stopped
    depends_on:
      backup-code:
        condition: service_healthy
    entrypoint: [dagster-daemon, run, -w, /etc/dagster/workspace.yaml]
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/backup-dagster-home:/dagster_home
      - ./configs/backup/backup-dagster.nightly.gpu.yml:/dagster_home/dagster.yaml:ro
      - ./configs/backup/backup-workspace.nightly.gpu.yml:/etc/dagster/workspace.yaml:ro
    healthcheck:
      test: [CMD, dagster-daemon, liveness-check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data
  # ===================================================================
  # AI Model Serving (Local GPU Inference via vLLM)
  # ===================================================================
  # All local model serving requires GPU. CPU setups route through
  # Swiss LLM Cloud instead. Models match the Swiss LLM Cloud stack
  # for a unified experience.
  # ===================================================================
  vllm:
    container_name: vllm
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model Qwen/Qwen3-VL-30B-A3B-Instruct-FP8
      --served-model-name qwen3-vl-30b
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.85
      --max-model-len 131072
      --max-num-seqs 16
      --max-num-batched-tokens 4096
      --enable-chunked-prefill
      --limit-mm-per-prompt '{"image": 8, "video": 0}'
      --async-scheduling
      --dtype auto
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [backend]
  vllm-bge-m3:
    container_name: vllm-bge-m3
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model BAAI/bge-m3
      --served-model-name bge-m3
      --runner pooling
      --convert embed
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.03
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [backend]
  vllm-bge-reranker:
    container_name: vllm-bge-reranker
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model BAAI/bge-reranker-v2-m3
      --served-model-name bge-reranker
      --runner pooling
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.03
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # Audio Model Serving (STT via Speaches)
  # ===================================================================
  # OpenAI-compatible transcription API. GPU only.
  # CPU setups route through Swiss LLM Cloud.
  # https://github.com/speaches-ai/speaches
  # ===================================================================
  speaches:
    container_name: speaches
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    restart: unless-stopped
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/speaches-models:/home/ubuntu/.cache/huggingface/hub
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      PRELOAD_MODELS: Systran/faster-whisper-large-v3
    healthcheck:
      test: [CMD, curl, --fail, http://0.0.0.0:8000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # LiteLLM Stack (Model Proxy and Guardrails)
  # ===================================================================
  # This stack provides a unified interface to various LLMs,
  # handles PII filtering, and manages API keys.
  # ===================================================================
  presidio-analyzer:
    container_name: presidio-analyzer
    image: ghcr.io/bbvch-ai/aihub-core/presidio-analyzer:2.2.359
    restart: always
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '3000'
      healthcheck.path: /health
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  presidio-anonymizer:
    container_name: presidio-anonymizer
    image: ghcr.io/bbvch-ai/aihub-core/presidio-anonymizer:2.2.359
    restart: always
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '3000'
      healthcheck.path: /health
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  litellm:
    container_name: litellm
    image: ghcr.io/bbvch-ai/aihub-core/litellm:v1.80.5-stable.1
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      LOCAL_LLM_TOKEN: ${LOCAL_LLM_TOKEN}
      REDIS_TOKEN: ${REDIS_TOKEN}
      SWISS_LLM_CLOUD_API_BASE_URL: ${SWISS_LLM_CLOUD_API_BASE_URL}
      SWISS_LLM_CLOUD_API_KEY: ${SWISS_LLM_CLOUD_API_KEY}
      SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL: ${SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL}
      SWISS_LLM_CLOUD_EMBEDDING_API_KEY: ${SWISS_LLM_CLOUD_EMBEDDING_API_KEY}
      SWISS_LLM_CLOUD_RERANKING_API_BASE_URL: ${SWISS_LLM_CLOUD_RERANKING_API_BASE_URL}
      SWISS_LLM_CLOUD_RERANKING_API_KEY: ${SWISS_LLM_CLOUD_RERANKING_API_KEY}
      SWISS_LLM_CLOUD_WHISPER_API_BASE_URL: ${SWISS_LLM_CLOUD_WHISPER_API_BASE_URL}
      SWISS_LLM_CLOUD_WHISPER_API_KEY: ${SWISS_LLM_CLOUD_WHISPER_API_KEY}
      SWISS_LLM_CLOUD_OCR_API_BASE_URL: ${SWISS_LLM_CLOUD_OCR_API_BASE_URL}
      SWISS_LLM_CLOUD_OCR_API_KEY: ${SWISS_LLM_CLOUD_OCR_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      SET_VERBOSE: false
      STORE_MODEL_IN_DB: true
    volumes:
      - ./configs/litellm/litellm-config.nightly.gpu.yml:/app/config.yml
    command: --config /app/config.yml
    depends_on:
      postgres:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.litellm.rule=Host(`litellm.${DOMAIN}`)
      - traefik.http.routers.litellm.entrypoints=websecure
      - traefik.http.routers.litellm.middlewares=security-headers@file
      - traefik.http.services.litellm.loadbalancer.server.port=4000
      - traefik.http.routers.litellm.tls.certresolver=letsencrypt
    networks:
      - backend
      - data  # For PostgreSQL access
      - proxy  # For external API access via Traefik

  # ===================================================================
  # Utility & Code Execution Services
  # ===================================================================
  # These services provide code execution runtimes (Jupyter) and
  # browser automation (Playwright) for various platform features.
  # ===================================================================
  jupyter:
    container_name: jupyter-lab
    image: ghcr.io/bbvch-ai/aihub-core/minimal-notebook:notebook-7.0.6
    restart: always
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/jupyter-data:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: true
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    healthcheck:
      test: [CMD, /etc/jupyter/docker_healthcheck.py]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  playwright:
    container_name: playwright-server
    build:
      context: ./configs/playwright
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend  # Internal service communication
      - egress  # Outbound internet access for web browsing

  # ===================================================================
  # Document Processing Stack
  # ===================================================================
  # This stack, powered by MinerU, handles OCR and parsing of
  # uploaded documents for the RAG pipeline. VLM requests are routed
  # through LiteLLM for unified model routing.
  # ===================================================================
  mineru-api:
    container_name: mineru-api
    image: ghcr.io/bbvch-ai/aihub-core/mineru-api:v2.7.5
    restart: always
    environment:
      # VLM routing through LiteLLM (OpenAI-compatible)
      # Various API keys for OpenAI client compatibility
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_BASE_URL: http://litellm:4000/v1
      LITELLM_PROXY_API_KEY: ${LITELLM_MASTER_KEY}
      # MinerU-specific configuration (used by mineru_vl_utils HttpVlmClient)
      MINERU_VL_SERVER: http://litellm:4000/v1
      MINERU_VL_API_KEY: ${LITELLM_MASTER_KEY}
      MINERU_VL_MODEL_NAME: ${MINERU_VLM_NAME}
      # Processing configuration
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/openapi.json]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 60s
    depends_on:
      litellm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        limits:
          memory: 4G
    networks: [backend]
  mineru-vlm:
    container_name: mineru-vlm
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/mineru-vlm:v2.7.5
    restart: always
    # No volume mount - VLM models are baked into the image for faster startup
    command: >
      mineru-vllm-server
      --host 0.0.0.0
      --port 30000
      --served-model-name MinerU2.5-2509-1.2B
      --gpu-memory-utilization 0.05
    environment:
      MINERU_MODEL_SOURCE: local
    healthcheck:
      test: [CMD, curl, -f, http://localhost:30000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 300s  # 5 minutes for model loading
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # Observability Stack
  # ===================================================================
  # The OTEL Collector gathers traces, logs, and metrics for debugging
  # and monitoring. It is only enabled in the 'dev' stage.
  # ===================================================================
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: [--config=/etc/otel-config.yml]
    environment:
      - OTEL_CLOUD_ENDPOINT=${OTEL_CLOUD_ENDPOINT}
      - OTEL_CLOUD_HEADERS=${OTEL_CLOUD_HEADERS}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    volumes: [./configs/otel/otel-config.nightly.gpu.yml:/etc/otel-config.yml]
    depends_on: [langfuse-web]
    healthcheck:
      test: [NONE]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '13133'
      healthcheck.path: /
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend

  # ===================================================================
  # Open WebUI Stack (Primary User Interface)
  # ===================================================================
  # This is the main frontend application for the AI Hub. Its
  # configuration is the most complex, with many stage-specific
  # environment variables for connecting to other services.
  # ===================================================================
  open-webui:
    container_name: open-webui
    image: ghcr.io/bbvch-ai/aihub-core/open-webui:v0.8.10
    restart: always
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/open-webui:/app/backend/data']
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
      litellm:
        condition: service_healthy
      jupyter:
        condition: service_healthy
      playwright:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      # --- General Settings ---
      WEBUI_NAME: Swiss AI-Hub
      DEFAULT_LOCALE: de
      # Disable model caching to ensure pipeline models (agents) are always fetched
      ENABLE_BASE_MODELS_CACHE: false
      ENABLE_COMMUNITY_SHARING: false
      BYPASS_MODEL_ACCESS_CONTROL: 'False'
      ENABLE_USER_WEBHOOKS: true
      WEBHOOK_URL: http://api:8000/api/v1/webhook/openwebui?token=${OPENWEBUI_WEBHOOK_SECRET}
      ENABLE_LOGIN_FORM: false
      ENABLE_FORWARD_USER_INFO_HEADERS: true
      ENABLE_VERSION_UPDATE_CHECK: false

      # --- Stage-Specific URLs and Environment ---
      WEBUI_URL: https://openwebui.${DOMAIN}
      ENV: ${ENV}
      GLOBAL_LOG_LEVEL: ${LOG_LEVEL}

      # --- Telemetry ---
      ENABLE_OTEL: true
      ENABLE_OTEL_METRICS: true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_SERVICE_NAME: open-webui

      # --- Auth & OIDC (Keycloak) ---
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      WEBUI_AUTH: true
      DEFAULT_USER_ROLE: user
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
      ENABLE_API_KEY: false
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_SESSION_COOKIE_SECURE: true
      ENABLE_OAUTH_SIGNUP: true
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      OAUTH_ROLES_CLAIM: roles
      OAUTH_ADMIN_ROLES: ${OAUTH_ADMIN_ROLES_OPENWEBUI}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_CLIENT_ID: openwebui
      OAUTH_CLIENT_SECRET: ${KEYCLOAK_OPENWEBUI_CLIENT_SECRET}
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/aihub/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://openwebui.${DOMAIN}/oauth/oidc/callback
      OAUTH_ALLOWED_DOMAINS: '*'
      OAUTH_SCOPES: openid email profile roles
      OAUTH_TIMEOUT: 60
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_USERNAME_CLAIM: preferred_username
      OAUTH_PICTURE_CLAIM: picture
      OAUTH_EMAIL_CLAIM: email
      OAUTH_GROUP_CLAIM: roles

      # --- SCIM 2.0 Provisioning ---
      SCIM_ENABLED: 'true'
      SCIM_TOKEN: ${OPENWEBUI_SCIM_TOKEN}

      # --- Data Storage (S3) ---
      STORAGE_PROVIDER: s3
      S3_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_REGION_NAME: us-east-1
      S3_BUCKET_NAME: open-webui
      S3_ENDPOINT_URL: http://seaweedfs-s3:9000

      # --- Model & AI-Hub Connection ---
      MODELS_CACHE_TTL: 60
      OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai
      OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      TASK_MODEL: text-generation/Qwen3-VL-30B-A3B-Instruct-FP8
      TASK_MODEL_EXTERNAL: text-generation/Qwen3-VL-30B-A3B-Instruct-FP8
      ENABLE_OLLAMA_API: false
      ENABLE_OPENAI_API: true

      # --- Image Generation ---
      IMAGE_GENERATION_MODEL: image-generation
      IMAGES_OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai
      IMAGES_OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      IMAGE_SIZE: 1024x1024
      ENABLE_IMAGE_GENERATION: true

      # --- Audio STT ---
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: transcription
      AUDIO_STT_OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai
      AUDIO_STT_OPENAI_API_KEY: ${SUPERUSER_TOKEN}

      # --- Audio TTS ---
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_MODEL: speech
      AUDIO_TTS_OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai
      AUDIO_TTS_OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      AUDIO_TTS_VOICE: alloy

      # --- AI-Hub Internal Connection ---
      AIHUB_BASE_URL: http://api:8000
      AIHUB_FRONTEND_URL: https://${DOMAIN}
      AIHUB_SUPERUSER_API_KEY: ${SUPERUSER_TOKEN}
      OPEN_WEBUI_SIGNING_SECRET: ${AUTH_OPEN_WEBUI_SIGNING_SECRET}
      AIHUB_PIPELINE_PREFIX: aihub/
      AIHUB_REQUEST_TIMEOUT: 60

      # --- Database & Cache ---
      DATABASE_TYPE: postgres
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: openwebui
      REDIS_URL: redis://default:${REDIS_TOKEN}@valkey:6379/10
      REDIS_KEY_PREFIX: open-webui

      # --- Web Server ---
      UVICORN_WORKERS: 8
      ENABLE_WEBSOCKET_SUPPORT: true
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://default:${REDIS_TOKEN}@valkey:6379/11
      THREAD_POOL_SIZE: 32
      CORS_ALLOW_ORIGIN: https://openwebui.${DOMAIN};https://${DOMAIN}

      # --- Admin ---
      ENABLE_ADMIN_EXPORT: true
      ENABLE_ADMIN_CHAT_ACCESS: false
      SHOW_ADMIN_DETAILS: true
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # --- Code Execution ---
      CODE_EXECUTION_ENGINE: jupyter
      CODE_EXECUTION_JUPYTER_URL: http://jupyter:8888
      CODE_EXECUTION_JUPYTER_AUTH: token
      CODE_EXECUTION_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}
      CODE_INTERPRETER_ENGINE: jupyter
      CODE_INTERPRETER_JUPYTER_URL: http://jupyter:8888
      CODE_INTERPRETER_JUPYTER_AUTH: token
      CODE_INTERPRETER_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}

      # --- Vector DB ---
      VECTOR_DB: milvus
      MILVUS_DB: default
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_TOKEN: root:${MILVUS_ROOT_PASSWORD}
      MILVUS_INDEX_TYPE: HNSW
      MILVUS_METRIC_TYPE: COSINE
      MILVUS_HNSW_M: 16
      MILVUS_HNSW_EFCONSTRUCTION: 256

      # --- RAG & Document Processing ---
      RAG_FULL_CONTEXT: true
      RAG_EMBEDDING_BATCH_SIZE: 64
      PDF_EXTRACT_IMAGES: true
      RAG_FILE_MAX_COUNT: 4
      CONTENT_EXTRACTION_ENGINE: external
      EXTERNAL_DOCUMENT_LOADER_URL: http://api:8000/api/v1/active/parsing
      EXTERNAL_DOCUMENT_LOADER_API_KEY: ${SUPERUSER_TOKEN}
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embedding/bge-m3
      RAG_OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai
      RAG_OPENAI_API_KEY: ${SUPERUSER_TOKEN}

      # --- Web Search ---
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_ENGINE: jina
      JINA_API_KEY: ${JINA_API_KEY}
      WEB_SEARCH_RESULT_COUNT: 6
      WEB_SEARCH_CONCURRENT_REQUESTS: 6
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: true
      WEB_LOADER_ENGINE: playwright
      PLAYWRIGHT_WS_URL: ws://playwright:3000
      FILE_IMAGE_COMPRESSION_WIDTH: 796
      FILE_IMAGE_COMPRESSION_HEIGHT: 796

      # --- User Permissions (consistent across stages) ---
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_CHAT_CONTROLS: true
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: true
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: true
      USER_PERMISSIONS_CHAT_DELETE: true
      USER_PERMISSIONS_CHAT_EDIT: true
      USER_PERMISSIONS_CHAT_SHARE: false
      USER_PERMISSIONS_CHAT_EXPORT: false
      USER_PERMISSIONS_CHAT_STT: true
      USER_PERMISSIONS_CHAT_TTS: true
      USER_PERMISSIONS_CHAT_CALL: true
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: true
      USER_PERMISSIONS_CHAT_TEMPORARY: true
      USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED: false
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: false
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: true
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: true
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: true
      USER_PERMISSIONS_FEATURES_NOTES: true
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # --- Routers ---
      - traefik.http.routers.openwebui-api-auth.rule=Host(`openwebui.${DOMAIN}`) &&
        PathPrefix(`/api/v1/auths`)
      - traefik.http.routers.openwebui-api-auth.priority=7000
      - traefik.http.routers.openwebui-api-auth.entrypoints=websecure
      - traefik.http.routers.openwebui-api-auth.middlewares=openwebui-api-middleware
      - traefik.http.routers.openwebui-api.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.openwebui-api.priority=6000
      - traefik.http.routers.openwebui-api.entrypoints=websecure
      - traefik.http.routers.openwebui-api.middlewares=openwebui-api-middleware
      - traefik.http.routers.openwebui-static.rule=Host(`openwebui.${DOMAIN}`) &&
        (PathPrefix(`/oauth`) || PathPrefix(`/assets`) || PathPrefix(`/_app`) || PathPrefix(`/static`))
      - traefik.http.routers.openwebui-static.priority=2000
      - traefik.http.routers.openwebui-static.entrypoints=websecure
      - traefik.http.routers.openwebui-static.middlewares=openwebui-static-middleware
      - traefik.http.routers.openwebui-path.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/openwebui`)
      - traefik.http.routers.openwebui-path.priority=3000
      - traefik.http.routers.openwebui-path.entrypoints=websecure
      - traefik.http.routers.openwebui-path.middlewares=openwebui-strip-middleware
      - traefik.http.routers.openwebui-default.rule=Host(`openwebui.${DOMAIN}`)
      - traefik.http.routers.openwebui-default.priority=500
      - traefik.http.routers.openwebui-default.entrypoints=websecure
      - traefik.http.routers.openwebui-default.middlewares=openwebui-default-middleware
      # --- TLS Resolver Logic ---
      - traefik.http.routers.openwebui-api-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.openwebui-api.tls.certresolver=letsencrypt
      - traefik.http.routers.openwebui-static.tls.certresolver=letsencrypt
      - traefik.http.routers.openwebui-path.tls.certresolver=letsencrypt
      - traefik.http.routers.openwebui-default.tls.certresolver=letsencrypt
      # --- Service ---
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
      # --- Middlewares ---
      - traefik.http.middlewares.openwebui-api-middleware.chain.middlewares=security-headers@file,openwebui-iframe,openwebui-forwarded-headers
      - traefik.http.middlewares.openwebui-static-middleware.chain.middlewares=security-headers@file,openwebui-iframe
      - traefik.http.middlewares.openwebui-strip-middleware.chain.middlewares=openwebui-strip-prefix,security-headers@file,openwebui-iframe
      - traefik.http.middlewares.openwebui-strip-prefix.stripprefix.prefixes=/openwebui
      - traefik.http.middlewares.openwebui-default-middleware.chain.middlewares=security-headers@file,openwebui-iframe,openwebui-forwarded-headers
      - traefik.http.middlewares.openwebui-iframe.headers.customResponseHeaders.Content-Security-Policy=frame-ancestors
        'self' https://${DOMAIN}
      - traefik.http.middlewares.openwebui-iframe.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN
      - traefik.http.middlewares.openwebui-forwarded-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.openwebui-forwarded-headers.headers.customrequestheaders.X-Forwarded-Host=openwebui.${DOMAIN}
      - traefik.http.middlewares.openwebui-forwarded-headers.headers.customRequestHeaders.X-Forwarded-Port=443
      - traefik.http.middlewares.openwebui-forwarded-headers.headers.customRequestHeaders.X-Real-IP=%{remote_addr}
    networks: [proxy, backend, data, storage]
  openwebui-init:
    container_name: openwebui-init
    image: ghcr.io/bbvch-ai/aihub-core/postgres:17
    restart: 'no'
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: openwebui
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENWEBUI_SERVICE_ACCOUNT_ID: ${OPENWEBUI_SERVICE_ACCOUNT_ID}
      FUNCTIONS_DIR: /functions
    volumes:
      - ./configs/openwebui/init-openwebui.sh:/init-openwebui.sh:ro
      - ./configs/openwebui/functions:/functions:ro
    entrypoint: [/bin/sh, /init-openwebui.sh]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # Dagster Stack (Data Pipeline Orchestration)
  # ===================================================================
  # This stack runs the data pipelines, managed by the Dagster UI
  # and backend daemon. It's only present in non-dev stages.
  # ===================================================================
  oauth2proxy-dagster:
    container_name: oauth2proxy-dagster
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    restart: always
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://dagster-webserver:3000
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy-dagster
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}/realms/aihub
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN}/realms/aihub/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/aihub/protocol/openid-connect/certs
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET_DAGSTER}
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DAGSTER_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: https://dagster.${DOMAIN}
      OAUTH2_PROXY_SCOPE: openid email profile roles
      OAUTH2_PROXY_ALLOWED_GROUPS: ${OAUTH_ALLOWED_GROUPS_DAGSTER}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: ${OAUTH_CUSTOM_SIGN_IN_LOGO}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.dagster.rule=Host(`dagster.${DOMAIN}`)
      - traefik.http.routers.dagster.entrypoints=websecure
      - traefik.http.routers.dagster.middlewares=security-headers@file
      - traefik.http.services.dagster.loadbalancer.server.port=4180
      - traefik.http.routers.dagster.tls.certresolver=letsencrypt
    networks: [proxy, backend]
  dagster-webserver:
    container_name: dagster-webserver
    restart: always
    image: ghcr.io/bbvch-ai/aihub-core/dagster:nightly
    depends_on:
      pgbouncer:
        condition: service_healthy
    entrypoint:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - '3000'
      - -w
      - /dagster_home/workspace.yaml
    volumes:
      - ./configs/dagster/dagster-config.nightly.gpu.yml:/dagster_home/dagster.yaml:ro
      - ./configs/dagster/workspace.nightly.gpu.yml:/dagster_home/workspace.yaml:ro
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/server_info]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend, data]
  dagster-daemon:
    container_name: dagster-daemon
    restart: always
    image: ghcr.io/bbvch-ai/aihub-core/dagster:nightly
    depends_on:
      pgbouncer:
        condition: service_healthy
    entrypoint: [dagster-daemon, run]
    volumes:
      - ./configs/dagster/dagster-config.nightly.gpu.yml:/dagster_home/dagster.yaml:ro
      - ./configs/dagster/workspace.nightly.gpu.yml:/dagster_home/workspace.yaml:ro
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test: [CMD, dagster-daemon, liveness-check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend
      - data

  # ===================================================================
  # Docker Socket Proxy (Security Layer)
  # ===================================================================
  # Provides filtered, read-only access to the Docker socket for Traefik.
  # This prevents potential container escape attacks if Traefik is
  # compromised, as the proxy only exposes the minimal Docker API
  # endpoints required for service discovery.
  # ===================================================================
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:0.3
    restart: always
    # Required for Docker socket access in SELinux/AppArmor environments
    privileged: true
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:2375/_ping]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    environment:
      # Security: Only enable required Docker API sections
      CONTAINERS: 1  # Required for Traefik to discover services
      NETWORKS: 1  # Required for Traefik network routing
      # Explicitly disable dangerous permissions (defaults are already 0, but explicit is clearer)
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      POST: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels: [traefik.enable=false]
    networks:
      - backend  # Only Traefik needs to access this service

  # ===================================================================
  # Traefik (Reverse Proxy)
  # ===================================================================
  # Traefik manages incoming traffic, TLS, and routing to services.
  # It is only enabled in non-dev stages.
  # ===================================================================
  traefik:
    container_name: traefik
    image: ghcr.io/bbvch-ai/aihub-core/traefik:v3.6.2
    restart: always
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: [NONE]
    ports: [80:80, 443:443]
    volumes:
      - ./configs/traefik/traefik-config.nightly.gpu.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/middlewares.nightly.gpu.yml:/etc/traefik/dynamic/middlewares.yml:ro
      - /srv/app/traefik/acme.json:/etc/traefik/acme.json
    environment:
      TRAEFIK_LOG_LEVEL: ${LOG_LEVEL}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # --- HTTP to HTTPS Redirect and ACME Challenge ---
      - traefik.http.routers.acme-challenge.rule=PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.acme-challenge.entrypoints=web
      - traefik.http.routers.acme-challenge.priority=9000
      - traefik.http.routers.http-catch.rule=HostRegexp(`{host:.+}`) && !PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.http-catch.entrypoints=web
      - traefik.http.routers.http-catch.priority=10
      - traefik.http.routers.http-catch.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      # --- Dashboard ---
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.middlewares.traefik-auth.basicauth.users=admin:${ADMIN_PASSWORD_HASH}
      - traefik.http.routers.traefik.middlewares=traefik-auth
    networks:
      - proxy
      - backend  # Traefik routes to backend services

  # ===================================================================
  # API Stack (Backend Logic)
  # ===================================================================
  # This is the main backend API for the AI Hub. It is not present
  # in the 'dev' stage.
  # ===================================================================
  api:
    container_name: api
    restart: always
    image: ghcr.io/bbvch-ai/aihub-core/api:nightly
    depends_on:
      nats:
        condition: service_started
      traefik:
        condition: service_started
      ferretdb:
        condition: service_started
      milvus-standalone:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mineru-api:
        condition: service_healthy
    environment:
      # Log Level
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      NUM_WORKERS: 1

      # General Auth settings
      AUTH_ENABLE_API_ACCESS: true
      AUTH_OPEN_WEBUI_SIGNING_SECRET: ${AUTH_OPEN_WEBUI_SIGNING_SECRET}

      # Keycloak OIDC config
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_EXTERNAL_URL: https://auth.${DOMAIN}
      KEYCLOAK_REALM: aihub
      KEYCLOAK_API_SERVICE_CLIENT_SECRET: ${KEYCLOAK_API_SERVICE_CLIENT_SECRET}
      KEYCLOAK_SHOW_KEYCLOAK_LOGIN: ${KEYCLOAK_SHOW_KEYCLOAK_LOGIN}

      # Oauth2 config
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_AUTHORITY_URL: ${OAUTH_AUTHORITY_URL}

      # Azure Oauth2 config
      AZURE_CLIENT_ID: ${OAUTH_CLIENT_ID}
      AZURE_TENANT_ID: ${OAUTH_TENANT_ID}
      AZURE_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}

      # Superuser
      # Superuser identity & static bearer token. The API seeds a BearerToken
      # row bound to the Keycloak user found by SUPERUSER_EMAIL at startup;
      # TokenAuthHandler + Keycloak realm roles (AIHubSysAdmin) grant sysadmin.
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_ROLES: ${SUPERUSER_ROLES}
      SUPERUSER_TOKEN: ${SUPERUSER_TOKEN}

      # AI-Hub Settings
      AIHUB_VERSION: ${AIHUB_VERSION}
      AIHUB_FRONTEND_ORIGIN: ${DOMAIN}
      AIHUB_CREATE_DEFAULT_ROLES: true
      AIHUB_CREATE_DEFAULT_BUCKETS: true
      AIHUB_DEFAULT_BUCKET_NAME: ${AIHUB_DEFAULT_BUCKET_NAME}
      AIHUB_SHARED_BUCKET_NAME: ${AIHUB_SHARED_BUCKET_NAME}
      AIHUB_DEFAULT_NAMESPACE_NAME: ${AIHUB_DEFAULT_NAMESPACE_NAME}
      AIHUB_SHARED_NAMESPACE_NAME: ${AIHUB_SHARED_NAMESPACE_NAME}

      # LiteLLM Access
      LITE_LLM_PROXY_BASE_URL: http://litellm:4000
      LITE_LLM_PROXY_API_KEY: ${LITELLM_MASTER_KEY}

      # Mongo DB
      MONGO_CONNECTION_STRING: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@ferretdb:27017/

      # MILVUS
      MILVUS_URL: http://milvus-standalone:19530
      MILVUS_DIMENSION: ${MILVUS_DIMENSION}
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD}

      # S3 Access connection
      S3_STORAGE_ENDPOINT: http://seaweedfs-s3:9000
      S3_STORAGE_PUBLIC_ENDPOINT: https://s3.${DOMAIN}
      S3_STORAGE_ACCESS_KEY: ${S3_STORAGE_ACCESS_KEY}
      S3_STORAGE_SECRET_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_STORAGE_URL_SIGNING_SECRET: ${S3_STORAGE_SECRET_KEY}
      ANONYMOUS_FILE_ACCESS_SERVICE_STORAGE_BACKEND: s3

      # Langfuse
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_URL: https://langfuse.${DOMAIN}
      LANGFUSE_PROJECT_ID: aihub-project
      AIHUB_OPENAI_API_BASE_URL: http://api:8000/api/v1/active/openai

      # OpenWebUI (agent visibility provisioning)
      OPENWEBUI_BASE_URL: http://open-webui:8080
      OPENWEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      OPENWEBUI_SCIM_TOKEN: ${OPENWEBUI_SCIM_TOKEN}
      OPENWEBUI_WEBHOOK_SECRET: ${OPENWEBUI_WEBHOOK_SECRET}
      OPENWEBUI_SERVICE_ACCOUNT_ID: ${OPENWEBUI_SERVICE_ACCOUNT_ID}

      # NATs
      NATS_ENDPOINT: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN}

      # REDIS
      REDIS_URL: redis://valkey:6379
      REDIS_TOKEN: ${REDIS_TOKEN}

      # Neo4j
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # Mem0
      MEM0_LLM_NAME: text-generation/Qwen3-VL-30B-A3B-Instruct-FP8
      MEM0_EMBEDDING_MODEL_NAME: embedding/bge-m3
      MEM0_RERANKING_MODEL_NAME: reranker/bge

      # Jupyter (for open-webui code interpreter)
      JUPYTER_URL: http://jupyter:8888
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}

      # MinerU (document parsing)
      MINERU_API_BASE_URL: http://mineru-api:8000
      MINERU_API_TIMEOUT: ${MINERU_API_TIMEOUT}
      MINERU_VLM_SERVER_URL: http://litellm:4000
      MINERU_VLM_SERVER_API_KEY: ${LITELLM_MASTER_KEY}
      MINERU_VLM_NAME: ${MINERU_VLM_NAME}
      MINERU_FORMULA_ENABLE: ${MINERU_FORMULA_ENABLE}
      MINERU_TABLE_ENABLE: ${MINERU_TABLE_ENABLE}

      # OpenTelemetry Configuration
      OTEL_ENABLED: ${OTEL_ENABLED}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_SERVICE_NAME: api
      OTEL_RESOURCE_SERVICE_VERSION: nightly
      OTEL_RESOURCE_SERVICE_NAMESPACE: swiss-ai-hub
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/v1/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.api.priority=6000
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.middlewares=security-headers@file
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.routers.api.tls.certresolver=letsencrypt
    networks:
      - proxy
      - backend
      - data
      - storage

  # ===================================================================
  # Suite UI Stack (Frontend)
  # ===================================================================
  # This is the main SvelteKit frontend for the AI Hub. It is not
  # present in the 'dev' stage.
  # ===================================================================
  web:
    container_name: web
    restart: always
    image: ghcr.io/bbvch-ai/aihub-core/web:nightly
    environment:
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_AUTHORITY_URL: ${OAUTH_AUTHORITY_URL}
      WEBUI_URL: https://openwebui.${DOMAIN}
      WS_ENDPOINT: wss://${DOMAIN}/api/v1/active/events/ws
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - proxy  # Static frontend only needs proxy access
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # --- Routers ---
      - traefik.http.routers.web-static.rule=Host(`${DOMAIN}`) && PathPrefix(`/_nuxt`)
      - traefik.http.routers.web-static.priority=2000
      - traefik.http.routers.web-static.entrypoints=websecure
      - traefik.http.routers.web-static.middlewares=web-standard-middleware
      - traefik.http.routers.web-auth.rule=Host(`${DOMAIN}`) && (PathPrefix(`/en/auth`)
        || PathPrefix(`/de/auth`) || PathPrefix(`/fr/auth`) || PathPrefix(`/it/auth`))
      - traefik.http.routers.web-auth.priority=750
      - traefik.http.routers.web-auth.entrypoints=websecure
      - traefik.http.routers.web-auth.middlewares=web-standard-middleware
      - traefik.http.routers.web-index.rule=Host(`${DOMAIN}`) && (Path(`/`) || Path(`/index.html`)
        || Path(`/config.json`))
      - traefik.http.routers.web-index.priority=400
      - traefik.http.routers.web-index.entrypoints=websecure
      - traefik.http.routers.web-index.middlewares=web-standard-middleware
      - traefik.http.routers.web-default.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.web-default.priority=100
      - traefik.http.routers.web-default.entrypoints=websecure
      - traefik.http.routers.web-default.middlewares=web-standard-middleware
      # --- TLS Resolver Logic ---
      - traefik.http.routers.web-static.tls.certresolver=letsencrypt
      - traefik.http.routers.web-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.web-index.tls.certresolver=letsencrypt
      - traefik.http.routers.web-default.tls.certresolver=letsencrypt
      # --- Service & Middleware ---
      - traefik.http.services.web.loadbalancer.server.port=80
      - traefik.http.middlewares.web-standard-middleware.chain.middlewares=security-headers@file

