---
# ===================================================================
# OpenTelemetry Collector Configuration - Stage: latest
# ===================================================================
# Generated from template. Do not edit directly.
# Collects traces, metrics, and logs for observability.
# ===================================================================
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # Basic auth extension for Langfuse authentication
  basicauth/langfuse:
    client_auth:
      username: ${LANGFUSE_PUBLIC_KEY}
      password: ${LANGFUSE_SECRET_KEY}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # gRPC defaults to a 4 MiB receive limit, and an over-limit request is rejected whole —
        # every record in that batch is lost, the collector logs nothing (the error goes to the
        # client), and the SDK's own report of it has nowhere to go but the failing exporter.
        # A batch of tracebacks reaches that size easily: measured with 1000 records of 6 KB and
        # counting arrivals, 4 MiB delivered 0 of them and logged "larger than max"; 32 MiB
        # delivered all 1000. 32 covers the app's own ceiling (max_export_batch_size 2048 x a
        # ~16 KB record) with headroom.
        max_recv_msg_size_mib: 32
      http:
        endpoint: 0.0.0.0:4318
processors:
  # send_batch_size is only a trigger — without send_batch_max_size a batch has no upper bound, and
  # the backend rejects an over-limit request as a PERMANENT error, so the exporter drops it without
  # retrying. Reproduced against a second collector standing in for the backend, capped at gRPC's
  # own 4 MiB default, with traceback-sized records: 2000/unbounded reached it with nothing and
  # logged "Exporting failed. Dropping data ... not retryable error: Permanent error ...
  # ResourceExhausted ... larger than max 4194304"; 500/500 delivered, with no such error.
  #
  # The cap has to be low enough that count x record size stays under that limit, which is why the
  # per-stage scaling (1000 on nightly, 2000 on latest) is gone: a cap the batch never reaches is
  # not a cap. The collector enforces send_batch_max_size >= send_batch_size, so raising throughput
  # again means raising both, and re-measuring. Only the timeout still varies by stage.
  #
  # Measured again on staging (2026-08): the real backend limit is 16 MiB, not 4, and 500 is
  # still not low enough — requests of 500, 159 and 143 spans were all rejected with
  # ResourceExhausted "larger than max 16777216", which puts the average span above 100 KB.
  # Batch size is the wrong lever for a span that large; the cloud path bounds span size instead.
  batch:
    send_batch_size: 500
    send_batch_max_size: 500
    timeout: 15s

  # Stamp environment + host on all app telemetry. SigNoz keys its Environment and Hostname
  # quick-filters on resource[deployment.environment] and resource[host.name]; the SDK sets only
  # service.name/version/namespace, so both columns arrived empty for every span and log.
  #
  # Values come from the deploying VM (aihub-playbook's env.j2 writes them into the stage's
  # environment file). The compose fallback to the stage name is load-bearing, not cosmetic: an
  # EMPTY value makes this processor fail to build, and the collector then exits:
  #   failed to create "resource/deployment" processor: error with key "deployment.environment"
  #   ... Either field "value", "from_attribute", "from_context", or "default_value" must be specified
  #
  # That used to cost only telemetry. It no longer does: every service that exports OTLP now
  # declares depends_on this collector (service_started), so a config error here holds up the app
  # plane instead of quietly dropping spans. These fallbacks are the only thing keeping an unset
  # variable on the VM from turning into a failed deploy.
  #
  # `upsert` so the VM's own identity wins over anything an app SDK may inconsistently send.
  resource/deployment:
    attributes:
      - key: deployment.environment
        value: ${OTEL_DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: host.name
        value: ${OTEL_HOST_NAME}
        action: upsert
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - attributes["http.route"] == "/health"
        - attributes["http.route"] == "/metrics"
        - attributes["db.system"] == "redis"
        - attributes["db.system"] == "postgresql"
        - attributes["db.system"] == "mongodb"
        - resource.attributes["service.name"] == "litellm" and attributes["service"]
          == "postgres"
        - resource.attributes["service.name"] == "litellm" and attributes["service"]
          == "auth"

  # Filter spans for Langfuse: only keep LLM-related traces with OpenInference semantic conventions
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - attributes["openinference.span.kind"] == nil
  # A rejected OTLP request is a PERMANENT error, so the exporter drops the whole batch
  # without retrying — every span in it is lost, including the small ones that rode along.
  # The size comes from OpenInference LLM spans carrying full prompts and completions, and
  # embedding vectors. Langfuse is the consumer that needs those verbatim and it has its own
  # pipeline, so drop the payload keys on the cloud path and truncate whatever is left as a
  # backstop against the next unbounded attribute. This also keeps prompts and completions
  # from leaving the deployment for a third-party backend at all.
  transform/cloud_span_size:
    error_mode: ignore
    trace_statements:
      - delete_matching_keys(span.attributes, "^(llm[.](input|output)_messages|llm[.]prompt_template|input[.]value|output[.]value|embedding[.]embeddings)")
      - truncate_all(span.attributes, 2048)
      - truncate_all(resource.attributes, 2048)

  # Backstop (issue 1496): drop unbounded, high-cardinality HTTP server metrics
  # (side-effect of FastAPI/ASGI auto-instrumentation) before they reach the paid
  # backend. Dropping whole metrics needs no histogram re-aggregation. Catches any
  # emitter (e.g. open-webui) even if suppressed at the application source.
  filter/metrics_cardinality:
    error_mode: ignore
    metrics:
      metric:
        - name == "http.server.duration"
        - name == "http.server.request.duration"
        - name == "http.server.active_requests"
        - name == "http.server.request.size"
        - name == "http.server.response.size"
        - name == "http.server.request.body.size"
        - name == "http.server.response.body.size"
exporters:
  # Generic cloud exporter with configurable headers
  # Controlled via environment variables:
  #   - OTEL_CLOUD_ENDPOINT: Target endpoint URL
  #   - OTEL_CLOUD_HEADERS: Authentication headers (e.g., "api-key=xxx")
  otlp/cloud:
    endpoint: ${OTEL_CLOUD_ENDPOINT}
    headers: ${OTEL_CLOUD_HEADERS}
    tls:
      insecure: false
    compression: gzip
    timeout: 60s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s

  # Langfuse OTLP exporter for AI observability
  # Langfuse accepts OTLP traces via HTTP with basic auth
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
service:
  extensions: [health_check, basicauth/langfuse]
  pipelines:
    # Send OpenInference traces to the stack-local Langfuse instance
    traces/langfuse:
      receivers: [otlp]
      processors:
        - filter/noise
        - filter/langfuse
        - resource/deployment
        - batch
      exporters: [otlphttp/langfuse]
    # Send traces to cloud backend
    traces/cloud:
      receivers: [otlp]
      processors:
        - filter/noise
        - transform/cloud_span_size
        - resource/deployment
        - batch
      exporters: [otlp/cloud]

    # Send metrics to cloud backend
    metrics:
      receivers: [otlp]
      processors: [filter/metrics_cardinality, resource/deployment, batch]
      exporters: [otlp/cloud]

    # Send logs to cloud backend
    logs:
      receivers: [otlp]
      processors: [resource/deployment, batch]
      exporters: [otlp/cloud]
