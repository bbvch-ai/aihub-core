---
# ===================================================================
# Backup Dagster Configuration - Stage: local
# ===================================================================
# Generated from template. Do not edit directly.
# ===================================================================
python_logs:
  python_log_level: INFO
  managed_python_loggers:
    - swiss_ai_hub
# Tag-based mutex — every job that touches Postgres carries the
# ``postgres-mutex=true`` tag (set in packages/backup/.../jobs/factory.py).
# The QueuedRunCoordinator caps the number of simultaneously-executing runs
# with that tag at 1, so backup / cleanup / repack / restore serialize. Within
# each run, intra-run parallelism (e.g. postgres + clickhouse + milvus backups
# in the same backup_asset_job) is unaffected — that's the executor's call.
# Other future jobs (sensors, health checks, ad-hoc utilities) without this
# tag run unimpeded.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10
    tag_concurrency_limits:
      - key: postgres-mutex
        value: 'true'
        limit: 1
# The backup Dagster instance also accumulates ticks from its own daily backup
# schedule + weekly cleanup + monthly repack schedules. Same retention as the
# main instance to keep the SQLite tick table bounded.
retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: 30
