---
# ===================================================================
# Dagster Configuration - Stage: local
# ===================================================================
# Generated from template. Do not edit directly.
# Uses PgBouncer (pgbouncer:6432) for connection pooling to prevent exhaustion.
# ===================================================================
run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname: pgbouncer
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      db_name: dagster
      port: 6432
event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname: pgbouncer
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      db_name: dagster
      port: 6432
schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname: pgbouncer
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD
      db_name: dagster
      port: 6432
compute_logs:
  module: dagster.core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs:
      env: DAGSTER_MAX_CONCURRENT_RUNS
python_logs:
  python_log_level: INFO
  managed_python_loggers: [swiss_ai_hub]
telemetry:
  enabled: false
run_monitoring:
  enabled: true
  max_runtime_seconds: 7200  # Cancel runs exceeding 2 hours
  start_timeout_seconds: 300  # Fail if worker doesn't start in 5 min
  cancel_timeout_seconds: 180  # Force-cancel stuck CANCELING runs after 3 min
  poll_interval_seconds: 120  # Check run status every 2 min
# Tick history retention. Daemon-managed; covers job_ticks only — the heavy
# event_logs / runs tables are pruned by the maintenance jobs in the backup
# Dagster instance (see packages/backup/swiss_ai_hub/backup/maintenance/).
retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: 30
