  # === Traefik ===
  # <editor-fold desc="Traefik">
  traefik:
    image: ghcr.io/bbvch-ai/aihub-core/traefik:v3.4.4
    container_name: traefik
    <<: *restart-policy
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/srv/app/traefik/acme.json"
      - "--api=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/middlewares.yml:/etc/traefik/middlewares.yml:ro"
      - "/srv/app/traefik/acme.json:/srv/app/traefik/acme.json"
    labels:
    - "traefik.enable=true"

    # ACME Challenge router (higher priority)
    - "traefik.http.routers.acme-challenge.rule=PathPrefix(`/.well-known/acme-challenge/`)"
    - "traefik.http.routers.acme-challenge.entrypoints=web"
    - "traefik.http.routers.acme-challenge.priority=100"

    # HTTP to HTTPS redirect (lower priority, excludes ACME)
    - "traefik.http.routers.http-catch.rule=HostRegexp(`{host:.+}`) && !PathPrefix(`/.well-known/acme-challenge/`)"
    - "traefik.http.routers.http-catch.entrypoints=web"
    - "traefik.http.routers.http-catch.middlewares=https-redirect"
    - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

    # Dashboard
    - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
    - "traefik.http.routers.traefik.priority=500"
    - "traefik.http.routers.traefik.entrypoints=websecure"
    - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
    - "traefik.http.routers.traefik.service=api@internal"
    - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:${ADMIN_PASSWORD_HASH}"
    - "traefik.http.routers.traefik.middlewares=traefik-auth"
  # </editor-fold>


volumes:
  api-venv:
  api-api-venv:
  dagster-venv:
  dagster-pipeline-venv: