# This docker-compos file requires the following environment variables to be set:
# - MODEL_SUI_URL: The base URL for a language model API (here bound to region SUI)
# - MODEL_SUI_API_KEY: Respective API key for the SUI model
# - MODEL_EUR_URL: The base URL for a language model API (here bound to region EUR or SWE)
# - MODEL_EUR_API_KEY: Respective API key for the EUR model

# Additionally, you can set the following environment variables, if they are not set default values are used
# - VOLUME_ROOT: The root directory for volumes (default: ./local-volumes)
# - MONGO_USERNAME: The MongoDB root username (default: admin)
# - MONGO_PASSWORD: The MongoDB root password (default: admin)
# - MINIO_ACCESS_KEY: The MinIO access key (default: minioadmin)
# - MINIO_SECRET_KEY: The MinIO secret key (default: minioadmin)
# - POSTGRES_USER: The Postgres user (default: webui)
# - POSTGRES_PASSWORD: The Postgres password (default: webui_password)
# - POSTGRES_DB: The Postgres database name (default: webui)

services:
  # === Milvus Stack ===
  # <editor-fold desc="Milvus Stack">
  milvus-etcd:
    image: ghcr.io/bbvch-ai/aihub-core/etcd:v3.5.16
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./milvus.yaml:/milvus/configs/milvus.yaml
      - /DATAFILES/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  milvus-minio:
    image: ghcr.io/bbvch-ai/aihub-core/minio:release.2023-03-20t20-16-18z
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./milvus.yaml:/milvus/configs/milvus.yaml
      - /DATAFILES/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  milvus-standalone:
    image: milvusdb/milvus:v2.4.7
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/milvus-data:/milvus-data
      - ./configs/milvus/milvus.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  attu:
    image: zilliz/attu:v2.5.6
    restart: always
    ports:
      - "3003:3000"
    depends_on:
      - "milvus-standalone"
    environment:
      - MILVUS_URL=milvus-standalone:19530
    logging:
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === Postgres Stack ===
  # <editor-fold desc="Postgres Stack">
  postgres:
    image: ghcr.io/bbvch-ai/aihub-core/pgvector:pg17
    container_name: webui-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webui_password}
      POSTGRES_DB: ${POSTGRES_DB:-webui}
    ports:
      - "5432:5432"
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webui" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # </editor-fold>

  # === OpenWebUI Stack ===
  # <editor-fold desc="OpenWebUI Stack">
  openwebui:
    image: ghcr.io/bbvch-ai/aihub-core/open-webui:v0.6.13
    container_name: webui-openwebui
    network_mode: "host"
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/open-webui:/app/backend/data
    environment:
      ENV: "dev"

      SCARF_NO_ANALYTICS: true
      DO_NOT_TRACK: true
      ANONYMIZED_TELEMETRY: true
      GLOBAL_LOG_LEVEL: "debug"

      WEBUI_NAME: "bbv AI-Hub"
      CORS_ALLOW_ORIGIN: "http://localhost:8080"
      ENABLE_SIGNUP: true
      ENABLE_LOGIN_FORM: true
      ENABLE_ADMIN_EXPORT: true
      ENABLE_ADMIN_CHAT_ACCESS: true
      ENABLE_CHANNELS: false
      ADMIN_EMAIL: "ai@bbv.ch"
      SHOW_ADMIN_DETAILS: true
      DEFAULT_USER_ROLE: "user"
      DEFAULT_LOCALE: "de"
      ENABLE_OLLAMA_API: false
      ENABLE_OPENAI_API: true
      ENABLE_FORWARD_USER_INFO_HEADERS: true
      PRESERVE_METADATA_IN_OPENAI_API_CALLS: true

      WEBUI_SESSION_COOKIE_SAME_SITE: "lax"
      WEBUI_AUTH_COOKIE_SAME_SITE: "lax"

      ENABLE_WEBSOCKET_SUPPORT: true
      WEBSOCKET_MANAGER: "redis"
      WEBSOCKET_REDIS_URL: "redis://localhost:6379/1"
      WEB_CONCURRENCY: 4

      DATABASE_URL: "postgresql://webui:webui_password@localhost:5432/webui"

      OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      RAG_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      IMAGES_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"

      OPENAI_API_KEY: "67ee50ac1e8098d24d74c970.Pg_yCimIj9ZJaN6m2Bf-WEKnt8VK36xFXFzedHOKQU9ACIeTzZKM7XAbwY4T1DO1zMHE_mXmi4R2EQojaPlqtMqrNYjCiWsSR9UWwdZvS2wKTpPjfITANkjiO9nmkOFO"
      RAG_OPENAI_API_KEY: "67ee50ac1e8098d24d74c970.Pg_yCimIj9ZJaN6m2Bf-WEKnt8VK36xFXFzedHOKQU9ACIeTzZKM7XAbwY4T1DO1zMHE_mXmi4R2EQojaPlqtMqrNYjCiWsSR9UWwdZvS2wKTpPjfITANkjiO9nmkOFO"
      AUDIO_STT_OPENAI_API_KEY: "67ee50ac1e8098d24d74c970.Pg_yCimIj9ZJaN6m2Bf-WEKnt8VK36xFXFzedHOKQU9ACIeTzZKM7XAbwY4T1DO1zMHE_mXmi4R2EQojaPlqtMqrNYjCiWsSR9UWwdZvS2wKTpPjfITANkjiO9nmkOFO"
      AUDIO_TTS_OPENAI_API_KEY: "67ee50ac1e8098d24d74c970.Pg_yCimIj9ZJaN6m2Bf-WEKnt8VK36xFXFzedHOKQU9ACIeTzZKM7XAbwY4T1DO1zMHE_mXmi4R2EQojaPlqtMqrNYjCiWsSR9UWwdZvS2wKTpPjfITANkjiO9nmkOFO"
      IMAGES_OPENAI_API_KEY: "67ee50ac1e8098d24d74c970.Pg_yCimIj9ZJaN6m2Bf-WEKnt8VK36xFXFzedHOKQU9ACIeTzZKM7XAbwY4T1DO1zMHE_mXmi4R2EQojaPlqtMqrNYjCiWsSR9UWwdZvS2wKTpPjfITANkjiO9nmkOFO"

      ENABLE_IMAGE_GENERATION: true
      IMAGE_GENERATION_ENGINE: "openai"
      IMAGE_SIZE: "1792x1024"
      IMAGE_GENERATION_MODEL: "dall-e-3"

      TASK_MODEL_EXTERNAL: "aihub/gpt-4o"

      ENABLE_AUTOCOMPLETE_GENERATION: false
      AUTOCOMPLETE_GENERATION_INPUT_MAX_LENGTH: 60

      VECTOR_DB: "pgvector"
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "text-embedding-3-large"
      RAG_EMBEDDING_OPENAI_BATCH_SIZE: 8
      RAG_TOP_K: 3
      RAG_RELEVANCE_THRESHOLD: 0.5
      CHUNK_SIZE: 1024
      CHUNK_OVERLAP: 256
      PDF_EXTRACT_IMAGES: true
      RAG_FILE_MAX_SIZE: 1024
      RAG_FILE_MAX_COUNT: 10
      ENABLE_RETRIEVAL_QUERY_GENERATION: true

      ENABLE_RAG_WEB_SEARCH: true
      ENABLE_SEARCH_QUERY_GENERATION: true

      RAG_WEB_SEARCH_FULL_CONTEXT: true
      RAG_WEB_SEARCH_RESULT_COUNT: 3
      RAG_WEB_SEARCH_ENGINE: "jina"
      JINA_API_KEY: "jina_d77fa4cacc3c4ac1a7bf560370b148d1xkZBcDksnOL0K6xpXtd3E9dWQR5I"

      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_MODEL: "whisper-1"

      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_MODEL: "tts-1-hd"
      AUDIO_TTS_VOICE: "alloy"

      ENABLE_API_KEY: true
      RAG_EMBEDDING_BATCH_SIZE: 64

      WEBUI_URL: "http://localhost:8080"

      ENABLE_OAUTH_SIGNUP: true
      OAUTH_CLIENT_ID: "3dc76991-ddd7-4c2d-9cf9-ac2146f33d23"
      OAUTH_CLIENT_SECRET: "Ygj8Q~~ZiHb19RIUIH4.21ezYjBwzv9GxIu_Ubjm"
      OPENID_PROVIDER_URL: "https://login.microsoftonline.com/279985bd-2077-4d9d-9797-42238cfc06e2/v2.0/.well-known/openid-configuration"
      OAUTH_PROVIDER_NAME: "azure"

      ENABLE_DIRECT_CONNECTIONS: false
  # </editor-fold>

  # === Phoenix Stack ===
  # <editor-fold desc="Phoenix Stack">
  phoenix:
    image: ghcr.io/bbvch-ai/aihub-core/phoenix:version-10.0.4
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/phoenix-data:/data
    ports:
      - "6006:6006"
      - "4317:4317"
    restart: always
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')" ]
      interval: 10s
      timeout: 5s
      retries: 3
  # </editor-fold">

  # === Nats & Redis Stack ===
  # <editor-fold desc="NATS & Redis Stack">
  nats:
    image: ghcr.io/bbvch-ai/aihub-core/nats:2.11.4
    command: -c /etc/nats/nats.conf
    volumes:
      - ./configs/nats/nats.conf:/etc/nats/nats.conf
      - ${VOLUME_ROOT:-./local-volumes}/nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: ghcr.io/bbvch-ai/aihub-core/redis:8.0.1
    container_name: redis
    command: "redis-server --save 30 1 --loglevel warning"
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # </editor-fold>

  mongo:
    image: ghcr.io/bbvch-ai/aihub-core/mongo:8.0.9
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: ghcr.io/bbvch-ai/aihub-core/api:latest
    restart: always
    depends_on:
      - mongo
      - nats
    environment:
      NATS_ENDPOINT: nats://nats:4222
      COSMOS_CONNECTION_STRING: "mongodb://mongo_root:your_mongo_root_password@mongo:27017"
      NUM_WORKERS: 1
      LOG_LEVEL: "WARNING"
      MODEL_SUI_URL: ${MODEL_SUI_URL}
      MODEL_SUI_API_KEY: ${MODEL_SUI_API_KEY}
      MODEL_EUR_URL: ${MODEL_EUR_URL}
      MODEL_EUR_API_KEY: ${MODEL_EUR_API_KEY}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  llama.cpp:
    image: ghcr.io/bbvch-ai/aihub-core/llama.cpp:server-b5490
    platform: linux/amd64
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/llama-data:/data
    ports:
      - "8182:8182"
    command: >
      -hf unsloth/Llama-3.2-1B-Instruct-GGUF
      --port 8182
      -c 8192
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8182/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  hf-TEI:
    image: ghcr.io/bbvch-ai/aihub-core/text-embeddings-inference:cpu-1.6
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/hf-tei-data:/data
    ports:
      - "8183:8183"
    command: >
      --port 8183
      --model-id Alibaba-NLP/gte-base-en-v1.5
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8183/health" ]