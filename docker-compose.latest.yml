# This docker-compos file requires the following environment variables to be set:
# - MODEL_SUI_URL: The base URL for a language model API (here bound to region SUI)
# - MODEL_SUI_API_KEY: Respective API key for the SUI model
# - MODEL_EUR_URL: The base URL for a language model API (here bound to region EUR or SWE)
# - MODEL_EUR_API_KEY: Respective API key for the EUR model
# - POSTGRES_USER: The Postgres user
# - POSTGRES_PASSWORD: The Postgres password
# - MONGO_USERNAME: The MongoDB root username
# - MONGO_PASSWORD: The MongoDB root password

# YAML Anchors for common configurations
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

x-restart-policy: &restart-policy
  restart: always

services:
  # === MinIO Stack (self-hosted S3-compatible) ===
  # <editor-fold desc="Minio Stack">
  minio:
    image: ghcr.io/bbvch-ai/aihub-core/minio:release.2025-05-24t17-08-30z
    container_name: minio
    <<: *restart-policy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`datalake.${DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio.middlewares=security-headers@file"

  # </editor-fold>

  # === Milvus Stack ===
  # <editor-fold desc="Milvus Stack">
  etcd:
    image: ghcr.io/bbvch-ai/aihub-core/etcd:v3.5.16
    container_name: etcd
    <<: *restart-policy
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
    logging: *default-logging

  milvus-standalone:
    image: ghcr.io/bbvch-ai/aihub-core/milvus:v2.5.15
    container_name: milvus
    <<: *restart-policy
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/milvus-data:/var/lib/milvus
      - ./configs/milvus/milvus.latest.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      start_period: 90s
    depends_on:
      - "etcd"
      - "minio"
    logging: *default-logging

  attu:
    image: ghcr.io/bbvch-ai/aihub-core/attu:v2.5.12
    container_name: attu
    <<: *restart-policy
    depends_on:
      - "milvus-standalone"
    environment:
      MILVUS_URL: milvus-standalone:19530
    logging: *default-logging
  # </editor-fold>

  # === Postgres Stack ===
  # <editor-fold desc="Postgres Stack">
  postgres:
    image: ghcr.io/bbvch-ai/aihub-core/pgvector:pg17
    container_name: postgres
    <<: *restart-policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: openwebui,phoenix,dagster,litellm
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webui" ]
      start_period: 5s
    logging: *default-logging
  # </editor-fold>

  # === Phoenix Stack ===
  # <editor-fold desc="Phoenix Stack">
  phoenix:
    image: ghcr.io/bbvch-ai/aihub-core/phoenix:version-10.0.4
    container_name: phoenix
    <<: *restart-policy
    depends_on:
      - "postgres"
    environment:
      PHOENIX_SQL_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/phoenix"
      PHOENIX_ENABLE_AUTH: "False"
      VERSION: ""
    logging: *default-logging
  # </editor-fold>

  # === Nats & Redis Stack ===
  # <editor-fold desc="NATS & Redis Stack">
  nats:
    image: ghcr.io/bbvch-ai/aihub-core/nats:2.11.4
    container_name: nats
    <<: *restart-policy
    command: -c /etc/nats/nats.conf
    volumes:
      - ./configs/nats/nats.latest.conf:/etc/nats/nats.conf
      - ${VOLUME_ROOT:-./local-volumes}/nats-data:/data
    logging: *default-logging

  redis:
    image: ghcr.io/bbvch-ai/aihub-core/redis:8.0.1
    container_name: redis
    <<: *restart-policy
    command: "redis-server --save 30 1 --loglevel warning"
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      start_period: 5s
    logging: *default-logging
  # </editor-fold>

  # === Mongo Stack ===
  # <editor-fold desc="Mongo Stack">
  mongo:
    image: ghcr.io/bbvch-ai/aihub-core/mongo:8.0.9
    container_name: mongo
    <<: *restart-policy
    command: >
      --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    logging: *default-logging
  # </editor-fold>

  # === LiteLLM Stack ===
  # <editor-fold desc="LiteLLM Stack">
  presidio-analyzer:
    image: ghcr.io/bbvch-ai/aihub-core/presidio-analyzer:2.2.359
    container_name: presidio-analyzer
    <<: *restart-policy
    logging: *default-logging

  presidio-anonymizer:
    image: ghcr.io/bbvch-ai/aihub-core/presidio-anonymizer:2.2.359
    container_name: presidio-anonymizer
    <<: *restart-policy
    logging: *default-logging

  litellm:
    image: ghcr.io/bbvch-ai/aihub-core/litellm:main-v1.74.8-nightly
    container_name: lite-llm
    <<: *restart-policy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_KEY_IMAGE: ${AZURE_OPENAI_KEY_IMAGE}
      AZURE_OPENAI_KEY_AUDIO: ${AZURE_OPENAI_KEY_AUDIO}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PRESIDIO_ANALYZER_API_BASE: "http://presidio-analyzer:3000"
      PRESIDIO_ANONYMIZER_API_BASE: "http://presidio-anonymizer:3000"
      SET_VERBOSE: "false"
    volumes:
      - ./configs/litellm/litellm.latest.yaml:/app/config.yaml
    command: --config /app/config.yaml --detailed_debug
    depends_on:
      postgres:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
    logging: *default-logging
  # </editor-fold>

  # === OpenWebUI Stack ===
  # <editor-fold desc="OpenWebUI Stack">
  open-webui:
    image: ghcr.io/bbvch-ai/aihub-core/open-webui:v0.6.13
    container_name: open-webui
    <<: *restart-policy
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_started
      jupyter:
        condition: service_healthy
      playwright:
        condition: service_healthy
      docling:
        condition: service_healthy
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/open-webui:/app/backend/data
    environment:
      WEBUI_NAME: "Swiss AI-Hub"
      WEBUI_URL: 'localhost:8080'
      DEFAULT_LOCALE: 'de'
      ENABLE_BASE_MODELS_CACHE: True

      # Development
      ENV: "dev" # TODO: what is this for?
      GLOBAL_LOG_LEVEL: ${LOG_LEVEL}

      # Privacy
      ENABLE_COMMUNITY_SHARING: False
      ENABLE_USER_WEBHOOKS: False
      ENABLE_LOGIN_FORM: False
      ENABLE_FORWARD_USER_INFO_HEADERS: True
      ENABLE_VERSION_UPDATE_CHECK: False

      # Telemetry
      ENABLE_OTEL: False
      ENABLE_OTEL_METRICS: True
      OTEL_EXPORTER_OTLP_ENDPOINT: XXX # TODO: define
      OTEL_SERVICE_NAME: "open-webui"
      OTEL_BASIC_AUTH_USERNAME: XXX # TODO: define
      OTEL_BASIC_AUTH_PASSWORD: XXX # TODO: define

      # Auth
      WEBUI_AUTH: True
      DEFAULT_USER_ROLE: 'user'
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: True
      ENABLE_API_KEY: False
      WEBUI_SESSION_COOKIE_SAME_SITE: "lax"
      WEBUI_SESSION_COOKIE_SECURE: False

      # Oauth
      ENABLE_OAUTH_SIGNUP: True
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: "${OAUTH_AUTHORITY_URL}/v2.0/.well-known/openid-configuration"
      # OPENID_REDIRECT_URI: XXX
      OAUTH_ALLOWED_DOMAINS: '*'
      OAUTH_SCOPES: 'openid email profile'
      OAUTH_TIMEOUT: 60
      OAUTH_CODE_CHALLENGE_METHOD: 'S256'
      OAUTH_USERNAME_CLAIM: 'name'
      OAUTH_PICTURE_CLAIM: 'picture'
      OAUTH_EMAIL_CLAIM: 'email'
      OAUTH_GROUP_CLAIM: 'email'

      # Data storage
      STORAGE_PROVIDER: "s3"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION_NAME: "us-east-1"
      S3_BUCKET_NAME: "open-webui"
      S3_ENDPOINT_URL: 'http://minio:9000'

      # Model config
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      RAG_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      AUDIO_STT_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      AUDIO_TTS_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      IMAGES_OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_BASE_URL: "litellm:4000/v1"
      MODELS_CACHE_TTL: 60
      TASK_MODEL: 'azure/gpt-4o-mini'
      TASK_MODEL_EXTERNAL: 'azure/gpt-4o-mini'

      # Database
      DATABASE_TYPE: 'postgres'
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: 'postgres'
      DATABASE_PORT: 5432
      DATABASE_NAME: 'openwebui'

      # Redis
      REDIS_URL: 'redis://redis:6379/1'
      REDIS_KEY_PREFIX: "open-webui"

      # Web server
      UVICORN_WORKERS: 1
      ENABLE_WEBSOCKET_SUPPORT: True
      WEBSOCKET_MANAGER: "redis"
      WEBSOCKET_REDIS_URL: 'redis://redis:6379/1'
      THREAD_POOL_SIZE: 32
      CORS_ALLOW_ORIGIN: "*"

      # Admin
      ENABLE_ADMIN_EXPORT: True
      ENABLE_ADMIN_CHAT_ACCESS: True
      SHOW_ADMIN_DETAILS: True
      ADMIN_EMAIL: 'admin@ai-hub.bbv.ch'

      # Code execution
      CODE_EXECUTION_ENGINE: 'jupyter'
      CODE_EXECUTION_JUPYTER_URL: 'http://jupyter:8888'
      CODE_EXECUTION_JUPYTER_AUTH: 'token'
      CODE_EXECUTION_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}

      # Code Interpreter
      CODE_INTERPRETER_ENGINE: 'jupyter'
      CODE_INTERPRETER_JUPYTER_URL: 'http://jupyter:88888'
      CODE_INTERPRETER_JUPYTER_AUTH: 'token'
      CODE_INTERPRETER_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}

      # Vector DB
      VECTOR_DB: 'milvus'
      MILVUS_DB: 'default'
      MILVUS_URI: 'http://milvus:19530'
      MILVUS_INDEX_TYPE: 'HNSW'
      MILVUS_METRIC_TYPE: 'COSINE'
      MILVUS_HNSW_M: '16'
      MILVUS_HNSW_EFCONSTRUCTION: '256'

      # RAG
      RAG_FULL_CONTEXT: True
      RAG_EMBEDDING_BATCH_SIZE: 64
      PDF_EXTRACT_IMAGES: True
      RAG_FILE_MAX_COUNT: 4

      # Docling
      CONTENT_EXTRACTION_ENGINE: 'docling'
      DOCLING_SERVER_URL: 'http://docling:5001'
      DOCLING_OCR_ENGINE: 'easyocr'
      DOCLING_OCR_LANG: 'en,de,fr,it'

      # Web search
      ENABLE_WEB_SEARCH: True
      WEB_SEARCH_ENGINE: 'jina'
      JINA_API_KEY: ${JINA_API_KEY}
      WEB_SEARCH_RESULT_COUNT: 6
      WEB_SEARCH_CONCURRENT_REQUESTS: 6
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: True
      WEB_LOADER_ENGINE: 'playwright'
      PLAYWRIGHT_WS_URL: 'ws://playwright:3000/ws'
      FILE_IMAGE_COMPRESSION_WIDTH: 796
      FILE_IMAGE_COMPRESSION_HEIGHT: 796

      # Image Generation
      IMAGE_GENERATION_MODEL: 'azure/dall-e-3'
      IMAGE_SIZE: '1024x1024'

      # Audio
      AUDIO_STT_ENGINE: 'openai'
      AUDIO_TTS_ENGINE: 'openai'
      AUDIO_STT_MODEL: 'azure/gpt-4o-mini-transcribe'
      AUDIO_TTS_MODEL: 'azure/gpt-4o-mini-tts'
      AUDIO_TTS_VOICE: 'alloy'

      # User Permissions
      # Workspace
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: False
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: False
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: False
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: False
      # Sharing
      USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_PUBLIC_SHARING: False
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_PUBLIC_SHARING: False
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_PUBLIC_SHARING: False
      USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_PUBLIC_SHARING: False
      # Chat
      USER_PERMISSIONS_CHAT_CONTROLS: True
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: True
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: True
      USER_PERMISSIONS_CHAT_DELETE: True
      USER_PERMISSIONS_CHAT_EDIT: True
      USER_PERMISSIONS_CHAT_SHARE: False
      USER_PERMISSIONS_CHAT_EXPORT: False
      USER_PERMISSIONS_CHAT_STT: True
      USER_PERMISSIONS_CHAT_TTS: True
      USER_PERMISSIONS_CHAT_CALL: True
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: True
      USER_PERMISSIONS_CHAT_TEMPORARY: True
      USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED: False
      # Features
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: False
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: True
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: True
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: True
      USER_PERMISSIONS_FEATURES_NOTES: True






    logging: *default-logging
    labels:
      - "traefik.enable=true"

      # --- /oauth Route ---
      - "traefik.http.routers.openwebui-oauth.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/oauth`)"
      - "traefik.http.routers.openwebui-oauth.priority=3000"
      - "traefik.http.routers.openwebui-oauth.entrypoints=websecure"
      - "traefik.http.routers.openwebui-oauth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-oauth.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- /assets Route ---
      - "traefik.http.routers.openwebui-assets.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/assets`)"
      - "traefik.http.routers.openwebui-assets.priority=3000"
      - "traefik.http.routers.openwebui-assets.entrypoints=websecure"
      - "traefik.http.routers.openwebui-assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-assets.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- /_app Route ---
      - "traefik.http.routers.openwebui-app.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/_app`)"
      - "traefik.http.routers.openwebui-app.priority=3000"
      - "traefik.http.routers.openwebui-app.entrypoints=websecure"
      - "traefik.http.routers.openwebui-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-app.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- /static Route ---
      - "traefik.http.routers.openwebui-static.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/static`)"
      - "traefik.http.routers.openwebui-static.priority=3000"
      - "traefik.http.routers.openwebui-static.entrypoints=websecure"
      - "traefik.http.routers.openwebui-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-static.middlewares=security-headers@file,allow-iframe"

      # --- /openwebui Route ---
      - "traefik.http.routers.openwebui.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/openwebui`)"
      - "traefik.http.routers.openwebui.priority=3000"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui.middlewares=strip-openwebui,security-headers@file,allow-iframe,strip-openwebui"
      - "traefik.http.middlewares.strip-openwebui.stripprefix.prefixes=/openwebui"

      # --- /api Route ---
      - "traefik.http.routers.openwebui-api.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.openwebui-api.priority=2200"
      - "traefik.http.routers.openwebui-api.entrypoints=websecure"
      - "traefik.http.routers.openwebui-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-api.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- /api Route ---
      - "traefik.http.routers.openwebui-api.rule=Host(`openwebui.${DOMAIN}`) && PathPrefix(`/api/v1/auths`)"
      - "traefik.http.routers.openwebui-api.priority=4000"
      - "traefik.http.routers.openwebui-api.entrypoints=websecure"
      - "traefik.http.routers.openwebui-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-api.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- Index / Catch-All Route ---
      - "traefik.http.routers.openwebui-index.rule=Host(`openwebui.${DOMAIN}`)"
      - "traefik.http.routers.openwebui-index.priority=2100"
      - "traefik.http.routers.openwebui-index.entrypoints=websecure"
      - "traefik.http.routers.openwebui-index.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openwebui-index.middlewares=security-headers@file,allow-iframe,forwarded-headers"

      # --- Shared Service ---
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

      # --- Allow Iframe Middleware ---
      - "traefik.http.middlewares.allow-iframe.headers.customResponseHeaders.Content-Security-Policy=frame-ancestors 'self' https://${DOMAIN}"
      - "traefik.http.middlewares.allow-iframe.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.forwarded-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.forwarded-headers.headers.customrequestheaders.X-Forwarded-Host=openwebui.${DOMAIN}"
      - "traefik.http.middlewares.forwarded-headers.headers.customRequestHeaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.forwarded-headers.headers.customRequestHeaders.X-Real-IP=%{remote_addr}"

  jupyter:
    image: ghcr.io/bbvch-ai/aihub-core/minimal-notebook:notebook-7.0.6
    container_name: jupyter-lab
    <<: *restart-policy
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/llama-data:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: yes
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}

  playwright:
    image: ghcr.io/bbvch-ai/aihub-core/playwright:v1.54.1-jammy
    container_name: playwright-server
    <<: *restart-policy
    command: npx playwright run-server --port 3000 --host 0.0.0.0
    environment:
      NODE_ENV: production
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # </editor-fold>

  # === Dagster Stack ===
  # <editor-fold desc="Dagster Stack">
  oauth2proxy:
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    container_name: oauth2proxy
    <<: *restart-policy
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://dagster-webserver:3000
      OAUTH2_PROXY_ALLOWED_GROUPS: "DagsterAdmin"
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "roles"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OAUTH_AUTHORITY_URL}/v2.0"
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: "https://aiagentsstpublicblobs.blob.core.windows.net/logos/Bbv-Logo_farbig.png"
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: "https://dagster.${DOMAIN}"
    logging: *default-logging
    labels:
      - "traefik.enable=true"

      # --- dagster Subdomain ---
      - "traefik.http.routers.dagster.rule=Host(`dagster.${DOMAIN}`)"
      - "traefik.http.routers.dagster.priority=500"
      - "traefik.http.routers.dagster.entrypoints=websecure"
      - "traefik.http.routers.dagster.tls.certresolver=letsencrypt"
      - "traefik.http.services.dagster.loadbalancer.server.port=4180"
      - "traefik.http.routers.dagster.middlewares=security-headers@file"

  dagster-webserver:
    image: ghcr.io/bbvch-ai/aihub-core/dagster:latest
    container_name:  dagster-webserver
    <<: *restart-policy
    entrypoint:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - '3000'
      - -w
      - /dagster_home/workspace.yaml
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/dagster-data:/dagster_home
      - dagster-venv:/app/.venv
      - dagster-pipeline-venv:/app/aihub_pipeline/.venv
      - ./configs/dagster/dagster.latest.yaml:/dagster_home/dagster.yaml:ro
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *default-logging

  dagster-daemon:
    image: ghcr.io/bbvch-ai/aihub-core/dagster:latest
    container_name: dagster-daemon
    <<: *restart-policy
    entrypoint:
      - dagster-daemon
      - run
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/dagster-data:/dagster_home
      - dagster-venv:/app/.venv
      - dagster-pipeline-venv:/app/aihub_pipeline/.venv
      - ./configs/dagster/dagster.latest.yaml:/dagster_home/dagster.yaml:ro
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *default-logging
  # </editor-fold>

  # === API Stack ===
  # <editor-fold desc="API Stack">
  api:
    image: ghcr.io/bbvch-ai/aihub-core/api:latest
    container_name: api
    <<: *restart-policy
    depends_on:
      - "mongo"
      - "nats"
      - "traefik"
    volumes:
      - api-venv:/app/.venv
      - api-api-venv:/app/aihub_api/.venv
    environment:
      NATS_ENDPOINT: "nats://nats:4222"
      COSMOS_CONNECTION_STRING: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017"
      NUM_WORKERS: 1
      LOG_LEVEL: ${LOG_LEVEL}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_AUTHORITY_URL: ${OAUTH_AUTHORITY_URL}
      AIHUB_API_VERSION: "dev"
      AIHUB_FRONTEND_ORIGIN: "${DOMAIN}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
    logging: *default-logging
    labels:
      - "traefik.enable=true"

      # --- /api/v1 Route ---
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.priority=300"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=security-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
  # </editor-fold>

  # === Docling ===
  # <editor-fold desc="Docling Stack">
  docling:
    image: ghcr.io/bbvch-ai/aihub-core/docling-serve:v1.1.0
    container_name: docling-serve
    <<: *restart-policy
    environment:
      DOCLING_SERVE_ENABLE_UI: false
      DOCLING_SERVE_MAX_SYNC_WAIT: 120
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
    logging: *default-logging
  # </editor-fold>

  # === SUITE UI Stack ===
  # <editor-fold desc="SUITE UI Stack">
  web:
    image: ghcr.io/bbvch-ai/aihub-core/web:latest
    container_name: web
    <<: *restart-policy
    environment:
      AZURE_AD_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_AUTHORITY_URL: ${OAUTH_AUTHORITY_URL}
      WEBUI_URL: "https://openwebui.${DOMAIN}"
      WS_ENDPOINT: "wss://${DOMAIN}/api/v1/event/ws"
    logging: *default-logging
    labels:
      - "traefik.enable=true"

      # --- Index / Catch-All Route ---
      - "traefik.http.routers.web-nuxt.rule=PathPrefix(`/_nuxt`)"
      - "traefik.http.routers.web-nuxt.priority=500"
      - "traefik.http.routers.web-nuxt.entrypoints=websecure"
      - "traefik.http.routers.web-nuxt.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-nuxt.middlewares=security-headers@file"

      # --- Index / Catch-All Route ---
      - "traefik.http.routers.web-auth.rule=PathPrefix(`/en/auth`) || PathPrefix(`/de/auth`) || PathPrefix(`/fr/auth`) || PathPrefix(`/it/auth`)"
      - "traefik.http.routers.web-auth.priority=500"
      - "traefik.http.routers.web-auth.entrypoints=websecure"
      - "traefik.http.routers.web-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-auth.middlewares=security-headers@file"

      # --- Index / Catch-All Route ---
      - "traefik.http.routers.web-index.rule=Path(`/`) || Path(`/index.html`) || Path(`/config.json`)"
      - "traefik.http.routers.web-index.priority=500"
      - "traefik.http.routers.web-index.entrypoints=websecure"
      - "traefik.http.routers.web-index.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-index.middlewares=security-headers@file"

      # --- Index / Catch-All Route ---
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.priority=100"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers@file"

      # --- Shared Service ---
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # </editor-fold>


  # === Common Agents ===
  # TODO: define which common agents should always be included...
  # <editor-fold desc="Common Agents">
  # </editor-fold>
  # === Common Pipelines ===
    # TODO: define which common pipelines should always be included...

  # </editor-fold>

  # <editor-fold desc="Common Pipelines">
