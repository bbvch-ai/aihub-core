# This docker-compos file requires the following environment variables to be set:
# - MODEL_SUI_URL: The base URL for a language model API (here bound to region SUI)
# - MODEL_SUI_API_KEY: Respective API key for the SUI model
# - MODEL_EUR_URL: The base URL for a language model API (here bound to region EUR or SWE)
# - MODEL_EUR_API_KEY: Respective API key for the EUR model
# - MINIO_ACCESS_KEY: The MinIO access key
# - MINIO_SECRET_KEY: The MinIO secret key
# - POSTGRES_USER: The Postgres user
# - POSTGRES_PASSWORD: The Postgres password
# - MONGO_USERNAME: The MongoDB root username
# - MONGO_PASSWORD: The MongoDB root password

services:
  # === MinIO Stack (self-hosted S3-compatible) ===
  # <editor-fold desc="Minio Stack">
  minio:
    image: ghcr.io/bbvch-ai/aihub-core/minio:release.2025-05-24t17-08-30z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ./configs/milvus/milvus.yaml:/milvus/configs/milvus.yaml
      - ${VOLUME_ROOT:-./local-volumes}/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`datalake.${DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio.middlewares=security-headers@file"

  # </editor-fold>

  # === Milvus Stack ===
  # <editor-fold desc="Milvus Stack">
  milvus-etcd:
    image: ghcr.io/bbvch-ai/aihub-core/etcd:v3.5.16
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  milvus-standalone:
    image: milvusdb/milvus:v2.4.7
    restart: always
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/milvus-data:/var/lib/milvus
      - ./configs/milvus/milvus.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "milvus-etcd"
      - "minio"
    logging:
      options:
        max-size: "10m"
        max-file: "2"


  # TODO: only use in dev , delete from latest
  attu:
    image: zilliz/attu:v2.5.6
    restart: always
    depends_on:
      - "milvus-standalone"
    environment:
      - MILVUS_URL=milvus-standalone:19530
    logging:
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === Postgres Stack ===
  # <editor-fold desc="Postgres Stack">
  postgres:
    image: ghcr.io/bbvch-ai/aihub-core/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: openwebui,phoenix,dagster
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webui" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === OpenWebUI Stack ===
  # <editor-fold desc="OpenWebUI Stack">
  openwebui:
    image: ghcr.io/bbvch-ai/aihub-core/open-webui:v0.6.13
    restart: always
    depends_on:
      - "postgres"
      - "redis"
      - "traefik"
    container_name: openwebui
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/open-webui:/app/backend/data
    environment:
      ENV: "dev"

      SCARF_NO_ANALYTICS: true
      DO_NOT_TRACK: true
      ANONYMIZED_TELEMETRY: true
      GLOBAL_LOG_LEVEL: "debug"

      WEBUI_NAME: "bbv AI-Hub"
      CORS_ALLOW_ORIGIN: "http://localhost:8080"
      ENABLE_SIGNUP: true
      ENABLE_LOGIN_FORM: false
      ENABLE_ADMIN_EXPORT: true
      ENABLE_ADMIN_CHAT_ACCESS: true
      ENABLE_CHANNELS: false
      ADMIN_EMAIL: "ai@bbv.ch"
      SHOW_ADMIN_DETAILS: true
      DEFAULT_USER_ROLE: "user"
      DEFAULT_LOCALE: "de"
      ENABLE_OLLAMA_API: false
      ENABLE_OPENAI_API: true
      ENABLE_FORWARD_USER_INFO_HEADERS: true
      PRESERVE_METADATA_IN_OPENAI_API_CALLS: true

      WEBUI_SESSION_COOKIE_SAME_SITE: "lax"
      WEBUI_AUTH_COOKIE_SAME_SITE: "lax"

      ENABLE_WEBSOCKET_SUPPORT: true
      WEBSOCKET_MANAGER: "redis"
      WEBSOCKET_REDIS_URL: "redis://redis:6379/1"
      WEB_CONCURRENCY: 4

      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui"

      OPENAI_API_BASE_URL: "http://api:8000/api/v1/openai"
      RAG_OPENAI_API_BASE_URL: "http://api:8000/api/v1/openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://api:8000/api/v1/openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://api:8000/api/v1/openai"
      IMAGES_OPENAI_API_BASE_URL: "http://api:8000/api/v1/openai"

      ENABLE_IMAGE_GENERATION: true
      IMAGE_GENERATION_ENGINE: "openai"
      IMAGE_SIZE: "1792x1024"
      IMAGE_GENERATION_MODEL: "dall-e-3"

      TASK_MODEL_EXTERNAL: "aihub/gpt-4o"

      ENABLE_AUTOCOMPLETE_GENERATION: false
      AUTOCOMPLETE_GENERATION_INPUT_MAX_LENGTH: 60

      VECTOR_DB: "pgvector"
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "text-embedding-3-large"
      RAG_EMBEDDING_OPENAI_BATCH_SIZE: 8
      RAG_TOP_K: 3
      RAG_RELEVANCE_THRESHOLD: 0.5
      CHUNK_SIZE: 1024
      CHUNK_OVERLAP: 256
      PDF_EXTRACT_IMAGES: true
      RAG_FILE_MAX_SIZE: 1024
      RAG_FILE_MAX_COUNT: 10
      ENABLE_RETRIEVAL_QUERY_GENERATION: true

      ENABLE_RAG_WEB_SEARCH: true
      ENABLE_SEARCH_QUERY_GENERATION: true

      RAG_WEB_SEARCH_FULL_CONTEXT: true
      RAG_WEB_SEARCH_RESULT_COUNT: 3
      RAG_WEB_SEARCH_ENGINE: "jina"
      JINA_API_KEY: "jina_d77fa4cacc3c4ac1a7bf560370b148d1xkZBcDksnOL0K6xpXtd3E9dWQR5I"

      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_MODEL: "whisper-1"

      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_MODEL: "tts-1-hd"
      AUDIO_TTS_VOICE: "alloy"

      ENABLE_API_KEY: true
      RAG_EMBEDDING_BATCH_SIZE: 64

      WEBUI_URL: "http://localhost:8080"

      ENABLE_OAUTH_SIGNUP: true
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_SCOPES: "openid email profile"
      OAUTH_CODE_CHALLENGE_METHOD: "S256"
      OPENID_REDIRECT_URI: "https://openwebui.${DOMAIN}/oauth/oidc/callback"

      ENABLE_DIRECT_CONNECTIONS: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`openwebui.${DOMAIN}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.allow-iframe.headers.customResponseHeaders.Content-Security-Policy=frame-ancestors 'self' https://${DOMAIN}"
      - "traefik.http.routers.webui.middlewares=security-headers@file,allow-iframe"

  # </editor-fold>

  # === Phoenix Stack ===
  # <editor-fold desc="Phoenix Stack">
  phoenix:
    image: ghcr.io/bbvch-ai/aihub-core/phoenix:version-10.0.4
    restart: always
    depends_on:
      - "postgres"
      - "traefik"
    environment:
      PHOENIX_SQL_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/phoenix"
      AZURE_CLIENT_ID: ${OAUTH_CLIENT_ID} # Is this really needed? Is this not duplicate to PHOENIX_OAUTH2_MICROSOFT_ENTRA_ID_CLIENT_ID
      PHOENIX_OAUTH2_MICROSOFT_ENTRA_ID_CLIENT_ID: ${OAUTH_CLIENT_ID}
      PHOENIX_OAUTH2_MICROSOFT_ENTRA_ID_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      PHOENIX_OAUTH2_MICROSOFT_ENTRA_ID_OIDC_CONFIG_URL: ${OPENID_PROVIDER_URL}
      PHOENIX_ENABLE_AUTH: "True"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      VERSION: ""
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phoenix.rule=Host(`phoenix.${DOMAIN}`)"
      - "traefik.http.routers.phoenix.entrypoints=websecure"
      - "traefik.http.routers.phoenix.tls.certresolver=letsencrypt"
      - "traefik.http.services.phoenix.loadbalancer.server.port=6006"
      - "traefik.http.routers.phoenix.middlewares=security-headers@file"
  # </editor-fold">

  # === Dagster Stack ===
  # <editor-fold desc="Dagster Stack">
  oauth2proxy:
    image: ghcr.io/bbvch-ai/bbvch-ai/oauth2-proxy:latest
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_UPSTREAMS: http://dagster-webserver:3000
      OAUTH2_PROXY_ALLOWED_GROUPS: "DagsterAdmin"
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "roles"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_AZURE_TENANT: ${OAUTH_TENANT_ID}
      OAUTH2_PROXY_PROVIDER: "azure"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://login.microsoftonline.com/${OAUTH_TENANT_ID}/v2.0"
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: "https://aiagentsstpublicblobs.blob.core.windows.net/logos/Bbv-Logo_farbig.png"
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_REDIRECT_URL: "https://dagster.${DOMAIN}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dagster.rule=Host(`dagster.${DOMAIN}`)"
      - "traefik.http.routers.dagster.entrypoints=websecure"
      - "traefik.http.routers.dagster.tls.certresolver=letsencrypt"
      - "traefik.http.services.dagster.loadbalancer.server.port=4180"
      - "traefik.http.routers.dagster.middlewares=security-headers@file"

  dagster-webserver:
    image: ghcr.io/bbvch-ai/aihub-core/dagster:latest
    entrypoint:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - '3000'
      - -w
      - /dagster_home/workspace.yaml
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/dagster-data:/dagster_home
      - dagster-venv:/app/.venv
      - dagster-pipeline-venv:/app/aihub_pipeline/.venv
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  dagster-daemon:
    image: ghcr.io/bbvch-ai/aihub-core/dagster:latest
    entrypoint:
      - dagster-daemon
      - run
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/dagster-data:/dagster_home
      - dagster-venv:/app/.venv
      - dagster-pipeline-venv:/app/aihub_pipeline/.venv
    environment:
      PYTHONUNBUFFERED: 1
      DAGSTER_HOME: /dagster_home
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === Nats & Redis Stack ===
  # <editor-fold desc="NATS & Redis Stack">
  nats:
    image: ghcr.io/bbvch-ai/aihub-core/nats:2.11.4
    command: -c /etc/nats/nats.conf
    volumes:
      - ./configs/nats/nats.conf:/etc/nats/nats.conf
      - ${VOLUME_ROOT:-./local-volumes}/nats-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: ghcr.io/bbvch-ai/aihub-core/redis:8.0.1
    command: "redis-server --save 30 1 --loglevel warning"
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === Mongo Stack ===
  # <editor-fold desc="Mongo Stack">
  mongo:
    image: ghcr.io/bbvch-ai/aihub-core/mongo:8.0.9
    restart: always
    command: >
      --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./local-volumes}/mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    logging:
      options:
        max-size: "10m"
        max-file: "2"
  # </editor-fold>

  # === API Stack ===
  # <editor-fold desc="API Stack">
  api:
    image: ghcr.io/bbvch-ai/aihub-core/api:latest
    restart: always
    depends_on:
      - "mongo"
      - "nats"
      - "traefik"
    volumes:
      - api-venv:/app/.venv
      - api-api-venv:/app/aihub_api/.venv
    environment:
      NATS_ENDPOINT: "nats://nats:4222"
      COSMOS_CONNECTION_STRING: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017"
      NUM_WORKERS: 1
      LOG_LEVEL: "DEBUG"
      MODEL_SUI_URL: ${MODEL_SUI_URL}
      MODEL_SUI_API_KEY: ${MODEL_SUI_API_KEY}
      MODEL_EUR_URL: ${MODEL_EUR_URL}
      MODEL_EUR_API_KEY: ${MODEL_EUR_API_KEY}
      CLIENT_ID: ${OAUTH_CLIENT_ID}
      AZURE_CLIENT_ID: ${OAUTH_CLIENT_ID}
      TENANT_ID: ${OAUTH_TENANT_ID}
      AZURE_TENANT_ID: ${OAUTH_TENANT_ID}
      AUTHORITY_URL: ${OAUTH_AUTHORITY_URL}
      AZURE_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=security-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
  # </editor-fold>

  # === Docling ===
  # <editor-fold desc="API Stack">
  docling:
    image: ghcr.io/bbvch-ai/aihub-core/docling-serve:v1.0.1
    container_name: docling-serve
    environment:
      DOCLING_SERVE_ENABLE_UI: false
      DOCLING_SERVE_MAX_SYNC_WAIT: 120
  # </editor-fold>

  # === SUITE UI Stack ===
  # <editor-fold desc="Suite UI Stack">
  web:
    image: ghcr.io/bbvch-ai/aihub-core/web:latest
    restart: always
    environment:
      AZURE_AD_CLIENT_ID: ${OAUTH_CLIENT_ID}
      AZURE_AD_TENANT_ID: ${OAUTH_TENANT_ID}
      WEBUI_URL: "https://openwebui.${DOMAIN}"
      WS_ENDPOINT: "wss://${DOMAIN}/api/v1/event/ws"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers@file"
      - "traefik.http.services.web.loadbalancer.server.port=80"
  # </editor-fold>

  # === Common Agents ===
  # TODO: define which common agents should always be included...
  # <editor-fold desc="Common Agents">
  # </editor-fold>
  # === Common Pipelines ===
    # TODO: define which common pipelines should always be included...
  # <editor-fold desc="Common Pipelines">
  # </editor-fold>
  # === Traefik ===
  # <editor-fold desc="Traefik">
  traefik:
    image: traefik:v3.4.4
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/srv/app/traefik/acme.json"
      - "--api=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/middlewares.yml:/etc/traefik/middlewares.yml:ro"
      - "/srv/app/traefik/acme.json:/srv/app/traefik/acme.json"
    labels:
    - "traefik.enable=true"

    # ACME Challenge router (higher priority)
    - "traefik.http.routers.acme-challenge.rule=PathPrefix(`/.well-known/acme-challenge/`)"
    - "traefik.http.routers.acme-challenge.entrypoints=web"
    - "traefik.http.routers.acme-challenge.priority=100"

    # HTTP to HTTPS redirect (lower priority, excludes ACME)
    - "traefik.http.routers.http-catch.rule=HostRegexp(`{host:.+}`) && !PathPrefix(`/.well-known/acme-challenge/`)"
    - "traefik.http.routers.http-catch.entrypoints=web"
    - "traefik.http.routers.http-catch.middlewares=https-redirect"
    - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

    # Dashboard
    - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
    - "traefik.http.routers.traefik.entrypoints=websecure"
    - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
    - "traefik.http.routers.traefik.service=api@internal"
    - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:${ADMIN_PASSWORD_HASH}"
    - "traefik.http.routers.traefik.middlewares=traefik-auth"
  # </editor-fold>


volumes:
  api-venv:
  api-api-venv:
  dagster-venv:
  dagster-pipeline-venv: