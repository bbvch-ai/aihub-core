---
# This file is auto-generated from a Jinja2 template.
# DO NOT EDIT THIS FILE DIRECTLY.
#
# To make changes, edit the following files and then run the generator script:
#   - deployment/compose-config.yml (for changing values and versions)
#   - deployment/templates/docker-compose.yml.j2 (for changing structure and logic)
services:
  # ===================================================================
  # SeaweedFS Stack (Distributed Object Storage)
  # ===================================================================
  # This stack provides S3-compatible storage for the entire platform.
  # ===================================================================
  seaweedfs-master:
    container_name: seaweedfs-master
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    expose:
      - '9333'   # Master HTTP port
      - '19333'  # Master gRPC port
    command: >
      master
      -ip=seaweedfs-master
      -ip.bind=0.0.0.0
      -defaultReplication=000
      -volumeSizeLimitMB=1024
      -volumePreallocate=false
    environment:
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-master:/data']
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9333/dir/status
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [storage]
  seaweedfs-volume:
    container_name: seaweedfs-volume
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    expose: ['8080', '18080']
    command: >
      volume
      -mserver="seaweedfs-master:9333"
      -ip.bind=0.0.0.0
      -port=8080
      -max=100
      -dataCenter=dc1
    environment:
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-volume:/data']
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8080'
      healthcheck.path: /status
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [storage]
  seaweedfs-filer:
    container_name: seaweedfs-filer
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    ports: [8889:8888, '18888']
    command: >
      filer
      -master="seaweedfs-master:9333"
      -ip.bind=0.0.0.0
    environment:
      # Internal JWT Authentication
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}

      # Etcd Configuration (SeaweedFS reads WEED_ETCD_* env vars)
      WEED_ETCD_ENABLED: 'true'
      WEED_ETCD_SERVERS: http://etcd:2379
      WEED_ETCD_TIMEOUT: 3s
      WEED_ETCD_USERNAME: root
      WEED_ETCD_PASSWORD: ${ETCD_TOKEN}

      # Disable default leveldb2 store when using etcd
      WEED_LEVELDB2_ENABLED: 'false'
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/seaweedfs-filer:/data']
    depends_on:
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started
      etcd-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8888/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - storage
      - data  # For etcd access
  seaweedfs-s3:
    container_name: seaweedfs-s3
    image: ghcr.io/bbvch-ai/aihub-core/seaweedfs:3.97
    restart: always
    ports: [9000:9000]
    volumes:
      - ./configs/seaweedfs/s3-entrypoint.sh:/usr/local/bin/s3-entrypoint.sh:ro
    entrypoint: [/bin/sh, /usr/local/bin/s3-entrypoint.sh]
    environment:
      # S3 Authentication
      SEAWEEDFS_S3_USER: ${S3_STORAGE_ACCESS_KEY}
      SEAWEEDFS_S3_PASSWORD: ${S3_STORAGE_SECRET_KEY}

      # Internal JWT Authentication
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_TOKEN}

      # S3 Service Configuration
      S3_PORT: '9000'
      S3_FILER: seaweedfs-filer:8888
      S3_BIND_IP: 0.0.0.0
      S3_ALLOW_EMPTY_FOLDER: true
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9000/status
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - storage
      - backend  # Internal access from application services
  seaweedfs-init:
    container_name: seaweedfs-init
    image: ghcr.io/bbvch-ai/aihub-core/aws-cli-alpine:3.22.1
    restart: 'no'
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_ENDPOINT: http://seaweedfs-s3:9000
      AIHUB_CREATE_DEFAULT_BUCKETS: ${AIHUB_CREATE_DEFAULT_BUCKETS}
      AIHUB_DEFAULT_BUCKET_NAME: ${AIHUB_DEFAULT_BUCKET_NAME}
      AIHUB_SHARED_BUCKET_NAME: ${AIHUB_SHARED_BUCKET_NAME}
    volumes:
      - ./configs/seaweedfs/init-buckets.sh:/usr/local/bin/init-buckets.sh:ro
    entrypoint: [/bin/sh, /usr/local/bin/init-buckets.sh]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - storage
      - backend

  # ===================================================================
  # Milvus Stack (Vector Database)
  # ===================================================================
  # This stack provides vector storage and search for RAG capabilities.
  # ===================================================================
  etcd:
    container_name: etcd
    image: ghcr.io/bbvch-ai/aihub-core/etcd:v3.5.25
    restart: always
    command:
      - etcd
      - --name=s1
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=s1=http://etcd:2380
      - --auth-token=simple
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
      # Token for healthcheck (used after auth is enabled by etcd-init)
      ETCD_TOKEN: ${ETCD_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/etcd-data:/etcd']
    healthcheck:
      # Use credentials for healthcheck to work after auth is enabled
      test: [CMD, etcdctl, '--user=root:${ETCD_TOKEN}', endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Milvus metadata storage
      - storage  # SeaweedFS filer metadata
  etcd-init:
    container_name: etcd-init
    build:
      context: ./configs/etcd
      dockerfile: init.Dockerfile
    restart: 'no'
    depends_on:
      etcd:
        condition: service_started
    environment:
      ETCDCTL_ENDPOINTS: http://etcd:2379
      ETCDCTL_API: '3'
      ETCD_ROOT_PASSWORD: ${ETCD_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data
      - storage  # Used by SeaweedFS filer for metadata
  milvus-standalone:
    container_name: milvus
    image: ghcr.io/bbvch-ai/aihub-core/milvus:v2.6.7
    restart: always
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      # Etcd Configuration (dots in YAML become underscores in env vars)
      ETCD_ENDPOINTS: etcd:2379
      ETCD_ROOTPATH: milvus
      ETCD_AUTH_USERNAME: root
      ETCD_AUTH_PASSWORD: ${ETCD_TOKEN}
      # MinIO/S3 Storage Configuration
      MINIO_ADDRESS: seaweedfs-s3:9000
      MINIO_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      # Token-based authentication - root password for Milvus
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD}
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/milvus-data:/var/lib/milvus
      - ./configs/milvus/milvus-config.dev.gpu.yml:/milvus/configs/milvus.yaml
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      start_period: 90s
    ports: [19530:19530, 9091:9091]
    depends_on:
      etcd-init:
        condition: service_completed_successfully
      seaweedfs-s3:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data
      - storage  # For S3 access to SeaweedFS
  attu:
    container_name: attu
    image: ghcr.io/bbvch-ai/aihub-core/attu:v2.5.12
    restart: always
    depends_on: [milvus-standalone]
    ports: [3003:3000]
    environment:
      MILVUS_URL: milvus-standalone:19530
      # Milvus authentication credentials (root username is hardcoded in Milvus)
      ATTU_LOGIN_USERNAME: root
      ATTU_LOGIN_PASSWORD: ${MILVUS_ROOT_PASSWORD}
    healthcheck:
      test: [NONE]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # Postgres Stack (SQL Database)
  # ===================================================================
  # PostgreSQL instance for application relational data.
  # ===================================================================
  postgres:
    container_name: postgres
    image: ghcr.io/bbvch-ai/aihub-core/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: openwebui,langfuse,dagster,litellm,keycloak
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports: [5432:5432]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER}']
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # FerretDB Stack (MongoDB Compatibility)
  # ===================================================================
  # FerretDB provides MongoDB-compatible API backed by PostgreSQL.
  # ===================================================================
  postgres-ferretdb:
    container_name: postgres-ferretdb
    image: ghcr.io/bbvch-ai/aihub-core/postgres-documentdb:17.0.106.0-ferretdb-2.5.0
    restart: always
    environment:
      POSTGRES_USER: ${MONGO_USERNAME}
      POSTGRES_PASSWORD: ${MONGO_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/ferretdb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${MONGO_USERNAME} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data]
  ferretdb:
    container_name: ferretdb
    image: ghcr.io/bbvch-ai/aihub-core/ferretdb:2.5.0
    restart: always
    ports: [27017:27017]
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://${MONGO_USERNAME}:${MONGO_PASSWORD}@postgres-ferretdb:5432/postgres
    depends_on:
      postgres-ferretdb:
        condition: service_healthy
    healthcheck:
      test: [NONE]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8088'
      healthcheck.path: /debug/livez
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

  # ===================================================================
  # Neo4j Stack (Graph Database)
  # ===================================================================
  # Neo4j provides graph database capabilities for relationship-based
  # data modeling and querying.
  # ===================================================================
  neo4j:
    container_name: neo4j
    image: ghcr.io/bbvch-ai/aihub-core/neo4j:5.26.16-community
    restart: always
    ports: [7474:7474, 7687:7687]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/logs:/logs
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/config:/config
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/data:/data
      - ${VOLUME_ROOT:-./.docker-volumes}/neo4j/plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:7474
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Graph database for Mem0 memory storage

  # ===================================================================
  # Langfuse Stack (LLM Observability & Evaluation)
  # ===================================================================
  # Langfuse provides tracing, evaluation, and observability for LLM apps.
  # Open-source alternative with MIT license for self-hosted deployments.
  # ===================================================================
  clickhouse:
    container_name: clickhouse
    image: ghcr.io/bbvch-ai/aihub-core/clickhouse/clickhouse-server:25.8
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      # Named volumes avoid Windows bind-mount issues with ClickHouse atomic renames
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ports: [127.0.0.1:8123:8123, 127.0.0.1:9009:9000]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit
        1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [data]
  langfuse-worker:
    container_name: langfuse-worker
    image: ghcr.io/bbvch-ai/aihub-core/langfuse/langfuse-worker:3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      clickhouse:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    ports: [127.0.0.1:3030:3030]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Use SeaweedFS for S3-compatible storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend
      - data  # For PostgreSQL access
      - storage  # For SeaweedFS S3 access
  langfuse-web:
    container_name: langfuse-web
    image: ghcr.io/bbvch-ai/aihub-core/langfuse/langfuse:3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      clickhouse:
        condition: service_healthy
    ports: [6006:3000]
    environment:
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Use SeaweedFS for S3-compatible storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs-s3:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_TOKEN}
      # Auto-initialize default project for API access
      LANGFUSE_INIT_ORG_ID: aihub-org
      LANGFUSE_INIT_ORG_NAME: AI-Hub
      LANGFUSE_INIT_PROJECT_ID: aihub-project
      LANGFUSE_INIT_PROJECT_NAME: AI-Hub
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: AI-Hub Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      # Keycloak SSO — uses Keycloak as the OIDC provider for Langfuse login
      AUTH_KEYCLOAK_CLIENT_ID: langfuse
      AUTH_KEYCLOAK_CLIENT_SECRET: ${LANGFUSE_KEYCLOAK_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: http://keycloak:8080/realms/aihub
      AUTH_KEYCLOAK_ALLOW_ACCOUNT_LINKING: 'true'
      # Auto-provisioning — SSO users get MEMBER in the AI-Hub org/project
      LANGFUSE_DEFAULT_ORG_ID: aihub-org
      LANGFUSE_DEFAULT_ORG_ROLE: MEMBER
      LANGFUSE_DEFAULT_PROJECT_ID: aihub-project
      LANGFUSE_DEFAULT_PROJECT_ROLE: MEMBER
      # Auth controls
      AUTH_DISABLE_USERNAME_PASSWORD: 'false'
      AUTH_DISABLE_SIGNUP: 'false'
      LANGFUSE_ALLOWED_ORGANIZATION_CREATORS: ${LANGFUSE_ALLOWED_ORGANIZATION_CREATORS}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://$(hostname):3000/api/public/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend
      - data  # For PostgreSQL access
      - storage  # For SeaweedFS S3 access

  # ===================================================================
  # Keycloak Stack (Identity and Access Management)
  # ===================================================================
  # Keycloak provides OIDC/OAuth2 authentication for all services.
  # In dev: Local users for development and E2E testing.
  # In prod: Identity broker for Azure AD and other providers.
  # ===================================================================
  keycloak:
    container_name: keycloak
    image: ghcr.io/bbvch-ai/aihub-core/keycloak:26.5.4
    restart: unless-stopped
    entrypoint: /bin/bash
    ports: [8180:8080]
    command: [/opt/keycloak/scripts/keycloak-entrypoint.sh, start-dev]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      # Dev user configuration (passed to realm template)
      KEYCLOAK_DEV_USER_USERNAME: ${KEYCLOAK_DEV_USER_USERNAME}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD}
      KEYCLOAK_DEV_USER_EMAIL: ${KEYCLOAK_DEV_USER_EMAIL}
      KEYCLOAK_DEV_USER_FIRSTNAME: ${KEYCLOAK_DEV_USER_FIRSTNAME}
      KEYCLOAK_DEV_USER_LASTNAME: ${KEYCLOAK_DEV_USER_LASTNAME}
      KEYCLOAK_DEV_USER_ROLES_JSON: ${KEYCLOAK_DEV_USER_ROLES_JSON}
      # Client secrets (used by bash_envsubst in realm template)
      KEYCLOAK_OPENWEBUI_CLIENT_SECRET: ${KEYCLOAK_OPENWEBUI_CLIENT_SECRET}
      KEYCLOAK_OAUTH2_PROXY_DAGSTER_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DAGSTER_SECRET}
      KEYCLOAK_OAUTH2_PROXY_DATALAKE_SECRET: ${KEYCLOAK_OAUTH2_PROXY_DATALAKE_SECRET}
      KEYCLOAK_OAUTH2_PROXY_ATTU_SECRET: ${KEYCLOAK_OAUTH2_PROXY_ATTU_SECRET}
      KEYCLOAK_LANGFUSE_CLIENT_SECRET: ${LANGFUSE_KEYCLOAK_CLIENT_SECRET}
      # Azure Entra ID configuration (for identity provider federation)
      KEYCLOAK_AZURE_CLIENT_ID: ${KEYCLOAK_AZURE_CLIENT_ID}
      KEYCLOAK_AZURE_CLIENT_SECRET: ${KEYCLOAK_AZURE_CLIENT_SECRET}
      KEYCLOAK_AZURE_TENANT_ID: ${KEYCLOAK_AZURE_TENANT_ID}
      KEYCLOAK_API_SERVICE_CLIENT_SECRET: ${KEYCLOAK_API_SERVICE_CLIENT_SECRET}
    volumes:
      - ./configs/keycloak/keycloak-entrypoint.sh:/opt/keycloak/scripts/keycloak-entrypoint.sh:ro
      - ./configs/keycloak/aihub-realm.dev.gpu.json:/opt/keycloak/data/import-templates/aihub-realm.json:ro
      - ./configs/keycloak/identity-providers.dev.gpu.json:/opt/keycloak/data/import-templates/identity-providers.json:ro
      - ./configs/keycloak/themes/aihub:/opt/keycloak/themes/aihub:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\n\
          host: localhost\r\nConnection: close\r\n\r\n' >&3;grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # PostgreSQL access for Keycloak database

  # ===================================================================
  # Nats & Valkey Stack (Messaging and Caching)
  # ===================================================================
  # Nats provides the messaging bus for asynchronous communication
  # between agents, and Valkey provides in-memory caching.
  # ===================================================================
  nats:
    container_name: nats
    image: ghcr.io/bbvch-ai/aihub-core/nats:2.11.4
    restart: always
    command: -c /etc/nats/nats-server.conf
    environment:
      # Token-based authentication for NATS clients
      NATS_TOKEN: ${NATS_TOKEN}
    volumes:
      - ./configs/nats/nats-config.dev.gpu.conf:/etc/nats/nats-server.conf
      - ${VOLUME_ROOT:-./.docker-volumes}/nats:/data/nats
    healthcheck:
      test: [NONE]
    ports: [4222:4222, 8222:8222]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '8222'
      healthcheck.path: /healthz
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Message broker is part of data infrastructure
  valkey:
    container_name: valkey
    image: ghcr.io/bbvch-ai/aihub-core/valkey:8.0.5
    restart: always
    # Password authentication enabled via --requirepass
    command: valkey-server --save 30 1 --loglevel warning --requirepass ${REDIS_TOKEN}
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/valkey-data:/data']
    ports: [6379:6379]
    healthcheck:
      # Use REDISCLI_AUTH to authenticate for health check
      test: [CMD-SHELL, 'REDISCLI_AUTH=${REDIS_TOKEN} valkey-cli ping']
      start_period: 5s
    environment:
      REDIS_TOKEN: ${REDIS_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data  # Cache is part of data infrastructure

  # ===================================================================
  # Rclone (Universal Cloud Storage Sync)
  # ===================================================================
  # Provides RC API for syncing files from 70+ cloud providers
  # (OneDrive, SharePoint, S3, Google Drive, Dropbox, etc.)
  # ===================================================================
  rclone:
    container_name: rclone
    image: ghcr.io/bbvch-ai/aihub-core/rclone:1.71.2
    restart: unless-stopped
    command:
      - rcd
      - --rc-addr=0.0.0.0:5572
      - --rc-serve
      - --rc-no-auth  # Only in dev!
      - --log-level=INFO
      - --config=/dev/null  # Disable config file, use environment variables only
    ports: [5572:5572]
    networks: [default]
    healthcheck:
      test: [CMD, rclone, rc, --rc-addr=localhost:5572, core/version]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
  # ===================================================================
  # AI Model Serving (Local GPU Inference via vLLM)
  # ===================================================================
  # All local model serving requires GPU. CPU setups route through
  # Swiss LLM Cloud instead. Models match the Swiss LLM Cloud stack
  # for a unified experience.
  # ===================================================================
  vllm:
    container_name: vllm
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    ports: [8182:8000]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model Qwen/Qwen3-VL-30B-A3B-Instruct-FP8
      --served-model-name qwen3-vl-30b
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.85
      --max-model-len 131072
      --max-num-seqs 16
      --max-num-batched-tokens 4096
      --enable-chunked-prefill
      --limit-mm-per-prompt '{"image": 8, "video": 0}'
      --async-scheduling
      --dtype auto
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [backend]
  vllm-bge-m3:
    container_name: vllm-bge-m3
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    ports: [8183:8000]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model BAAI/bge-m3
      --served-model-name bge-m3
      --runner pooling
      --convert embed
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.03
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks: [backend]
  vllm-bge-reranker:
    container_name: vllm-bge-reranker
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.15.1
    restart: always
    ipc: host
    ports: [8184:8000]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/huggingface:/root/.cache/huggingface
      - ${VOLUME_ROOT:-./.docker-volumes}/vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      VLLM_API_KEY: ${LOCAL_LLM_TOKEN}
    command: >
      --model BAAI/bge-reranker-v2-m3
      --served-model-name bge-reranker
      --runner pooling
      --port 8000
      --host 0.0.0.0
      --gpu-memory-utilization 0.03
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # Audio Model Serving (STT via Speaches)
  # ===================================================================
  # OpenAI-compatible transcription API. GPU only.
  # CPU setups route through Swiss LLM Cloud.
  # https://github.com/speaches-ai/speaches
  # ===================================================================
  speaches:
    container_name: speaches
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    restart: unless-stopped
    ports: [8185:8000]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/speaches-models:/home/ubuntu/.cache/huggingface/hub
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      PRELOAD_MODELS: Systran/faster-whisper-large-v3
    healthcheck:
      test: [CMD, curl, --fail, http://0.0.0.0:8000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # LiteLLM Stack (Model Proxy and Guardrails)
  # ===================================================================
  # This stack provides a unified interface to various LLMs,
  # handles PII filtering, and manages API keys.
  # ===================================================================
  presidio-analyzer:
    container_name: presidio-analyzer
    image: ghcr.io/bbvch-ai/aihub-core/presidio-analyzer:2.2.359
    restart: always
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '3000'
      healthcheck.path: /health
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  presidio-anonymizer:
    container_name: presidio-anonymizer
    image: ghcr.io/bbvch-ai/aihub-core/presidio-anonymizer:2.2.359
    restart: always
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '3000'
      healthcheck.path: /health
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  litellm:
    container_name: litellm
    image: ghcr.io/bbvch-ai/aihub-core/litellm:v1.80.5-stable.1
    restart: always
    ports: [4000:4000]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      LOCAL_LLM_TOKEN: ${LOCAL_LLM_TOKEN}
      REDIS_TOKEN: ${REDIS_TOKEN}
      SWISS_LLM_CLOUD_API_BASE_URL: ${SWISS_LLM_CLOUD_API_BASE_URL}
      SWISS_LLM_CLOUD_API_KEY: ${SWISS_LLM_CLOUD_API_KEY}
      SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL: ${SWISS_LLM_CLOUD_EMBEDDING_API_BASE_URL}
      SWISS_LLM_CLOUD_EMBEDDING_API_KEY: ${SWISS_LLM_CLOUD_EMBEDDING_API_KEY}
      SWISS_LLM_CLOUD_RERANKING_API_BASE_URL: ${SWISS_LLM_CLOUD_RERANKING_API_BASE_URL}
      SWISS_LLM_CLOUD_RERANKING_API_KEY: ${SWISS_LLM_CLOUD_RERANKING_API_KEY}
      SWISS_LLM_CLOUD_WHISPER_API_BASE_URL: ${SWISS_LLM_CLOUD_WHISPER_API_BASE_URL}
      SWISS_LLM_CLOUD_WHISPER_API_KEY: ${SWISS_LLM_CLOUD_WHISPER_API_KEY}
      SWISS_LLM_CLOUD_OCR_API_BASE_URL: ${SWISS_LLM_CLOUD_OCR_API_BASE_URL}
      SWISS_LLM_CLOUD_OCR_API_KEY: ${SWISS_LLM_CLOUD_OCR_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      SET_VERBOSE: false
    volumes: [./configs/litellm/litellm-config.dev.gpu.yml:/app/config.yml]
    command: --config /app/config.yml
    depends_on:
      postgres:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
      presidio-anonymizer:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend
      - data  # For PostgreSQL access

  # ===================================================================
  # Utility & Code Execution Services
  # ===================================================================
  # These services provide code execution runtimes (Jupyter) and
  # browser automation (Playwright) for various platform features.
  # ===================================================================
  jupyter:
    container_name: jupyter-lab
    image: ghcr.io/bbvch-ai/aihub-core/minimal-notebook:notebook-7.0.6
    restart: always
    ports: [8888:8888]
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/jupyter-data:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: true
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    healthcheck:
      test: [CMD, /etc/jupyter/docker_healthcheck.py]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks: [backend]
  playwright:
    container_name: playwright-server
    build:
      context: ./configs/playwright
      dockerfile: Dockerfile
    restart: always
    ports: [3036:3000]
    environment:
      NODE_ENV: production
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend  # Internal service communication
      - egress  # Outbound internet access for web browsing

  # ===================================================================
  # Document Processing Stack
  # ===================================================================
  # This stack, powered by MinerU, handles OCR and parsing of
  # uploaded documents for the RAG pipeline. VLM requests are routed
  # through LiteLLM for unified model routing.
  # ===================================================================
  mineru-api:
    container_name: mineru-api
    image: ghcr.io/bbvch-ai/aihub-core/mineru-api:v2.7.5
    restart: always
    ports: [8002:8000]
    environment:
      # VLM routing through LiteLLM (OpenAI-compatible)
      # Various API keys for OpenAI client compatibility
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_BASE_URL: http://litellm:4000/v1
      LITELLM_PROXY_API_KEY: ${LITELLM_MASTER_KEY}
      # MinerU-specific configuration (used by mineru_vl_utils HttpVlmClient)
      MINERU_VL_SERVER: http://litellm:4000/v1
      MINERU_VL_API_KEY: ${LITELLM_MASTER_KEY}
      MINERU_VL_MODEL_NAME: ${MINERU_VLM_NAME}
      # Processing configuration
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/openapi.json]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 60s
    depends_on:
      litellm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        limits:
          memory: 4G
    networks: [backend]
  mineru-vlm:
    container_name: mineru-vlm
    platform: linux/amd64
    image: ghcr.io/bbvch-ai/aihub-core/mineru-vlm:v2.7.5
    restart: always
    ports:
      - 30000:30000
    # No volume mount - VLM models are baked into the image for faster startup
    command: >
      mineru-vllm-server
      --host 0.0.0.0
      --port 30000
      --served-model-name MinerU2.5-2509-1.2B
      --gpu-memory-utilization 0.05
    environment:
      MINERU_MODEL_SOURCE: local
    healthcheck:
      test: [CMD, curl, -f, http://localhost:30000/health]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 300s  # 5 minutes for model loading
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - backend

  # ===================================================================
  # Observability Stack
  # ===================================================================
  # The OTEL Collector gathers traces, logs, and metrics for debugging
  # and monitoring. It is only enabled in the 'dev' stage.
  # ===================================================================
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: [--config=/etc/otel-config.yml]
    environment:
      - OTEL_CLOUD_ENDPOINT=${OTEL_CLOUD_ENDPOINT}
      - OTEL_CLOUD_HEADERS=${OTEL_CLOUD_HEADERS}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
    volumes: [./configs/otel/otel-config.dev.gpu.yml:/etc/otel-config.yml]
    ports: [4317:4317, 4318:4318, 13133:13133, 55679:55679]
    depends_on: [langfuse-web]
    healthcheck:
      test: [NONE]
    labels:
      healthcheck.enabled: 'true'
      healthcheck.protocol: http
      healthcheck.port: '13133'
      healthcheck.path: /
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - backend

  # ===================================================================
  # Open WebUI Stack (Primary User Interface)
  # ===================================================================
  # This is the main frontend application for the AI Hub. Its
  # configuration is the most complex, with many stage-specific
  # environment variables for connecting to other services.
  # ===================================================================
  open-webui:
    container_name: open-webui
    image: ghcr.io/bbvch-ai/aihub-core/open-webui:v0.6.41
    restart: always
    network_mode: host
    volumes: ['${VOLUME_ROOT:-./.docker-volumes}/open-webui:/app/backend/data']
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
      litellm:
        condition: service_started
      jupyter:
        condition: service_healthy
      playwright:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # --- General Settings ---
      WEBUI_NAME: Swiss AI-Hub
      DEFAULT_LOCALE: de
      # Disable model caching to ensure pipeline models (agents) are always fetched
      ENABLE_BASE_MODELS_CACHE: false
      ENABLE_COMMUNITY_SHARING: false
      ENABLE_USER_WEBHOOKS: false
      ENABLE_LOGIN_FORM: false
      ENABLE_FORWARD_USER_INFO_HEADERS: true
      ENABLE_VERSION_UPDATE_CHECK: false

      # --- Stage-Specific URLs and Environment ---
      WEBUI_URL: http://localhost:8080
      ENV: ${ENV}
      GLOBAL_LOG_LEVEL: ${LOG_LEVEL}

      # --- Telemetry ---
      ENABLE_OTEL: true
      ENABLE_OTEL_METRICS: true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_SERVICE_NAME: open-webui

      # --- Auth & OIDC (Keycloak) ---
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: true
      DEFAULT_USER_ROLE: user
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
      ENABLE_API_KEY: false
      WEBUI_SESSION_COOKIE_SAME_SITE: lax
      WEBUI_SESSION_COOKIE_SECURE: false
      ENABLE_OAUTH_SIGNUP: true
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OAUTH_CLIENT_ID: openwebui
      OAUTH_CLIENT_SECRET: ${KEYCLOAK_OPENWEBUI_CLIENT_SECRET}
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/aihub/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:8080/oauth/oidc/callback
      OAUTH_ALLOWED_DOMAINS: '*'
      OAUTH_SCOPES: openid email profile
      OAUTH_TIMEOUT: 60
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OAUTH_USERNAME_CLAIM: preferred_username
      OAUTH_PICTURE_CLAIM: picture
      OAUTH_EMAIL_CLAIM: email
      OAUTH_GROUP_CLAIM: roles

      # --- Data Storage (S3) ---
      STORAGE_PROVIDER: s3
      S3_ACCESS_KEY_ID: ${S3_STORAGE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_REGION_NAME: us-east-1
      S3_BUCKET_NAME: open-webui
      S3_ENDPOINT_URL: http://localhost:9000

      # --- Model & AI-Hub Connection ---
      MODELS_CACHE_TTL: 60
      OPENAI_API_BASE_URL: http://localhost:8000/api/v1/openai
      OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      TASK_MODEL: text-generation/Qwen3-VL-30B-A3B-Instruct-FP8
      TASK_MODEL_EXTERNAL: text-generation/Qwen3-VL-30B-A3B-Instruct-FP8
      ENABLE_OLLAMA_API: false
      ENABLE_OPENAI_API: true

      # --- Image Generation ---
      IMAGE_GENERATION_MODEL: image-generation
      IMAGES_OPENAI_API_BASE_URL: http://localhost:8000/api/v1/openai
      IMAGES_OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      IMAGE_SIZE: 1024x1024
      ENABLE_IMAGE_GENERATION: true

      # --- Audio STT ---
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_MODEL: transcription
      AUDIO_STT_OPENAI_API_BASE_URL: http://localhost:8000/api/v1/openai
      AUDIO_STT_OPENAI_API_KEY: ${SUPERUSER_TOKEN}

      # --- Audio TTS ---
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_MODEL: speech
      AUDIO_TTS_OPENAI_API_BASE_URL: http://localhost:8000/api/v1/openai
      AUDIO_TTS_OPENAI_API_KEY: ${SUPERUSER_TOKEN}
      AUDIO_TTS_VOICE: alloy

      # --- AI-Hub Internal Connection ---
      AIHUB_BASE_URL: http://localhost:8000
      AIHUB_FRONTEND_URL: http://localhost:3333
      AIHUB_SUPERUSER_API_KEY: ${SUPERUSER_TOKEN}
      OPEN_WEBUI_SIGNING_SECRET: ${AUTH_OPEN_WEBUI_SIGNING_SECRET}
      AIHUB_PIPELINE_PREFIX: aihub/
      AIHUB_REQUEST_TIMEOUT: 60

      # --- Database & Cache ---
      DATABASE_TYPE: postgres
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: openwebui
      REDIS_URL: redis://default:${REDIS_TOKEN}@localhost:6379/10
      REDIS_KEY_PREFIX: open-webui

      # --- Web Server ---
      UVICORN_WORKERS: 1
      ENABLE_WEBSOCKET_SUPPORT: true
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://default:${REDIS_TOKEN}@localhost:6379/11
      THREAD_POOL_SIZE: 8
      CORS_ALLOW_ORIGIN: https://openwebui.${DOMAIN},https://${DOMAIN}

      # --- Admin ---
      ENABLE_ADMIN_EXPORT: true
      ENABLE_ADMIN_CHAT_ACCESS: false
      SHOW_ADMIN_DETAILS: true
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      # --- Code Execution ---
      CODE_EXECUTION_ENGINE: jupyter
      CODE_EXECUTION_JUPYTER_URL: http://localhost:8888
      CODE_EXECUTION_JUPYTER_AUTH: token
      CODE_EXECUTION_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}
      CODE_INTERPRETER_ENGINE: jupyter
      CODE_INTERPRETER_JUPYTER_URL: http://localhost:8888
      CODE_INTERPRETER_JUPYTER_AUTH: token
      CODE_INTERPRETER_JUPYTER_AUTH_TOKEN: ${JUPYTER_TOKEN}

      # --- Vector DB ---
      VECTOR_DB: milvus
      MILVUS_DB: default
      MILVUS_URI: http://localhost:19530
      MILVUS_TOKEN: root:${MILVUS_ROOT_PASSWORD}
      MILVUS_INDEX_TYPE: HNSW
      MILVUS_METRIC_TYPE: COSINE
      MILVUS_HNSW_M: 16
      MILVUS_HNSW_EFCONSTRUCTION: 256

      # --- RAG & Document Processing ---
      RAG_FULL_CONTEXT: true
      RAG_EMBEDDING_BATCH_SIZE: 64
      PDF_EXTRACT_IMAGES: true
      RAG_FILE_MAX_COUNT: 4
      CONTENT_EXTRACTION_ENGINE: external
      EXTERNAL_DOCUMENT_LOADER_URL: http://localhost:8000/api/v1/parsing
      EXTERNAL_DOCUMENT_LOADER_API_KEY: ${SUPERUSER_TOKEN}
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embedding/bge-m3
      RAG_OPENAI_API_BASE_URL: http://localhost:8000/api/v1/openai
      RAG_OPENAI_API_KEY: ${SUPERUSER_TOKEN}

      # --- Web Search ---
      ENABLE_WEB_SEARCH: true
      WEB_SEARCH_ENGINE: jina
      JINA_API_KEY: ${JINA_API_KEY}
      WEB_SEARCH_RESULT_COUNT: 6
      WEB_SEARCH_CONCURRENT_REQUESTS: 6
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: true
      WEB_LOADER_ENGINE: playwright
      PLAYWRIGHT_WS_URL: ws://playwright:3000
      FILE_IMAGE_COMPRESSION_WIDTH: 796
      FILE_IMAGE_COMPRESSION_HEIGHT: 796

      # --- User Permissions (consistent across stages) ---
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: false
      USER_PERMISSIONS_WORKSPACE_MODELS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_WORKSPACE_TOOLS_ALLOW_PUBLIC_SHARING: false
      USER_PERMISSIONS_CHAT_CONTROLS: true
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: true
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: true
      USER_PERMISSIONS_CHAT_DELETE: true
      USER_PERMISSIONS_CHAT_EDIT: true
      USER_PERMISSIONS_CHAT_SHARE: false
      USER_PERMISSIONS_CHAT_EXPORT: false
      USER_PERMISSIONS_CHAT_STT: true
      USER_PERMISSIONS_CHAT_TTS: true
      USER_PERMISSIONS_CHAT_CALL: true
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: true
      USER_PERMISSIONS_CHAT_TEMPORARY: true
      USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED: false
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: false
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: true
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: true
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: true
      USER_PERMISSIONS_FEATURES_NOTES: true
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
  openwebui-init:
    container_name: openwebui-init
    image: ghcr.io/bbvch-ai/aihub-core/postgres:17
    restart: 'no'
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: openwebui
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./configs/openwebui/init-functions.sh:/init-functions.sh:ro
      - ./configs/openwebui/functions:/functions:ro
    entrypoint: [/bin/sh, /init-functions.sh]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    networks:
      - data

