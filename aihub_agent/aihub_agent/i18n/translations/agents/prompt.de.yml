test: Das ist ein test prompt auf deutsch
condenser:
  standalone_question: |
    Gegeben ist die folgende Konversation zwischen einem Benutzer und einem KI-Assistenten und eine Folgefrage des Benutzers,
    formuliere die Folgefrage um, so dass sie als eigenständige Frage gestellt werden kann.

    <chat_history>
    {chat_history}
    </chat_history>
    
    <user_question>
    {question}
    </user_question>
    
    Eigenständige Frage:

rag_agent:
  context_prompt: |
    Du erhältst zusätzliche Kontextinformationen in Form von strukturierten Dokumenten. Jedes Dokument ist durch <DOC_START [Dokumentname]>
    und <DOC_END [Dokumentname]> gekennzeichnet.
    Hier sind die für den Kontext relevanten Dokumente:
    
    <context_documents>
    {context_str}
    </context_documents>
    
    Aufgabe: Gib basierend auf den obigen Dokumenten eine detaillierte Antwort auf die folgende Benutzerfrage.
guard:
  reject: |
    Informiere den Benutzer, dass du die Frage nicht beantworten kannst, aufgrund des folgenden Grundes:
    <Grund>
    {reason}
    </Grund>