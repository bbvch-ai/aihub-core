condenser:
  standalone_question: |
    Given the following conversation between a user and an assistant and a follow-up question from the user,
    Rephrase the follow-up question to be a single question.

    <chat_history>
    {chat_history}
    </chat_history>
    
    <follow-up question>
    {question}
    </follow-up question>
    
    Standalone question:
guard:
  reject: |
    Inform the user that you can not answer the question due to the following reason:
    <Reject reason>
    {reason}
    </Reject reason>