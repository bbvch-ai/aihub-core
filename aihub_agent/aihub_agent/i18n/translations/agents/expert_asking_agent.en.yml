follow_up_question: |
  You are given a chat history between an AI assistant and an expert. The goal of this conversation
  is to answer a question originally posed by a user. However, the experts answer seemed to be insufficient.

   <chat_history>
  {% for message in chat_history %}
  <message role="{{ message.role.value }}">
  {% for block in message.blocks %}
  {% if block.block_type == 'text' %}
  {{ block.text }}
  {% endif %}
  {% endfor %}
  </message>
  {% endfor %}
  </chat_history>

  <user_question>
  {{ question }}
  </user_query>
  
  <insufficient_reason>
  {{ reason }}
  </insufficient_reason>
  
  Please formulate a follow-up question to the expert that addresses the insufficiency in their previous answer.
  The question should be clear and concise, and it should help the expert provide a more complete answer to the user's original question.

knowledge_snippet: |
  You are given a chat history between an AI assistant and an expert. The goal of this conversation
  was to answer a question originally posed by a user. The expert could successfully provide the answer

  <user_question>
  {{ question }}
  </user_query>

  <chat_history> 
  {% for message in chat_history %}
  <message role="{{ message.role.value }}">
  {% for block in message.blocks %}
  {% if block.block_type == 'text' %}
  {{ block.text }}
  {% endif %}
  {% endfor %}
  </message>
  {% endfor %}
  </chat_history>
  
  Now that the answer is provided, please extract the key-knowledge from this conversation that the user was missing. 
  This knowledge snippet should be a concise summary of the most important information that the user needed to know.
  The snippet will be returned to the user, hence, from the snippet alone, the answer to the question must be obvious.
  However, the snippet will also be added to the knowledge base, hence, the snippet should not simply contain
  the answer to the question, but the knowledge that is required to answer the question.