# Passi RAG condivisi (usati da RAGAgent ed ExpertRAGAgent)
rag:
  limit_chat_history:
    name: "Limita cronologia chat"
    description: "Tronca i messaggi di chat in arrivo per rispettare il limite di token configurato"
  condense_standalone_question:
    name: "Condensa domanda autonoma"
    description: "Condensa la cronologia della chat e la query utente in una domanda autonoma."
  few_shot_guard:
    name: "Guardia Few-Shot"
    description: "Protegge la domanda per assicurarsi che sia appropriata per l'agente."
  retrieve_nodes:
    name: "Recupera nodi"
    description: "Recupera i nodi rilevanti dalle fonti di conoscenza."
  rerank_nodes:
    name: "Riclassifica nodi recuperati"
    description: "Riclassifica i documenti recuperati con un modello di riclassificazione per una migliore rilevanza"
  order_nodes:
    name: "Ordina nodi per documenti"
    description: "Ordina i nodi recuperati per i loro documenti sorgente."
  context_sufficient_guard:
    name: "Guardia contesto sufficiente"
    description: "Protegge il contesto per assicurarsi che sia sufficiente per generare una risposta."
  limit_chat_history_with_context:
    name: "Limita cronologia con contesto"
    description: "Include il contesto combinato e tronca nuovamente la cronologia della chat."
  respond_with_llm:
    name: "Rispondi con LLM"
    description: "Genera una risposta utilizzando il LLM configurato."

# Passi specifici di ExpertRAGAgent
expert_rag:
  handle_insufficient_context:
    name: "Gestisci contesto insufficiente"
    description: "Gestisce il contesto insufficiente chiedendo il consenso per l'esperto."
  consent_answer:
    name: "Risposta consenso"
    description: "L'utente ha risposto alla domanda di consenso."
  invoke_expert_agent:
    name: "Invoca ExpertAskingAgent"
    description: "Inoltra la richiesta a ExpertAskingAgent che interrogherà gli esperti."
  expert_answer_positive:
    name: "Risposta esperto positiva"
    description: "ExpertAskingAgent è riuscito a estrarre informazioni dall'esperto."
  expert_answer_negative:
    name: "Risposta esperto negativa"
    description: "ExpertAskingAgent NON è riuscito a estrarre informazioni dall'esperto."
  expert_answer_error:
    name: "Errore risposta esperto"
    description: "ExpertAskingAgent ha incontrato un errore."

# Passi ExpertAskingAgent
expert_asking:
  invoke_expert:
    name: "Invoca esperto"
    description: "Pone una domanda a un gruppo di esperti."
  expert_response:
    name: "Risposta esperto"
    description: "Elabora la risposta dell'esperto."
  response_sufficient_router:
    name: "Router risposta sufficiente"
    description: "Verifica se l'esperto ha risposto sufficientemente alla domanda."
  follow_up_question:
    name: "Domanda di follow-up"
    description: "Pone una domanda di follow-up all'esperto poiché la risposta non è ancora sufficiente."

# Passi NamespaceSelectionAgent
namespace_selection:
  initialize_determination:
    name: "Inizializza determinazione namespace"
    description: "Recupera i namespace e inizializza il ciclo di determinazione"
  determine_namespaces:
    name: "Determina namespace"
    description: "Il LLM analizza la conversazione per determinare i namespace"
  process_follow_up:
    name: "Elabora follow-up"
    description: "Elabora la risposta di follow-up dell'utente e continua la determinazione"
  process_approval_approved:
    name: "Elabora approvazione - Approvato"
    description: "Salva la selezione e inoltra all'agente RAG"
  process_approval_rejected:
    name: "Elabora approvazione - Rifiutato"
    description: "Aggiunge il rifiuto alla conversazione e torna al ciclo"
  rag_response:
    name: "Risposta RAG"
    description: "Gestisce la risposta dall'agente RAG"
  rag_error:
    name: "Errore RAG"
    description: "Gestisce l'errore dall'agente RAG"
  forward_to_rag:
    name: "Inoltra al RAG"
    description: "Inoltra la query all'agente RAG con la selezione del namespace"

# Passi RetrievalAgent
retrieval:
  retrieve_nodes:
    name: "Recupera nodi"
    description: "Recupera i nodi rilevanti dalla base di conoscenza."
  order_nodes:
    name: "Ordina nodi per documenti"
    description: "Ordina i nodi recuperati per i loro documenti sorgente."
  stop:
    name: "Passo di arresto"
    description: "Ferma l'agente e restituisce i nodi ordinati come messaggi di contesto."

# Passi LLMWrappingAgent
llm_wrapping:
  start:
    name: "Elabora messaggio utente"
    description: "Inoltra il messaggio dell'utente al LLM e trasmette la risposta in streaming."

# Passi FewShotAgent
few_shot:
  limit_chat_history:
    name: "Limita cronologia chat"
    description: "Tronca i messaggi della chat in arrivo per rispettare il limite di token configurato."
  agent_suitability_guard:
    name: "Verifica idoneità agente"
    description: "Verifica se l'agente è adatto a gestire la richiesta dell'utente."
  condense_standalone_question:
    name: "Condensare domanda autonoma"
    description: "Condensa la cronologia della chat e la query dell'utente in una domanda autonoma."
  create_few_shot_examples:
    name: "Crea esempi Few-Shot"
    description: "Prepara esempi Few-Shot e crea il contesto completo per il LLM."
  respond_with_llm:
    name: "Rispondi con LLM"
    description: "Genera una risposta utilizzando il LLM basato su esempi Few-Shot."
  stop:
    name: "Ferma"
    description: "Ferma l'agente quando la richiesta viene rifiutata dalla verifica di idoneità."
