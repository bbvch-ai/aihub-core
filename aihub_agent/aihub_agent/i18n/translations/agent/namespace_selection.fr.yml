messages:
  topic_change_question: "Votre question semble porter sur un sujet different. Je cherche actuellement dans **%{sources}**. Dois-je chercher dans d'autres sources de connaissances pour cette question?"
  approval_question: "Je vais chercher dans ces sources de connaissances: **%{sources}**. Est-ce correct, ou preferez-vous d'autres sources?"
  clarification_question: "J'ai trouve des sources de connaissances potentiellement pertinentes (%{sources}), mais je ne suis pas certain lesquelles correspondent le mieux a votre question. Pourriez-vous preciser le sujet ou le domaine de votre question?"
  rag_error: "Une erreur s'est produite lors du traitement de votre question: %{error}"

prompts:
  selection_system: |
    Vous etes un selecteur de sources de connaissances. Votre tache est de determiner quelles sources de connaissances sont les plus pertinentes pour la question d'un utilisateur.

    Sources de connaissances disponibles:
    %{namespaces}
    %{context}

    IMPORTANT: Selectionnez exactement UN namespace par bucket. Chaque bucket doit avoir un et un seul namespace selectionne en fonction de la requete de l'utilisateur.

    Repondez avec un objet JSON contenant:
    - "selected_sources": Tableau d'objets avec "bucket_name" et "namespace_name" pour chaque source pertinente (un par bucket)
    - "reasoning": Une breve explication de pourquoi vous avez selectionne ces sources

    Exemple de reponse:
    {
      "selected_sources": [{"bucket_name": "knowledge", "namespace_name": "hr-policies"}],
      "reasoning": "La requete concerne les politiques des employes, ce qui correspond au namespace des politiques RH."
    }

  selection_user: "Question utilisateur: %{query}"

  # Approval interpreter prompts
  approval_intent_description: "L'intention de l'utilisateur: 'approve' s'il accepte, 'reject' s'il refuse, 'correct' s'il veut des modifications"
  correction_details_description: "En cas de correction, decrivez ce que l'utilisateur veut modifier"
  preferred_sources_description: "Liste des noms de namespace que l'utilisateur a specifiquement mentionnes"
  interpretation_reasoning_description: "Breve explication de l'interpretation de la reponse"
  approval_interpretation_docstring: "Interpretation de la reponse d'approbation de l'utilisateur"

  approval_interpretation: |
    Interpretez la reponse de l'utilisateur a une question d'approbation de selection de namespace.

    Selection actuelle: %{current_selection}
    Sources disponibles: %{available_sources}
    Reponse de l'utilisateur: "%{user_response}"

    Determinez si l'utilisateur:
    - "approve": Accepte la selection (oui, ok, continuer, ca me va, etc.)
    - "reject": Refuse sans proposer d'alternatives (non, pas celles-la, faux, etc.)
    - "correct": Fournit des indications specifiques (utiliser X a la place, inclure aussi Y, seulement Z, etc.)

  # Topic change response interpreter prompts
  wants_new_sources_description: "True si l'utilisateur veut chercher dans d'autres sources, False pour garder les actuelles"
  topic_response_reasoning_description: "Breve explication de l'interpretation"
  topic_change_interpretation_docstring: "Interpretation de la reponse de l'utilisateur concernant le changement de sujet"

  topic_change_interpretation: |
    Interpretez la reponse de l'utilisateur pour savoir s'il veut chercher dans d'autres sources de connaissances.

    Reponse de l'utilisateur: "%{user_response}"

    Determinez si l'utilisateur veut chercher dans d'autres sources (oui, differentes, nouveau sujet, etc.)
    ou garder les sources actuelles (non, les memes, continuer, etc.).
