thoughts:
  fetching_namespaces: "Récupération des espaces de noms disponibles depuis les buckets configurés"
  parsing_selection: "Analyse de la sélection d'espace de noms à partir de la réponse de l'utilisateur"
  selection_complete: "Sélection de l'espace de noms terminée, délégation à l'agent RAG"
  delegating_to_rag: "Délégation à l'agent RAG avec les espaces de noms sélectionnés"
  rag_error: "Erreur de l'agent RAG: %{error_code} - %{error_message}"

messages:
  default_question: "Veuillez sélectionner l'espace de noms que vous souhaitez utiliser pour votre recherche."
  clarification_needed: "Je n'ai pas pu comprendre votre sélection. Pourriez-vous préciser quel espace de noms vous souhaitez utiliser?"
  rag_error: "J'ai rencontré une erreur lors du traitement de votre demande. Veuillez réessayer."

prompts:
  ask_selection: |
    Vous aidez l'utilisateur à choisir quelles sources de connaissances rechercher.
    Générez une question amicale et concise demandant quel(s) espace(s) de noms il souhaite utiliser.
    S'il y a plusieurs buckets, demandez une sélection par bucket.
    Soyez conversationnel et serviable. Ne listez pas toutes les options sauf s'il n'y en a que quelques-unes.
    Demandez simplement ce qu'ils souhaitent rechercher.

  parse_selection: |
    Vous extrayez la sélection d'espace de noms de l'utilisateur à partir de sa réponse.

    Réponse de l'utilisateur: {user_response}

    Espaces de noms disponibles:
    {namespace_options}

    Sélectionnez l'espace de noms qui correspond le mieux à ce que l'utilisateur veut.
    Si l'intention de l'utilisateur est claire, définissez selected_namespace sur le nom de l'espace de noms correspondant.
    Si ce n'est pas clair, définissez selected_namespace sur null et fournissez une question de suivi utile dans follow_up.

fields:
  selected_namespace: "Le nom interne (du champ 'name') de l'espace de noms sélectionné par l'utilisateur, ou null si la sélection n'est pas claire"
  follow_up: "Une question de clarification si la sélection de l'utilisateur n'est pas claire. Chaîne vide si la sélection est claire."
