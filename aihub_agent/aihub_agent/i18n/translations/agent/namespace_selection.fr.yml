  reusing_selection: "Sujet inchangé, réutilisation de la sélection de namespace précédente."
  topic_changed: "Changement de sujet détecté, réévaluation de la sélection de namespace."
  analyzing_query: "Analyse de la requête utilisateur pour déterminer les sources de connaissances pertinentes."
  confident_selection: "Confiant dans la sélection de namespace, poursuite vers RAG."
  max_rounds_reached: "Nombre maximum de tours de clarification atteint, poursuite avec la meilleure sélection."
  need_clarification: "Confiance de sélection trop faible, demande de clarification à l'utilisateur."
  asking_clarification: "Question de clarification (tour %{round})."
  processing_response: "Traitement de la réponse utilisateur: %{response}"
  invoking_rag: "Invocation de l'agent RAG avec les sources: %{sources}"
