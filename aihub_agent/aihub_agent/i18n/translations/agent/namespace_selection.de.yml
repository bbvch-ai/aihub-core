messages:
  topic_change_question: "Ihre Frage scheint ein anderes Thema zu betreffen. Ich suche derzeit in **%{sources}**. Soll ich für diese Frage andere Wissensquellen durchsuchen?"
  approval_question: "Ich werde in diesen Wissensquellen suchen: **%{sources}**. Ist das korrekt, oder bevorzugen Sie andere Quellen?"
  clarification_question: "Ich habe einige potenziell relevante Wissensquellen gefunden (%{sources}), bin mir aber nicht sicher, welche am besten zu Ihrer Frage passen. Könnten Sie bitte klären, zu welchem Thema oder Bereich Sie fragen?"
  rag_error: "Bei der Verarbeitung Ihrer Frage ist ein Fehler aufgetreten: %{error}"

prompts:
  selection_system: |
    Du bist ein Wissensquellen-Selektor. Deine Aufgabe ist es, zu bestimmen, welche Wissensquellen für die Frage eines Benutzers am relevantesten sind.

    Verfügbare Wissensquellen:
    %{namespaces}
    %{context}

    WICHTIG: Wähle genau EINEN Namespace pro Bucket. Jeder Bucket sollte genau einen Namespace haben, basierend auf der Benutzeranfrage.

    Verwende das bereitgestellte Tool, um deine Auswahl zu übermitteln.

  selection_user: "Benutzerfrage: %{query}"

  # Approval interpreter prompts
  approval_intent_description: "Die Absicht des Benutzers: 'approve' bei Zustimmung, 'reject' bei Ablehnung, 'correct' bei Änderungswunsch"
  correction_details_description: "Bei Korrektur, beschreibe was der Benutzer ändern möchte"
  preferred_sources_description: "Liste der vom Benutzer spezifisch genannten Namespace-Namen"
  interpretation_reasoning_description: "Kurze Erklärung, wie die Antwort interpretiert wurde"
  approval_interpretation_docstring: "Interpretation der Benutzer-Bestätigungsantwort"

  approval_interpretation: |
    Interpretiere die Antwort des Benutzers auf eine Namespace-Auswahl-Bestätigungsfrage.

    Aktuelle Auswahl: %{current_selection}
    Verfügbare Quellen: %{available_sources}
    Benutzerantwort: "%{user_response}"

    Bestimme, ob der Benutzer:
    - "approve": Mit der Auswahl einverstanden ist (ja, ok, weiter, sieht gut aus, etc.)
    - "reject": Nicht einverstanden ist ohne Alternativen zu nennen (nein, nicht diese, falsch, etc.)
    - "correct": Spezifische Anweisungen gibt (verwende stattdessen X, auch Y einschliessen, nur Z, etc.)

  # Topic change response interpreter prompts
  wants_new_sources_description: "True wenn Benutzer andere Quellen durchsuchen möchte, False um aktuelle zu behalten"
  topic_response_reasoning_description: "Kurze Erklärung der Interpretation"
  topic_change_interpretation_docstring: "Interpretation der Benutzerantwort zum Themenwechsel"

  topic_change_interpretation: |
    Interpretiere die Antwort des Benutzers, ob er andere Wissensquellen durchsuchen möchte.

    Benutzerantwort: "%{user_response}"

    Bestimme, ob der Benutzer andere Quellen durchsuchen möchte (ja, andere, neues Thema, etc.)
    oder die aktuellen Quellen behalten möchte (nein, gleiche, weiter, etc.).
