thoughts:
  fetching_namespaces: "Verfügbare Namespaces aus konfigurierten Buckets werden abgerufen"
  parsing_selection: "Namespace-Auswahl aus Benutzerantwort wird analysiert"
  selection_complete: "Namespace-Auswahl abgeschlossen, Weiterleitung an RAG-Agent"
  delegating_to_rag: "Weiterleitung an RAG-Agent mit ausgewählten Namespaces"
  rag_error: "Bei der Verarbeitung ist ein Fehler aufgetreten"

messages:
  default_question: "Bitte wählen Sie den Namespace, den Sie für Ihre Suche verwenden möchten."
  clarification_needed: "Ich konnte Ihre Auswahl nicht verstehen. Könnten Sie bitte angeben, welchen Namespace Sie verwenden möchten?"
  rag_error: "Bei der Verarbeitung Ihrer Anfrage ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut."

prompts:
  ask_selection: |
    Du hilfst dem Benutzer bei der Auswahl der Wissensquellen für die Suche.
    Stelle eine freundliche, kurze Frage, welche Namespace(s) er verwenden möchte.
    Bei mehreren Buckets frage nach einer Auswahl pro Bucket.
    Sei gesprächig und hilfsbereit. Liste nicht alle Optionen auf, es sei denn, es sind nur wenige.
    Frage einfach, wonach sie suchen möchten.

  parse_selection: |
    Du extrahierst die Namespace-Auswahl des Benutzers aus seiner Antwort.

    Benutzerantwort: {user_response}

    Verfügbare Namespaces:
    {namespace_options}

    Wähle den Namespace, der am besten zu dem passt, was der Benutzer möchte.
    Wenn die Absicht des Benutzers klar ist, setze selected_namespace auf den passenden Namespace-Namen.
    Falls unklar, setze selected_namespace auf null und stelle eine hilfreiche Nachfrage in follow_up.

fields:
  selected_namespace: "Der interne Name (aus dem 'name'-Feld) des vom Benutzer gewählten Namespaces, oder null wenn die Auswahl unklar ist"
  follow_up: "Eine klärende Frage, falls die Auswahl des Benutzers unklar ist. Leerer String wenn die Auswahl klar ist."
