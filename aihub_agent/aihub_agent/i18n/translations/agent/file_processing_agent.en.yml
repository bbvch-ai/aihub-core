---
metadata:
  name: File Processing Agent
  description: LLM chat agent that can optionally process user-uploaded files
config:
  system_prompt:
    label: System Prompt
    help: Instructions for the LLM on how to respond and process files
  number_of_input_tokens:
    label: Max Input Tokens
    help: Maximum tokens allowed in input to manage context size or cost
steps:
  extract_files:
    name: Extract Files
    description: Downloads attached files and extracts their text content
  prepare_messages:
    name: Prepare Messages
    description: Assembles the chat history with system prompt and file context for the LLM
  process:
    name: Process Message
    description: Sends the prepared messages to the LLM and streams the response
