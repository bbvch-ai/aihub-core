---
metadata:
  name: Assistente Insegnabile
  description: Assistente IA che impara dagli esempi che fornisci per capire come
    desideri che risponda
config:
  number_of_input_tokens:
    label: Token di input max
    help: Numero massimo di token consentiti nel contesto di input
steps:
  limit_chat_history:
    name: Limita cronologia chat
    description: Tronca i messaggi della chat in arrivo per rispettare il limite di
      token configurato.
  agent_suitability_guard:
    name: Verifica idoneità agente
    description: Verifica se l'agente è adatto a gestire la richiesta dell'utente.
  condense_standalone_question:
    name: Condensare domanda autonoma
    description: Condensa la cronologia della chat e la query dell'utente in una domanda
      autonoma.
  create_few_shot_examples:
    name: Crea esempi Few-Shot
    description: Prepara esempi Few-Shot e crea il contesto completo per il LLM.
  respond_with_llm:
    name: Rispondi con LLM
    description: Genera una risposta utilizzando il LLM basato su esempi Few-Shot.
  stop:
    name: Ferma
    description: Ferma l'agente quando la richiesta viene rifiutata dalla verifica
      di idoneità.
