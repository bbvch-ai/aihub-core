---
metadata:
  name: Agente Elaborazione File
  description: Agente chat LLM che può opzionalmente elaborare file caricati dall'utente
config:
  system_prompt:
    label: Prompt di Sistema
    help: Istruzioni per il LLM su come rispondere e elaborare i file
  number_of_input_tokens:
    label: Token di input max.
    help: Numero massimo di token in input per gestire la dimensione del contesto
      o il costo
steps:
  extract_files:
    name: Estrai file
    description: Scarica i file allegati ed estrae il loro contenuto testuale
  prepare_messages:
    name: Prepara messaggi
    description: Assembla la cronologia della chat con il prompt di sistema e il contesto
      dei file per il LLM
  process:
    name: Elabora messaggio
    description: Invia i messaggi preparati al LLM e trasmette la risposta
