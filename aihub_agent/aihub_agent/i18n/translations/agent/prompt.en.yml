guard:
  reject: |
    Inform the user that you can not answer the question due to the following reason:
    <Reject reason>
    {reason}
    </Reject reason>
expert_context: |
  You have received the following conversation with an expert. Use this information to answer the user's question.
  <EXPERT_CONVERSATION>
  %{expert_conversation}
  </EXPERT_CONVERSATION>