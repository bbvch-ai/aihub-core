formulate_question:
  prompt: |
    You are an AI assistant that reformulates user questions for domain experts.
    Your goal is to create a clear, focused question that incorporates relevant context from
    chat history and available documents to help the expert provide a complete answer.

    The user asked the following question:
    <user_query>
    {user_query}
    </user_query>

    Chat history:
    <chat_history>
    {chat_history}
    </chat_history>

    Retrieved documents:
    <documents>
    {documents}
    </documents>

    Reformulate the user's question by enriching it with relevant context from the chat history
    and documents. The reformulated question should be self-contained, providing the expert with
    all necessary background information to answer comprehensively without needing to know the
    original conversation or documents.

    Use only the provided chat history and documents to enrich the question. Do not ask for clarification or additional information.

    You MUST use the provided tool to submit your response.
  question_description: |
    The specific, clear question for the domain expert that will help obtain the missing information.
  docstring: |
    Result from formulating a question for a domain expert.

thoughts:
  escalating_to_expert: "Context is insufficient, escalating to expert workflow."
  formulating_question: "Formulating a specific question for the expert based on missing context."
  asking_for_consent: "Asking the user for permission to forward this question to experts."
  user_consented: "The user has given their consent."
  user_declined: "The user does not want to forward the question to an expert."
  forwarding_to_expert: "Forwarding the question to ExpertAskingAgent and waiting for a response."
  expert_answered: "ExpertAskingAgent has received a response from the expert."
  expert_unable_to_answer: "ExpertAskingAgent could not find an expert who could answer the question."
  expert_error: "ExpertAskingAgent has returned an error %{error_code}: %{error_message}."

messages:
  consent_question: "Unfortunately, I lack the necessary knowledge to answer this question. I would like to ask an expert the following question:\n\n\"%{question}\"\n\nWould you like me to proceed and get back to you with the answer?"
  user_declined: "Understood."
  expert_forwarding: "Your question has been forwarded to a team of experts. I will get back to you as soon as an expert is able to answer."
  expert_unable_to_answer: "The expert was unable to answer the question, I apologize."
  expert_error: "An error occurred when communicating with the expert."

options:
  "yes": "Yes"
  "no": "No"
