metadata:
  name: Document Intelligence Assistant
  description: AI assistant that searches and analyzes your documents to provide informed,
    context-aware answers
config:
  number_of_input_tokens:
    label: Max input tokens
    help: Maximum number of tokens allowed in the LLM input. Limits context size to
      manage costs and avoid exceeding model limits.
  check_context_sufficiency:
    label: Check context sufficiency
    help: When enabled, the agent verifies if retrieved context contains enough information
      before generating a response.
  max_hops:
    label: Max retrieval hops
    help: Maximum number of retrieval iterations when initial context is insufficient.
      Higher values may improve answers but increase latency.
  system_prompt:
    label: System prompt
    help: Instructions defining the agent's personality, role, and behavior guidelines.
      Sets the overall tone and capabilities.
    default: "<persona>\nYou are RAG Agent, a knowledge retrieval assistant. Your\
      \ primary mission is to provide accurate answers using only retrieved document\
      \ information.\n</persona>\n\n<rules>\n- MUST: Answer using ONLY retrieved context\
      \ and documents\n- MUST: Quote specific passages supporting your answer\n- NEVER:\
      \ Use general knowledge beyond provided context\n- FORBIDDEN: Speculation or\
      \ assumptions not in retrieved documents\n</rules>\n\n<instructions>\nFollow\
      \ this process:\n    1. Analyze retrieved context\n    2. Identify relevant\
      \ passages\n    3. Extract key information\n    4. Provide answer with direct\
      \ quotes.\nWhen context is insufficient, state that you cannot answer the question\
      \ with available information.\n</instructions>\n"
  context_prompt:
    label: Context prompt
    help: Template for presenting retrieved documents to the LLM. Use placeholders
      like {context} to inject retrieved content.
    default: '{% chat role="user" %}

      You are provided with additional context information in the form of structured
      documents. Each document follows a

      consistent format, beginning with `<REFERENCE_DOCUMENT [metadata]>` and ending
      with `</REFERENCE_DOCUMENT>`. These documents contain

      essential details that should be utilized to accurately understand and respond
      to the user''s query.


      Each document includes metadata such as source, namespace, type, language, version,
      and timestamps. The content

      within these documents provides crucial insights relevant to the given context.


      Below are the relevant documents:


      <context_documents>

      {% for block in context_blocks %}

      {% if block.block_type == ''text'' %}

      {{ block.text }}

      {% endif %}

      {% if block.block_type == ''image'' %}

      {{ block.url.__str__() | image}}

      {% endif %}

      {% endfor %}

      </context_documents>


      Instruction: Using the information from the provided documents, generate a detailed
      and well-structured response

      to the user''s question.

      {% endchat %}

      '
  context_insufficient_prompt:
    label: Context insufficient prompt
    help: Message shown when the agent cannot find sufficient information to answer.
      Guides how the agent communicates limitations.
    default: 'Inform the user that you can not answer the question due to the following
      reason:'
  reranking_enabled:
    label: Enable reranking
    help: Use a reranking model to improve the relevance of retrieved documents before
      passing them to the LLM.
  enable_organization_memory:
    label: Enable organization memory
    help: Whether to retrieve organization memories (expert knowledge shared across
      users) for context.
  tenant_namespace:
    label: Tenant namespace
    help: Namespace for department-level memory isolation. Leave empty for default
      organization scope.
  enable_user_memory_retrieval:
    label: Enable user memory retrieval
    help: Whether to retrieve user-specific memories for personalized context.
  enable_user_memory_storage:
    label: Enable user memory storage
    help: Whether to store new memories from conversations for future retrieval.
