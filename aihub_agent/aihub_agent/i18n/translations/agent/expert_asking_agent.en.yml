follow_up_question: |
  The expert was asked: "{{ question }}"

  Their response:
  {% for message in chat_history %}
  {% if message.role.value == 'user' %}
  {% for block in message.blocks %}
  {% if block.block_type == 'text' %}
  {{ block.text }}
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}

  The expert either said they don't know, didn't answer, or only answered part of the question.
  Ask for the specific missing information. Keep it short and polite. Only ask for what was originally requested but not yet answered.

routes:
  answer_sufficient: "The expert answered the question. Choose this if the expert provided ANY direct answer."
  answer_insufficient: "The expert did NOT answer. Choose ONLY if the expert said 'I don't know' or refused to answer."

thoughts:
  asking_question: "Asking question to expert: '%{question}'."
  expert_responded: "Expert has responded: '%{response}'."
  determine_sufficient: "Verify if the expert's answer is sufficient."
  answer_sufficient: "The expert's answer is sufficient."
  max_questions_reached: "Maximum number of follow-up questions reached."
  returning_insufficient: "Returning to the user with an insufficient answer."
  answer_not_sufficient: "Answer is not sufficient, formulating a follow-up question."