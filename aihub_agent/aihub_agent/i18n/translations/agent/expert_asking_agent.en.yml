follow_up_question: |
  You are given a chat history between an AI assistant and an expert. The goal of this conversation
  is to answer a question originally posed by a user. However, the experts answer seemed to be insufficient.

   <chat_history>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>

  <user_query>
    %{question}
  </user_query>

  Please formulate a follow-up question to the expert that addresses the insufficiency in their previous answer.
  The question should be clear and concise, and it should help the expert provide a more complete answer to the user's original question.

thoughts:
  asking_question: "Asking question to expert: '%{question}'."
  expert_responded: "Expert has responded: '%{response}'."
  determine_sufficient: "Verify if the expert's answer is sufficient."
  answer_sufficient: "The expert's answer is sufficient."
  max_questions_reached: "Maximum number of follow-up questions reached."
  returning_insufficient: "Returning to the user with an insufficient answer."
  answer_not_sufficient: "Answer is not sufficient, formulating a follow-up question."