follow_up_question: |
  Ti viene fornita una cronologia di chat tra un assistente AI e un esperto. L'obiettivo di questa conversazione
  è rispondere a una domanda originariamente posta da un utente. Tuttavia, la risposta dell'esperto sembra essere insufficiente.

   <chat_history>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>

  <user_query>
    %{question}
  </user_query>

  Per favore, formula una domanda di follow-up all'esperto che affronti l'insufficienza della sua risposta precedente.
  La domanda dovrebbe essere chiara e concisa, e dovrebbe aiutare l'esperto a fornire una risposta più completa alla domanda originale dell'utente.

thoughts:
  asking_question: "Porre una domanda all'esperto: '%{question}'."
  expert_responded: "L'esperto ha risposto: '%{response}'."
  determine_sufficient: "Verificare se la risposta dell'esperto è sufficiente."
  answer_sufficient: "La risposta dell'esperto è sufficiente."
  max_questions_reached: "Raggiunto il numero massimo di domande di follow-up."
  returning_insufficient: "Ritorno all'utente con una risposta insufficiente."
  answer_not_sufficient: "La risposta non è sufficiente, formulazione di una domanda di follow-up."