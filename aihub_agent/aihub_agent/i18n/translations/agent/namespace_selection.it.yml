  starting_selection: "Avvio dell'analisi di selezione namespace."
  reusing_selection: "Argomento invariato, riutilizzo della selezione namespace precedente."
  topic_changed: "Cambio di argomento rilevato, rivalutazione della selezione namespace."
  analyzing_query: "Analisi della richiesta utente per determinare le fonti di conoscenza rilevanti."
  confident_selection: "Sicuro della selezione namespace, procedo con RAG."
  max_rounds_reached: "Numero massimo di round di chiarimento raggiunto, procedo con la migliore selezione."
  need_clarification: "Confidenza di selezione troppo bassa, richiesta chiarimento all'utente."
  asking_clarification: "Domanda di chiarimento (round %{round})."
  processing_response: "Elaborazione risposta utente: %{response}"
  invoking_rag: "Invocazione agente RAG con fonti: %{sources}"
