thoughts:
  fetching_namespaces: "Recupero degli spazi dei nomi disponibili dai bucket configurati"
  parsing_selection: "Analisi della selezione dello spazio dei nomi dalla risposta dell'utente"
  selection_complete: "Selezione dello spazio dei nomi completata, delega all'agente RAG"
  delegating_to_rag: "Delega all'agente RAG con gli spazi dei nomi selezionati"
  rag_error: "Errore dell'agente RAG: %{error_code} - %{error_message}"

messages:
  default_question: "Seleziona lo spazio dei nomi che desideri utilizzare per la tua ricerca."
  clarification_needed: "Non sono riuscito a capire la tua selezione. Potresti specificare quale spazio dei nomi vorresti usare?"
  rag_error: "Ho riscontrato un errore durante l'elaborazione della tua richiesta. Per favore riprova."

prompts:
  ask_selection: |
    Stai aiutando l'utente a scegliere quali fonti di conoscenza cercare.
    Genera una domanda amichevole e concisa che chieda quale/i spazio/i dei nomi desidera utilizzare.
    Se ci sono più bucket, chiedi una selezione per bucket.
    Sii conversazionale e disponibile. Non elencare tutte le opzioni a meno che non siano poche.
    Chiedi semplicemente cosa vogliono cercare.

  parse_selection: |
    Stai estraendo la selezione dello spazio dei nomi dell'utente dalla sua risposta.

    Risposta dell'utente: {user_response}

    Spazi dei nomi disponibili:
    {namespace_options}

    Seleziona lo spazio dei nomi che meglio corrisponde a ciò che l'utente desidera.
    Se l'intenzione dell'utente è chiara, imposta selected_namespace sul nome dello spazio dei nomi corrispondente.
    Se non è chiaro, imposta selected_namespace su null e fornisci una domanda di follow-up utile in follow_up.

fields:
  selected_namespace: "Il nome interno (dal campo 'name') dello spazio dei nomi selezionato dall'utente, o null se la selezione non è chiara"
  follow_up: "Una domanda di chiarimento se la selezione dell'utente non è chiara. Stringa vuota se la selezione è chiara."
