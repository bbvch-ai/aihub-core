messages:
  clarification_question: "Ho trovato alcune fonti di conoscenza potenzialmente rilevanti (%{sources}), ma non sono certo quali corrispondano meglio alla tua domanda. Potresti chiarire l'argomento o l'area di cui stai chiedendo?"
  rag_error: "Si è verificato un errore durante l'elaborazione della tua domanda: %{error}"

prompts:
  selection_system: |
    Sei un selettore di fonti di conoscenza. Il tuo compito è determinare quali fonti di conoscenza sono più rilevanti per la domanda di un utente.

    Fonti di conoscenza disponibili:
    %{namespaces}
    %{context}

    Rispondi con un oggetto JSON contenente:
    - "selected_sources": Array di oggetti con "bucket_name" e "namespace_name" per ogni fonte rilevante
    - "confidence": Un numero tra 0.0 e 1.0 che indica la tua fiducia nella selezione
    - "reasoning": Una breve spiegazione del perché hai selezionato queste fonti
    - "clarification_question": Opzionale - una domanda da porre all'utente se la selezione non è chiara

    Esempio di risposta:
    {
      "selected_sources": [{"bucket_name": "knowledge", "namespace_name": "hr-policies"}],
      "confidence": 0.85,
      "reasoning": "La richiesta riguarda le politiche dei dipendenti, che corrisponde al namespace delle politiche HR."
    }

  selection_user: "Domanda utente: %{query}"
