messages:
  topic_change_question: "La tua domanda sembra riguardare un argomento diverso. Attualmente sto cercando in **%{sources}**. Devo cercare in altre fonti di conoscenza per questa domanda?"
  approval_question: "Cerchero in queste fonti di conoscenza: **%{sources}**. E corretto, o preferisci altre fonti?"
  clarification_question: "Ho trovato alcune fonti di conoscenza potenzialmente rilevanti (%{sources}), ma non sono certo quali corrispondano meglio alla tua domanda. Potresti chiarire l'argomento o l'area di cui stai chiedendo?"
  rag_error: "Si e verificato un errore durante l'elaborazione della tua domanda: %{error}"

prompts:
  selection_system: |
    Sei un selettore di fonti di conoscenza. Il tuo compito e determinare quali fonti di conoscenza sono piu rilevanti per la domanda di un utente.

    Fonti di conoscenza disponibili:
    %{namespaces}
    %{context}

    IMPORTANTE: Seleziona esattamente UN namespace per bucket. Ogni bucket deve avere uno e un solo namespace selezionato in base alla richiesta dell'utente.

    Rispondi con un oggetto JSON contenente:
    - "selected_sources": Array di oggetti con "bucket_name" e "namespace_name" per ogni fonte rilevante (uno per bucket)
    - "reasoning": Una breve spiegazione del perche hai selezionato queste fonti

    Esempio di risposta:
    {
      "selected_sources": [{"bucket_name": "knowledge", "namespace_name": "hr-policies"}],
      "reasoning": "La richiesta riguarda le politiche dei dipendenti, che corrisponde al namespace delle politiche HR."
    }

  selection_user: "Domanda utente: %{query}"

  # Approval interpreter prompts
  approval_intent_description: "L'intenzione dell'utente: 'approve' se accetta, 'reject' se rifiuta, 'correct' se vuole modifiche"
  correction_details_description: "In caso di correzione, descrivi cosa l'utente vuole modificare"
  preferred_sources_description: "Lista dei nomi di namespace che l'utente ha specificamente menzionato"
  interpretation_reasoning_description: "Breve spiegazione dell'interpretazione della risposta"
  approval_interpretation_docstring: "Interpretazione della risposta di approvazione dell'utente"

  approval_interpretation: |
    Interpreta la risposta dell'utente a una domanda di approvazione della selezione namespace.

    Selezione attuale: %{current_selection}
    Fonti disponibili: %{available_sources}
    Risposta dell'utente: "%{user_response}"

    Determina se l'utente:
    - "approve": Accetta la selezione (si, ok, procedi, va bene, ecc.)
    - "reject": Rifiuta senza proporre alternative (no, non quelle, sbagliato, ecc.)
    - "correct": Fornisce indicazioni specifiche (usa X invece, includi anche Y, solo Z, ecc.)

  # Topic change response interpreter prompts
  wants_new_sources_description: "True se l'utente vuole cercare in altre fonti, False per mantenere le attuali"
  topic_response_reasoning_description: "Breve spiegazione dell'interpretazione"
  topic_change_interpretation_docstring: "Interpretazione della risposta dell'utente riguardo al cambio di argomento"

  topic_change_interpretation: |
    Interpreta la risposta dell'utente per sapere se vuole cercare in altre fonti di conoscenza.

    Risposta dell'utente: "%{user_response}"

    Determina se l'utente vuole cercare in altre fonti (si, diverse, nuovo argomento, ecc.)
    o mantenere le fonti attuali (no, le stesse, continua, ecc.).
