follow_up_question: |
  L'expert a été interrogé : "{{ question }}"

  Sa réponse :
  {% for message in chat_history %}
  {% if message.role.value == 'user' %}
  {% for block in message.blocks %}
  {% if block.block_type == 'text' %}
  {{ block.text }}
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}

  L'expert a dit qu'il ne sait pas, n'a pas répondu, ou n'a répondu qu'à une partie de la question.
  Demandez les informations spécifiques manquantes. Restez bref et poli. Ne demandez que ce qui a été initialement demandé mais pas encore répondu.

routes:
  answer_sufficient: "L'expert a répondu à la question. Choisissez ceci si l'expert a fourni UNE réponse directe."
  answer_insufficient: "L'expert n'a PAS répondu. Choisissez ceci UNIQUEMENT si l'expert a dit 'Je ne sais pas' ou a refusé de répondre."

thoughts:
  asking_question: "Poser une question à l'expert: '%{question}'."
  expert_responded: "L'expert a répondu: '%{response}'."
  determine_sufficient: "Vérifier si la réponse de l'expert est suffisante."
  answer_sufficient: "La réponse de l'expert est suffisante."
  max_questions_reached: "Nombre maximum de questions de suivi atteint."
  returning_insufficient: "Retour à l'utilisateur avec une réponse insuffisante."
  answer_not_sufficient: "La réponse n'est pas suffisante, formulation d'une question de suivi."