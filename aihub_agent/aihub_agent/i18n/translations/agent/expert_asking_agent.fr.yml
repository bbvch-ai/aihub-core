follow_up_question: |
  Vous disposez d'un historique de chat entre un assistant IA et un expert. L'objectif de cette conversation
  est de répondre à une question initialement posée par un utilisateur. Cependant, la réponse de l'expert semble insuffisante.

   <chat_history>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>

  <user_query>
    %{question}
  </user_query>

  Veuillez formuler une question de suivi à l'expert qui aborde l'insuffisance de sa réponse précédente.
  La question doit être claire et concise, et elle doit aider l'expert à fournir une réponse plus complète à la question initiale de l'utilisateur.

thoughts:
  asking_question: "Poser une question à l'expert: '%{question}'."
  expert_responded: "L'expert a répondu: '%{response}'."
  determine_sufficient: "Vérifier si la réponse de l'expert est suffisante."
  answer_sufficient: "La réponse de l'expert est suffisante."
  max_questions_reached: "Nombre maximum de questions de suivi atteint."
  returning_insufficient: "Retour à l'utilisateur avec une réponse insuffisante."
  answer_not_sufficient: "La réponse n'est pas suffisante, formulation d'une question de suivi."