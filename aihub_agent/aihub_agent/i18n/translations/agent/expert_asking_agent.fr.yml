follow_up_question: |
  Vous disposez d'un historique de chat entre un assistant IA et un expert. L'objectif de cette conversation
  est de répondre à une question initialement posée par un utilisateur. Cependant, la réponse de l'expert semble insuffisante.

   <chat_history>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>

  <user_query>
    %{question}
  </user_query>
  
  Veuillez formuler une question de suivi à l'expert qui aborde l'insuffisance de sa réponse précédente.
  La question doit être claire et concise, et elle doit aider l'expert à fournir une réponse plus complète à la question initiale de l'utilisateur.

knowledge_snippet_prompt: |
  {% chat role="system" %}
  Vous disposez d'un historique de chat entre un assistant IA et un expert. L'objectif de cette conversation
  était de répondre à une question initialement posée par un utilisateur. L'expert a pu fournir la réponse avec succès.

  <user_query>
    %{question}
  </user_query>

  <chat_history> 
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>
  {% endchat %}

  {% chat role="user" %}
  Maintenant que la réponse est fournie, veuillez extraire les connaissances clés de cette conversation qui manquaient à l'utilisateur.
  Cet extrait de connaissances doit être un résumé concis des informations les plus importantes que l'utilisateur devait connaître.
  L'extrait sera renvoyé à l'utilisateur, donc, à partir de l'extrait seul, la réponse à la question doit être évidente.
  Cependant, l'extrait sera également ajouté à la base de connaissances, donc l'extrait ne doit pas simplement contenir
  la réponse à la question, mais les connaissances nécessaires pour répondre à la question..
  {% endchat %}

knowledge_snippet: |
  %{content}
  
  Connaissance soumise via Slack par l'utilisateur %{expert_name} le %{date} à %{time}.

