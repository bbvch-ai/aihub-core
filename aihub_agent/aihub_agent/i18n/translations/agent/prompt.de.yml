guard:
  reject: |
    Informiere den Benutzer, dass du die Frage nicht beantworten kannst, aufgrund des folgenden Grundes:
    <Grund>
    {reason}
    </Grund>
expert_context: |
  Du hast folgende Konversation mit einem Experten erhalten. Verwende diese Information, um die Frage des Benutzers zu beantworten.
  <EXPERTEN_KONVERSATION>
  %{expert_conversation}
  </EXPERTEN_KONVERSATION>