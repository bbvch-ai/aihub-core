follow_up_question: |
  Ihnen wird ein Chat-Verlauf zwischen einem KI-Assistenten und einem Experten gegeben. Das Ziel dieses Gesprächs
  ist es, eine ursprünglich von einem Benutzer gestellte Frage zu beantworten. Die Antwort des Experten scheint jedoch unzureichend zu sein.

   <chat_history>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
    </message>
    {% endfor %}
  </chat_history>

  <user_query>
    %{question}
  </user_query>

  Bitte formulieren Sie eine Folgefrage an den Experten, die auf die Unzulänglichkeit in seiner vorherigen Antwort eingeht.
  Die Frage sollte klar und präzise sein und dem Experten helfen, eine vollständigere Antwort auf die ursprüngliche Frage des Benutzers zu geben.

thoughts:
  asking_question: "Frage an Experten stellen: '%{question}'."
  expert_responded: "Experte hat geantwortet: '%{response}'."
  determine_sufficient: "Überprüfen, ob die Antwort des Experten ausreichend ist."
  answer_sufficient: "Die Antwort des Experten ist ausreichend."
  max_questions_reached: "Maximale Anzahl an Folgefragen erreicht."
  returning_insufficient: "Kehre zum Benutzer mit einer unzureichenden Antwort zurück."
  answer_not_sufficient: "Antwort ist nicht ausreichend, formuliere eine Folgefrage."
