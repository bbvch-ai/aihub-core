# Gemeinsame RAG-Schritte (verwendet von RAGAgent und ExpertRAGAgent)
rag:
  limit_chat_history:
    name: "Chat-Verlauf begrenzen"
    description: "Kürzt eingehende Chat-Nachrichten auf das konfigurierte Token-Limit"
  condense_standalone_question:
    name: "Eigenständige Frage kondensieren"
    description: "Fasst den Chat-Verlauf und die Benutzeranfrage zu einer eigenständigen Frage zusammen."
  few_shot_guard:
    name: "Few-Shot-Schutz"
    description: "Schützt die Frage, um sicherzustellen, dass sie für den Agenten geeignet ist."
  retrieve_nodes:
    name: "Knoten abrufen"
    description: "Ruft relevante Knoten aus Wissensquellen ab."
  rerank_nodes:
    name: "Abgerufene Knoten neu ordnen"
    description: "Ordnet abgerufene Dokumente mit einem Reranking-Modell für bessere Relevanz neu"
  order_nodes:
    name: "Knoten nach Dokumenten ordnen"
    description: "Ordnet die abgerufenen Knoten nach ihren Quelldokumenten."
  context_sufficient_guard:
    name: "Kontext-Ausreichend-Schutz"
    description: "Schützt den Kontext, um sicherzustellen, dass er für eine Antwort ausreicht."
  limit_chat_history_with_context:
    name: "Chat-Verlauf mit Kontext begrenzen"
    description: "Fügt den kombinierten Kontext hinzu und kürzt den Chat-Verlauf erneut."
  respond_with_llm:
    name: "Mit LLM antworten"
    description: "Generiert eine Antwort mit dem konfigurierten LLM."

# ExpertRAGAgent-spezifische Schritte
expert_rag:
  handle_insufficient_context:
    name: "Unzureichenden Kontext behandeln"
    description: "Behandelt unzureichenden Kontext durch Einholung der Experten-Zustimmung."
  consent_answer:
    name: "Zustimmungsantwort"
    description: "Benutzer hat die Zustimmungsfrage beantwortet."
  invoke_expert_agent:
    name: "ExpertAskingAgent aufrufen"
    description: "Leitet Anfrage an ExpertAskingAgent weiter, der Experten befragt."
  expert_answer_positive:
    name: "Experten-Antwort positiv"
    description: "ExpertAskingAgent konnte Informationen vom Experten extrahieren."
  expert_answer_negative:
    name: "Experten-Antwort negativ"
    description: "ExpertAskingAgent konnte KEINE Informationen vom Experten extrahieren."
  expert_answer_error:
    name: "Experten-Antwort Fehler"
    description: "ExpertAskingAgent ist auf einen Fehler gestossen."

# ExpertAskingAgent-Schritte
expert_asking:
  invoke_expert:
    name: "Experten aufrufen"
    description: "Stellt eine Frage an eine Gruppe von Experten."
  expert_response:
    name: "Experten-Antwort"
    description: "Verarbeitet die Antwort des Experten."
  response_sufficient_router:
    name: "Antwort-Ausreichend-Router"
    description: "Prüft, ob der Experte die Frage ausreichend beantwortet hat."
  follow_up_question:
    name: "Nachfrage"
    description: "Stellt eine Nachfrage an den Experten, da die Antwort noch nicht ausreicht."

# NamespaceSelectionAgent-Schritte
namespace_selection:
  initialize_determination:
    name: "Namespace-Bestimmung initialisieren"
    description: "Lädt Namespaces und initialisiert die Bestimmungsschleife"
  determine_namespaces:
    name: "Namespaces bestimmen"
    description: "LLM analysiert Konversation zur Namespace-Bestimmung"
  process_follow_up:
    name: "Nachfrage verarbeiten"
    description: "Verarbeitet die Nachfrage-Antwort des Benutzers und setzt die Bestimmung fort"
  process_approval_approved:
    name: "Genehmigung verarbeiten - Genehmigt"
    description: "Speichert die Auswahl und leitet an RAG-Agent weiter"
  process_approval_rejected:
    name: "Genehmigung verarbeiten - Abgelehnt"
    description: "Fügt Ablehnung zur Konversation hinzu und kehrt zur Schleife zurück"
  rag_response:
    name: "RAG-Antwort"
    description: "Verarbeitet die Antwort vom RAG-Agent"
  rag_error:
    name: "RAG-Fehler"
    description: "Behandelt Fehler vom RAG-Agent"
  forward_to_rag:
    name: "An RAG weiterleiten"
    description: "Leitet die Anfrage mit Namespace-Auswahl an den RAG-Agent weiter"

# RetrievalAgent-Schritte
retrieval:
  retrieve_nodes:
    name: "Knoten abrufen"
    description: "Ruft relevante Knoten aus der Wissensbasis ab."
  order_nodes:
    name: "Knoten nach Dokumenten ordnen"
    description: "Ordnet die abgerufenen Knoten nach ihren Quelldokumenten."
  stop:
    name: "Stopp-Schritt"
    description: "Stoppt den Agenten und gibt die geordneten Knoten als Kontextnachrichten zurück."

# LLMWrappingAgent-Schritte
llm_wrapping:
  start:
    name: "Benutzernachricht verarbeiten"
    description: "Leitet die Benutzernachricht an das LLM weiter und streamt die Antwort."

# FewShotAgent-Schritte
few_shot:
  limit_chat_history:
    name: "Chat-Verlauf begrenzen"
    description: "Kürzt eingehende Chat-Nachrichten, um innerhalb des konfigurierten Token-Limits zu bleiben."
  agent_suitability_guard:
    name: "Agenteneignungsprüfung"
    description: "Prüft, ob der Agent für die Bearbeitung der Benutzeranfrage geeignet ist."
  condense_standalone_question:
    name: "Eigenständige Frage verdichten"
    description: "Verdichtet den Chat-Verlauf und die Benutzeranfrage zu einer eigenständigen Frage."
  create_few_shot_examples:
    name: "Few-Shot-Beispiele erstellen"
    description: "Bereitet Few-Shot-Beispiele vor und erstellt den vollständigen Kontext für das LLM."
  respond_with_llm:
    name: "Mit LLM antworten"
    description: "Generiert eine Antwort mit dem LLM basierend auf Few-Shot-Beispielen."
  stop:
    name: "Stoppen"
    description: "Stoppt den Agenten, wenn die Anfrage von der Eignungsprüfung abgelehnt wird."
