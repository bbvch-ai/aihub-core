[project]
name = "aihub-agent"
version = "0.270.1"
description = "agents core"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "LicenseRef-Proprietary"
dependencies = [
    "aihub-core",
    "llama-index-llms-openai>=0.6.12",
    "llama-index-llms-azure-openai>=0.4.2",
    "stringcase>=1.2.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "slow: mark a test as slow",
    "experimental: mark a test as experimental",
    "flaky: mark a test as flaky (may fail intermittently)",
    "e2e: mark a test as e2e (should not run with unit tests)",
]
addopts = "--strict-markers"
