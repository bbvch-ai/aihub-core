[project]
name = "aihub-agent"
version = "0.263.1"
description = "agents core"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "LicenseRef-Proprietary"
dependencies = [
    "aihub-core",
    "pydantic>=2.10.3",
    "nats-py>=2.9.0",
    "openinference-instrumentation-llama-index>=4.2.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-api>=1.39.1",
    "llama-index-core==0.14.12",
    "mongoengine>=0.29.1",
    "python-i18n>=0.3.9",
    "opentelemetry-exporter-otlp>=1.39.1",
    "pydantic-settings>=2.7.0",
    "colorlog>=6.9.0",
    "llama-index-llms-openai>=0.6.12",
    "llama-index-llms-azure-openai>=0.4.2",
    "cachetools>=5.5.2",
    "redis>=5.2.1",
    "stringcase>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.1",
    "mypy>=1.13.0",
    "toml-sort>=0.24.2",
    "black[jupyter]>=26.1.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=6.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "pip-licenses>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
aihub-core = { workspace = true }

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "azure: mark tests that use Azure services",
    "self_hosted: mark tests that use self hosted services",
    "slow: mark a test as slow",
    "integration: mark a test as an integration test",
    "experimental: mark a test as experimental",
    "flaky: mark a test as flaky (may fail intermittently)",
]
addopts = "--strict-markers"
