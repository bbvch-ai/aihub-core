# Agent Development Environment - Docker Compose
#
# Provides isolated development containers for building AI agents.
# Each agent gets its own VS Code (browser) + OpenCode Server instance.
#
# Quick Start:
#   docker-compose -f docker-compose.agent-dev.yml up -d
#   Open: http://localhost:8443 (password: developer)
#
# Scaling:
#   Copy the agent-dev-template service block and modify:
#   - Service name (e.g., legal-agent-dev, product-agent-dev)
#   - Ports (increment by 1: 8444/8081, 8445/8082, etc.)
#   - Volume path (./agents/legal, ./agents/product, etc.)
#   - PASSWORD environment variable
#
# See AGENT_DEV_SETUP.md for detailed instructions.

services:
  # ===================================================================
  # Shared Infrastructure
  # These services are shared by ALL agent development containers
  # ===================================================================

  nats:
    container_name: aihub-nats-dev
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--max_file_store=10G"
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-nats:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agent-dev-network

  redis:
    container_name: aihub-redis-dev
    image: valkey/valkey:8.0-alpine
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-dev-network

  postgres:
    container_name: aihub-postgres-dev
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: aihub
    ports:
      - "5432:5432"
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-dev-network

  milvus-etcd:
    container_name: aihub-milvus-etcd-dev
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-milvus-etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - agent-dev-network

  milvus-minio:
    container_name: aihub-milvus-minio-dev
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - agent-dev-network

  milvus:
    container_name: aihub-milvus-dev
    image: milvusdb/milvus:v2.4.15
    command: milvus run standalone
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-milvus:/var/lib/milvus
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # HTTP metrics
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    networks:
      - agent-dev-network

  phoenix:
    container_name: aihub-phoenix-dev
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /phoenix-data
    volumes:
      - ${VOLUME_ROOT:-./.docker-volumes}/agent-dev-phoenix:/phoenix-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-dev-network

  # ===================================================================
  # Agent Development Container Template
  #
  # This is Agent #1. To add more agents:
  # 1. Copy this entire service block
  # 2. Rename service (e.g., legal-agent-dev → product-agent-dev)
  # 3. Change ports:
  #    - VS Code: 8443 → 8444, 8445, etc.
  #    - OpenCode: 8080 → 8081, 8082, etc.
  # 4. Change volume path: ./agents/agent-1 → ./agents/product
  # 5. Change PASSWORD and AGENT_NAME
  # 6. Change volume name: agent-1-vscode → product-vscode
  # ===================================================================

  agent-1-dev:
    container_name: agent-1-dev
    build:
      context: ./deployment/agent-dev
      dockerfile: Dockerfile.agent-dev
      args:
        USERNAME: developer
        USER_UID: 1000
        USER_GID: 1000
    stdin_open: true
    tty: true
    ports:
      - "8443:8443"  # VS Code (change to 8444, 8445, etc. for more agents)
      - "8080:8080"  # OpenCode (change to 8081, 8082, etc. for more agents)
    volumes:
      # Agent source code (persists on host)
      - ./agents/agent-1:/workspace/agent:rw

      # Shared libraries (read-only)
      - ./aihub_lib:/workspace/aihub_lib:ro
      - ./aihub_agent/aihub_agent:/workspace/aihub_agent:ro

      # Documentation for AI context
      - ./AGENTS.md:/workspace/AGENTS.md:ro
      - ./AI_AGENT_BUILD_AND_DEPLOY_GUIDE.md:/workspace/BUILD_GUIDE.md:ro
      - ./aihub_agent/AGENTS.md:/workspace/aihub_agent_guide.md:ro

      # Poetry files for dependency management
      - ./aihub_agent/pyproject.toml:/workspace/pyproject.toml:ro
      - ./aihub_agent/poetry.lock:/workspace/poetry.lock:ro

      # Persist VS Code settings and extensions
      - agent-1-vscode-data:/home/developer/.local/share/code-server

      # Persist bash history
      - agent-1-bash-history:/home/developer/.bash_history_mount
    environment:
      # Infrastructure endpoints
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://admin:admin@postgres:5432/aihub
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006

      # Development settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development

      # VS Code password (CHANGE THIS!)
      PASSWORD: ${AGENT_1_PASSWORD:-developer}

      # Agent identification
      AGENT_NAME: agent-1

      # Port info (for display in logs)
      VSCODE_PORT: 8443
      OPENCODE_PORT: 8080

      # Preserve bash history
      HISTFILE: /home/developer/.bash_history_mount/.bash_history
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    networks:
      - agent-dev-network

