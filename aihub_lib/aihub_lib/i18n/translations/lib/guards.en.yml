common:
  user_message: |
    <User>
    {user}
    </User>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Justification for the decision made.
  success: |
    true if the request can be forwarded to the agent, false if the request does not fall into the responsibility of the agent.
  docstring: |
    Data model for the decision on whether the request is acceptable or not.
agent_description_guard:
  prompt: |
    The description of an agent is as follows:
    <Agent Description>
    {agent_description}
    </Agent Description>
    The agent may have access to additional sources of information to help answer the question.
    Decide whether the question asked by the user should be directed to this agent in the context of the conversation. Allow all questions that might fall within the agent's area of expertise. Block all questions that are obviously unrelated to the agent. In case of doubt, choose to allow the question.
    <User Query>
    {user_query}
    </User Query>
    <Past Conversation Context>
    {history}
    </Past Conversation Context>
few_shot_guard:
  prompt: |
    I will provide you with a series of examples of messages and responses. These examples show the types of questions the agent can answer. If the agent can answer the question, the success will be true; if not, the success will be false. Based on these examples, decide whether a new question can be answered or not.
    <Examples of Messages and Responses>
    {examples}
    </Examples of Messages and Responses>
    <User Query>
    {user_query}
    </User Query>