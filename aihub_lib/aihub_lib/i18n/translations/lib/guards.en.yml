agent_description_guard:
  prompt: |
    The description of an agent is as follows:
    <Agent Description>
    {agent_description}
    </Agent Description>
    The agent may have access to additional sources of information to help answer the question.
    Decide whether the question asked by the user should be directed to this agent in the context of the conversation. Allow all questions that might fall within the agent's area of expertise. Block all questions that are obviously unrelated to the agent. In case of doubt, choose to allow the question.
    <User Query>
    {user_query}
    </User Query>
    <Past Conversation Context>
    {history}
    </Past Conversation Context>
  user_message: |
    <User>
    {user}
    </User>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Justification for the decision made.
  success: |
    true if the request can be forwarded to the agent, false if the request does not fall into the responsibility of the agent.
  docstring: |
    Data model for the decision on whether the request is acceptable or not.
few_shot_guard:
  prompt: |
    You will be provided with a series of example user messages, each labeled with a success status and an explanation. 
    These examples define the types of queries the agent is allowed to answer.
    
    - If a query is allowed, the success status is **true**.
    - If a query is not allowed, the success status is **false**, along with a justification.
    
    Your task is to determine whether a new user query is permissible based on these examples.
    
    **Examples:**
    <Examples>
    {examples}
    </Examples>
    **User Query:**
    <UserQuery>
    {user_query}
    </UserQuery>
  user_message: |
    <User>
    {user}
    </User>
  success_message: |
    <Success>
    {success}
    </Success>
  reason_message: |
    <Reason>
    {reason}
    </Reason>
  success: |
    true if the user query is permitted, false if the request is not allowed.
  reason: |
    Justification for the decision made.
  docstring: |
    Data model for the decision on whether the request is acceptable or not.

  
