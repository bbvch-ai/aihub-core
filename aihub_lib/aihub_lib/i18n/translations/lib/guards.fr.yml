agent_description_guard:
  prompt: |
    La description d'un agent est la suivante :
    <Description de l'agent>
    {agent_description}
    </Description de l'agent>
    L'agent peut avoir accès à des sources d'informations supplémentaires qui pourraient l'aider à répondre à la question.
    Décidez si la question posée par l'utilisateur dans le cadre de la conversation doit être adressée à cet agent. Autorisez toutes les questions qui
    pourraient potentiellement relever du domaine de l'agent. Bloquez toutes les questions qui, de manière évidente,
    n'ont absolument rien à voir avec l'agent. En cas de doute, choisissez d'autoriser la question.
    <Question de l'utilisateur>
    {user_query}
    </Question de l'utilisateur>
    <Historique de la conversation>
    {history}
    </Historique de la conversation>
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Justification de la décision prise.
  success: |
    true si une réponse peut être donnée, false sinon
  docstring: |
    Modèle de données pour la décision concernant la possibilité de fournir une réponse.
few_shot_guard:
  prompt: |
    Vous recevrez plusieurs exemples montrant quelles demandes d'utilisateurs sont autorisées et lesquelles ne le sont pas. Chaque exemple de réponse se compose de deux clés :

    « success » : un booléen (vrai ou faux) indiquant si la demande est autorisée.
    « reasoning » : une chaîne de caractères contenant les raisons de cette décision.
    Important :
    Votre résultat final doit être exclusivement un objet JSON contenant exactement les deux clés « success » et « reasoning ». Ne répétez pas l'ensemble du schéma JSON et n'ajoutez pas de méta-informations supplémentaires.

    Votre tâche est de déterminer si une nouvelle requête utilisateur est autorisée en vous basant sur ces exemples.

    **Exemples :**
    <Examples>
    {examples}
    </Examples>

    **Requête utilisateur :**
    <UserQuery>
    {user_query}
    </UserQuery>
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  success_message: |
    <Agent>
    ```{ "success": {success},
  reason_message: |
    "reasoning": "{reason}" }```
    </Agent>
  success: |
    true si la requête utilisateur est autorisée, false si la requête n'est pas permise.
  reason: |
    Justification de la décision prise.
  docstring: |
    Modèle de données pour la décision concernant l'acceptabilité de la requête.

