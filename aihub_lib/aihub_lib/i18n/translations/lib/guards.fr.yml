agent_description_guard:
  prompt: |
    La description d'un agent est la suivante :
    <Description de l'agent>
    {agent_description}
    </Description de l'agent>
    L'agent peut avoir accès à des sources d'informations supplémentaires qui pourraient l'aider à répondre à la question.
    Décidez si la question posée par l'utilisateur dans le cadre de la conversation doit être adressée à cet agent. Autorisez toutes les questions qui
    pourraient potentiellement relever du domaine de l'agent. Bloquez toutes les questions qui, de manière évidente,
    n'ont absolument rien à voir avec l'agent. En cas de doute, choisissez d'autoriser la question.
    <Question de l'utilisateur>
    {user_query}
    </Question de l'utilisateur>
    <Historique de la conversation>
    {history}
    </Historique de la conversation>
    Votre résultat final doit être exclusivement un objet JSON contenant exactement les deux clés « success » et « reasoning ». Ne répétez pas l'ensemble du schéma JSON et n'ajoutez pas de méta-informations supplémentaires.
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Justification de la décision prise.
  success: |
    true si une réponse peut être donnée, false sinon
  docstring: |
    Modèle de données pour la décision concernant la possibilité de fournir une réponse.

few_shot_guard:
  prompt: |
    Vous recevrez plusieurs exemples montrant quelles demandes d'utilisateurs sont autorisées et lesquelles ne le sont pas. Chaque exemple de réponse se compose de deux clés :
    "success" : un booléen (vrai ou faux) indiquant si la demande est autorisée.
    "reasoning" : une chaîne de caractères contenant les raisons de cette décision.
    Important :
    Votre résultat final doit être exclusivement un objet JSON contenant exactement les deux clés « success » et « reasoning ». Ne répétez pas l'ensemble du schéma JSON et n'ajoutez pas de méta-informations supplémentaires.
    Votre tâche est de déterminer si une nouvelle requête utilisateur est autorisée en vous basant sur ces exemples.
    **Exemples :**
    <Examples>
    {examples}
    </Examples>
    **Requête utilisateur :**
    <UserQuery>
    {user_query}
    </UserQuery>
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  success_message: |
    <Agent>
    ```{ "success": {success},
  reason_message: |
    "reasoning": "{reason}" }```
    </Agent>
  success: |
    true si la requête utilisateur est autorisée, false si la requête n'est pas permise.
  reason: |
    Justification de la décision prise.
  docstring: |
    Modèle de données pour la décision concernant l'acceptabilité de la requête.

context_sufficient_guard:
  doc_string: |
    Résultat de l'évaluation visant à déterminer si le contexte est suffisant pour répondre à la requête de l'utilisateur.
  reason: |
    Raisonnement expliquant pourquoi le contexte est ou n'est pas suffisant.
  success: |
    true si le contexte est suffisant pour répondre à la requête de l'utilisateur, false s'il ne l'est pas.
  new_query: |
    Une requête révisée pour obtenir de meilleurs résultats de recherche si le contexte était insuffisant, assurez-vous de la différencier suffisamment des requêtes existantes. 
    des requêtes existantes.
  prompt: |
    Je vais vous donner un contexte, une question et les requêtes précédentes si elles ont été générées.
    Si le contexte fourni permet de répondre à la question, la conversation peut se poursuivre (success=True).
    Si le contexte ne permet pas de répondre à la question, la conversation doit être interrompue (success=False).
    Si success=False, vous devez générer une nouvelle requête qui sera utilisée pour recueillir plus d'informations. Lors de la création d'une nouvelle requête :
    1. DONNEZ LA PRIORITÉ AUX CONCEPTS DE HAUT NIVEAU : Votre stratégie principale doit consister à remonter les hiérarchies conceptuelles vers des domaines plus larges qui incluraient naturellement des informations sur le sujet d'origine.
       - Par exemple, si une requête sur les « réseaux neuronaux » ne donne pas de résultats suffisants, passez aux « méthodes d'apprentissage automatique » ou aux « modèles informatiques » au lieu de poser une question différente sur les réseaux neuronaux.
       - Si un sujet ne donne pas de résultats, réfléchissez au domaine académique, à l'industrie ou au domaine de connaissances auquel il appartient.
    2. Analysez les requêtes précédentes pour éviter les répétitions ou les variations mineures de la même question.
    3. Si des concepts de plus haut niveau ont déjà été explorés, essayez ces stratégies alternatives :
       - Examiner les domaines connexes qui recoupent le sujet principal
       - rechercher les concepts fondamentaux qui sous-tendent le sujet
       - Rechercher des informations sur la catégorie ou le système de classification d'origine
       - Demander des informations sur des principes technologiques ou scientifiques plus larges
       - Envisager des liens interdisciplinaires avec d'autres domaines
    4. La nouvelle requête DOIT être clairement distincte de toutes les requêtes précédentes et s'éloigner du sujet spécifique si les approches directes ont échoué.
    5. Chaque requête successive doit représenter un changement conceptuel plus important que les précédentes.
    Question:
      <Question>
      { user_query }
      </Question>
    Contexte:
      <Context>
      { context }
      </Context>
    Requêtes précédentes:
    <Previous_Queries>
    { prev_queries }
    <\Previous_Queries>
  reason_no_hops: |
    Raisonnement expliquant pourquoi le contexte est ou n'est pas suffisant (aucun saut supplémentaire disponible).
  success_no_hops: |
    true si le contexte est suffisant pour répondre à la requête de l'utilisateur, false s'il ne l'est pas (aucun saut supplémentaire disponible).
  docstring_no_hops: |
    Résultat de l'évaluation visant à déterminer si le contexte est suffisant pour répondre à la requête de l'utilisateur (aucun saut supplémentaire disponible).

sensitive_info_guard:
  prompt: |
    Vous êtes un gardien de sécurité responsable de la protection des informations confidentielles de l'entreprise. Votre tâche est d'analyser la réponse suivante et de déterminer si elle contient des informations sensibles qui ne devraient pas être partagées en externe.
    Recherchez :
    - Processus, procédures ou politiques internes de l'entreprise
    - Stratégies ou plans commerciaux confidentiels
    - Noms d'employés, adresses e-mail ou informations personnelles
    - Données financières, budgets ou informations de tarification
    - Spécifications techniques ou méthodes propriétaires
    - Données clients ou informations confidentielles de clients
    - Détails de systèmes internes, noms de serveurs ou informations d'infrastructure
    - Toute information marquée comme confidentielle ou réservée à un usage interne
    Si vous trouvez des informations sensibles, fournissez une version nettoyée de la réponse avec les parties sensibles supprimées ou généralisées.
    <Réponse à analyser>
    {answer}
    </Réponse à analyser>
    Votre sortie doit être un objet JSON avec exactement trois clés :
    - "success" : true si aucune information sensible n'a été trouvée, false si des informations sensibles ont été détectées
    - "reasoning" : explication de votre décision
    - "cleaned_answer" : si des informations sensibles ont été trouvées, fournissez une version nettoyée ; sinon null
  reason: |
    Explication indiquant si des informations sensibles ont été détectées et quelles actions ont été prises.
  success: |
    true si aucune information sensible n'a été trouvée, false si des informations sensibles ont été détectées et nettoyées.
  cleaned_answer: |
    La réponse révisée avec les informations sensibles supprimées ou expurgées, le cas échéant.
  docstring: |
    Résultat de l'analyse d'une réponse pour détecter des informations sensibles qui ne devraient pas être partagées en externe.

few_shot_example:
  user:
    label: Message utilisateur
    help: Un exemple de demande ou message utilisateur qui sera évalué.
  success:
    label: Accepter la demande
    help: Cochez si cet exemple doit être accepté, décochez s'il doit être rejeté.
  reason:
    label: Raison
    help: Explication de la raison pour laquelle la demande est acceptée ou rejetée.
