agent_description_guard:
  prompt: |
    La description d'un agent est la suivante :
    <Description de l'agent>
    {agent_description}
    </Description de l'agent>
    L'agent peut avoir accès à des sources d'informations supplémentaires qui pourraient l'aider à répondre à la question.
    Décidez si la question posée par l'utilisateur dans le cadre de la conversation doit être adressée à cet agent. Autorisez toutes les questions qui
    pourraient potentiellement relever du domaine de l'agent. Bloquez toutes les questions qui, de manière évidente,
    n'ont absolument rien à voir avec l'agent. En cas de doute, choisissez d'autoriser la question.
    <Question de l'utilisateur>
    {user_query}
    </Question de l'utilisateur>
    <Historique de la conversation>
    {history}
    </Historique de la conversation>
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Justification de la décision prise.
  success: |
    true si une réponse peut être donnée, false sinon
  docstring: |
    Modèle de données pour la décision concernant la possibilité de fournir une réponse.
few_shot_guard:
  prompt: |
    Vous recevrez plusieurs exemples montrant quelles demandes d'utilisateurs sont autorisées et lesquelles ne le sont pas. Chaque exemple de réponse se compose de deux clés :

    "success" : un booléen (vrai ou faux) indiquant si la demande est autorisée.
    "reasoning" : une chaîne de caractères contenant les raisons de cette décision.
    Important :
    Votre résultat final doit être exclusivement un objet JSON contenant exactement les deux clés « success » et « reasoning ». Ne répétez pas l'ensemble du schéma JSON et n'ajoutez pas de méta-informations supplémentaires.

    Votre tâche est de déterminer si une nouvelle requête utilisateur est autorisée en vous basant sur ces exemples.

    **Exemples :**
    <Examples>
    {examples}
    </Examples>

    **Requête utilisateur :**
    <UserQuery>
    {user_query}
    </UserQuery>
  user_message: |
    <Utilisateur>
    {user}
    </Utilisateur>
  success_message: |
    <Agent>
    ```{ "success": {success},
  reason_message: |
    "reasoning": "{reason}" }```
    </Agent>
  success: |
    true si la requête utilisateur est autorisée, false si la requête n'est pas permise.
  reason: |
    Justification de la décision prise.
  docstring: |
    Modèle de données pour la décision concernant l'acceptabilité de la requête.
context_sufficient_guard:
  doc_string: |
    Résultat de l'évaluation visant à déterminer si le contexte est suffisant pour répondre à la requête de l'utilisateur.
  reason: |
    Raisonnement expliquant pourquoi le contexte est ou n'est pas suffisant.
  success: |
    true si le contexte est suffisant pour répondre à la requête de l'utilisateur, false s'il ne l'est pas.
  new_query: |
    Une requête révisée pour obtenir de meilleurs résultats de recherche si le contexte était insuffisant, assurez-vous de la différencier suffisamment des requêtes existantes. 
    des requêtes existantes.
  prompt: |
    Je vais vous donner un contexte, une question et les requêtes précédentes si elles ont été générées.
    Si le contexte fourni permet de répondre à la question, la conversation peut se poursuivre (success=True).
    Si le contexte ne permet pas de répondre à la question, la conversation doit être interrompue (success=False).
    Tout d'abord, réfléchissez à la manière de prendre une décision, puis déterminez si la conversation peut être poursuivie avec succès ou non. 
    Ensuite, assurez-vous que votre nouvelle requête est suffisamment unique par rapport aux précédentes.
    
    Question :
    <Question>
    {user_query}
    </Question>
    Contexte :
    <Context>
    {context}
    </Context>
    Requêtes précédentes :
    <Previous_Queries>
    {prev_queries}
    <\Previous_Queries>
