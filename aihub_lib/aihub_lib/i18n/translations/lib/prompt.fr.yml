condenser:
  standalone_question: |
    <role_and_task>
    Vous êtes un expert en optimisation de requêtes de recherche.
    Votre tâche consiste à reformuler **le dernier message de l'utilisateur** de ce chat en une question totalement autonome.
    </role_and_task>

    <chat_history>
    {chat_history}
    </chat_history>

    <instructions>
    Le message de l'utilisateur contient du texte et éventuellement une image.
    1. **Résoudre le contexte de l'historique** : Remplacez les pronoms ou références qui font référence à des messages précédents dans l'historique du chat par les termes concrets de l'historique.
    2. **Références à l'image** : UNIQUEMENT si l'utilisateur fait explicitement référence à une image (par ex. "Qu'est-ce que **c'est** ?", "Que voyez-vous **ici** ?"), remplacez le pronom par une brève description de l'objet visible.
    3. **Ne pas ajouter de nouvelles informations** : N'ajoutez JAMAIS de détails qui ne sont pas présents dans la question originale. La question reformulée doit être sémantiquement équivalente à l'originale.
    4. **Sortie** : Ne donnez QUE la nouvelle phrase.
    </instructions>

rag:
  context_prompt: |
    {% chat role="user" %}
    Des informations contextuelles supplémentaires vous sont fournies sous la forme de documents structurés. Chaque document suit 
    un format cohérent, commençant par `<REFERENCE_DOCUMENT [metadata]>` et se terminant par `</REFERENCE_DOCUMENT>`. Ces documents contiennent des 
    détails essentiels qui doivent être utilisés pour comprendre et répondre avec précision à la requête de l’utilisateur.

    Chaque document comprend des métadonnées telles que la source, l’espace de noms, le type, la langue, la version et les 
    horodatages. Le contenu de ces documents fournit des informations précieuses pertinentes pour le contexte donné.

    Voici les documents pertinents :

    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>

    Instruction : Utilisez les informations des documents fournis pour générer une réponse détaillée et bien structurée 
    à la question de l'utilisateur.
    {% endchat %}

router:
  selection_option_index: Index of the selected option (0-based)
  reason: Detailed explanation of why this option is the most appropriate
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Select the most appropriate routing option based on the given instructions.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analyze the instructions carefully
    2. Compare against each option's selection criteria
    3. Choose exactly one option that best matches
    4. Provide the option index (0 to {{ routes|length - 1 }})
    5. Explain your reasoning in detail
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Determine whether the user's query can be fulfilled given the available chat history.
      
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      
      <user_query>
      {{ query }}
      </user_query>
      
      <fulfillment_criteria>
      <can_fulfill>
      A query CAN be fulfilled if ANY of the following are true:
      * All information required to fulfill the query is present in the chat history
      * No specific information is required to fulfill the query (e.g., summarizing already provided content)
      * The information required is trivial knowledge that most people would know (e.g., "the sky is blue")
      * There is no information in the chat history, but the query also does not require any specific information
      </can_fulfill>
      
      <cannot_fulfill>
      A query CANNOT be fulfilled if ANY of the following are true:
      * It explicitly asks for information not provided in the chat history and not trivially available
      * It requires a task that would need more knowledge than what is available in the context
      * The query can only be insufficiently or partially answered given the available context
      </cannot_fulfill>
      </fulfillment_criteria>
      
      Analyze the user query carefully in relation to the chat history. Determine whether the query can be fulfilled based on the criteria above. Provide a clear yes/no decision with detailed reasoning.

    expert_answer_sufficient: |
      La réponse de l'expert répond-elle à la question de l'utilisateur ?

      <expert_response>
      {% for message in chat_history %}
      {% if message.role.value == 'user' %}
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      </expert_response>

      <user_question>
      {{ query }}
      </user_question>

      La question EST répondue si l'expert a fourni des informations qui répondent directement à TOUTES les parties de ce qui a été demandé.
      La question n'est PAS répondue si :
      - L'expert dit explicitement qu'il ne sait pas ou refuse de répondre
      - La question comporte plusieurs parties et seules certaines ont été répondues

      Analysez soigneusement l'historique du chat par rapport à la question de l'utilisateur. Déterminez si l'expert a déjà suffisamment répondu à la question selon les critères ci-dessus. Fournissez une décision claire avec un raisonnement détaillé.

routing:
  topic_change:
    instructions: |
      Déterminez si la requête actuelle de l'utilisateur représente un changement de sujet par rapport à la conversation précédente.

      <current_query>
      %{current_query}
      </current_query>

      <current_knowledge_sources>
      L'utilisateur recherche actuellement dans ces sources de connaissances :
      %{current_sources}
      </current_knowledge_sources>

      <conversation_history>
      %{conversation_history}
      </conversation_history>

      <topic_change_criteria>
      Le sujet a CHANGÉ si :
      - La question porte sur un domaine fondamentalement différent
      - Les sources de connaissances actuelles ne seraient PAS pertinentes pour la nouvelle question
      - L'utilisateur pose une question complètement sans rapport avec l'historique de la conversation

      Le sujet n'a PAS changé si :
      - La question est une suite ou une clarification du sujet précédent
      - La question demande plus de détails sur quelque chose discuté auparavant
      - La question fait référence aux réponses précédentes (par ex. "qu'en est-il de...", "comment cela est-il lié à...")
      - La question est liée au même domaine
      - Les sources actuelles seraient toujours pertinentes
      </topic_change_criteria>

      Analysez soigneusement et déterminez l'option de routage la plus appropriée.

    no_previous_conversation: "Aucun contexte de conversation précédent disponible"
    topic_unchanged_reason: "Sujet inchangé - continuation avec les sources actuelles"
    topic_changed_reason: "Le sujet semble avoir changé"
    unchanged_instructions: "Sélectionnez cette option si le sujet est identique ou lié à la conversation précédente, y compris les questions de suivi, les clarifications ou les demandes de plus de détails. Les mêmes sources de connaissances doivent être utilisées."
    changed_instructions: "Sélectionnez cette option si le sujet a changé substantiellement et que différentes sources de connaissances pourraient être nécessaires."

summarizer:
  summarize: |
    Tâche : Résume le texte suivant sous forme de TL;DR :
    
    Directives :
      - Commence directement par les points ou idées essentiels, sans phrases introductives comme « Le texte explique… ».
      - Utilise des phrases courtes, claires et directes.
      - Concentre-toi uniquement sur les informations essentielles, en évitant les détails superflus ou les commentaires.
      - Énonce les idées principales directement, sans décrire le texte.
      - Veillez à rédiger votre résumé dans la MÊME langue que le <Texte>.
    
    Texte d’entrée : 
    <Text> 
      {text} 
    </Text>
    
    Résumé TL;DR :
figure_description_generator:
  context_string: |
    {% chat role="system" %}
    Vous êtes un expert dans la création de descriptions d'images de haute qualité pour l'accessibilité des documents.
    Votre tâche consiste à générer un texte alt détaillé pour les figures dans les documents qui :

    1. Décrit de manière concise le contenu visuel (images, graphiques, diagrammes, etc.)
    2. Capture l'information clé transmise par la figure
    3. Pour les graphiques et les diagrammes : description de la structure, identification des axes, des points de données et des tendances
    4. Pour les tableaux : description de la structure et résumé des principaux points de données
    5. Extraction de tout texte visible dans l'image, le cas échéant
    6. Utilise un langage technique approprié tout en restant accessible
    7. Évite toute verbosité ou spéculation inutile

    CRITIQUE : Décrivez UNIQUEMENT ce que vous voyez réellement dans l'image. Le texte environnant est fourni pour le contexte concernant la terminologie et la langue, mais vous ne devez JAMAIS supposer que l'image représente quelque chose mentionné dans le texte. Si le texte mentionne « un chat » mais que vous voyez un fruit, décrivez le fruit. Si vous ne pouvez pas identifier un objet avec certitude, décrivez ses propriétés visuelles (forme, couleur, texture) sans deviner ce qu'il représente.

    Formulez vos descriptions sous forme de paragraphes concis et factuels qui pourraient être utilisés directement comme texte alternatif.
    Concentrez-vous sur l'information et aidez le lecteur à comprendre ce qu'il ne peut pas voir.
    Rédigez votre réponse dans la MÊME langue que le texte de contexte et le texte de l'image.
    {% endchat %}

    {% chat role="user" %}
    Veuillez fournir une description détaillée et précise de cette image qui servirait de texte alt efficace. Rappel : décrivez uniquement ce que vous voyez réellement, pas ce que le texte environnant suggère.
    {% endchat %}