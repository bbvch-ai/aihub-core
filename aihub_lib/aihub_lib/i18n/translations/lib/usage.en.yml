  limit_detail: "%{current}/%{limit} per %{period} (%{scope})"
  resets_at: "Resets at %{time}"
  resets_tomorrow_at: "Resets tomorrow at %{time}"
  resets_on_weekday_at: "Resets on %{weekday} at %{time}"
  resets_on_date_at: "Resets on %{date} at %{time}"
