display_event:
  name: "Événement d'Affichage"
  description: "Un événement qui affiche des informations à l'utilisateur sans affecter le flux de travail."

aitl_exception_event:
  name: "Erreur de Délégation de Tâche"
  description: "Un autre agent à qui une tâche a été déléguée a signalé une erreur et n'a pas pu traiter la demande."

aitl_request_event:
  name: "Délégation de Tâche à un Autre Agent"
  description: "L'agent a transmis une tâche à un autre agent ou assistant pour bénéficier de ses connaissances spécialisées."

aitl_response_event:
  name: "Réponse de l'Agent Délégué"
  description: "L'autre agent a traité avec succès la tâche assignée et a renvoyé une réponse."

bitl_request_event:
  name: "Demande au Bot"
  description: "Une demande a été transmise à un bot spécialisé pour accomplir une tâche spécifique."

bitl_response_event:
  name: "Réponse du Bot"
  description: "Le bot spécialisé a traité la demande et a renvoyé une réponse."

limit_chat_history_event:
  name: "Historique de Chat Limité"
  description: "L'historique du chat a été raccourci pour des raisons d'efficacité, en ne conservant que les parties les plus pertinentes."

start_event:
  name: "Processus Démarré"
  description: "Un nouveau processus ou une nouvelle tâche a été initié."

stop_event:
  name: "Processus Terminé"
  description: "L'assistant a terminé sa tâche et rend le contrôle à l'utilisateur."

cost_event:
  name: "Aperçu des Coûts"
  description: "Un aperçu des coûts encourus pour les opérations effectuées."

llm_cost_event:
  name: "Coûts du Modèle de Langage"
  description: "Des coûts ont été encourus lors de l'interaction avec le modèle de langage, qui sont listés ici."

chunk_event:
  name: "Réponse Partielle"
  description: "L'assistant a généré une partie de la réponse et l'a envoyée à l'utilisateur, qui est déjà affichée."

thought_event:
  name: "Processus de Réflexion"
  description: "L'agent partage son processus de réflexion interne, ce qui l'aide à comprendre et à résoudre la tâche."

guard_rejection_event:
  name: "Demande Rejetée"
  description: "La demande a été rejetée pour des raisons de sécurité ou en raison de violations de politique."

hitl_request_event:
  name: "Demande à l'Utilisateur"
  description: "L'assistant a besoin d'informations supplémentaires de l'utilisateur pour poursuivre la tâche."

hitl_response_event:
  name: "Réponse de l'Utilisateur Reçue"
  description: "L'utilisateur a répondu à la demande, et l'assistant peut poursuivre la tâche."

router_event:
  name: "Chemin optimal choisi"
  description: "L'assistant a choisi le chemin optimal pour la suite."

semantic_agent_event:
  name: "Activité de l'Agent"
  description: "Un agent spécialisé effectue une tâche dans le cadre du processus global."

semantic_chain_event:
  name: "Actions Enchaînées"
  description: "Une série d'actions interconnectées est exécutée pour résoudre un problème complexe."

semantic_embedding_event:
  name: "Recherche d'Informations"
  description: "L'agent recherche dans sa base de connaissances des informations pertinentes pour répondre à la demande."

semantic_guard_event:
  name: "Vérification de Sécurité"
  description: "La demande est vérifiée pour la sécurité et la conformité aux politiques."

semantic_llm_event:
  name: "Interaction avec le Modèle de Langage"
  description: "Une interaction avec le modèle de langage a été effectuée pour traiter ou générer des informations."

semantic_llm_stop_event:
  name: "Interaction avec le Modèle de Langage Terminée"
  description: "L'interaction avec le modèle de langage a été terminée."

semantic_reranker_event:
  name: "Optimisation de la Pertinence"
  description: "Les documents trouvés sont triés par pertinence pour sélectionner les informations les plus appropriées pour la tâche."

semantic_retriever_event:
  name: "Documents Trouvés"
  description: "L'assistant a trouvé des documents pertinents qui pourraient être utiles dans le traitement de la tâche."

semantic_tool_event:
  name: "Utilisation d'Outil"
  description: "L'agent utilise un outil spécialisé pour accomplir une tâche spécifique plus efficacement."

user_message_event:
  name: "Demande de l'Utilisateur"
  description: "L'assistant a reçu un message de l'utilisateur et le traite, en tenant compte de l'historique de chat précédent."
