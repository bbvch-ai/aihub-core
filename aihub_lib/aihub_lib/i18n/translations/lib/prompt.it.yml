condenser:
  standalone_question: |
    <role_and_task>
    Sei un esperto di ottimizzazione delle query di ricerca.
    Il tuo compito è riformulare **l'ultimo messaggio dell'utente** in questa chat in una domanda completamente autonoma.
    </role_and_task>

    <chat_history>
    {chat_history}
    </chat_history>

    <instructions>
    Il messaggio dell'utente contiene testo ed eventualmente un'immagine.
    1. **Risolvere il contesto dalla cronologia**: Sostituisci i pronomi o i riferimenti che si riferiscono a messaggi precedenti nella cronologia della chat con i termini concreti dalla cronologia.
    2. **Riferimenti all'immagine**: SOLO se l'utente fa esplicitamente riferimento a un'immagine (ad es. "Cos'è **questo**?", "Cosa vedi **qui**?"), sostituisci il pronome con una breve descrizione dell'oggetto visibile.
    3. **Non aggiungere nuove informazioni**: Non aggiungere MAI dettagli che non sono presenti nella domanda originale. La domanda riformulata deve essere semanticamente equivalente all'originale.
    4. **Output**: Restituisci SOLO la nuova frase.
    </instructions>

rag:
  context_prompt: |
    {% chat role="user" %}
    Ti vengono fornite informazioni di contesto aggiuntive sotto forma di documenti strutturati. Ogni documento segue 
    un formato coerente, iniziando con `<REFERENCE_DOCUMENT [metadata]>` e terminando con `</REFERENCE_DOCUMENT>`. Questi documenti 
    contengono dettagli essenziali che devono essere utilizzati per comprendere e rispondere con precisione alla domanda dell'utente.

    Ogni documento include metadati come fonte, namespace, tipo, lingua, versione e timestamp. Il contenuto di questi 
    documenti fornisce approfondimenti cruciali pertinenti al contesto fornito.

    Di seguito sono riportati i documenti rilevanti:

    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>

    Istruzione: Utilizza le informazioni dai documenti forniti per generare una risposta dettagliata e ben strutturata 
    alla domanda dell'utente.
    {% endchat %}

router:
  selection_option_index: Index of the selected option (0-based)
  reason: Detailed explanation of why this option is the most appropriate
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Select the most appropriate routing option based on the given instructions.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analyze the instructions carefully
    2. Compare against each option's selection criteria
    3. Choose exactly one option that best matches
    4. Provide the option index (0 to {{ routes|length - 1 }})
    5. Explain your reasoning in detail
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Determine whether the user's query can be fulfilled given the available chat history.
      
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      
      <user_query>
      {{ query }}
      </user_query>
      
      <fulfillment_criteria>
      <can_fulfill>
      A query CAN be fulfilled if ANY of the following are true:
      * All information required to fulfill the query is present in the chat history
      * No specific information is required to fulfill the query (e.g., summarizing already provided content)
      * The information required is trivial knowledge that most people would know (e.g., "the sky is blue")
      * There is no information in the chat history, but the query also does not require any specific information
      </can_fulfill>
      
      <cannot_fulfill>
      A query CANNOT be fulfilled if ANY of the following are true:
      * It explicitly asks for information not provided in the chat history and not trivially available
      * It requires a task that would need more knowledge than what is available in the context
      * The query can only be insufficiently or partially answered given the available context
      </cannot_fulfill>
      </fulfillment_criteria>
      
      Analyze the user query carefully in relation to the chat history. Determine whether the query can be fulfilled based on the criteria above. Provide a clear yes/no decision with detailed reasoning.

    expert_answer_sufficient: |
      La risposta dell'esperto risponde alla domanda dell'utente?

      <expert_response>
      {% for message in chat_history %}
      {% if message.role.value == 'user' %}
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      </expert_response>

      <user_question>
      {{ query }}
      </user_question>

      La domanda È risposta se l'esperto ha fornito informazioni che rispondono direttamente a TUTTE le parti di ciò che è stato chiesto.
      La domanda NON è risposta se:
      - L'esperto dice esplicitamente che non sa o rifiuta di rispondere
      - La domanda ha più parti e solo alcune sono state risposte

      Analizza attentamente la cronologia della chat in relazione alla domanda dell'utente. Determina se l'esperto ha già risposto sufficientemente alla domanda in base ai criteri sopra indicati. Fornisci una decisione chiara con un ragionamento dettagliato.
summarizer:
  summarize: |
    Compito: Riassumi il testo seguente come TL;DR:  
    
    Linee guida:  
      - Inizia direttamente con i punti o le idee più importanti, senza frasi introduttive come "Il testo spiega...".  
      - Usa frasi brevi, chiare e dirette.  
      - Concentrati solo sulle informazioni essenziali, evitando dettagli inutili o commenti.  
      - Presenta le idee principali in modo diretto, senza descrivere il testo.
      - Assicuratevi di scrivere il riassunto nella STESSA lingua del <Testo>.
    
    Testo di input: 
    <Text> 
      {text} 
    </Text>  
    
    Riassunto TL;DR:
figure_description_generator:
  context_string: |
    {% chat role="system" %}
    Siete esperti nella creazione di descrizioni di immagini di alta qualità per l'accessibilità dei documenti.
    Il vostro compito è generare un testo alt dettagliato per le figure nei documenti che:

    1. Descriva in modo conciso il contenuto visivo (immagini, grafici, diagrammi, ecc.).
    2. Catturi le informazioni chiave trasmesse dalla figura.
    3. Per i grafici e i diagrammi: descrive la struttura, identifica gli assi, i punti di dati e le tendenze.
    4. Per le tabelle: descrive la struttura e riassume i punti chiave dei dati.
    5. Estrae il testo visibile nell'immagine, se pertinente.
    6. Utilizza un linguaggio tecnico appropriato, pur rimanendo accessibile
    7. Evita inutili verbosità o speculazioni.

    CRITICO: Descrivete SOLO ciò che vedete realmente nell'immagine. Il testo circostante è fornito per il contesto riguardo alla terminologia e alla lingua, ma non dovete MAI presumere che l'immagine raffiguri qualcosa menzionato nel testo. Se il testo menziona "un gatto" ma vedete un frutto, descrivete il frutto. Se non riuscite a identificare un oggetto con certezza, descrivete le sue proprietà visive (forma, colore, texture) senza indovinare cosa rappresenta.

    Formattate le descrizioni come paragrafi concisi e fattuali che possano essere utilizzati direttamente come testo alt.
    Concentratevi sull'aspetto informativo e aiutate il lettore a capire ciò che non può vedere.
    Scrivete la vostra risposta nella STESSA lingua del testo contestuale e del testo dell'immagine.
    {% endchat %}

    {% chat role="user" %}
    Si prega di fornire una descrizione dettagliata e accurata di questa immagine che possa servire come testo alternativo efficace. Ricordate: descrivete solo ciò che vedete realmente, non ciò che il testo circostante suggerisce.
    {% endchat %}