condenser:
  standalone_question: |
    Given the following conversation between a user and an AI assistant, along with a follow-up question from the user, 
    rephrase the follow-up question into a fully standalone question that retains the original context.

    <chat_history>
    {chat_history}
    </chat_history>
    
    <user_query>
    {question}
    </user_question>
    
    Standalone question:

rag:
  context_prompt: |
    {% chat role="user" %}
    You are provided with additional context information in the form of structured documents. Each document follows a 
    consistent format, beginning with `<REFERENCE_DOCUMENT [metadata]>` and ending with `</REFERENCE_DOCUMENT>`. These documents contain 
    essential details that should be utilized to accurately understand and respond to the user’s query.

    Each document includes metadata such as source, namespace, type, language, version, and timestamps. The content 
    within these documents provides crucial insights relevant to the given context.

    Below are the relevant documents:

    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>

    Instruction: Using the information from the provided documents, generate a detailed and well-structured response 
    to the user’s question.
    {% endchat %}

router:
  selection_option_index: Index of the selected option (0-based)
  reason: Detailed explanation of why this option is the most appropriate
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Select the most appropriate routing option based on the given instructions.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analyze the instructions carefully
    2. Compare against each option's selection criteria
    3. Choose exactly one option that best matches
    4. Provide the option index (0 to {{ routes|length - 1 }})
    5. Explain your reasoning in detail
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Determine whether the user's query can be fulfilled given the available chat history.
      
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      
      <user_query>
      {{ query }}
      </user_query>
      
      <fulfillment_criteria>
      <can_fulfill>
      A query CAN be fulfilled if ANY of the following are true:
      * All information required to fulfill the query is present in the chat history
      * No specific information is required to fulfill the query (e.g., summarizing already provided content)
      * The information required is trivial knowledge that most people would know (e.g., "the sky is blue")
      * There is no information in the chat history, but the query also does not require any specific information
      </can_fulfill>
      
      <cannot_fulfill>
      A query CANNOT be fulfilled if ANY of the following are true:
      * It explicitly asks for information not provided in the chat history and not trivially available
      * It requires a task that would need more knowledge than what is available in the context
      * The query can only be insufficiently or partially answered given the available context
      </cannot_fulfill>
      </fulfillment_criteria>
      
      Analyze the user query carefully in relation to the chat history. Determine whether the query can be fulfilled based on the criteria above. Provide a clear yes/no decision with detailed reasoning.

    expert_answer_sufficient: |
      Does the expert's response answer the user's question?

      <expert_response>
      {{ expert_response }}
      </expert_response>

      <user_question>
      {{ query }}
      </user_question>

      The question IS answered if the expert provided information that directly responds to ALL parts of what was asked.
      The question is NOT answered if:
      - The expert explicitly says they don't know or refuses to answer
      - The question has multiple parts and only some were answered

      Analyze the expert's response carefully in relation to the user's question. Determine whether the expert has sufficiently answered the question based on the criteria above. Provide a clear decision with detailed reasoning.
summarizer:
  summarize: |
    Task: Summarize the following text as a TL;DR:
    
    Guidelines:
      - Begin with the most critical points or ideas immediately, without introductory phrases like "The text explains..."
      - Use brief, clear, and straightforward sentences.
      - Focus only on the most essential information, avoiding unnecessary detail or commentary.
      - Write as if directly stating the key takeaways, not describing the text itself.
      - Make sure to write your summary in the SAME language as the <Text>.
    Input Text:
    <Text>
      {text} 
    </Text>
    
    TL;DR Summary:
figure_description_generator:
  context_string: |
    {% chat role="system" %}
    You are an expert at creating high-quality image descriptions for document accessibility.
    Your task is to generate detailed alt text for figures in documents that:

    1. Concisely describes the visual content (images, charts, diagrams, etc.)
    2. Captures the key information being conveyed by the figure
    3. For charts and diagrams: describes the structure, identifies axes, data points, and trends
    4. For tables: describes the structure and summarizes key data points
    5. Extracts any visible text in the image when relevant
    6. Uses appropriate technical language while remaining accessible
    7. Avoids unnecessary verbosity or speculation

    CRITICAL: Describe ONLY what you actually see in the image. The surrounding text is provided for context about terminology and language, but you must NEVER assume the image depicts something mentioned in the text. If the text mentions "a cat" but you see a fruit, describe the fruit. If you cannot identify an object with certainty, describe its visual properties (shape, color, texture) without guessing what it represents.

    Format your descriptions as concise, factual paragraphs that could be used directly as alt text.
    Focus on being informative and helping the reader understand what they can't see.
    Write your reply in the SAME language as the context text and image text.
    {% endchat %}

    {% chat role="user" %}
    Please provide a detailed, accurate description of this image that would serve as effective alt text. Remember: describe only what you actually see, not what the surrounding text suggests should be there.
    {% endchat %}