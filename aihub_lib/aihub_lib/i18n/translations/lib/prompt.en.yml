condenser:
  standalone_question: |
    Given the following conversation between a user and an AI assistant, along with a follow-up question from the user, 
    rephrase the follow-up question into a fully standalone question that retains the original context.

    <chat_history>
    {chat_history}
    </chat_history>
    
    <user_query>
    {question}
    </user_question>
    
    Standalone question:

rag:
  context_prompt: |
    You are provided with additional context information in the form of structured documents. Each document follows a 
    consistent format, beginning with `<DOCUMENT [metadata]>` and ending with `</DOCUMENT>`. These documents contain 
    essential details that should be utilized to accurately understand and respond to the user’s query.

    Each document includes metadata such as source, namespace, type, language, version, and timestamps. The content 
    within these documents provides crucial insights relevant to the given context.

    Below are the relevant documents:

    <context_documents>
    {context_str}
    </context_documents>

    Instruction: Using the information from the provided documents, generate a detailed and well-structured response 
    to the user’s question.

router:
  selection_option_index: Index of the selected option (0-based)
  reason: Detailed explanation of why this option is the most appropriate
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Select the most appropriate routing option based on the given instructions.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analyze the instructions carefully
    2. Compare against each option's selection criteria
    3. Choose exactly one option that best matches
    4. Provide the option index (0 to {{ routes|length - 1 }})
    5. Explain your reasoning in detail
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Determine whether the user's query can be fulfilled given the available chat history.
  
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
  
      <user_query>
      {{ query }}
      </user_query>
  
      <fulfillment_criteria>
      <can_fulfill>
      A query CAN be fulfilled if ANY of the following are true:
      * All information required to fulfill the query is present in the chat history
      * No specific information is required to fulfill the query (e.g., summarizing already provided content)
      * The information required is trivial knowledge that most people would know (e.g., "the sky is blue")
      * There is no information in the chat history, but the query also does not require any specific information
      </can_fulfill>
  
      <cannot_fulfill>
      A query CANNOT be fulfilled if ANY of the following are true:
      * It explicitly asks for information not provided in the chat history and not trivially available
      * It requires a task that would need more knowledge than what is available in the context
      * The query can only be insufficiently or partially answered given the available context
      </cannot_fulfill>
      </fulfillment_criteria>
  
      Analyze the user query carefully in relation to the chat history. Determine whether the query can be fulfilled based on the criteria above. Provide a clear yes/no decision with detailed reasoning.

    expert_answer_sufficient: |
      You are given a chat history between an AI assistant and an expert. The goal of this conversation
      is to answer a question originaly posed by a user. Determine whether the expert has already sufficiently
      answered the question based on the chat history.

       <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>

      <user_query>
      %{question}
      </user_query>

      <answered_criteria>
      <is_answered>
      A question is considered answered if ANY of the following are true:
      * The expert has provided a complete and accurate answer to the user's question
      * The expert has provided a partial answer, but the user can still understand the main points
      * The expert has indicated where the answer can be found
      * The expert has provided context information, maybe in the systme message, that - directly or indirectly - answer the question
      </is_answered>
      <is_not_answered>
      A question is considered not answered if ANY of the following are true:
      * The expert has not provided any answer to the user's question
      * The expert has provided an answer, but it is incomplete or inaccurate
      * The expert has provided an answer, but it is not relevant to the user's question
      * The expert has provided an answer, but it is not clear or understandable
      * The expert indicates that they do not know the answer
      </is_not_answered>
      </answered_criteria>

      Analyze the chat history carefully in relation to the user's question. Determine whether the expert has already sufficiently answered the question based on the criteria above. Provide a clear decision with detailed reasoning.