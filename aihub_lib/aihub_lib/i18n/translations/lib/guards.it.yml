common:
  user_message: |
    <Utente>
    {user}
    </Utente>
  agent_message: |
    <Agente>
    {agent}
    </Agente>
  reason: |
    Motivazione della decisione presa.
  success: |
    true se la risposta può essere fornita, false altrimenti
  docstring: |
    Modello di dati per la decisione se è possibile fornire una risposta.
agent_description_guard:
  prompt: |
    La descrizione di un agente è la seguente:
    <DescrizioneAgente>
    {agent_description}
    </DescrizioneAgente>
    L'agente potrebbe avere accesso a ulteriori fonti di informazione che possono aiutarlo a rispondere alla domanda.
    Decidi se la domanda posta dall'utente nel contesto della conversazione debba essere indirizzata a questo agente.
    Permetti tutte le domande che potrebbero rientrare nell'ambito di competenza dell'agente. Blocca tutte le domande
    che chiaramente non hanno nulla a che fare con l'agente. In caso di dubbio, scegli di consentire la domanda.
    <DomandaUtente>
    {user_query}
    </DomandaUtente>
    <CronologiaConversazionePrecedente>
    {history}
    </CronologiaConversazionePrecedente>
    DEVI utilizzare lo strumento fornito per inviare la tua risposta.
few_shot_guard:
  prompt: |
    Riceverete diversi esempi che mostrano quali richieste dell'utente sono consentite e quali no. Ogni risposta di esempio è composta da due chiavi:

    "success": un booleano (vero o falso) che indica se la richiesta è consentita.
    "reasoning": una stringa contenente la motivazione di questa decisione.

    Il tuo compito è determinare se una nuova richiesta dell'utente è consentita in base a questi esempi.

    **Esempi:**
    <Examples>
    {examples}
    </Examples>

    **Richiesta utente:**
    <UserQuery>
    {user_query}
    </UserQuery>

    DEVI utilizzare lo strumento fornito per inviare la tua risposta.
  user_message: |
    <Utente>
    {user}
    </Utente>
  success_message: |
    <Agente>
    ```{ "success": {success},
  reason_message: |
    "reasoning": "{reason}" }```
    </Agente>
  success: |
    true se la richiesta dell'utente è consentita, false se la richiesta non è permessa.
  reason: |
    Giustificazione della decisione presa.
  docstring: |
    Modello di dati per la decisione sull'accettabilità della richiesta.
context_sufficient_guard:
  doc_string: |
    Risultato della valutazione se il contesto è sufficiente per rispondere alla domanda dell'utente.
  reason: |
    Motivo che spiega perché il contesto è o non è sufficiente.
  success: |
    true se il contesto è sufficiente per rispondere alla domanda dell'utente, false se non lo è.
  new_query: |
    Una query rielaborata per ottenere risultati di ricerca migliori se il contesto era insufficiente, assicurarsi di differenziarla abbastanza 
    dalle query esistenti.
  prompt: |
    Fornirò un contesto, una domanda e le query precedenti, se sono state generate.
    Se è possibile rispondere alla domanda con il contesto fornito, la conversazione può continuare (success=True).
    Se non è possibile rispondere alla domanda con il contesto, la conversazione deve essere interrotta (success=False).

    Quando success=False, è necessario generare una nuova query che verrà utilizzata per raccogliere ulteriori informazioni. Quando si crea una nuova query:

    1. DARE PRIORITÀ AI CONCETTI DI LIVELLO SUPERIORE: La strategia principale dovrebbe essere quella di risalire le gerarchie concettuali verso domini più ampi che includano naturalmente informazioni sull'argomento originale.
       - Ad esempio, se la richiesta di "reti neurali" non produce risultati sufficienti, spostatevi su "metodi di apprendimento automatico" o "modelli computazionali" invece di chiedere le reti neurali in modo diverso.
       - Se un argomento non produce risultati, considerate il campo accademico, l'industria o il dominio di conoscenza a cui appartiene.

    2. Analizzate le query precedenti per evitare ripetizioni o piccole variazioni della stessa domanda.

    3. Se i concetti di livello superiore sono già stati esplorati, provate queste strategie alternative:
       - Esaminare i campi correlati che si intersecano con l'argomento principale.
       - Cercare i concetti fondamentali che stanno alla base dell'argomento
       - Cercare informazioni sulla categoria o sul sistema di classificazione di riferimento.
       - Richiedere informazioni su principi tecnologici o scientifici più ampi
       - Considerare collegamenti interdisciplinari con altri ambiti

    4. La nuova interrogazione DEVE essere chiaramente distinta da tutte le interrogazioni precedenti e allontanarsi dall'argomento specifico se gli approcci diretti hanno fallito.

    5. Ogni domanda successiva deve rappresentare un cambiamento concettuale più significativo di quelle precedenti.

    Domanda:
    <Domanda>
    {user_query}
    </Domanda>
    Contesto:
    <Contesto>
    {context}
    </Contesto>
    Quesiti precedenti:
    <Questioni_precedenti>
    {prev_queries}
    <Questioni_precedenti>

    DEVI utilizzare lo strumento fornito per inviare la tua risposta.
  reason_no_hops: |
    Motivo che spiega perché il contesto è o non è sufficiente (nessun salto aggiuntivo disponibile).
  success_no_hops: |
    true se il contesto è sufficiente per rispondere alla domanda dell'utente, false se non lo è (nessun salto aggiuntivo disponibile).
  docstring_no_hops: |
    Risultato della valutazione se il contesto è sufficiente per rispondere alla domanda dell'utente (nessun salto aggiuntivo disponibile).
sensitive_info_guard:
  prompt: |
    Sei una guardia di sicurezza responsabile della protezione delle informazioni sensibili dell'azienda. Il tuo compito è analizzare la seguente risposta e determinare se contiene informazioni sensibili che non dovrebbero essere condivise esternamente.

    Cerca:
    - Processi, procedure o politiche aziendali interne
    - Strategie o piani aziendali confidenziali
    - Nomi di dipendenti, indirizzi email o informazioni personali
    - Dati finanziari, budget o informazioni sui prezzi
    - Specifiche tecniche o metodi proprietari
    - Dati dei clienti o informazioni riservate sui clienti
    - Dettagli di sistemi interni, nomi di server o informazioni sull'infrastruttura
    - Qualsiasi informazione contrassegnata come confidenziale o solo per uso interno

    Se trovi informazioni sensibili, fornisci una versione pulita della risposta con le parti sensibili rimosse o generalizzate.

    <Risposta da analizzare>
    {answer}
    </Risposta da analizzare>

    DEVI utilizzare lo strumento fornito per inviare la tua risposta.
  reason: |
    Spiegazione se sono state rilevate informazioni sensibili e quali azioni sono state intraprese.
  success: |
    true se non sono state trovate informazioni sensibili, false se sono state rilevate informazioni sensibili e ripulite.
  cleaned_answer: |
    La risposta rivista con informazioni sensibili rimosse o censurate, se applicabile.
  docstring: |
    Risultato dell'analisi di una risposta per informazioni sensibili che non dovrebbero essere condivise esternamente.
