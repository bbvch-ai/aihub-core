decompose_chat_history:
  decompose_prompt: |
    Given the following conversation between a user and an AI assistant and a follow-up question from the user
    user, decompose this into multiple questions.

    <chat_history>
    {chat_history}
    </chat_history>
    
    <user_question>
    {question}
    </user_question>
    
    Several follow-up questions:

  decompose_result:
    questions: |
      A list of %{hops} questions that can be derived from the conversation.

    docstring: |
      Decompose the following conversation between a user and an AI assistant into several questions that can be
      used to search for relevant documents.