condenser:
  standalone_question: |
    <role_and_task>
    Du bist ein Experte für Suchanfragen-Optimierung.
    Deine Aufgabe ist es, **die letzte Nachricht des Benutzers** in diesem Chat in eine vollständig eigenständige Frage umzuformulieren.
    </role_and_task>

    <chat_history>
    {chat_history}
    </chat_history>

    <instructions>
    Die Nachricht des Benutzers enthält Text und eventuell ein Bild.
    1. **Kontext aus Verlauf auflösen**: Ersetze Pronomen oder Referenzen, die sich auf frühere Nachrichten im Chatverlauf beziehen, durch die konkreten Begriffe aus dem Verlauf.
    2. **Bild-Referenzen**: NUR wenn der Benutzer explizit auf ein Bild verweist (z.B. "Was ist **das**?", "Was siehst du **hier**?"), ersetze das Pronomen durch eine kurze Beschreibung des sichtbaren Objekts.
    3. **Keine neuen Informationen hinzufügen**: Füge NIEMALS Details hinzu, die nicht in der ursprünglichen Frage enthalten sind. Die umformulierte Frage muss semantisch äquivalent zur ursprünglichen sein.
    4. **Output**: Gib NUR den neuen Satz aus.
    </instructions>

rag:
  context_prompt: |
    {% chat role="user" %}
    Dir werden zusätzliche Kontextinformationen in Form von strukturierten Dokumenten bereitgestellt. 
    Jedes Dokument folgt einem einheitlichen Format, beginnend mit `<REFERENCE_DOCUMENT [metadata]>` und endend 
    mit `</REFERENCE_DOCUMENT>`. Diese Dokumente enthalten wichtige Details, die genutzt werden sollten, um die 
    Benutzeranfrage genau zu verstehen und zu beantworten.

    Jedes Dokument enthält Metadaten wie Quelle, Namespace, Typ, Sprache, Version und Zeitstempel. 
    Der Inhalt dieser Dokumente bietet wichtige Einblicke, die für den gegebenen Kontext relevant sind.

    Nachfolgend findest du die relevanten Dokumente:

    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>

    Anweisung: Nutze die Informationen aus den bereitgestellten Dokumenten, um eine detaillierte und 
    gut strukturierte Antwort auf die Benutzerfrage zu erstellen.
    {% endchat %}

router:
  selection_option_index: Index der ausgewählten Option (0-basiert)
  reason: Detaillierte Erklärung, warum diese Option am besten geeignet ist
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Wählen Sie die am besten geeignete Routing-Option basierend auf den gegebenen Anweisungen.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analysieren Sie die Anweisungen sorgfältig
    2. Vergleichen Sie mit den Auswahlkriterien jeder Option
    3. Wählen Sie genau eine Option, die am besten passt
    4. Geben Sie den Options-Index an (0 bis {{ routes|length - 1 }})
    5. Erklären Sie Ihre Begründung ausführlich
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Bestimmen Sie, ob die Anfrage des Benutzers anhand des verfügbaren Chat-Verlaufs erfüllt werden kann.
      
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      
      <user_query>
      {{ query }}
      </user_query>
      
      <fulfillment_criteria>
      <can_fulfill>
      Eine Anfrage KANN erfüllt werden, wenn EINER der folgenden Punkte zutrifft:
      * Alle Informationen, die zur Erfüllung der Anfrage erforderlich sind, sind im Chat-Verlauf vorhanden
      * Es sind keine spezifischen Informationen erforderlich, um die Anfrage zu erfüllen (z.B. Zusammenfassung bereits bereitgestellter Inhalte)
      * Die erforderlichen Informationen sind triviales Wissen, das die meisten Menschen kennen würden (z.B. "der Himmel ist blau")
      * Es gibt keine Informationen im Chat-Verlauf, aber die Anfrage erfordert auch keine spezifischen Informationen
      </can_fulfill>
      
      <cannot_fulfill>
      Eine Anfrage KANN NICHT erfüllt werden, wenn EINER der folgenden Punkte zutrifft:
      * Sie fragt explizit nach Informationen, die nicht im Chat-Verlauf vorhanden und nicht trivial verfügbar sind
      * Sie erfordert eine Aufgabe, die mehr Wissen benötigen würde, als im Kontext verfügbar ist
      * Die Anfrage kann aufgrund des verfügbaren Kontexts nur unzureichend oder teilweise beantwortet werden
      </cannot_fulfill>
      </fulfillment_criteria>
      
      Analysieren Sie die Benutzeranfrage sorgfältig in Bezug auf den Chat-Verlauf. Bestimmen Sie, ob die Anfrage basierend auf den oben genannten Kriterien erfüllt werden kann. Geben Sie eine klare Ja/Nein-Entscheidung mit detaillierter Begründung an.

    expert_answer_sufficient: |
      Beantwortet die Antwort des Experten die Frage des Benutzers?

      <expert_response>
      {% for message in chat_history %}
      {% if message.role.value == 'user' %}
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      </expert_response>

      <user_question>
      {{ query }}
      </user_question>

      Die Frage IST beantwortet, wenn der Experte Informationen geliefert hat, die direkt auf ALLE Teile des Gefragten eingehen.
      Die Frage ist NICHT beantwortet, wenn:
      - Der Experte ausdrücklich sagt, dass er es nicht weiss oder die Antwort verweigert
      - Die Frage mehrere Teile hat und nur einige beantwortet wurden

      Analysieren Sie den Chat-Verlauf sorgfältig in Bezug auf die Frage des Benutzers. Bestimmen Sie, ob der Experte die Frage basierend auf den oben genannten Kriterien bereits ausreichend beantwortet hat. Geben Sie eine klare Entscheidung mit detaillierter Begründung an.

routing:
  topic_change:
    instructions: |
      Bestimmen Sie, ob die aktuelle Anfrage des Benutzers einen Themenwechsel gegenüber der vorherigen Konversation darstellt.

      <current_query>
      %{current_query}
      </current_query>

      <current_knowledge_sources>
      Der Benutzer sucht derzeit in diesen Wissensquellen:
      %{current_sources}
      </current_knowledge_sources>

      <conversation_history>
      %{conversation_history}
      </conversation_history>

      <topic_change_criteria>
      Das Thema hat sich GEÄNDERT, wenn:
      - Die Frage ein grundlegend anderes Themengebiet betrifft
      - Die aktuellen Wissensquellen für die neue Frage NICHT relevant wären
      - Der Benutzer nach etwas fragt, das völlig unabhängig vom Gesprächsverlauf ist

      Das Thema hat sich NICHT geändert, wenn:
      - Die Frage eine Folgefrage oder Klärung zum vorherigen Thema ist
      - Die Frage nach mehr Details zu etwas fragt, das zuvor besprochen wurde
      - Die Frage auf frühere Antworten verweist (z.B. "was ist mit...", "wie hängt das zusammen mit...")
      - Die Frage zum gleichen Themenbereich gehört
      - Die aktuellen Quellen weiterhin relevant wären
      </topic_change_criteria>

      Analysieren Sie sorgfältig und bestimmen Sie die am besten geeignete Routing-Option.

    no_previous_conversation: "Kein vorheriger Konversationskontext verfügbar"
    topic_unchanged_reason: "Thema unverändert - fahre mit aktuellen Quellen fort"
    topic_changed_reason: "Thema scheint sich geändert zu haben"
    unchanged_instructions: "Wählen Sie diese Option, wenn das Thema gleich oder verwandt mit der vorherigen Konversation ist, einschliesslich Folgefragen, Klärungen oder Anfragen nach mehr Details. Die gleichen Wissensquellen sollten verwendet werden."
    changed_instructions: "Wählen Sie diese Option, wenn sich das Thema wesentlich geändert hat und andere Wissensquellen benötigt werden könnten."

summarizer:
  summarize: |
    Aufgabe: Fasse den folgenden Text als TL;DR zusammen:
    
    Richtlinien:
      - Starte direkt mit den entscheidenden Punkten oder Ideen, ohne einleitende Floskeln wie „Der Text erklärt …“.
      - Verwende kurze, prägnante und einfache Sätze.
      - Beschränke dich auf die essenziellen Informationen und lasse unwichtige Details oder Kommentare weg.
      - Formuliere die zentralen Aussagen direkt, ohne den Text zu beschreiben.
      - Achten Sie darauf, dass Sie Ihre Zusammenfassung in der GLEICHEN Sprache wie den <Text> schreiben.
    Eingabetext: 
    <Text> 
      {text}
    </Text>
    
    TL;DR-Zusammenfassung:
figure_description_generator:
  context_string: |
    {% chat role="system" %}
    Sie sind Experte für die Erstellung hochwertiger Bildbeschreibungen für barrierefreie Dokumente.
    Ihre Aufgabe ist es, detaillierte Alt-Texte für Abbildungen in Dokumenten zu erstellen, die:

    1. den visuellen Inhalt (Bilder, Tabellen, Diagramme, etc.) präzise beschreibt
    2. die wichtigsten Informationen, die durch die Abbildung vermittelt werden, aufgreift
    3. Bei Schaubildern und Diagrammen: Beschreibung der Struktur, Identifizierung von Achsen, Datenpunkten und Trends
    4. Für Tabellen: beschreibt die Struktur und fasst die wichtigsten Datenpunkte zusammen
    5. Extrahiert ggf. sichtbaren Text aus dem Bild
    6. Verwendet eine angemessene Fachsprache und bleibt dabei verständlich
    7. Vermeidet unnötige Ausführlichkeit oder Spekulationen

    WICHTIG: Beschreiben Sie NUR, was Sie tatsächlich im Bild sehen. Der umgebende Text dient lediglich als Kontext für Terminologie und Sprache, aber Sie dürfen NIEMALS annehmen, dass das Bild etwas darstellt, das im Text erwähnt wird. Wenn der Text "eine Katze" erwähnt, Sie aber eine Frucht sehen, beschreiben Sie die Frucht. Wenn Sie ein Objekt nicht sicher identifizieren können, beschreiben Sie seine visuellen Eigenschaften (Form, Farbe, Textur), ohne zu raten, was es darstellt.

    Formatieren Sie Ihre Beschreibungen als knappe, sachliche Absätze, die direkt als Alt-Text verwendet werden können.
    Konzentrieren Sie sich darauf, informativ zu sein und dem Leser zu helfen, zu verstehen, was er nicht sehen kann.
    Schreiben Sie Ihre Antwort in der GLEICHEN Sprache wie der Kontexttext und der Bildtext.
    {% endchat %}

    {% chat role="user" %}
    Bitte geben Sie eine detaillierte, genaue Beschreibung dieses Bildes an, die als effektiver Alt-Text dienen kann. Denken Sie daran: Beschreiben Sie nur, was Sie tatsächlich sehen, nicht das, was der umgebende Text vermuten lässt.
    {% endchat %}