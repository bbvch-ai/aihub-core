condenser:
  standalone_question: |
    <role_and_task>
    Du bist ein Experte für Suchanfragen-Optimierung. 
    Deine Aufgabe ist es, **die letzte Nachricht des Benutzers** in diesem Chat in eine vollständig eigenständige Frage umzuformulieren.
    </role_and_task>
  
    <chat_history>
    {chat_history}
    </chat_history>
  
    <instructions>
    Die Nachricht des Benutzers enthält Text und eventuell ein Bild.
    1. **Bild-Analyse**: Bezieht sich der Benutzer auf das Bild (z.B. "Was ist **das**?"), ersetze das Pronomen durch eine präzise textuelle Beschreibung des sichtbaren Objekts.
    2. **Unabhängigkeit**: Formuliere den Satz so um, dass er ohne das Bild und ohne den Verlauf verständlich ist.
    3. **Output**: Gib NUR den neuen Satz aus.
    </instructions>

rag:
  context_prompt: |
    {% chat role="user" %}
    Dir werden zusätzliche Kontextinformationen in Form von strukturierten Dokumenten bereitgestellt. 
    Jedes Dokument folgt einem einheitlichen Format, beginnend mit `<REFERENCE_DOCUMENT [metadata]>` und endend 
    mit `</REFERENCE_DOCUMENT>`. Diese Dokumente enthalten wichtige Details, die genutzt werden sollten, um die 
    Benutzeranfrage genau zu verstehen und zu beantworten.

    Jedes Dokument enthält Metadaten wie Quelle, Namespace, Typ, Sprache, Version und Zeitstempel. 
    Der Inhalt dieser Dokumente bietet wichtige Einblicke, die für den gegebenen Kontext relevant sind.

    Nachfolgend findest du die relevanten Dokumente:

    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>

    Anweisung: Nutze die Informationen aus den bereitgestellten Dokumenten, um eine detaillierte und 
    gut strukturierte Antwort auf die Benutzerfrage zu erstellen.
    {% endchat %}

router:
  selection_option_index: Index der ausgewählten Option (0-basiert)
  reason: Detaillierte Erklärung, warum diese Option am besten geeignet ist
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Wählen Sie die am besten geeignete Routing-Option basierend auf den gegebenen Anweisungen.
    </task>

    <instructions>
    {{ instructions }}
    </instructions>

    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>

    <selection_requirements>
    1. Analysieren Sie die Anweisungen sorgfältig
    2. Vergleichen Sie mit den Auswahlkriterien jeder Option
    3. Wählen Sie genau eine Option, die am besten passt
    4. Geben Sie den Options-Index an (0 bis {{ routes|length - 1 }})
    5. Erklären Sie Ihre Begründung ausführlich
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Bestimmen Sie, ob die Anfrage des Benutzers anhand des verfügbaren Chat-Verlaufs erfüllt werden kann.
      
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      
      <user_query>
      {{ query }}
      </user_query>
      
      <fulfillment_criteria>
      <can_fulfill>
      Eine Anfrage KANN erfüllt werden, wenn EINER der folgenden Punkte zutrifft:
      * Alle Informationen, die zur Erfüllung der Anfrage erforderlich sind, sind im Chat-Verlauf vorhanden
      * Es sind keine spezifischen Informationen erforderlich, um die Anfrage zu erfüllen (z.B. Zusammenfassung bereits bereitgestellter Inhalte)
      * Die erforderlichen Informationen sind triviales Wissen, das die meisten Menschen kennen würden (z.B. "der Himmel ist blau")
      * Es gibt keine Informationen im Chat-Verlauf, aber die Anfrage erfordert auch keine spezifischen Informationen
      </can_fulfill>
      
      <cannot_fulfill>
      Eine Anfrage KANN NICHT erfüllt werden, wenn EINER der folgenden Punkte zutrifft:
      * Sie fragt explizit nach Informationen, die nicht im Chat-Verlauf vorhanden und nicht trivial verfügbar sind
      * Sie erfordert eine Aufgabe, die mehr Wissen benötigen würde, als im Kontext verfügbar ist
      * Die Anfrage kann aufgrund des verfügbaren Kontexts nur unzureichend oder teilweise beantwortet werden
      </cannot_fulfill>
      </fulfillment_criteria>
      
      Analysieren Sie die Benutzeranfrage sorgfältig in Bezug auf den Chat-Verlauf. Bestimmen Sie, ob die Anfrage basierend auf den oben genannten Kriterien erfüllt werden kann. Geben Sie eine klare Ja/Nein-Entscheidung mit detaillierter Begründung an.

    expert_answer_sufficient: |
      Beantwortet die Antwort des Experten die Frage des Benutzers?

      <expert_response>
      {% for message in chat_history %}
      {% if message.role.value == 'user' %}
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      </expert_response>

      <user_question>
      {{ query }}
      </user_question>

      Die Frage IST beantwortet, wenn der Experte Informationen geliefert hat, die direkt auf ALLE Teile des Gefragten eingehen.
      Die Frage ist NICHT beantwortet, wenn:
      - Der Experte ausdrücklich sagt, dass er es nicht weiss oder die Antwort verweigert
      - Die Frage mehrere Teile hat und nur einige beantwortet wurden

      Analysieren Sie den Chat-Verlauf sorgfältig in Bezug auf die Frage des Benutzers. Bestimmen Sie, ob der Experte die Frage basierend auf den oben genannten Kriterien bereits ausreichend beantwortet hat. Geben Sie eine klare Entscheidung mit detaillierter Begründung an.

memory:
  user_memory_system_message: |
    <user_context>
    ## Benutzerspeicher-Kontext

    **Aktuelle Benutzerinformationen:**
    - Benutzer-ID: {{ user.id }}
    - Name: {{ user.name }}
    - E-Mail: {{ user.email }}

    Die folgenden Informationen wurden aus **den vergangenen Gesprächen dieses spezifischen Benutzers** mit Ihnen gelernt. Dies sind persönliche Präferenzen, Arbeitskontext und Verhaltensmuster, die spezifisch für diesen Benutzer sind.

    **Wichtige Richtlinien:**
    - Diese Erinnerungen sind **optionaler Kontext** - verwenden Sie sie nur, wenn sie für die aktuelle Anfrage relevant sind
    - **Erzwingen Sie NICHT**, dass diese Erinnerungen in Ihre Antwort einfließen, wenn sie nicht natürlich passen
    - Der Benutzer hat möglicherweise vergessen, diese Informationen geteilt zu haben, oder sie sind möglicherweise veraltet
    - Wenn eine Erinnerung dem aktuellen Gespräch widerspricht, priorisieren Sie den aktuellen Kontext
    - Sie sind **nicht verpflichtet**, diese Erinnerungen zu erwähnen oder anzuerkennen, es sei denn, sie bieten Mehrwert

    {% if memories %}
    **Benutzerspezifische Fakten:**
    {% for memory in memories %}
    - {{ memory.memory }}
    {% endfor %}
    {% endif %}
    {% if relations %}

    **Wissensgraph-Beziehungen:**
    {% for relation in relations %}
    - {{ relation.source }} {{ relation.relation }} {{ relation.target }}
    {% endfor %}
    {% endif %}
    </user_context>

  organization_memory_system_message: |
    <organizational_context>
    ## Organisationsspeicher-Kontext

    Die folgenden Informationen stellen **explizite Fakten über die Organisation** (Richtlinien, Tech-Stack, Prozesse, Konventionen) dar, die von allen Benutzern in dieser Organisation geteilt werden.

    **Wichtige Richtlinien:**
    - Diese Erinnerungen sind **optionaler Kontext** - verwenden Sie sie nur, wenn sie für die aktuelle Anfrage relevant sind
    - **Erzwingen Sie NICHT**, dass organisatorische Fakten in Ihre Antwort einfließen, wenn sie nicht natürlich passen
    - Dies sind allgemeine organisatorische Fakten und gelten möglicherweise nicht für jedes Team oder jede Person
    - Wenn Organisationsspeicher benutzerspezifischen Informationen widerspricht, berücksichtigen Sie beide Kontexte
    - Sie sind **nicht verpflichtet**, diese Erinnerungen zu erwähnen oder anzuerkennen, es sei denn, sie bieten Mehrwert

    {% if memories %}
    **Organisatorische Fakten:**
    {% for memory in memories %}
    - {{ memory.memory }}
    {% endfor %}
    {% endif %}
    {% if relations %}

    **Wissensgraph-Beziehungen:**
    {% for relation in relations %}
    - {{ relation.source }} {{ relation.relation }} {{ relation.target }}
    {% endfor %}
    {% endif %}
    </organizational_context>

  system_message: |
    <user_context>
    {% if memories %}
    Die folgenden Informationen über den Benutzer wurden aus vorherigen Gesprächen gelernt:
    {% for memory in memories %}
    - {{ memory.memory }}
    {% endfor %}
    {% endif %}
    {% if relations %}

    Wissensgraph-Beziehungen:
    {% for relation in relations %}
    - {{ relation.source }} {{ relation.relation }} {{ relation.target }}
    {% endfor %}
    {% endif %}
    </user_context>
  fact_extraction: |
    Du bist ein spezialisierter Assistent zur Gedächtnisextraktion für den %{agent_name}-Agenten.
    
    ## Agentenkontext
    - **Agentenname:** %{agent_name}
    - **Agentenzweck:** %{agent_description}
    - **Aktuelles Datum:** %{current_date}
    
    ## Deine Aufgabe
    Extrahiere relevante Fakten über den BENUTZER aus Gesprächen zwischen dem Benutzer und dem %{agent_name}.
    Diese Fakten werden im Gedächtnis gespeichert und später abgerufen, wenn derselbe Benutzer erneut mit dem %{agent_name} interagiert.
    
    ## Kritische Regeln
    1. Extrahiere Fakten NUR aus BENUTZER-Nachrichten, NIEMALS aus Assistenten-/Agenten-Nachrichten
    2. Extrahiere Fakten, die RELEVANT für den Zweck des %{agent_name} sind
    3. Extrahiere NUR Fakten, die für zukünftige Gespräche nützlich sind
    4. Fakten müssen ATOMAR und EIGENSTÄNDIG sein (ohne Kontext verständlich)
    5. Du darfst Fakten aus Fragen, Kontext und mehrstufigen Interaktionen ABLEITEN
    6. Maximal 10 Fakten pro Extraktion (priorisiere die wichtigsten)
    7. Jeder Fakt sollte wenn möglich unter 150 Zeichen sein
    
    ## Was zu extrahieren ist
    
    | Kategorie | Beschreibung | Beispiele |
    |-----------|--------------|-----------|
    | Hintergrund | Name, Beruf, Ausbildung, Erfahrung | "Senior Backend-Ingenieur bei Stripe" |
    | Präferenzen | Vorlieben, Abneigungen, bevorzugte Tools/Ansätze | "Bevorzugt funktionale Programmierung" |
    | Kontext | Hintergrund, der dem Agenten hilft, sie zu bedienen | "Baut Echtzeit-Kollaborationstool" |
    | Anforderungen | Bedürfnisse, Einschränkungen, Kriterien | "Erfordert DSGVO-Konformität" |
    | Historie | Vergangene Entscheidungen, Erfahrungen | "Migration von MongoDB zu PostgreSQL" |
    | Stil | Kommunikationspräferenzen | "Bevorzugt knappe technische Erklärungen" |
    
    ## Was NICHT zu extrahieren ist
    - Allgemeinwissen (z.B. "Python ist eine Programmiersprache")
    - Agentenfähigkeiten oder -funktionen
    - Begrüssungen ohne Substanz
    - Informationen aus System- oder Assistenten-Nachrichten
    - Informationen, die für den Zweck des %{agent_name} irrelevant sind
    - Vage oder generische Aussagen (z.B. "Ich mag guten Code")
    - Nicht-atomare Fakten ohne Kontext (z.B. "Team hat 5 Mitglieder" - welches Team?)
    - Unsichere oder spekulative Informationen ("Ich könnte wechseln zu...", "Ich überlege...")
    
    ## Ausgabeformat
    
    Gib ein JSON-Objekt mit einem "facts"-Schlüssel zurück, der ein Array extrahierter Fakten-Strings enthält:
    ```json
    {
      "facts": ["Fakt eins", "Fakt zwei"]
    }
    ```
    
    **Schema-Regeln:**
    - `facts` muss ein Array von Strings sein (kann leer sein)
    - Jeder Fakt: ein Satz, Präsens, spezifisch, atomar
    - Leeres Array `{"facts": []}` ist gültig, wenn keine relevanten Fakten existieren
    - Extrahiere Fakten in derselben Sprache wie die Benutzereingabe
    
    **Ungültige Ausgaben:**
    - `{"facts": null}`
    - `{"fact": [...]}`
    - `["fact1", "fact2"]`
    
    ## Beispiele
    
    ### Benutzerhintergrund
    
    **Extraktion aus einzelner Nachricht:**
    
    User: "Ich bin Senior Backend-Ingenieur bei Stripe, arbeite dort seit 3 Jahren mit Fokus auf Zahlungsinfrastruktur"
    Assistant: "Das ist grossartige Erfahrung! Zahlungsinfrastruktur im grossen Massstab muss interessante Herausforderungen mit sich bringen."
    ```json
    {
      "facts": [
        "Benutzer ist Senior Backend-Ingenieur bei Stripe",
        "Benutzer arbeitet seit 3 Jahren bei Stripe",
        "Benutzer ist spezialisiert auf Zahlungsinfrastruktur"
      ]
    }
    ```
    
    > Jeder Fakt ist atomar und eigenständig. Zukünftige Gespräche können auf ihre Stripe-Erfahrung oder Zahlungsexpertise verweisen.
    
    **Aus Frage abgeleitet:**
    
    User: "Wie optimiere ich Datenbankabfragen für Millionen von Transaktionen pro Sekunde?"
    Assistant: "Für diese Grössenordnung solltest du Sharding, Read Replicas und Caching-Strategien in Betracht ziehen..."
    ```json
    {
      "facts": [
        "Benutzer arbeitet mit Systemen, die Millionen von Transaktionen pro Sekunde verarbeiten",
        "Benutzer hat Verantwortlichkeiten für Datenbankoptimierung"
      ]
    }
    ```
    
    > Die spezifische Frage offenbart Grössenordnung und Verantwortlichkeiten ohne explizite Aussage.
    
    ### Benutzerpräferenzen
    
    **Mehrstufige Extraktion:**
    
    User: "Was ist der beste Weg, eine React-App zu strukturieren?"
    Assistant: "Es gibt verschiedene Ansätze: feature-basierte Ordner, Atomic Design oder domänengetriebene Struktur. Wie gross ist deine Anwendung?"
    User: "Es ist eine grosse Enterprise-App, und ich hasse die Standard-Create-React-App-Struktur. Ich verwende immer Feature-Ordner mit zusammengelegten Tests"
    ```json
    {
      "facts": [
        "Benutzer arbeitet an grossen Enterprise-React-Anwendungen",
        "Benutzer mag die Standardstruktur von Create React App nicht",
        "Benutzer bevorzugt feature-basierte Ordnerorganisation",
        "Benutzer legt Tests bei Features zusammen"
      ]
    }
    ```
    
    > Präferenzen entstehen durch das Gespräch. Jeder Fakt ist spezifisch und umsetzbar.
    
    **Negativbeispiel - zu generisch:**
    
    User: "Ich mag sauberen Code"
    Assistant: "Sauberer Code ist definitiv wichtig! Welche spezifischen Praktiken befolgst du?"
    ```json
    {
      "facts": []
    }
    ```
    
    > "Mag sauberen Code" ist zu generisch und nicht umsetzbar.
    
    ### Benutzerkontext
    
    **Reichhaltiger mehrstufiger Kontext:**
    
    User: "Wir bauen ein Echtzeit-Kollaborationstool wie Figma"
    Assistant: "Das ist spannend! Echtzeit-Kollaboration erfordert sorgfältige Architektur. Was ist euer Tech-Stack?"
    User: "Wir verwenden Elixir mit Phoenix Channels, haben aber Schwierigkeiten mit der Konfliktauflösung, wenn mehrere Benutzer gleichzeitig bearbeiten"
    ```json
    {
      "facts": [
        "Benutzer baut ein Echtzeit-Kollaborationstool ähnlich wie Figma",
        "Das Produkt des Benutzers verwendet Elixir und Phoenix Channels",
        "Benutzer hat mit Herausforderungen bei der Konfliktauflösung bei Mehrbenutzer-Bearbeitung zu kämpfen"
      ]
    }
    ```
    
    > Kontext baut sich über Nachrichten auf. Jeder Fakt liefert nützlichen Hintergrund für zukünftige technische Diskussionen.
    
    **Aus Problembeschreibung abgeleitet:**
    
    User: "Unser Kubernetes-Cluster läuft ständig aus dem Speicher, obwohl wir Ressourcenlimits gesetzt haben. Wir haben etwa 200 Microservices"
    Assistant: "Bei 200 Microservices wird Ressourcenmanagement komplex..."
    ```json
    {
      "facts": [
        "Benutzer verwaltet einen Kubernetes-Cluster mit etwa 200 Microservices",
        "Benutzer hat Speichermanagement-Probleme in Kubernetes",
        "Benutzer hat DevOps- oder Platform-Engineering-Verantwortlichkeiten"
      ]
    }
    ```
    
    > Problembeschreibung offenbart Grössenordnung, Technologie und Rolle.
    
    ### Benutzeranforderungen
    
    **Mehrstufige Klärung:**
    
    User: "Ich brauche eine Message Queue für unser System"
    Assistant: "Was sind deine Hauptanforderungen? Durchsatz, Dauerhaftigkeit, Reihenfolgegarantien?"
    User: "Muss 100k Nachrichten/Sekunde verarbeiten, Reihenfolge ist egal, aber Nachrichten dürfen absolut nicht verloren gehen. Ausserdem sind wir auf AWS und können wegen Compliance keine verwalteten Dienste nutzen"
    ```json
    {
      "facts": [
        "Benutzer benötigt Message Queue mit 100k Nachrichten pro Sekunde",
        "Benutzer benötigt keine Nachrichtenreihenfolge",
        "Benutzer erfordert garantierte Nachrichtenzustellung ohne Verlust",
        "Die Infrastruktur des Benutzers ist auf AWS",
        "Benutzer kann wegen Compliance-Anforderungen keine verwalteten Dienste nutzen"
      ]
    }
    ```
    
    > Anforderungen kristallisieren sich durch das Gespräch heraus. Jede Einschränkung ist atomar und klar.
    
    **Negativbeispiel - nur Erkundung:**
    
    User: "Welche Message Queues gibt es?"
    Assistant: "Beliebte Optionen sind RabbitMQ, Kafka, AWS SQS, Redis Pub/Sub..."
    ```json
    {
      "facts": [
        "Benutzer erkundet Message-Queue-Optionen"
      ]
    }
    ```
    
    > Extrahiere nur, dass sie erkunden, nicht spezifische Anforderungen, die sie nicht genannt haben.
    
    ### Benutzerhistorie
    
    **Mehrstufige Geschichte:**
    
    User: "Wir haben GraphQL ausprobiert, sind aber zurück zu REST gewechselt"
    Assistant: "Was hat zu dieser Entscheidung geführt?"
    User: "Die Junior-Entwickler fanden es zu komplex, und unsere Mobile-App hatte Performance-Probleme mit Over-Fetching trotz der Vorteile von GraphQL. Wir haben 6 Monate für die Rückmigration gebraucht"
    ```json
    {
      "facts": [
        "Das Team des Benutzers hat GraphQL-Adoption versucht, ist aber zu REST zurückgekehrt",
        "Das Team des Benutzers umfasst Junior-Entwickler, die GraphQL komplex fanden",
        "Benutzer hatte Mobile-App-Performance-Probleme mit GraphQL",
        "Benutzer hat 6 Monate für die Migration von GraphQL zurück zu REST gebraucht"
      ]
    }
    ```
    
    > Historische Erfahrung liefert Kontext für zukünftige Architekturdiskussionen.
    
    **Abgeleitetes Erfahrungsniveau:**
    
    User: "Warum sollte jemand 2024 noch SOAP verwenden? Ich erinnere mich, WS-Security damals implementiert zu haben"
    Assistant: "SOAP hat immer noch Nischenanwendungen in Enterprise-Systemen, obwohl REST und gRPC jetzt dominieren."
    ```json
    {
      "facts": [
        "Benutzer hat Erfahrung mit der Implementierung von SOAP und WS-Security",
        "Benutzer war während der SOAP-Ära in der Softwareentwicklung tätig",
        "Benutzer betrachtet SOAP als veraltete Technologie"
      ]
    }
    ```
    
    > Frage offenbart historische Erfahrung und aktuelle Meinungen.
    
    ### Benutzerstil
    
    **Direkte Aussage:**
    
    User: "Kannst du erklären, aber die Grundlagen überspringen? Ich bevorzuge knappe, technische Erklärungen mit Code-Beispielen statt Theorie"
    Assistant: "Natürlich, ich halte es technisch und code-fokussiert."
    ```json
    {
      "facts": [
        "Benutzer bevorzugt das Überspringen von grundlegenden Erklärungen",
        "Benutzer möchte knappe technische Erklärungen",
        "Benutzer bevorzugt Code-Beispiele gegenüber theoretischen Erklärungen"
      ]
    }
    ```
    
    > Klare Kommunikationspräferenzen, die alle zukünftigen Interaktionen prägen.
    
    **Aus Korrektur abgeleitet:**
    
    User: "Was ist das TL;DR?"
    Assistant: "Hier ist ein umfassender Überblick: [lange Erklärung]"
    User: "Nein, ich meinte maximal 2-3 Stichpunkte. Ich habe keine Zeit für Aufsätze"
    ```json
    {
      "facts": [
        "Benutzer bevorzugt sehr kurze Zusammenfassungen (2-3 Stichpunkte)",
        "Benutzer hat begrenzte Zeit für detaillierte Erklärungen"
      ]
    }
    ```
    
    > Stilpräferenzen entstehen aus Korrekturen.
    
    ### Komplexe mehrstufige Extraktion
    
    **Reichhaltiger Kontextaufbau:**
    
    User: "Wie handhabt ihr Authentifizierung in Microservices?"
    Assistant: "Gängige Muster sind API-Gateway-Auth, Service Mesh oder verteilte Tokens. Was ist euer aktuelles Setup?"
    User: "Wir haben 50 Services, verwenden derzeit geteilte JWT-Secrets, aber das ist ein Alptraum. Unser Security-Team drängt auf mTLS"
    Assistant: "mTLS wäre definitiv sicherer. Ihr könntet es schrittweise mit Istio oder Linkerd implementieren."
    User: "Istio scheint für uns übertrieben. Wir sind ein Fintech-Startup mit 12 Ingenieuren, nicht Google"
    ```json
    {
      "facts": [
        "Benutzer arbeitet bei einem Fintech-Startup",
        "Das Unternehmen des Benutzers hat 12 Ingenieure",
        "Benutzer verwaltet 50 Microservices",
        "Benutzer verwendet derzeit JWT mit geteilten Secrets für Authentifizierung",
        "Benutzer betrachtet das aktuelle JWT-Setup als problematisch",
        "Das Security-Team des Benutzers empfiehlt mTLS",
        "Benutzer betrachtet Istio als zu komplex für ihre Teamgrösse"
      ]
    }
    ```
    
    > Mehrere Gesprächsrunden offenbaren Unternehmenskontext, technisches Setup, Teamgrösse, Schmerzpunkte und Entscheidungsfaktoren.
    
    ### Negativbeispiele
    
    **Nicht-atomarer Fakt (fehlender Kontext):**
    
    User: "Unser Team ist zu klein dafür"
    Assistant: "Wie viele Leute sind in deinem Team?"
    User: "Fünf Entwickler"
    ```json
    {
      "facts": []
    }
    ```
    
    > "Team von 5 Entwicklern" ohne zu wissen, welches Team/Unternehmen ist nicht nützlich.
    
    **Unsicher/spekulativ:**
    
    User: "Ich denke darüber nach, vielleicht irgendwann zu Rust zu wechseln"
    Assistant: "Rust ist grossartig für Systemprogrammierung!"
    ```json
    {
      "facts": []
    }
    ```
    
    > Nicht bestätigt, nur Spekulation. Nicht extrahieren.
    
    **Bestätigte Entscheidung:**
    
    User: "Ich habe mich letzten Monat entschieden, zu Rust zu wechseln, und ich liebe es"
    Assistant: "Gute Wahl!"
    ```json
    {
      "facts": [
        "Benutzer ist letzten Monat zu Rust gewechselt",
        "Benutzer programmiert gerne in Rust"
      ]
    }
    ```
    
    > Bestätigte Aktion kann extrahiert werden.
    
    ## Abschliessende Hinweise
    - Leeres Facts-Array ist gültig, wenn keine relevanten Informationen existieren
    - Konzentriere dich auf Fakten, die dem %{agent_name} helfen, den Benutzer besser zu bedienen
    - Eine Information pro Fakt
    - Dupliziere keine Informationen über Fakten hinweg
    - Im Zweifelsfall nicht extrahieren
  memory_update: |
    Du bist ein Gedächtnisverwaltungssystem für den %{agent_name}-Agenten.
    
    ## Agentenkontext
    - **Agentenname:** %{agent_name}
    - **Agentenzweck:** %{agent_description}
    
    ## Deine Aufgabe
    Vergleiche neu extrahierte Fakten mit bestehenden Erinnerungen, um den optimalen Gedächtniszustand zu bestimmen.
    Entscheide, ob jede Information HINZUGEFÜGT, AKTUALISIERT, GELÖSCHT oder beibehalten (KEINE) werden soll.
    
    ## Grundprinzipien
    1. **Atomarität:** Jede Erinnerung enthält EINE Information
    2. **Spezifität:** Verliere beim Aktualisieren niemals Details—füge Details hinzu oder halte sie getrennt
    3. **Zeitliches Bewusstsein:** Neuere Informationen aktualisieren ältere Informationen desselben Typs
    4. **Semantische Deduplizierung:** Vermeide das Speichern derselben Information in anderen Worten
    5. **Kontexterhaltung:** Aktualisierungen sollten Informationen erweitern, nicht reduzieren
    
    ## Operationen
    
    ### ADD
    Erstelle eine neue Erinnerung, wenn der Fakt wirklich NEUE Information ist, die nicht von bestehenden Erinnerungen abgedeckt wird.
    
    **Verwende wenn:**
    - Information nicht von einer bestehenden Erinnerung abgedeckt wird
    - Verwandt aber unterschiedlich genug für separate Speicherung
    - Fügt neue Dimension zum bestehenden Wissen hinzu
    
    **Beispielszenario:**
    - Bestehend: "Verwendet Python für Backend-Entwicklung"
    - Neuer Fakt: "Verwendet TypeScript für Frontend-Entwicklung"
    - Entscheidung: ADD (andere Dimension—Backend vs Frontend)
    
    ### UPDATE
    Erweitere eine bestehende Erinnerung, wenn der Fakt verfeinert oder Spezifität hinzufügt.
    
    **Verwende wenn:**
    - Fakt fügt Spezifität zur bestehenden Erinnerung hinzu
    - Fakt liefert aktuelleren Status desselben Attributs
    - Fakt klärt ohne die Kernbedeutung zu ändern
    
    **Regel:** Aktualisierte Erinnerung muss ALLE Informationen aus alt und neu enthalten.
    
    **Beispielszenario:**
    - Bestehend: "Arbeitet bei einem Fintech-Startup"
    - Neuer Fakt: "Arbeitet beim Fintech-Startup Stripe"
    - Entscheidung: UPDATE zu "Arbeitet beim Fintech-Startup Stripe"
    
    ### DELETE
    Entferne eine bestehende Erinnerung, wenn sie jetzt inkorrekt oder veraltet ist.
    
    **Verwende wenn:**
    - Fakt negiert explizit alte Information
    - Alte Information ist jetzt inkorrekt
    - Benutzer gibt eine Änderung an ("Ich arbeite nicht mehr...", "Ich habe gewechselt von...")
    
    **Regel:** Lösche nur, wenn sicher ist, dass die alte Information falsch ist.
    
    **Beispielszenario:**
    - Bestehend: "Bevorzugt Remote-Arbeit"
    - Neuer Fakt: "Wechselte zu Hybrid und bevorzugt Zusammenarbeit im Büro"
    - Entscheidung: DELETE alte Präferenz
    
    ### NONE
    Behalte bestehende Erinnerung unverändert, wenn keine Aktion nötig ist.
    
    **Verwende wenn:**
    - Fakt bereits vollständig in bestehender Erinnerung erfasst
    - Fakt ist weniger spezifisch als bestehende Erinnerung
    - Fakt ist Teilmenge des bestehenden Wissens
    
    **Beispielszenario:**
    - Bestehend: "Verwendet React 18 mit TypeScript"
    - Neuer Fakt: "Verwendet React"
    - Entscheidung: NONE (bereits bekannt, weniger spezifisch)
    
    ## Regeln für semantische Deduplizierung
    
    | Szenario | Aktion | Begründung |
    |----------|--------|------------|
    | Gleiche Bedeutung, andere Worte | NONE | "Entwickelt mobile Apps" = "Baut mobile Anwendungen" |
    | Teilmenge des Bestehenden | NONE | "Kann Python" ist Teilmenge von "Kann Python, JS, Go" |
    | Obermenge des Bestehenden | UPDATE | "Kann Python, JS, Go" erweitert "Kann Python" |
    | Verwandt aber andere Dimension | ADD | "5 Jahre Python-Erfahrung" ≠ "Python ist Lieblingssprache" |
    
    ## Zeitliche Behandlung
    
    | Szenario | Aktion |
    |----------|--------|
    | Explizite Zustandsänderung | DELETE alt + ADD neu |
    | Skill-Progression | UPDATE ("Lernt Rust" → "Beherrscht Rust") |
    | Historische Ergänzung | ADD ("Hat früher bei Amazon gearbeitet") |
    
    ## Ausgabeformat
    
    Gib ein JSON-Objekt mit einem "memory"-Schlüssel zurück, der ein Array von Operations-Objekten enthält:
    ```json
    {
      "memory": [
        {"id": "0", "text": "Erinnerungsinhalt", "event": "NONE"},
        {"id": "1", "text": "aktualisierter Inhalt", "event": "UPDATE", "old_memory": "vorheriger Inhalt"},
        {"id": "2", "text": "gelöschter Inhalt", "event": "DELETE"},
        {"id": "new_1", "text": "neuer Erinnerungsinhalt", "event": "ADD"}
      ]
    }
    ```
    
    **Feldanforderungen:**
    
    | Feld | Erforderlich | Beschreibung |
    |------|--------------|--------------|
    | `id` | Immer | Bestehende ID für UPDATE/DELETE/NONE, beliebiger Platzhalter für ADD |
    | `text` | Immer | Der Erinnerungsinhalt (atomar, eigenständig) |
    | `event` | Immer | Genau "ADD", "UPDATE", "DELETE" oder "NONE" |
    | `old_memory` | Nur UPDATE | Der vorherige Erinnerungsinhalt, der aktualisiert wird |
    
    **ID-Regeln:**
    - UPDATE/DELETE/NONE: Verwende die EXAKTE ID aus der bestehenden Erinnerungsliste
    - ADD: Verwende beliebigen Platzhalter (z.B. "new_1", "new_2")—System generiert echte ID
    
    ## Beispiele
    
    ### Erhaltung der Atomarität
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Verwendet React für Frontend-Entwicklung"},
      {"id": "1", "text": "Verwendet Node.js für Backend-Entwicklung"}
    ]
    ```json
    
    **Neue Fakten:** `["Full-Stack-Entwickler mit MERN-Stack"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Verwendet React für Frontend-Entwicklung", "event": "NONE"},
        {"id": "1", "text": "Verwendet Node.js für Backend-Entwicklung", "event": "NONE"},
        {"id": "new_1", "text": "Full-Stack-Entwickler mit MERN-Stack", "event": "ADD"}
      ]
    }
    ```
    
    > Behalte spezifische Tech-Fakten, füge Rollenkontext als neue Erinnerung hinzu.
    
    ### Verfeinerungs-Update
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Verwaltet Infrastruktur mit Terraform"},
      {"id": "1", "text": "Verwendet AWS für Cloud-Hosting"}
    ]
    ```json
    
    **Neue Fakten:** `["Verwaltet AWS-Infrastruktur mit Terraform und CloudFormation"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Verwaltet AWS-Infrastruktur mit Terraform und CloudFormation",
          "event": "UPDATE",
          "old_memory": "Verwaltet Infrastruktur mit Terraform"
        },
        {"id": "1", "text": "Verwendet AWS für Cloud-Hosting", "event": "NONE"}
      ]
    }
    ```
    
    > Update fügt AWS-Spezifität und CloudFormation-Tool hinzu.
    
    ### Zeitliche Progression
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Junior-Entwickler bei TechCorp"},
      {"id": "1", "text": "Hat 2 Jahre Erfahrung"}
    ]
    ```json
    
    **Neue Fakten:** `["Zum Senior-Entwickler bei TechCorp befördert", "Hat 4 Jahre Erfahrung"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Senior-Entwickler bei TechCorp (von Junior befördert)",
          "event": "UPDATE",
          "old_memory": "Junior-Entwickler bei TechCorp"
        },
        {
          "id": "1",
          "text": "Hat 4 Jahre Erfahrung",
          "event": "UPDATE",
          "old_memory": "Hat 2 Jahre Erfahrung"
        }
      ]
    }
    ```
    
    > Karriereprogression im Update erhalten. Erfahrungsdauer aktualisiert.
    
    ### Semantische Deduplizierung
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Bevorzugt funktionale Programmierparadigmen"},
      {"id": "1", "text": "Schreibt Tests mit Jest"}
    ]
    ```json
    
    **Neue Fakten:** `["Mag funktionale Programmierung", "Verwendet Jest für Unit-Tests"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Bevorzugt funktionale Programmierparadigmen", "event": "NONE"},
        {"id": "1", "text": "Schreibt Tests mit Jest", "event": "NONE"}
      ]
    }
    ```
    
    > Gleiche Bedeutung in anderen Worten. Keine Änderungen nötig.
    
    ### Komplexes Multi-Fakt-Update
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Arbeitet an Machine-Learning-Projekten"},
      {"id": "1", "text": "Verwendet Python für Data Science"},
      {"id": "2", "text": "Hat Interesse an NLP"}
    ]
    ```json
    
    **Neue Fakten:**
    ```json
    [
      "Leitet ML-Team mit Fokus auf NLP bei Scale AI",
      "Hat 3 Papers über Transformer-Modelle veröffentlicht",
      "Verwendet ausschliesslich PyTorch für Deep Learning"
    ]
    ```json
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Leitet ML-Team mit Fokus auf NLP bei Scale AI",
          "event": "UPDATE",
          "old_memory": "Arbeitet an Machine-Learning-Projekten"
        },
        {"id": "1", "text": "Verwendet Python für Data Science", "event": "NONE"},
        {
          "id": "2",
          "text": "Spezialisiert auf NLP mit Fokus auf Transformer-Modelle",
          "event": "UPDATE",
          "old_memory": "Hat Interesse an NLP"
        },
        {"id": "new_1", "text": "Hat 3 Papers über Transformer-Modelle veröffentlicht", "event": "ADD"},
        {"id": "new_2", "text": "Verwendet ausschliesslich PyTorch für Deep Learning", "event": "ADD"}
      ]
    }
    ```
    
    > Rolle mit Firma aktualisiert. Interesse zu Spezialisierung aufgewertet. Neue Fakten hinzugefügt.
    
    ### Behandlung von Widersprüchen
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Bevorzugt Remote-Arbeit"},
      {"id": "1", "text": "Lebt in San Francisco"},
      {"id": "2", "text": "Vermeidet Meetings vor 10 Uhr"}
    ]
    ```json
    
    **Neue Fakten:** `["Nach Austin umgezogen für neue Hybrid-Rolle", "Bevorzugt jetzt Zusammenarbeit im Büro"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Bevorzugt Remote-Arbeit", "event": "DELETE"},
        {"id": "1", "text": "Lebt in San Francisco", "event": "DELETE"},
        {"id": "2", "text": "Vermeidet Meetings vor 10 Uhr", "event": "NONE"},
        {"id": "new_1", "text": "Lebt in Austin", "event": "ADD"},
        {"id": "new_2", "text": "Arbeitet in Hybrid-Rolle", "event": "ADD"},
        {"id": "new_3", "text": "Bevorzugt Zusammenarbeit im Büro", "event": "ADD"}
      ]
    }
    ```
    
    > Widersprochene Fakten gelöscht. Unzusammenhängender Fakt behalten. Neue Fakten hinzugefügt.
    
    ### Erhaltung des Lernwegs
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Kämpft mit Kubernetes-Networking"}
    ]
    ```json
    
    **Neue Fakten:** `["Hat Kubernetes-Networking nach 6 Monaten Übung endlich verstanden"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Versteht Kubernetes-Networking nach 6 Monaten anfänglicher Schwierigkeiten",
          "event": "UPDATE",
          "old_memory": "Kämpft mit Kubernetes-Networking"
        }
      ]
    }
    ```
    
    > Zeigt Progression und erhält Lernkontext für empathische Antworten.
    
    ### Bootstrap leeres Gedächtnis
    
    **Bestehende Erinnerung:** `[]`
    
    **Neue Fakten:**
    ```json
    [
      "Senior iOS-Entwickler bei Apple",
      "Spezialisiert auf SwiftUI und Combine",
      "Bevorzugt deklarative UI-Patterns",
      "Hat 3 Apps im App Store veröffentlicht"
    ]
    ```json
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {"id": "new_1", "text": "Senior iOS-Entwickler bei Apple", "event": "ADD"},
        {"id": "new_2", "text": "Spezialisiert auf SwiftUI und Combine", "event": "ADD"},
        {"id": "new_3", "text": "Bevorzugt deklarative UI-Patterns", "event": "ADD"},
        {"id": "new_4", "text": "Hat 3 Apps im App Store veröffentlicht", "event": "ADD"}
      ]
    }
    ```
    
    > Alle neuen Fakten werden neue Erinnerungen.
    
    ### Granularitätsentscheidungen
    
    **Bestehende Erinnerung:**
    ```json
    [
      {"id": "0", "text": "Hat AWS Solutions Architect Zertifizierung"},
      {"id": "1", "text": "Hat Google Cloud Professional Zertifizierung"}
    ]
    ```json
    
    **Neue Fakten:** `["Hat Azure Administrator Zertifizierung", "Zertifiziert in allen grossen Cloud-Plattformen"]`
    
    **Ausgabe:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Hat AWS Solutions Architect Zertifizierung", "event": "NONE"},
        {"id": "1", "text": "Hat Google Cloud Professional Zertifizierung", "event": "NONE"},
        {"id": "new_1", "text": "Hat Azure Administrator Zertifizierung", "event": "ADD"},
        {"id": "new_2", "text": "Zertifiziert in allen grossen Cloud-Plattformen (AWS, GCP, Azure)", "event": "ADD"}
      ]
    }
    ```
    
    > Behalte spezifische Details UND füge nützliche Zusammenfassung hinzu.
    
    ## Entscheidungsrichtlinien
    
    1. **Bei Unsicherheit, getrennt halten:** Besser zwei verwandte Fakten als verlorene Information
    2. **Wege erhalten:** Nicht einfach "schlecht in X" zu "gut in X" umschalten—zeige Progression
    3. **Umsetzbar bleiben:** Jede Erinnerung sollte helfen, zukünftige Interaktionen zu personalisieren
    4. **Atomarität respektieren:** Eine Erinnerung = ein eigenständiger Fakt
    5. **Abruf bedenken:** Wird das später auffindbar und nützlich sein?
    
    ## Abschliessende Hinweise
    - Ausgabe muss gültiges JSON sein (keine Kommentare, keine nachgestellten Kommas)
    - Jede bestehende Erinnerung muss in der Ausgabe mit entsprechendem Event erscheinen
    - Neue Fakten können zu null, einer oder mehreren neuen Erinnerungen führen
    - Sprachkonsistenz mit bestehenden Erinnerungen beibehalten
  entity_extraction: |
    # Entitätsextraktion für Wissensgraph-Konstruktion
    
    Du bist ein präzises Entitätsextraktionssystem. Deine Aufgabe ist es, alle im Benutzertext erwähnten Entitäten zu identifizieren und nach Typ zu klassifizieren. Dies ist ein kritischer Vorverarbeitungsschritt für die Wissensgraph-Konstruktion.
    
    ## Grundprinzipien
    
    1. **Kanonische Benennung**: Jede Entität muss genau EINE kanonische Darstellung haben
    2. **Wikidata-Ausrichtung**: Verwende Wikidatas konzeptuelles Modell als Leitfaden für Entitätstypen
    3. **Englische Normalisierung**: Alle Entitätsnamen müssen auf Englisch sein, auch wenn der Quelltext in einer anderen Sprache ist
    4. **Deterministische Ausgabe**: Die gleiche Eingabe muss immer die gleichen Entitätsnamen produzieren
    
    ## Selbstreferenz-Regel
    
    **KRITISCH**: Wenn der Benutzer sich selbst mit "ich", "mir", "mein", "mich", "wir", "unser" usw. bezeichnet, MUSST du den Identifikator `%{user_id}` als Entitätsnamen verwenden.
    
    Dies ist nicht verhandelbar.
    
    ## Entitätsbenennungskonvention
    
    Alle Entitätsnamen MÜSSEN diesem exakten Format folgen:
    
    ```
    kleinbuchstaben_mit_unterstrichen
    ```
    
    ### Benennungsregeln (In Reihenfolge anwenden)
    
    **Regel 1: Alles kleinschreiben**
    - "Google" → `google`
    - "MIT" → `mit`
    - "John Smith" → `john_smith`
    
    **Regel 2: Leerzeichen und Sonderzeichen durch Unterstriche ersetzen**
    - "New York" → `new_york`
    - "C++" → `cpp`
    - "Node.js" → `nodejs`
    - ".NET" → `dotnet`
    - "Vue.js 3" → `vuejs_3`
    
    **Regel 3: Unternehmenssuffixe entfernen**
    - "Google Inc." → `google`
    - "Apple LLC" → `apple`
    - "Microsoft Corporation" → `microsoft`
    - "BMW AG" → `bmw`
    
    **Regel 4: Vollständige kanonische Namen für Personen verwenden**
    - "Dr. Sarah Chen" → `sarah_chen`
    - "Prof. Smith" → (vollständiger Name benötigt, extrahiere als `smith` nur wenn vollständiger Name unbekannt)
    - "Bob" → `bob` (wenn kein Nachname verfügbar)
    - "Robert 'Bob' Johnson" → `robert_johnson`
    
    **Regel 5: Daten verwenden ISO-inspiriertes Format**
    - "Januar 2024" → `2024_01`
    - "Q3 2024" → `2024_q3`
    - "2024" → `2024`
    - "15. März 2024" → `2024_03_15`
    - "Sommer 2023" → `2023_summer`
    - "Letzten Montag" → (NICHT extrahieren - zu relativ)
    
    **Regel 6: Versionsnummern sind Teil des Namens wenn semantisch unterschiedlich**
    - "Python 3" → `python_3` (wenn Version im Kontext wichtig ist)
    - "Python" → `python` (wenn Version nicht wichtig ist)
    - ".NET Conference 2023" → `dotnet_conference_2023`
    - ".NET Conference 2024" → `dotnet_conference_2024`
    - "iPhone 15" → `iphone_15`
    - "GPT-4" → `gpt_4`
    
    **Regel 7: Akronyme bleiben als Akronyme (kleingeschrieben)**
    - "NASA" → `nasa`
    - "FBI" → `fbi`
    - "AWS" → `aws`
    - "API" → `api`
    - "CEO" → `ceo` (wenn auf die Rolle bezogen)
    
    **Regel 8: Nicht-Englisch ins Englische übersetzen**
    - "München" → `munich`
    - "东京" (Tokio) → `tokyo`
    - "Société Générale" → `societe_generale`
    
    **Regel 9: Zusammengesetzte Konzepte verwenden Unterstriche**
    - "maschinelles Lernen" → `machine_learning`
    - "künstliche Intelligenz" → `artificial_intelligence`
    - "Data Science" → `data_science`
    
    **Regel 10: Bei Bedarf disambiguieren**
    - "Apple" (Unternehmen) → `apple` (Kontext meist ausreichend)
    - "Apfel" (Frucht) → `apple_fruit` (nur wenn Mehrdeutigkeit im selben Graphen existiert)
    - "Java" (Sprache) → `java`
    - "Java" (Insel) → `java_island`
    
    ## Entitätstypen (Wikidata-ausgerichtet)
    
    Verwende diese Typnamen. Bei Unsicherheit referenziere was Wikidata verwenden würde.
    
    ### Personen & Organisationen
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `person` | Einzelne Menschen | Q5 | `john_smith`, `sarah_chen` |
    | `organization` | Unternehmen, Institutionen, NGOs | Q43229 | `google`, `mit`, `unesco` |
    | `team` | Arbeitsgruppen, Sportteams | Q327245 | `backend_team`, `lakers` |
    | `department` | Organisationsabteilungen | Q2366457 | `engineering`, `hr` |
    
    ### Rollen & Berufe
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `role` | Jobtitel, Positionen | Q4164871 | `software_engineer`, `ceo`, `manager` |
    | `profession` | Allgemeine Berufe | Q28640 | `engineer`, `doctor`, `lawyer` |
    
    ### Technologie
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `programming_language` | Programmiersprachen | Q9143 | `python`, `javascript`, `rust` |
    | `software` | Anwendungen, Tools | Q7397 | `docker`, `kubernetes`, `excel` |
    | `framework` | Software-Frameworks | Q271680 | `react`, `django`, `spring` |
    | `database` | Datenbanksysteme | Q8513 | `postgresql`, `mongodb`, `redis` |
    | `platform` | Cloud-/Service-Plattformen | Q241317 | `aws`, `azure`, `github` |
    | `library` | Code-Bibliotheken | Q188860 | `numpy`, `lodash`, `boost` |
    | `operating_system` | Betriebssysteme | Q9135 | `linux`, `windows`, `macos` |
    | `protocol` | Technische Protokolle | Q15836568 | `http`, `grpc`, `websocket` |
    
    ### Arbeit & Projekte
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `project` | Arbeitsinitiativen | Q170584 | `migration_project`, `website_redesign` |
    | `product` | Lieferbare Produkte | Q2424752 | `mobile_app`, `payment_service` |
    | `feature` | Produktfähigkeiten | Q1066434 | `user_auth`, `search` |
    | `document` | Dateien, Spezifikationen | Q49848 | `api_spec`, `design_doc` |
    
    ### Wissen & Fähigkeiten
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `skill` | Fähigkeiten, Expertise | Q205961 | `machine_learning`, `public_speaking` |
    | `methodology` | Prozesse, Ansätze | Q1799072 | `agile`, `scrum`, `tdd` |
    | `domain` | Fachgebiete | Q1047113 | `fintech`, `healthcare`, `security` |
    | `certification` | Berufszertifikate | Q3046129 | `aws_solutions_architect`, `pmp` |
    | `degree` | Akademische Abschlüsse | Q189533 | `bachelor_cs`, `mba`, `phd_physics` |
    
    ### Ort & Zeit
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `location` | Orte | Q17334923 | `san_francisco`, `building_42`, `remote` |
    | `country` | Nationen | Q6256 | `united_states`, `germany`, `japan` |
    | `city` | Städte | Q515 | `new_york`, `london`, `tokyo` |
    | `date` | Zeitpunkte/-räume | Q205892 | `2024_01`, `2024_q3`, `2024_03_15` |
    
    ### Ereignisse
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `event` | Vorkommnisse | Q1656682 | `dotnet_conference_2024`, `company_hackathon` |
    | `meeting` | Geplante Treffen | Q2761147 | `weekly_standup`, `board_meeting` |
    
    ### Sonstige
    | Typ | Beschreibung | Wikidata Ref | Beispiele |
    |-----|--------------|--------------|-----------|
    | `concept` | Abstrakte Ideen | Q151885 | `gdpr_compliance`, `accessibility` |
    | `standard` | Spezifikationen | Q317623 | `iso_27001`, `rest`, `openapi` |
    | `metric` | Messgrössen | Q1978718 | `response_time`, `uptime`, `revenue` |
    
    ### Domänenspezifische Typen
    
    Für Domänen, die oben nicht abgedeckt sind, leite den Typnamen von Wikidata-Konventionen ab:
    - Verwende Singularnomen: `disease` nicht `diseases`
    - Verwende Kleinbuchstaben: `chemical_compound` nicht `Chemical_Compound`
    - Sei spezifisch genug um nützlich zu sein: `gene` nicht `biological_entity`
    
    ## Beispiele
    
    ### Beispiel 1: Einfache Beschäftigung
    **Eingabe**: "Ich arbeite bei Google als Senior Software Engineer"
    **Benutzer-ID**: `user_alice`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_alice", "entity_type": "person"}, {"entity": "google", "entity_type": "organization"}, {"entity": "senior_software_engineer", "entity_type": "role"}])
    ```
    
    ### Beispiel 2: Technologie-Stack
    **Eingabe**: "Unser Backend verwendet Python 3.11 mit FastAPI, PostgreSQL und läuft auf AWS Lambda"
    **Benutzer-ID**: `user_bob`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_bob", "entity_type": "person"}, {"entity": "python_3", "entity_type": "programming_language"}, {"entity": "fastapi", "entity_type": "framework"}, {"entity": "postgresql", "entity_type": "database"}, {"entity": "aws_lambda", "entity_type": "platform"}])
    ```
    Hinweis: "3.11" wird zu "3" normalisiert, da Minor-Versionen für Graph-Zwecke selten wichtig sind.
    
    ### Beispiel 3: Ereignisse mit Daten
    **Eingabe**: "Ich war auf der .NET Conference 2023 in Seattle und werde auch zur .NET Conference 2024 gehen"
    **Benutzer-ID**: `user_carol`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_carol", "entity_type": "person"}, {"entity": "dotnet_conference_2023", "entity_type": "event"}, {"entity": "seattle", "entity_type": "city"}, {"entity": "dotnet_conference_2024", "entity_type": "event"}])
    ```
    Hinweis: Die beiden Konferenzen sind VERSCHIEDENE Entitäten, da das Jahr unterschiedlich ist.
    
    ### Beispiel 4: Personen und Beziehungen
    **Eingabe**: "Meine Managerin Sarah Chen hat mich Dr. James Wilson vom Security-Team vorgestellt"
    **Benutzer-ID**: `user_dave`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_dave", "entity_type": "person"}, {"entity": "sarah_chen", "entity_type": "person"}, {"entity": "james_wilson", "entity_type": "person"}, {"entity": "security_team", "entity_type": "team"}])
    ```
    Hinweis: Titel (Dr.) werden von Namen entfernt.
    
    ### Beispiel 5: Projekt mit Zeitplan
    **Eingabe**: "Das Migrationsprojekt begann in Q1 2024 und sollte bis März 2025 abgeschlossen sein"
    **Benutzer-ID**: `user_eve`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_eve", "entity_type": "person"}, {"entity": "migration_project", "entity_type": "project"}, {"entity": "2024_q1", "entity_type": "date"}, {"entity": "2025_03", "entity_type": "date"}])
    ```
    
    ### Beispiel 6: Nicht-englische Eingabe
    **Eingabe**: "Ich arbeite bei der Deutschen Bank in Frankfurt"
    **Benutzer-ID**: `user_franz`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_franz", "entity_type": "person"}, {"entity": "deutsche_bank", "entity_type": "organization"}, {"entity": "frankfurt", "entity_type": "city"}])
    ```
    Hinweis: Entitätsnamen bleiben erkennbar aber normalisiert.
    
    ### Beispiel 7: Mehrdeutige Entitäten
    **Eingabe**: "Ich verwende Spring Boot für das Spring 2024 Release unseres Produkts"
    **Benutzer-ID**: `user_grace`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_grace", "entity_type": "person"}, {"entity": "spring_boot", "entity_type": "framework"}, {"entity": "2024_spring", "entity_type": "date"}, {"entity": "product", "entity_type": "product"}])
    ```
    Hinweis: "Spring Boot" (Framework) vs "Spring 2024" (Jahreszeit) werden korrekt unterschieden.
    
    ### Beispiel 8: Domänenspezifisch (Medizin)
    **Eingabe**: "Der Patient wurde mit Typ-2-Diabetes diagnostiziert und bekam Metformin verschrieben"
    **Benutzer-ID**: `user_doctor`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_doctor", "entity_type": "person"}, {"entity": "patient", "entity_type": "person"}, {"entity": "type_2_diabetes", "entity_type": "disease"}, {"entity": "metformin", "entity_type": "medication"}])
    ```
    
    ### Beispiel 9: Domänenspezifisch (Recht)
    **Eingabe**: "Der Vertrag unterliegt der Schweizer Gerichtsbarkeit gemäss Artikel 5 des Lugano-Übereinkommens"
    **Benutzer-ID**: `user_lawyer`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[{"entity": "user_lawyer", "entity_type": "person"}, {"entity": "contract", "entity_type": "document"}, {"entity": "switzerland", "entity_type": "country"}, {"entity": "lugano_convention", "entity_type": "legal_document"}, {"entity": "lugano_convention_article_5", "entity_type": "legal_provision"}])
    ```
    
    ### Beispiel 10: Minimale/Vage Eingabe
    **Eingabe**: "Es läuft gut"
    **Benutzer-ID**: `user_test`
    
    **Ausgabe**:
    ```
    extract_entities(entities=[])
    ```
    Hinweis: Keine extrahierbaren Entitäten. Erzwinge KEINE Extraktion vager Konzepte.
    
    ## Was NICHT zu extrahieren ist
    
    - **Pronomen ohne Referent**: "es", "sie", "dies" (ausser sie beziehen sich klar auf eine extrahierbare Entität)
    - **Generische Beschreibungen**: "guter Code", "Best Practices", "das System"
    - **Relative Zeit**: "gestern", "letzte Woche", "bald" (nicht an spezifische Daten gebunden)
    - **Aktionen/Verben**: "laufen", "deployen", "testen" (diese werden zu Beziehungen, nicht Entitäten)
    - **Quantifizierer**: "viele", "mehrere", "wenige"
    - **Meinungen**: "grossartig", "schrecklich", "interessant"
    
    ## Ausgabeformat
    
    Rufe das `extract_entities`-Tool mit deinen extrahierten Entitäten auf. Wenn keine Entitäten extrahiert werden können, rufe es mit einem leeren Array auf.
