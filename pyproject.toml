[tool.poetry]
name = "aihub-core"
version = "v0.13.0"
description = "aihub core"
authors = [
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
]
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13, <3.14"

[tool.poetry.group.dev.dependencies]
tomlkit = "^0.13.2"
black = { extras = ["jupyter"], version = "^25.1.0" }
pip-licenses = "^5.0.0"
mdformat = "^0.7.21"
mdformat-gfm = "^0.4.1"
mdformat-frontmatter = "^2.0.8"
mdformat-simple-breaks = "^0.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mdformat]
extensions = ["frontmatter", "gfm", "myst"]
exclude = [
    "node_modules",
    ".pnpm",
    ".venv",
    "dist",
    "local_volumes",
    ".idea",
    "venv",
    ".git"
]
wrap = 120
number = true
end_of_line = "lf"