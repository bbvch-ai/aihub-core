[tool.poetry]
name = "aihub-core"
version = "v0.13.0"
description = "aihub core"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
    "Noah Hermann <noah.hermann@bbv.ch>",
]
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13, <3.14"
tomlkit = "^0.13.2"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
black = { extras = ["jupyter"], version = "^25.1.0" }
pip-licenses = "^5.0.0"
mdformat = "^0.7.21"
mdformat-gfm = "^0.4.1"
mdformat-frontmatter = "^2.0.8"
mdformat-simple-breaks = "^0.0.1"
mdformat-pyproject = "^0.0.2"
mdformat-vuepress = "^0.1.0"
mdformat-myst = "^0.2.1"
huggingface-hub = {extras = ["cli"], version = "^0.34.4"}
tomlkit = "^0.13.3"
yamlfix = "^1.19.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mdformat]
extensions = ["vuepress", "frontmatter", "gfm", "myst"]
exclude = [
    "node_modules",
    ".pnpm",
    ".venv",
    "dist",
    "local_volumes",
    ".idea",
    "venv",
    ".git"
]
wrap = 120
number = true
end_of_line = "lf"

[tool.yamlfix]
line_length = 200
quotes_representation = "double"
preserve_quotes = false
sequence_style = "block_style"
explicit_start = false
none_representation = ""
indent_mapping = 2
indent_offset = 0
indent_sequence = 2
section_whitelines = 1
exclude = [
    "node_modules/",
    ".venv/",
    "local_volumes/",
    ".pnpm/",
    "pnpm-lock.yaml",
]