[project]
name = "swiss-ai-hub-workspace"
version = "0.290.9"
requires-python = ">=3.13, <3.14"
description = "Swiss AI Hub Monorepo Workspace"
dependencies = [
    "tomlkit>=0.13.3",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    # Linting & formatting
    "black[jupyter]>=26.1.0",
    "ty>=0.0.34",
    "ruff>=0.15.12",
    "toml-sort>=0.24.4",
    # Utilities
    "pip-licenses>=5.5.5",
    "mdformat>=0.7.21",
    "mdformat-gfm>=0.4.1",
    "mdformat-simple-breaks>=0.0.1",
    "mdformat-pyproject>=0.0.2",
    "mdformat-vuepress>=0.1.0",
    "mdformat-myst>=0.2.1",
    "huggingface-hub>=0.36.2",
    "tomlkit>=0.13.3",
    "yamlfix>=1.19.1",
]

[tool.uv]
package = false
# mem0ai[graph] 1.0.11 transitively pulls apache-age-python -> psycopg2 (source-only,
# needs libpq-dev to compile). We only use the Neo4j provider (see
# packages/core/.../mem0/mem0_settings.py), so drop apache-age-python entirely.
override-dependencies = ["apache-age-python ; sys_platform == 'never'"]
# Security floor: starlette 1.0.0 has a known vulnerability, fixed in 1.0.1. starlette is
# only a transitive dependency (fastapi, mcp, sse-starlette, dagster-graphql), so pin the
# lower bound to the first fixed release to stop the resolver selecting the affected version.
constraint-dependencies = ["starlette>=1.0.1"]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/agent",
    "packages/api",
    "packages/bot",
    "packages/pipeline",
    "packages/process",
    "packages/backup",
    "packages/sysadmin-api",
]

[tool.uv.sources]
swiss-ai-hub-core = { workspace = true }
swiss-ai-hub-agent = { workspace = true }
swiss-ai-hub-api = { workspace = true }
swiss-ai-hub-bot = { workspace = true }
swiss-ai-hub-pipeline = { workspace = true }
swiss-ai-hub-process = { workspace = true }
swiss-ai-hub-sysadmin-api = { workspace = true }

# Ruff config for files outside the per-package scopes (root-level scripts and
# `infra/`). Each `packages/*/pyproject.toml` defines its own `[tool.ruff]` and
# wins for files inside that scope. Without this section, root-level invocations
# of `ruff format` fall back to the 88-char default and over-wrap files like
# `infra/deployment/*.py` that the rest of the codebase keeps at 120.
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mdformat]
extensions = ["vuepress", "gfm", "myst"]
exclude = [
    "node_modules",
    ".pnpm",
    ".venv",
    "dist",
    "local_volumes",
    ".idea",
    "venv",
    ".git",
    "docs/whitepaper/chapters",
]
wrap = 120
number = true
end_of_line = "lf"
