[project]
name = "aihub-core-workspace"
version = "0.269.2"
requires-python = ">=3.13, <3.14"
description = "AI-Hub Core Monorepo Workspace"
dependencies = [
    "tomlkit>=0.13.3",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    # Linting & formatting
    "black[jupyter]>=26.1.0",
    "mypy>=1.13.0",
    "ruff>=0.8.1",
    "toml-sort>=0.24.2",
    # Utilities
    "pip-licenses>=5.0.0",
    "mdformat>=0.7.21",
    "mdformat-gfm>=0.4.1",
    "mdformat-simple-breaks>=0.0.1",
    "mdformat-pyproject>=0.0.2",
    "mdformat-vuepress>=0.1.0",
    "mdformat-myst>=0.2.1",
    "huggingface-hub[cli]>=0.34.4",
    "tomlkit>=0.13.3",
    "yamlfix>=1.19.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "aihub_lib",
    "aihub_agent",
    "aihub_api",
    "aihub_bot",
    "aihub_pipeline",
    "aihub_process",
]

[tool.uv.sources]
aihub-core = { workspace = true }
aihub-agent = { workspace = true }

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mdformat]
extensions = ["vuepress", "gfm", "myst"]
exclude = [
    "node_modules",
    ".pnpm",
    ".venv",
    "dist",
    "local_volumes",
    ".idea",
    "venv",
    ".git",
    "aihub_doc/whitepaper/chapters",
]
wrap = 120
number = true
end_of_line = "lf"
