[tool.poetry]
name = "aihub-core"
version = "v0.13.0"
description = "aihub core"
authors = [
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
]
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11, <3.12"

[tool.poetry.group.dev.dependencies]
tomlkit = "^0.13.2"
black = { extras = ["jupyter"], version = "^24.10.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
