[tool.poetry]
name = "agents_core"
version = "0.1.0"
description = "agents core"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <3.12"
pydantic = "^2.10.3"
nats-py = "^2.9.0"
openinference-instrumentation-llama-index = "^3.0.4"
opentelemetry-sdk = "^1.28.2"
opentelemetry-api = "^1.28.2"
pytest-asyncio = "^0.24.0"
llama-index-core = "^0.12.7"
bson = "^0.5.10"
mongoengine = "^0.29.1"
python-i18n = "^0.3.9"
flatdict = "^4.0.1"
opentelemetry-exporter-otlp = "^1.29.0"
pydantic-settings = "^2.7.0"
colorlog = "^6.9.0"
llama-index-llms-openai = "^0.3.12"
llama-index-llms-azure-openai = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
isort = "^5.13.2"
mypy = "^1.13.0"
toml-sort = "^0.24.2"
black = {extras = ["jupyter"], version = "^24.10.0"}
pytest-bdd = "^8.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
