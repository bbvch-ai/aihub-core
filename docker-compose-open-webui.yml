version: "3.8"

services:
  etcd:
    container_name: milvus-etcd-openwebui
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_volume:/etcd
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      openwebui:
        aliases:
          - etcd

  minio:
    container_name: milvus-minio-openwebui
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_volume:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      openwebui:
        aliases:
          - minio
  standalone:
    container_name: milvus-standalone-openwebui
    image: milvusdb/milvus:v2.5.3
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_volume:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - openwebui

  openwebui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - openwebui_volume:/app/backend/data
    environment:
      # Tracking & Telemetry
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "true"

      # UI and Security
      WEBUI_NAME: "bbv AI-Hub"
      CORS_ALLOW_ORIGIN: "http://localhost:3000"
      RESET_CONFIG_ON_START: "true"
      ENABLE_SIGNUP: "true"
      ENABLE_LOGIN_FORM: "true"
      ENABLE_ADMIN_EXPORT: "true"
      ENABLE_ADMIN_CHAT_ACCESS: "true"
      ENABLE_CHANNELS: "true"
      ADMIN_EMAIL: "ai@bbv.ch"
      SHOW_ADMIN_DETAILS: "true"
      DEFAULT_USER_ROLE: "user"
      DEFAULT_LOCALE: "de"

      # API settings (using OpenAI endpoints)
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      RAG_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      AUDIO_TTS_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"
      IMAGES_OPENAI_API_BASE_URL: "http://localhost:8000/api/v1/openai"

      # API Keys (replace xxx with your keys)
      OPENAI_API_KEY: "xxx"
      RAG_OPENAI_API_KEY: "xxx"
      AUDIO_STT_OPENAI_API_KEY: "xxx"
      AUDIO_TTS_OPENAI_API_KEY: "xxx"
      IMAGES_OPENAI_API_KEY: "xxx"

      # Image Generation
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: "openai"
      IMAGE_SIZE: "1792x1024"
      IMAGE_GENERATION_MODEL: "dall-e-3"

      # Task / Model settings
      TASK_MODEL_EXTERNAL: "unsloth/Llama-3.2-1B-Instruct"

      # Autocomplete Generation
      ENABLE_AUTOCOMPLETE_GENERATION: "true"
      AUTOCOMPLETE_GENERATION_INPUT_MAX_LENGTH: "60"

      # Retrieval Augmented Generation (RAG) settings
      VECTOR_DB: "milvus"
      RAG_EMBEDDING_ENGINE: "openai"
      RAG_EMBEDDING_MODEL: "text-embedding-3-large"
      RAG_EMBEDDING_OPENAI_BATCH_SIZE: "8"
      RAG_TOP_K: "3"
      RAG_RELEVANCE_THRESHOLD: "0.5"
      CHUNK_SIZE: "1024"
      CHUNK_OVERLAP: "256"
      PDF_EXTRACT_IMAGES: "true"
      RAG_FILE_MAX_SIZE: "1024"
      RAG_FILE_MAX_COUNT: "10"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "true"

      # Milvus connection (note: use the service name for standalone)
      MILVUS_URI: "http://milvus-standalone-openwebui:19530"
      MILVUS_DB: "aihub"

      # Web Search & Query Generation
      ENABLE_RAG_WEB_SEARCH: "true"
      ENABLE_SEARCH_QUERY_GENERATION: "true"
      RAG_WEB_SEARCH_RESULT_COUNT: "3"
      RAG_WEB_SEARCH_ENGINE: "jina"
      JINA_API_KEY: "jina_d77fa4cacc3c4ac1a7bf560370b148d1xkZBcDksnOL0K6xpXtd3E9dWQR5I"

      # Audio settings
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_MODEL: "whisper-1"
      AUDIO_TTS_ENGINE: "openai"
      AUDIO_TTS_MODEL: "tts-1-hd"
      AUDIO_TTS_VOICE: "alloy"

      # API Key enforcement
      ENABLE_API_KEY: "false"
      WEBUI_URL: "http://localhost:3000"

      # OAuth Settings
      ENABLE_OAUTH_SIGNUP: "true"
      MICROSOFT_CLIENT_ID: "f1f4589c-9140-4dd2-921d-9c01245abf13"
      MICROSOFT_CLIENT_TENANT_ID: "279985bd-2077-4d9d-9797-42238cfc06e2"
      MICROSOFT_CLIENT_SECRET: "waE8Q~p-HbqV_73W6xv9BnaCT2L27CQhjpoUoa9y"
    depends_on:
      - standalone
    networks:
      - openwebui

networks:
  openwebui:
    name: openwebui

volumes:
  etcd_volume:
  minio_volume:
  milvus_volume:
  openwebui_volume:
