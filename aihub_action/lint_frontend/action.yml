name: Lint frontend
description: Run linter on Nuxt frontend

inputs:
  github_token:
    description: 'GitHub token for authentication'
    required: true
  private_ssh_key:
    description: 'Private SSH key for accessing repositories'
    required: true
  working_directory:
    description: 'Working directory for the linter'
  lockfile:
    description: 'Path to the lockfile'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm

    - name: Get pnpm store path
      id: pnpm-store-dir-path
      shell: bash
      run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Cache Node Modules
      uses: actions/cache@v4
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store-dir-path.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles(inputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: |
          mkdir -p ~/.ssh
          echo "${{ inputs.private_ssh_key }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."
          pnpm install --frozen-lockfile
      working-directory: ${{ inputs.working_directory }}

    - name: Prepare nuxt
      shell: bash
      run: pnpm exec nuxi prepare
      working-directory: ${{ inputs.working_directory }}

    - name: Lint frontend
      uses: reviewdog/action-eslint@v1
      with:
        github_token: ${{ inputs.github_token }}
        reporter: github-pr-review
        workdir: ${{ inputs.working_directory }}

