name: SonarCloud Scan
description: Runs the SonarCloud scan on the codebase

inputs:
  sonar_token:
    description: 'SonarCloud token for authentication'
    required: true
  sonar_project_key:
      description: 'SonarCloud project key'
      required: true
  working_directory:
    description: 'Working directory for the SonarCloud scan'
    required: true
  github_token:
    description: 'GitHub token for authentication'
    required: true

runs:
    using: "composite"
    steps:
      - name: Download Coverage (if exists)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.working_directory }}-coverage-report
          path: ${{ inputs.working_directory }}

      - name: Check if Coverage Report Exists
        id: check_coverage
        shell: bash
        run: |
          if [[ -f "${{ inputs.working_directory }}/coverage.xml" ]]; then
            echo "COVERAGE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "COVERAGE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Run SonarCloud
        shell: bash
        run: |
          sonar-scanner -Dsonar.projectBaseDir=${{ inputs.working_directory }} -Dsonar.projectKey=${{ inputs.sonar_project_key }} \
          $([[ "$COVERAGE_EXISTS" == "true" ]] && echo "-Dsonar.python.coverage.reportPaths=${{ inputs.working_directory }}/coverage.xml" || echo "")
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
          SONAR_TOKEN: ${{ inputs.sonar_token }}
