name: Test Backend
description: Run tests with coverage on Python backend

inputs:
  github_token:
    description: GitHub token for authentication
    required: true
  working_directory:
    description: Working directory for the module
    required: true
  docker_compose_services:
    description: Space-separated list of Docker Compose services (empty if not needed)
    required: false
  use_local_core:
    description: Use local core
    required: false
    default: 'false'
  install_ffmpeg:
    description: Install ffmpeg
    required: false
    default: 'false'
  python_version:
    description: Python version to install
    required: false
    default: '3.13'
  huggingface_api_key:
    description: HuggingFace API key for model downloads
    required: false
    default: ''
  regenerate_compose:
    description: Regenerate Docker Compose files
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: ${{ inputs.python_version }}

    # Cache Poetry installation
  - name: Cache Poetry installation
    uses: actions/cache@v4
    with:
      path: ~/.local
      key: ${{ runner.os }}-poetry-2.1.1
  - name: Install Poetry
    uses: snok/install-poetry@v1
    with:
      version: 2.1.1

    # Cache Poetry downloads - using a simpler key that doesn't require files to exist
  - name: Cache Poetry downloads
    uses: actions/cache@v4
    with:
      path: ~/.cache/pypoetry
      key: ${{ runner.os }}-poetry-cache-${{ inputs.working_directory }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working_directory),
        'poetry.lock') }}
      restore-keys: |
        ${{ runner.os }}-poetry-cache-${{ inputs.working_directory }}-
        ${{ runner.os }}-poetry-cache-

    # Cache HuggingFace models with dynamic key based on docker-compose content
  - name: Cache HuggingFace Models
    if: inputs.docker_compose_services != ''
    id: model-cache
    uses: actions/cache@v4
    with:
      path: |
        ./.docker-volumes/llamacpp-data
      key: ${{ runner.os }}-hf-models-${{ hashFiles('docker-compose.dev.yml') }}
      restore-keys: |
        ${{ runner.os }}-hf-models-

    # Report cache status
  - name: Report Model Cache Status
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      if [ "${{ steps.model-cache.outputs.cache-hit }}" == "true" ]; then
        echo "✅ HuggingFace models restored from cache!"
        echo "CACHE_HIT=true" >> $GITHUB_ENV
      else
        echo "📥 HuggingFace models will be downloaded (first run or docker-compose changed)"
        echo "CACHE_HIT=false" >> $GITHUB_ENV
      fi

    # Ensure volume directories exist with correct permissions
  - name: Prepare Volume Directories
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      mkdir -p ./.docker-volumes/llamacpp-data
      chmod 777 ./.docker-volumes/llamacpp-data
  - name: Configure Git Authentication
    shell: bash
    run: git config --global url."git@github.com:".insteadOf "https://github.com/"
  - name: Install Global Dependencies
    shell: bash
    run: poetry install --no-interaction --with dev --no-root
  - name: Generate Docker Compose files
    if: inputs.docker_compose_services != '' && inputs.regenerate_compose == 'true'
    shell: bash
    run: make generate-compose
  - name: Pre-pull Docker images (if services needed)
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      echo "${{ inputs.github_token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Pre-pull images in parallel to use cache effectively
      echo "Pre-pulling Docker images for faster startup..."
      docker compose -f docker-compose.dev.yml --env-file .env.dev pull --quiet ${{ inputs.docker_compose_services }} || true
  - name: Add HuggingFace token to environment variables
    if: inputs.huggingface_api_key != ''
    shell: bash
    run: |
      echo "HUGGINGFACE_API_KEY=${{ inputs.huggingface_api_key }}" >> .env.dev
  - name: Start Docker services (if needed)
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      docker compose -f docker-compose.dev.yml --env-file .env.dev up -d ${{ inputs.docker_compose_services }}
  - name: Use Local Core (without install)
    if: inputs.use_local_core == 'true'
    shell: bash
    run: |
      echo "Switching to local core dependencies without install..."
      make use-local-core-without-install
  - name: Update Poetry Lock and Install for Module
    if: inputs.use_local_core == 'true'
    shell: bash
    working-directory: ${{ inputs.working_directory }}
    run: |
      echo "Updating poetry.lock for ${{ inputs.working_directory }}..."
      poetry lock
      echo "Installing dependencies for ${{ inputs.working_directory }}..."
      poetry install --no-interaction --with dev --no-root
  - name: Install Module Dependencies (when not using local core)
    if: inputs.use_local_core != 'true'
    shell: bash
    working-directory: ${{ inputs.working_directory }}
    run: |
      echo "Installing dependencies for ${{ inputs.working_directory }}..."
      poetry install --no-interaction --with dev --no-root
  - name: Install FFmpeg
    if: inputs.install_ffmpeg == 'true'
    shell: bash
    run: make install-ffmpeg
    working-directory: ${{ inputs.working_directory }}
  - name: Setup environment variables for tests
    shell: bash
    run: |
      # Copy .env.dev to .env so that Pydantic BaseSettings can find it
      cp .env.dev .env
      echo "✅ Copied .env.dev to .env for test environment"
  - name: Wait for Docker services to become healthy
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      echo "Waiting for Docker services to become healthy..."

      # Check if Docker is running
      if ! docker info > /dev/null 2>&1; then
        echo "Error: Docker is not running or not accessible"
        exit 1
      fi

      # Show initial state of containers
      echo "Initial container status:"
      docker ps

      # Wait for at most 10 minutes for services to get healthy
      MAX_WAIT=600
      # Polling interval in seconds
      INTERVAL=5
      # Counter
      ELAPSED=0
      while [ $ELAPSED -lt $MAX_WAIT ]; do
        # Check if any containers are unhealthy - approach with fewer assumptions about output format
        UNHEALTHY_CONTAINERS=$(docker ps --format "{{.Names}}: {{.Status}}" | grep -i "unhealthy" || true)
        STARTING_CONTAINERS=$(docker ps --format "{{.Names}}: {{.Status}}" | grep -i "starting" || true)
        if [ -z "$UNHEALTHY_CONTAINERS" ] && [ -z "$STARTING_CONTAINERS" ]; then
          echo "All Docker services are in a healthy state!"
          docker ps
          break
        fi
        echo "Some containers are still starting or unhealthy:"
        [ -n "$UNHEALTHY_CONTAINERS" ] && echo "$UNHEALTHY_CONTAINERS" 
        [ -n "$STARTING_CONTAINERS" ] && echo "$STARTING_CONTAINERS"

        # Sleep for the polling interval
        sleep $INTERVAL
        ELAPSED=$((ELAPSED + INTERVAL))
        echo "Waited for $ELAPSED seconds out of $MAX_WAIT maximum..."
      done
      if [ $ELAPSED -ge $MAX_WAIT ]; then
        echo "⚠️ Timed out waiting for Docker services to become healthy after $MAX_WAIT seconds."
        docker ps
        echo "Continuing with tests anyway, but they may fail if services aren't ready."
      fi
  - name: Run Tests with Coverage and Generate Report
    shell: bash
    working-directory: ${{ inputs.working_directory }}
    run: |
      pytest_exit_code=0
      poetry run pytest -m "not azure and not flaky" --cov=. \
                       --cov-report=xml:coverage.xml \
                       --cov-report=term-missing \
                       --junitxml=pytest.xml || pytest_exit_code=$?
      if [[ $pytest_exit_code -eq 5 ]]; then
        echo "⚠️ No tests found! Creating an empty pytest.xml..."
        echo '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > pytest.xml
        echo "NO_TESTS_FOUND=true" >> $GITHUB_ENV
      elif [[ $pytest_exit_code -ne 0 ]]; then
        echo "❌ Some tests failed!"
        echo "TEST_FAIL=true" >> $GITHUB_ENV
      fi
  - name: Stop Docker services (if started)
    if: inputs.docker_compose_services != ''
    shell: bash
    run: |
      docker compose -f docker-compose.dev.yml down --remove-orphans
  - name: Upload Coverage Report
    uses: actions/upload-artifact@v4
    with:
      name: ${{ inputs.working_directory }}-coverage-report
      path: ${{ inputs.working_directory }}/coverage.xml
  - name: Upload Pytest Report
    uses: actions/upload-artifact@v4
    with:
      name: ${{ inputs.working_directory }}-pytest-report
      path: ${{ inputs.working_directory }}/pytest.xml
  - name: Publish Test Results
    uses: EnricoMi/publish-unit-test-result-action@v2
    if: always()
    with:
      files: |
        ${{ inputs.working_directory }}/pytest.xml
      check_name: ${{ inputs.working_directory }}
      comment_title: Test results for ${{ inputs.working_directory }}
  - name: Check if Tests Failed
    if: env.TEST_FAIL == 'true'
    shell: bash
    run: |-
      echo "Tests have failed!"
      exit 1
