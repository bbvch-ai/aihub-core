name: Test Backend
description: Run tests with coverage on Python backend

inputs:
  github_token:
    description: 'GitHub token for authentication'
    required: true
  working_directory:
    description: 'Working directory for the module'
    required: true
  docker_compose_paths:
    description: 'Comma-separated list of Docker Compose file paths (empty if not needed)'
    required: false
  use_local_core:
    description: 'Use local core'
    required: false
    default: 'false'

runs:
  using: "composite"

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '2.1.1'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'poetry'

    - name: Start Docker services (if needed)
      if: inputs.docker_compose_paths != ''
      shell: bash
      run: |
        IFS=',' read -ra COMPOSE_FILES <<< "${{ inputs.docker_compose_paths }}"
        DOCKER_COMPOSE_CMD="docker compose"
        for file in "${COMPOSE_FILES[@]}"; do
          DOCKER_COMPOSE_CMD+=" -f $file"
        done
        eval "$DOCKER_COMPOSE_CMD up -d"

    - name: Configure Git Authentication
      shell: bash
      run: git config --global url."git@github.com:".insteadOf "https://github.com/"

    - name: Validate Global Poetry Lock
      shell: bash
      run: poetry lock

    - name: Install Global Dependencies
      shell: bash
      run: poetry install --no-interaction --no-root

    - name: Use Local Core
      if: inputs.use_local_core == 'true'
      shell: bash
      run: poetry run make use-local-core

    - name: Validate Poetry Lock
      shell: bash
      run: poetry lock
      working-directory: ${{ inputs.working_directory }}

    - name: Install Dependencies
      shell: bash
      run: poetry install --no-interaction --no-root
      working-directory: ${{ inputs.working_directory }}

    - name: Wait for Docker services to become healthy
      if: inputs.docker_compose_paths != ''
      shell: bash
      run: |
        echo "Waiting for Docker services to become healthy..."

        # Maximum wait time in seconds (5 minutes)
        MAX_WAIT=300
        # Polling interval in seconds
        INTERVAL=5
        # Counter
        ELAPSED=0

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          # Check if any unhealthy containers exist
          # If a container has no health check, its status won't contain "(health:"
          UNHEALTHY_COUNT=$(docker ps | grep "(health:" | grep -v "healthy" | wc -l)

          if [ $UNHEALTHY_COUNT -eq 0 ]; then
            echo "All Docker services are healthy or don't have health checks!"
            docker ps
            break
          fi

          echo "Found $UNHEALTHY_COUNT containers still starting or unhealthy..."

          # Sleep for the polling interval
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
          echo "Waited for $ELAPSED seconds out of $MAX_WAIT maximum..."
        done

        if [ $ELAPSED -ge $MAX_WAIT ]; then
          echo "⚠️ Timed out waiting for Docker services to become healthy after $MAX_WAIT seconds."
          docker ps
          echo "Continuing with tests anyway, but they may fail if services aren't ready."
        fi

    - name: Run Tests with Coverage and Generate Report
      shell: bash
      run: |
        pytest_exit_code=0
        poetry run pytest -m "not azure" --cov=. \
                         --cov-report=xml:coverage.xml \
                         --cov-report=term-missing \
                         --junitxml=pytest.xml || pytest_exit_code=$?
        
        if [[ $pytest_exit_code -eq 5 ]]; then
          echo "⚠️ No tests found! Creating an empty pytest.xml..."
          echo '<?xml version="1.0" encoding="UTF-8"?><testsuites></testsuites>' > pytest.xml
          echo "NO_TESTS_FOUND=true" >> $GITHUB_ENV
        elif [[ $pytest_exit_code -ne 0 ]]; then
          echo "❌ Some tests failed!"
          echo "TEST_FAIL=true" >> $GITHUB_ENV
        fi
      working-directory: ${{ inputs.working_directory }}


    - name: Stop Docker services (if started)
      if: inputs.docker_compose_paths != ''
      shell: bash
      run: |
        IFS=',' read -ra COMPOSE_FILES <<< "${{ inputs.docker_compose_paths }}"
        DOCKER_COMPOSE_CMD="docker compose"
        for file in "${COMPOSE_FILES[@]}"; do
          DOCKER_COMPOSE_CMD+=" -f $file"
        done
        eval "$DOCKER_COMPOSE_CMD down"

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.working_directory }}-coverage-report
        path: ${{ inputs.working_directory }}/coverage.xml

    - name: Upload Pytest Report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.working_directory }}-pytest-report
        path: ${{ inputs.working_directory }}/pytest.xml

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ${{ inputs.working_directory }}/pytest.xml
        check_name: ${{ inputs.working_directory }}
        comment_title: Test results for ${{ inputs.working_directory }}

    - name: Check if Tests Failed
      if: env.TEST_FAIL == 'true'
      shell: bash
      run: |
        echo "Tests have failed!"
        exit 1
