[tool.poetry]
name = "aihub_process"
version = "v0.256.11"
description = "agentic process automation"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
    "Noah Hermann <noah.hermann@bbv.ch>",
]
license = "Proprietary"

[tool.poetry.dependencies]
python = ">=3.13, <3.14"
pydantic = "^2.10.3"
nats-py = "^2.9.0"
fastapi = "^0.128.0"
cachetools = "^5.5.0"
mongoengine = "^0.29.1"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
mypy = "^1.13.0"
toml-sort = "^0.24.2"
black = { extras = ["jupyter"], version = "^25.1.0" }
pytest-bdd = "^8.1.0"
pytest-cov = "^6.0.0"
asgi-lifespan = "^2.1.0"
pip-licenses = "^5.0.0"

[tool.poetry.dependencies.aihub_lib]
git = "https://github.com/bbvch-ai/aihub-core.git"
tag = "v0.256.11"
subdirectory = "aihub_lib"

[tool.poetry.group.dev.dependencies.aihub_agent]
path = "../aihub_agent"
develop = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "azure: mark tests that use Azure services",
    "self_hosted: mark tests that use self hosted services",
    "slow: mark a test as slow",
    "integration: mark a test as an integration test",
    "experimental: mark a test as experimental",
]
addopts = "--strict-markers"