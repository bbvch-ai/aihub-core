services:
  # ===================================================================
  # PostgreSQL Database
  # ===================================================================
  # Database for LiteLLM cost tracking and usage logs
  # ===================================================================
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2

  # ===================================================================
  # Traefik Reverse Proxy
  # ===================================================================
  # Provides HTTPS termination with Let's Encrypt and routing
  # ===================================================================
  traefik:
    container_name: traefik
    image: traefik:v3.6.2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/acme.json:/etc/traefik/acme.json"
    environment:
      TRAEFIK_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2

  # ===================================================================
  # vLLM - Model Server
  # ===================================================================
  # Serves the docling granite model via OpenAI-compatible API
  # ===================================================================
  vllm-docling:
    container_name: vllm-docling
    image: ghcr.io/bbvch-ai/aihub-core/vllm-openai:v0.11.0
    restart: always
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_API_KEY}
      CUDA_VISIBLE_DEVICES: "0"
    command: >
      --model ibm-granite/granite-docling-258M
      --served-model-name granite-docling
      --port 8000
      --host 0.0.0.0
      --max-model-len 8192
      --trust-remote-code
      --gpu-memory-utilization 0.60
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2

  # ===================================================================
  # LiteLLM - API Gateway
  # ===================================================================
  # Provides unified API with authentication and cost tracking
  # ===================================================================
  litellm:
    container_name: litellm
    image: ghcr.io/bbvch-ai/aihub-core/litellm:v1.79.1-stable
    restart: always
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm"
      STORE_MODEL_IN_DB: "false"
    volumes:
      - ./litellm/config.yml:/app/config.yml:ro
    command: --config /app/config.yml --detailed_debug
    depends_on:
      postgres:
        condition: service_healthy
      vllm-docling:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/health/liveliness"]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - "traefik.enable=true"
      # API endpoint
      - "traefik.http.routers.litellm.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls.certresolver=letsencrypt"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      # Security headers
      - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.routers.litellm.middlewares=security-headers"

  # ===================================================================
  # Docling Model Downloader (Init Container)
  # ===================================================================
  # Downloads all required models on first run, then exits
  # Runs before docling-serve to ensure models are available
  # ===================================================================
  docling-init:
    container_name: docling-init
    image: quay.io/docling-project/docling-serve-cu128:v1.9.0
    user: root
    volumes:
      - docling-models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /models/.initialized ]; then
          echo "Models already downloaded, skipping..."
        else
          echo "Downloading Docling models (layout, tableformer, code_formula, picture_classifier, rapidocr, easyocr)..."
          docling-tools models download layout tableformer code_formula picture_classifier rapidocr easyocr -o /models
          chown -R 1001:0 /models
          chmod -R g+rwX /models
          touch /models/.initialized
          echo "Models downloaded successfully!"
        fi
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2

  # ===================================================================
  # Docling Serve - Document Processing API
  # ===================================================================
  # Provides document conversion via Docling with GPU acceleration
  # Subdomain: serve.docling.ai-agents.ch
  # Auth: IP allowlist via Traefik middleware
  # Image: cu128 for CUDA 12.8+ (compatible with host CUDA 13.0)
  # Models: Pre-downloaded to avoid cache path issues with HuggingFace
  # ===================================================================
  docling-serve:
    container_name: docling-serve
    image: quay.io/docling-project/docling-serve-cu128:v1.9.0
    restart: always
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ARTIFACTS_PATH: /models
    volumes:
      - docling-models:/models
    depends_on:
      docling-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 2
    labels:
      - "traefik.enable=true"
      # Router on dedicated subdomain
      - "traefik.http.routers.docling-serve.rule=Host(`${DOCLING_SERVE_DOMAIN}`)"
      - "traefik.http.routers.docling-serve.entrypoints=websecure"
      - "traefik.http.routers.docling-serve.tls.certresolver=letsencrypt"
      - "traefik.http.services.docling-serve.loadbalancer.server.port=5001"
      # IP Allowlist middleware
      - "traefik.http.middlewares.docling-serve-ipallowlist.ipallowlist.sourcerange=${DOCLING_SERVE_ALLOWED_IPS}"
      # Security headers
      - "traefik.http.middlewares.docling-serve-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.docling-serve-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.docling-serve-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.docling-serve-headers.headers.stsPreload=true"
      # Apply middlewares
      - "traefik.http.routers.docling-serve.middlewares=docling-serve-ipallowlist,docling-serve-headers"

volumes:
  postgres-data:
    driver: local
  huggingface-cache:
    driver: local
  docling-models:
    driver: local