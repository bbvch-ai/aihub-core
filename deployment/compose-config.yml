# ===================================================================
# Single Source of Truth for Docker Compose Generation (v2)
# ===================================================================
# This lean configuration file contains ONLY the values that change
# between stages. All static structure and rendering logic now lives
# in the Jinja2 template.
#
# CONVENTIONS:
# 1. A service is ONLY included if an image_tag is defined for the
#    current stage/hardware. No tag = no service.
# 2. To build a service from source, use the special tag 'localbuild'.
# ===================================================================

global:
  registry_prefix: ghcr.io/bbvch-ai/aihub-core/
  volume_root: ${VOLUME_ROOT:-./.docker-volumes}

# -------------------------------------------------------------------
# Centralized Image Tag Management
# Defines which services exist in which stage and their versions.
# -------------------------------------------------------------------
image_tags:
  # --- Core Infrastructure (mostly static) ---
  seaweedfs: seaweedfs:3.97
  aws_cli: aws-cli-alpine:3.22.1
  etcd: etcd:v3.5.16
  milvus: milvus:v2.5.15
  attu: attu:v2.5.12
  postgres: pgvector:pg17
  phoenix: phoenix:version-10.0.4
  nats: nats:2.11.4
  valkey: valkey:8.0.5
  ferretdb: ferretdb:2.5.0
  presidio: presidio-analyzer:2.2.359 # Analyzer and Anonymizer use same tag
  litellm: litellm:main-v1.74.8-nightly
  docling: docling-serve-cpu:v1.7.2
  jupyter: minimal-notebook:notebook-7.0.6
  otel_collector: opentelemetry-collector-contrib:latest
  oauth2_proxy: oauth2-proxy:latest
  traefik: traefik:v3.4.4
  postgres_ferretdb: postgres-documentdb:17.0.106.0-ferretdb-2.5.0
  docling_model_permission: alpine  # Init container
  huggingface_tei: text-embeddings-inference:cpu-ipex-sha-c8ff435
  llama_cpp_reranker: llama.cpp:server-b6710
  oauth2proxy_dagster: bbvch-ai/oauth2-proxy:latest
  oauth2proxy_seaweed: bbvch-ai/oauth2-proxy:latest
  open_webui: open-webui:v0.6.22
  playwright: playwright:v1.54.1-jammy

  # --- GPU-Specific Services (only exist in 'dev' for now) ---
  llama_cpp:
    dev:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    local:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    nightly:
      gpu: llama.cpp:server-cuda-b6894

    latest:
      gpu: llama.cpp:server-cuda-b6894

  llama_cpp_embedding:
    dev:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    local:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    nightly:
      gpu: llama.cpp:server-cuda-b6894

    latest:
      gpu: llama.cpp:server-cuda-b6894

  llama_cpp_reranking:
    dev:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    local:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    nightly:
      gpu: llama.cpp:server-cuda-b6894

    latest:
      gpu: llama.cpp:server-cuda-b6894

  llama_cpp_docling:
    dev:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    local:
      cpu: llama.cpp:server-b6894
      gpu: llama.cpp:server-cuda-b6894

    nightly:
      gpu: llama.cpp:server-cuda-b6894

    latest:
      gpu: llama.cpp:server-cuda-b6894

  speaches:
    dev:
      cpu: speaches:0.8.3-cpu
      gpu: speaches:0.8.3-cuda-12.6.3

    local:
      cpu: speaches:0.8.3-cpu
      gpu: speaches:0.8.3-cuda-12.6.3

    nightly:
      gpu: speaches:0.8.3-cuda-12.6.3

    latest:
      gpu: speaches:0.8.3-cuda-12.6.3

  # --- Custom Application Services ---
  api:
    build: localbuild
    local: api:latest
    nightly: api:nightly
    latest: api:latest

  web:
    build: localbuild
    local: web:latest
    nightly: web:nightly
    latest: web:latest

  dagster:
    build: localbuild
    local: dagster:latest
    nightly: dagster:nightly
    latest: dagster:latest

  llm_wrapping_agent:
    build: localbuild
    local: llm_wrapping_agent:latest
    nightly: llm_wrapping_agent:nightly
    latest: llm_wrapping_agent:latest

  rag_agent:
    build: localbuild
    local: rag_agent:latest
    nightly: rag_agent:nightly
    latest: rag_agent:latest

  default_rag_pipeline:
    build: localbuild
    local: default_rag_pipeline:latest
    nightly: default_rag_pipeline:nightly
    latest: default_rag_pipeline:latest

  bot:
    build: localbuild
    local: bot:latest
    nightly: bot:nightly
    latest: bot:latest

# -------------------------------------------------------------------
# Service-Specific Configurations (only stage-varying configs)
# -------------------------------------------------------------------
service_configs:
  llama_cpp:
    dev:
      cpu:
        command: |
          -hf google/gemma-3-4b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-4b
          --port 8182
          --host 0.0.0.0
          -c 8196
      gpu:
        command: |
          -hf google/gemma-3-4b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-4b
          --port 8182
          --host 0.0.0.0
          -c 8196
          -ngl -1

    local:
      cpu:
        command: |
          -hf google/gemma-3-4b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-4b
          --port 8182
          --host 0.0.0.0
          -c 8196
      gpu:
        command: |
          -hf google/gemma-3-4b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-4b
          --port 8182
          --host 0.0.0.0
          -c 8196
          -ngl -1

    nightly:
      gpu:
        command: |
          -hf google/gemma-3-12b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-12b
          --port 128000
          --host 0.0.0.0
          -c 8196
          -ngl -1

    latest:
      gpu:
        command: |
          -hf google/gemma-3-12b-it-qat-q4_0-gguf
          --hf-token ${HUGGINGFACE_API_KEY}
          --alias gemma-3-12b
          --port 128000
          --host 0.0.0.0
          -c 8196
          -ngl -1
