services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_secure_password  # CHANGE THIS!
      POSTGRES_DB: litellm_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-network

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    ports:
      - "5001:3000"
    networks:
      - litellm-network
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - "5002:3000"
    networks:
      - litellm-network
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://litellm:litellm_secure_password@postgres:5432/litellm_db"
      LITELLM_MASTER_KEY: "sk-1234567890abcdef"  # CHANGE THIS!
      UI_USERNAME: "admin"
      UI_PASSWORD: "your_secure_password"  # CHANGE THIS!
      AZURE_OPENAI_KEY: "${AZURE_OPENAI_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      PRESIDIO_ANALYZER_API_BASE: "http://presidio-analyzer:3000"
      PRESIDIO_ANONYMIZER_API_BASE: "http://presidio-anonymizer:3000"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_SENDER_EMAIL: "${SMTP_SENDER_EMAIL}"
      SET_VERBOSE: "false"
    volumes:
      - ./litellm.yaml:/app/config.yaml
    command: --config /app/config.yaml --detailed_debug
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started  # Changed from service_healthy
      presidio-anonymizer:
        condition: service_started  # Changed from service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - litellm-network

volumes:
  postgres_data:
    driver: local

networks:
  litellm-network:
    driver: bridge