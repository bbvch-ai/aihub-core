# NGINX Ingress Controller Configuration
# This file contains the configuration for the NGINX Ingress Controller
# Install with: helm install ingress-nginx ingress-nginx/ingress-nginx --namespace ingress-nginx --create-namespace --values values.yaml

controller:
  # Service configuration
  service:
    type: LoadBalancer
    # LoadBalancer IP is set in environment-specific values files (values.prod.yaml, values.test.yaml)
    annotations:
      # Azure-specific annotations (not needed for OpenStack)
      # service.beta.kubernetes.io/azure-load-balancer-internal: "false"
      # service.beta.kubernetes.io/azure-dns-label-name: "aihub-ingress"
    
  # Controller configuration
  config:
    # Enable forwarded headers for proper client IP detection
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
    
    # Enable real IP from load balancer
    real-ip-header: "X-Forwarded-For"
    set-real-ip-from: "0.0.0.0/0"
    
    # SSL configuration
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-SHA256,ECDHE-RSA-AES256-SHA384"
    
    # Rate limiting
    rate-limit: "100"
    rate-limit-window: "1m"
    
    # Logging
    log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$proxy_protocol_addr", "x_forwarded_for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user": "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query": "$args", "request_length": $request_length, "duration": $request_time, "method": "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent", "upstream_addr": "$upstream_addr", "upstream_status": "$upstream_status", "upstream_response_time": "$upstream_response_time", "upstream_response_length": "$upstream_response_length", "upstream_cache_status": "$upstream_cache_status"}'
    
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Replica count
  replicaCount: 2
  
  # Node selector for high availability
  nodeSelector:
    kubernetes.io/os: linux
  
  # Tolerations for node taints
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
  
  # Affinity for pod distribution
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - ingress-nginx
          topologyKey: kubernetes.io/hostname
  
  # Admission webhook configuration - DISABLED
  admissionWebhooks:
    enabled: false

# Default backend (optional)
defaultBackend:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 50m
      memory: 50Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

# Metrics for monitoring
metrics:
  enabled: true
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "10254"
      prometheus.io/path: "/metrics"
  serviceMonitor:
    enabled: false  # Set to true if using Prometheus Operator


# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
