{{- if .Values.github.username }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.github.username .Values.github.token (printf "%s:%s" .Values.github.username .Values.github.token | b64enc) | b64enc }}
{{- end }}