{{- if .Values.llmWrappingAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.deploymentName" (dict "component" "llm-wrapping-agent" "Release" .Release) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-wrapping-agent
spec:
  replicas: {{ .Values.llmWrappingAgent.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm-wrapping-agent
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm-wrapping-agent
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: llm-wrapping-agent
        image: {{ .Values.llmWrappingAgent.image.repository }}:{{ .Values.llmWrappingAgent.image.tag }}
        imagePullPolicy: {{ .Values.llmWrappingAgent.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        - name: NATS_ENDPOINT
          value: "nats://{{ include "aihub.serviceName" (dict "component" "nats" "Release" .Release) }}:4222"
        - name: REDIS_URL
          value: "redis://{{ include "aihub.serviceName" (dict "component" "redis" "Release" .Release) }}:6379"
        - name: PHOENIX_ENDPOINT
          value: "http://{{ include "aihub.serviceName" (dict "component" "phoenix" "Release" .Release) }}:6006"
        - name: LITE_LLM_PROXY_BASE_URL
          value: "http://{{ include "aihub.serviceName" (dict "component" "litellm" "Release" .Release) }}:4000"
        - name: LITE_LLM_PROXY_API_KEY
          valueFrom:
            configMapKeyRef:
              name: {{ include "aihub.fullname" . }}-env
              key: LITELLM_MASTER_KEY
        resources:
          {{- toYaml .Values.llmWrappingAgent.resources | nindent 10 }}
      volumes:
      {{- include "aihub.commonVolumes" . | nindent 6 }}
{{- end }}
