{{- if .Values.defaultRagPipeline.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "default-rag-pipeline-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: default-rag-pipeline
type: Opaque
data:
  S3_STORAGE_ACCESS_KEY: {{ .Values.minio.env.MINIO_ROOT_USER | b64enc }}
  S3_STORAGE_SECRET_KEY: {{ .Values.minio.env.MINIO_ROOT_PASSWORD | b64enc }}
  S3_STORAGE_URL_SIGNING_SECRET: {{ .Values.minio.env.MINIO_URL_SIGNING_SECRET | b64enc }}
  POSTGRES_USER: {{ .Values.postgres.env.POSTGRES_USER | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc }}
  MONGO_USERNAME: {{ .Values.mongo.env.MONGO_USERNAME | b64enc }}
  MONGO_PASSWORD: {{ .Values.mongo.env.MONGO_PASSWORD | b64enc }}
  LITELLM_MASTER_KEY: {{ .Values.litellm.env.LITELLM_MASTER_KEY | b64enc }}
{{- end }}
