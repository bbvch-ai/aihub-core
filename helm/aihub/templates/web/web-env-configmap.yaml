{{- if .Values.web.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aihub.fullname" (dict "component" "web-env" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  # Web configuration
  WEBUI_URL: "https://openwebui.{{ .Values.global.domain }}"
  WS_ENDPOINT: "wss://{{ .Values.global.domain }}/api/v1/event/ws"
{{- end }}
