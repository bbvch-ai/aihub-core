{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:

  name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
  - port: {{ .Values.web.service.port }}
    targetPort: 80
    protocol: TCP
    name: web
  selector:
    {{- include "aihub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
