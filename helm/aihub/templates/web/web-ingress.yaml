{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aihub.fullname" (dict "component" "web-ingress" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ include "aihub.fullname" (dict "component" "web-tls" "context" .) }}
      hosts:
        - "{{ .Values.global.domain }}"
        - "web.{{ .Values.global.domain }}"
  rules:
    - host: "{{ .Values.global.domain }}"
      http:
        paths:
          # Static assets (priority 2000 - Static files)
          - path: /_nuxt
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Auth routes (priority 750 - Language/locale routing)
          - path: /en/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /de/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /fr/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /it/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Index routes (priority 400 - Domain catch-all with path restrictions)
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /index.html
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /config.json
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Default catch-all (priority 100 - Default domain catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
    - host: "web.{{ .Values.global.domain }}"
      http:
        paths:
          # Static assets (priority 2000 - Static files)
          - path: /_nuxt
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Auth routes (priority 750 - Language/locale routing)
          - path: /en/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /de/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /fr/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /it/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Index routes (priority 400 - Domain catch-all with path restrictions)
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /index.html
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          - path: /config.json
            pathType: Exact
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
          # Default catch-all (priority 100 - Default domain catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
                port:
                  number: 80
{{- end }}
