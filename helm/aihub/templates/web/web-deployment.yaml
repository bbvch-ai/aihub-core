{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "web" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: web
        image: {{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}
        imagePullPolicy: {{ .Values.web.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Web ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "web-env" "context" .) }}
        # Sensitive environment variables from Web Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "web-secret" "context" .) }}
        ports:
        - containerPort: 80
          name: web
        resources:
          {{- toYaml .Values.web.resources | nindent 10 }}
      # No shared env-config volumes; all env is provided via values
{{- end }}
