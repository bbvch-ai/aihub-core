{{- if .Values.api.enabled }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aihub.fullname" (dict "component" "api-ingress" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ include "aihub.fullname" (dict "component" "api-tls" "context" .) }}
      hosts:
        - "{{ .Values.global.domain }}"
  rules:
    - host: "{{ .Values.global.domain }}"
      http:
        paths:
          # API endpoint (priority 6000 - Specific API endpoints)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "api" "context" .) }}
                port:
                  number: 8000
{{- end }}
{{- end }}

