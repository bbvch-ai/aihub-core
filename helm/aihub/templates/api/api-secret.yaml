{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "api-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
data:
  # Database credentials from mongo service
  MONGO_USERNAME: {{ .Values.mongo.env.MONGO_USERNAME | b64enc }}
  MONGO_PASSWORD: {{ .Values.mongo.env.MONGO_PASSWORD | b64enc }}
  
  # Authentication secrets from api service
  AUTH_OPEN_WEBUI_SIGNING_SECRET: {{ .Values.api.env.AUTH_OPEN_WEBUI_SIGNING_SECRET | b64enc }}
  AUTH_IDENTITY_PROVIDER: {{ .Values.api.env.AUTH_IDENTITY_PROVIDER | b64enc }}
  
  # OAuth configuration from oauth2proxy service
  OAUTH_CLIENT_ID: {{ .Values.oauth2proxy.env.OAUTH_CLIENT_ID | b64enc }}
  OAUTH_CLIENT_SECRET: {{ .Values.oauth2proxy.env.OAUTH_CLIENT_SECRET | b64enc }}
  OAUTH_AUTHORITY_URL: {{ .Values.oauth2proxy.env.OAUTH_AUTHORITY_URL | b64enc }}
  OAUTH_TENANT_ID: {{ .Values.oauth2proxy.env.OAUTH_TENANT_ID | b64enc }}
  
  # Superuser configuration from api service
  SUPERUSER_NAME: {{ .Values.api.env.SUPERUSER_NAME | b64enc }}
  SUPERUSER_EMAIL: {{ .Values.api.env.SUPERUSER_EMAIL | b64enc }}
  SUPERUSER_OID: {{ .Values.api.env.SUPERUSER_OID | b64enc }}
  SUPERUSER_TOKEN: {{ .Values.api.env.SUPERUSER_TOKEN | b64enc }}
  
  # API keys from litellm service
  LITELLM_MASTER_KEY: {{ .Values.litellm.env.LITELLM_MASTER_KEY | b64enc }}
{{- end }}
