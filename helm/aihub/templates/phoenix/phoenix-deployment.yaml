{{- if .Values.phoenix.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "phoenix" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: phoenix
spec:
  replicas: {{ .Values.phoenix.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: phoenix
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: phoenix
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: phoenix
        image: {{ .Values.phoenix.image.repository }}:{{ .Values.phoenix.image.tag }}
        imagePullPolicy: {{ .Values.phoenix.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        - name: PHOENIX_WORKING_DIR
          value: "/phoenix-data"
        envFrom:
        # Non-sensitive environment variables from Phoenix ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "phoenix-env" "context" .) }}
        # Sensitive environment variables from Phoenix Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "phoenix-secret" "context" .) }}
        ports:
        - containerPort: 6006
          name: phoenix
        volumeMounts:
        - name: phoenix-data
          mountPath: /phoenix-data
        resources:
          {{- toYaml .Values.phoenix.resources | nindent 10 }}
      volumes:
      - name: phoenix-data
        emptyDir: {}
{{- end }}
