{{- if .Values.ragAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "rag-agent" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-agent
spec:
  replicas: {{ .Values.ragAgent.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rag-agent
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rag-agent
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: rag-agent
        image: {{ .Values.ragAgent.image.repository }}:{{ .Values.ragAgent.image.tag }}
        imagePullPolicy: {{ .Values.ragAgent.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from RAG Agent ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "rag-agent-env" "context" .) }}
        # Sensitive environment variables from RAG Agent Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "rag-agent-secret" "context" .) }}
        resources:
          {{- toYaml .Values.ragAgent.resources | nindent 10 }}
      volumes:
{{- end }}
