{{- if .Values.ragAgent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "rag-agent-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-agent
type: Opaque
data:
  # LiteLLM API key from litellm service
  LITE_LLM_PROXY_API_KEY: {{ .Values.litellm.env.LITELLM_MASTER_KEY | b64enc }}
{{- end }}
