{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "minio" "Values" .Values "Release" .Release) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: {{ .Values.minio.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: minio
        image: {{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}
        imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        - name: MINIO_ROOT_USER
          value: "{{ .Values.minio.env.MINIO_ROOT_USER }}"
        - name: MINIO_ROOT_PASSWORD
          value: "{{ .Values.minio.env.MINIO_ROOT_PASSWORD }}"
        - name: MINIO_DEFAULT_BUCKETS
          value: "open-webui,milvus"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        {{- include "aihub.commonVolumeMounts" . | nindent 8 }}
        - name: minio-data
          mountPath: /minio-data
        - name: minio-entrypoint
          mountPath: /usr/local/bin/minio-entrypoint.sh
          subPath: minio-entrypoint.sh
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: {{ include "aihub.fullname" (dict "component" "minio-data" "Values" .Values "Release" .Release) }}
      - name: minio-entrypoint
        configMap:
          name: {{ include "aihub.fullname" .  }}-minio-entrypoint
          defaultMode: 0755
{{- end }}
