{{- if .Values.oauth2proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aihub.fullname" (dict "component" "oauth2proxy-env" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2proxy
data:
  # OAuth2Proxy configuration
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_COOKIE_SECURE: "false"
  OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
  OAUTH2_PROXY_UPSTREAMS: "http://{{ include "aihub.fullname" (dict "component" "dagster-webserver" "context" .) }}:3000"
  OAUTH2_PROXY_ALLOWED_GROUPS: "DagsterAdmin"
  OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "roles"
  OAUTH2_PROXY_PROVIDER: "oidc"
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: "https://aiagentsstpublicblobs.blob.core.windows.net/logos/Bbv-Logo_farbig.png"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_REDIRECT_URL: "https://dagster.{{ .Values.global.domain }}"
{{- end }}
