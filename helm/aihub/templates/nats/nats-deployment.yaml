{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aihub.fullname" (dict "component" "nats" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "aihub.fullname" (dict "component" "nats-headless" "context" .) }}
  replicas: {{ .Values.nats.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: nats
        image: {{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}
        imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        command:
        - nats-server
        - -c
        - /etc/nats/nats.conf
        ports:
        - containerPort: 4222
          name: nats
        - containerPort: 6222
          name: cluster
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.nats.resources | nindent 10 }}
      volumes:
      - name: nats-config
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "nats-config" "context" .) }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - {{ .Values.persistence.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
{{- end }}
