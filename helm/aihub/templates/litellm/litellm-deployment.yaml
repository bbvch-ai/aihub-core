{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "litellm" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: litellm
        image: {{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}
        imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
        args:
        - --config
        - /app/config.yaml
        - --detailed_debug
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Litellm ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "litellm-env" "context" .) }}
        # Sensitive environment variables from Litellm Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "litellm-secret" "context" .) }}
        ports:
        - containerPort: 4000
          name: litellm
        volumeMounts:
        - name: litellm-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        resources:
          {{- toYaml .Values.litellm.resources | nindent 10 }}
      volumes:
      - name: litellm-config
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "litellm-config" "context" .) }}
{{- end }}
