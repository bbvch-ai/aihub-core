{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "litellm" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litellm
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: litellm
        image: {{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}
        imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Litellm ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "litellm-env" "context" .) }}
        # Sensitive environment variables from Litellm Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "litellm-secret" "context" .) }}
        ports:
        - containerPort: 4000
          name: litellm
        volumeMounts:
        - name: litellm-config
          mountPath: /app/config.yaml
          subPath: config.yaml
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.litellm.resources | nindent 10 }}
      volumes:
      - name: litellm-config
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "litellm-config" "context" .) }}
{{- end }}
