{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "litellm-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
type: Opaque
data:
  # Database credentials from postgres service
  POSTGRES_USER: {{ .Values.postgres.env.POSTGRES_USER | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc }}
  
  # Litellm credentials from litellm service
  LITELLM_MASTER_KEY: {{ .Values.litellm.env.LITELLM_MASTER_KEY | b64enc }}
  LITELLM_UI_USERNAME: {{ .Values.litellm.env.LITELLM_UI_USERNAME | b64enc }}
  LITELLM_UI_PASSWORD: {{ .Values.litellm.env.LITELLM_UI_PASSWORD | b64enc }}
  
  # API keys from litellm service
  AZURE_OPENAI_KEY: {{ .Values.litellm.env.AZURE_OPENAI_KEY | b64enc }}
  AZURE_OPENAI_KEY_IMAGE: {{ .Values.litellm.env.AZURE_OPENAI_KEY_IMAGE | b64enc }}
  AZURE_OPENAI_KEY_AUDIO: {{ .Values.litellm.env.AZURE_OPENAI_KEY_AUDIO | b64enc }}
  GEMINI_API_KEY: {{ .Values.litellm.env.GEMINI_API_KEY | b64enc }}
{{- end }}
