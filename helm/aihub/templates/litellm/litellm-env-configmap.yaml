{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aihub.fullname" (dict "component" "litellm-env" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
data:
  # Service endpoints
  PRESIDIO_ANALYZER_API_BASE: "http://{{ include "aihub.fullname" (dict "component" "presidio-analyzer" "context" .) }}:3000"
  PRESIDIO_ANONYMIZER_API_BASE: "http://{{ include "aihub.fullname" (dict "component" "presidio-anonymizer" "context" .) }}:3000"
  
  # Configuration
  SET_VERBOSE: "false"
{{- end }}
