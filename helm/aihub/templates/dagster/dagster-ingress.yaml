{{- if .Values.dagsterWebserver.enabled }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aihub.fullname" (dict "component" "dagster-ingress" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ include "aihub.fullname" (dict "component" "dagster-tls" "context" .) }}
      hosts:
        - "dagster.{{ .Values.global.domain }}"
  rules:
    - host: "dagster.{{ .Values.global.domain }}"
      http:
        paths:
          # Dagster service (priority 1000 - Service-specific catch-all routes)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "dagster-webserver" "context" .) }}
                port:
                  number: 4180
{{- end }}
{{- end }}
