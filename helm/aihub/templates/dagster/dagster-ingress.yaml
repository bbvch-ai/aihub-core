{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aihub.fullname" . }}-dagster-ingress
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ include "aihub.fullname" . }}-dagster-tls
      hosts:
        - "dagster.{{ .Values.global.domain }}"
  rules:
    - host: "dagster.{{ .Values.global.domain }}"
      http:
        paths:
          # Dagster service (priority 1000 - Service-specific catch-all routes)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" . }}-dagster-webserver
                port:
                  number: 4180
{{- end }}
