{{- if .Values.dagsterDaemon.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "dagster-daemon" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: dagster-daemon
spec:
  replicas: {{ .Values.dagsterDaemon.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dagster-daemon
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dagster-daemon
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: dagster-daemon
        image: {{ .Values.dagsterDaemon.image.repository }}:{{ .Values.dagsterDaemon.image.tag }}
        imagePullPolicy: {{ .Values.dagsterDaemon.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        command:
        - dagster-daemon
        - run
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Dagster ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "dagster-env" "context" .) }}
        # Sensitive environment variables from Dagster Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "dagster-secret" "context" .) }}
        volumeMounts:
        - name: dagster-data
          mountPath: /dagster_home
        - name: dagster-config
          mountPath: /dagster_home/dagster.yaml
          subPath: dagster.yaml
        - name: dagster-workspace
          mountPath: /dagster_home/workspace.yaml
          subPath: workspace.yaml
        resources:
          {{- toYaml .Values.dagsterDaemon.resources | nindent 10 }}
      volumes:
      - name: dagster-data
        persistentVolumeClaim:
          claimName: {{ include "aihub.fullname" (dict "component" "dagster-data" "context" .) }}
      - name: dagster-config
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "dagster-config" "context" .) }}
      - name: dagster-workspace
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "dagster-workspace" "context" .) }}
{{- end }}
