{{- if .Values.dagsterWebserver.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "dagster-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: dagster
type: Opaque
data:
  # Database credentials from postgres service
  POSTGRES_USER: {{ .Values.postgres.env.POSTGRES_USER | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc }}
{{- end }}
