{{- if .Values.jupyter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "jupyter" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: jupyter
spec:
  replicas: {{ .Values.jupyter.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jupyter
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jupyter
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      containers:
      - name: jupyter
        image: {{ .Values.jupyter.image.repository }}:{{ .Values.jupyter.image.tag }}
        imagePullPolicy: {{ .Values.jupyter.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Jupyter ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "jupyter-env" "context" .) }}
        # Sensitive environment variables from Jupyter Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "jupyter-secret" "context" .) }}
        ports:
        - containerPort: 8888
          name: jupyter
        volumeMounts:
        - name: jupyter-data
          mountPath: /home/jovyan/work
        resources:
          {{- toYaml .Values.jupyter.resources | nindent 10 }}
      volumes:
      - name: jupyter-data
        persistentVolumeClaim:
          claimName: {{ include "aihub.fullname" (dict "component" "jupyter-data" "context" .) }}
{{- end }}
