{{- if .Values.jupyter.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aihub.fullname" (dict "component" "jupyter" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: jupyter
spec:
  serviceName: {{ include "aihub.fullname" (dict "component" "jupyter" "context" .) }}
  replicas: {{ .Values.jupyter.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jupyter
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jupyter
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: jupyter
        image: {{ .Values.jupyter.image.repository }}:{{ .Values.jupyter.image.tag }}
        imagePullPolicy: {{ .Values.jupyter.image.pullPolicy }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from Jupyter ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "jupyter-env" "context" .) }}
        # Sensitive environment variables from Jupyter Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "jupyter-secret" "context" .) }}
        ports:
        - containerPort: 8888
          name: jupyter
        volumeMounts:
        - name: jupyter-data
          mountPath: /home/jovyan/work
        resources:
          {{- toYaml .Values.jupyter.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: jupyter-data
    spec:
      accessModes:
      - {{ .Values.persistence.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
{{- end }}
