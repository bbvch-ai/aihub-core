{{- if .Values.presidioAnonymizer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "presidio-anonymizer" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: presidio-anonymizer
spec:
  replicas: {{ .Values.presidioAnonymizer.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: presidio-anonymizer
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: presidio-anonymizer
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: presidio-anonymizer
        image: {{ .Values.presidioAnonymizer.image.repository }}:{{ .Values.presidioAnonymizer.image.tag }}
        imagePullPolicy: {{ .Values.presidioAnonymizer.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        ports:
        - containerPort: 3000
          name: anonymizer
        resources:
          {{- toYaml .Values.presidioAnonymizer.resources | nindent 10 }}
      volumes:
{{- end }}
