{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.deploymentName" (dict "component" "mongo" "Release" .Release) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  replicas: {{ .Values.mongo.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongo
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongo
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: mongo
        image: {{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}
        imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        command:
        - mongod
        - --quiet
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "aihub.fullname" . }}-env
              key: MONGO_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: {{ include "aihub.fullname" . }}-env
              key: MONGO_PASSWORD
        ports:
        - containerPort: 27017
          name: mongo
        volumeMounts:
        {{- include "aihub.commonVolumeMounts" . | nindent 8 }}
        - name: mongo-data
          mountPath: /data/db
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.runCommand('ping').ok"
            - localhost:27017/test
            - --quiet
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.runCommand('ping').ok"
            - localhost:27017/test
            - --quiet
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.mongo.resources | nindent 10 }}
      volumes:
      {{- include "aihub.commonVolumes" . | nindent 6 }}
      - name: mongo-data
        persistentVolumeClaim:
          claimName: {{ include "aihub.pvcName" (dict "component" "mongo-data" "Release" .Release) }}
{{- end }}
