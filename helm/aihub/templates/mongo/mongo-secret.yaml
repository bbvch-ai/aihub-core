{{- if .Values.mongo.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "mongo-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
type: Opaque
data:
  # MongoDB credentials from mongo service
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongo.env.MONGO_USERNAME | b64enc }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongo.env.MONGO_PASSWORD | b64enc }}
{{- end }}
