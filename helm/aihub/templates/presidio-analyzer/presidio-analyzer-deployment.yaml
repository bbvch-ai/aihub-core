{{- if .Values.presidioAnalyzer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "presidio-analyzer" "Values" .Values "Release" .Release) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: presidio-analyzer
spec:
  replicas: {{ .Values.presidioAnalyzer.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: presidio-analyzer
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: presidio-analyzer
    spec:
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: presidio-analyzer
        image: {{ .Values.presidioAnalyzer.image.repository }}:{{ .Values.presidioAnalyzer.image.tag }}
        imagePullPolicy: {{ .Values.presidioAnalyzer.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        ports:
        - containerPort: 3000
          name: analyzer
        resources:
          {{- toYaml .Values.presidioAnalyzer.resources | nindent 10 }}
      volumes:
{{- end }}
