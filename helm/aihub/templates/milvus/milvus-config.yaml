{{- if .Values.milvus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aihub.fullname" (dict "component" "milvus-config" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: milvus
data:
  milvus.yaml: |
    # Milvus configuration
    common:
      security:
        authorizationEnabled: false
      defaultIndexType: "HNSW"
      defaultMetricType: "COSINE"
    
    etcd:
      endpoints:
        - "{{ include "aihub.fullname" (dict "component" "etcd" "context" .) }}:2379"
    
    minio:
      address: "{{ include "aihub.fullname" (dict "component" "minio" "context" .) }}"
      port: 9000
      accessKeyID: "${MINIO_ACCESS_KEY_ID}"
      secretAccessKey: "${MINIO_SECRET_ACCESS_KEY}"
      bucketName: "milvus"
      rootPath: "milvus"
{{- end }}
