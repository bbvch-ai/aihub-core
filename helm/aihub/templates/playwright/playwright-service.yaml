{{- if .Values.playwright.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aihub.fullname" (dict "component" "playwright" "Values" .Values "Release" .Release) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: playwright
spec:
  type: {{ .Values.playwright.service.type }}
  ports:
  - port: {{ .Values.playwright.service.port }}
    targetPort: 3000
    protocol: TCP
    name: playwright
  selector:
    {{- include "aihub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: playwright
{{- end }}
