{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aihub.fullname" (dict "component" "openwebui-ingress" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - secretName: {{ include "aihub.fullname" (dict "component" "openwebui-tls" "context" .) }}
      hosts:
        - "openwebui.{{ .Values.global.domain }}"
  rules:
    - host: "openwebui.{{ .Values.global.domain }}"
      http:
        paths:
          # Specific API auth endpoint (priority 7000 - Authentication APIs)
          - path: /api/v1/auths
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          # General API routes (priority 6000 - Specific API endpoints)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          # Static assets (priority 2000 - Static files)
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          - path: /_app
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          # Feature-specific paths (priority 3000 - Feature-specific paths)
          - path: /openwebui
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
          # Default catch-all (priority 500 - General routes)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
                port:
                  number: 8080
{{- end }}
