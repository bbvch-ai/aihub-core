{{- if .Values.openWebui.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aihub.fullname" (dict "component" "openwebui-secret" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
type: Opaque
data:
  # Log level from global configuration
  GLOBAL_LOG_LEVEL: {{ .Values.global.logLevel | b64enc }}
  
  # OAuth configuration from oauth2proxy service
  OAUTH_PROVIDER_NAME: {{ .Values.oauth2proxy.env.OAUTH_PROVIDER_NAME | b64enc }}
  OAUTH_CLIENT_ID: {{ .Values.oauth2proxy.env.OAUTH_CLIENT_ID | b64enc }}
  OAUTH_CLIENT_SECRET: {{ .Values.oauth2proxy.env.OAUTH_CLIENT_SECRET | b64enc }}
  OAUTH_AUTHORITY_URL: {{ .Values.oauth2proxy.env.OAUTH_AUTHORITY_URL | b64enc }}
  
  # MinIO credentials from minio service
  S3_ACCESS_KEY_ID: {{ .Values.minio.env.MINIO_ROOT_USER | b64enc }}
  S3_SECRET_ACCESS_KEY: {{ .Values.minio.env.MINIO_ROOT_PASSWORD | b64enc }}
  
  # Superuser token from api service
  SUPERUSER_TOKEN: {{ .Values.api.env.SUPERUSER_TOKEN | b64enc }}
  
  # Database credentials from postgres service
  DATABASE_USER: {{ .Values.postgres.env.POSTGRES_USER | b64enc }}
  DATABASE_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc }}
  
  # Jupyter token from jupyter service
  JUPYTER_TOKEN: {{ .Values.jupyter.env.JUPYTER_TOKEN | b64enc }}
  
  # Jina API key from api service
  JINA_API_KEY: {{ .Values.api.env.JINA_API_KEY | b64enc }}
{{- end }}
