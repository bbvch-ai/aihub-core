{{- if .Values.openWebui.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
spec:
  serviceName: {{ include "aihub.fullname" (dict "component" "openwebui" "context" .) }}
  replicas: {{ .Values.openWebui.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: openwebui
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openwebui
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      tolerations:
        {{- include "aihub.globalTolerations" . | nindent 8 }}
      containers:
      - name: openwebui
        image: {{ .Values.openWebui.image.repository }}:{{ .Values.openWebui.image.tag }}
        imagePullPolicy: {{ .Values.openWebui.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Non-sensitive environment variables from OpenWebUI ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "openwebui-env" "context" .) }}
        # Sensitive environment variables from OpenWebUI Secret
        - secretRef:
            name: {{ include "aihub.fullname" (dict "component" "openwebui-secret" "context" .) }}
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        resources:
          {{- toYaml .Values.openWebui.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "aihub.labels" . | nindent 8 }}
        app.kubernetes.io/component: openwebui
    spec:
      accessModes:
        - {{ .Values.persistence.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
{{- end }}


