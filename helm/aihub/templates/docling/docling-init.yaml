{{- if .Values.docling.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aihub.fullname" (dict "component" "docling-init" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: docling
data:
  init-models.sh: |
    #!/bin/bash
    set -e
    set -u

    MODEL_DIR="${DOCLING_SERVE_ARTIFACTS_PATH:-/models}"
    REQUIRED_MODELS="layout tableformer code_formula easyocr"
    EASYOCR_DETECTOR="craft_mlt_25k.pth"

    function check_and_download_models() {
      echo "Checking models in directory: $MODEL_DIR"

      # Try to create directory if it doesn't exist
      if [ ! -d "$MODEL_DIR" ]; then
        if ! mkdir -p "$MODEL_DIR" 2>/dev/null; then
          echo "Warning: Cannot create $MODEL_DIR directory (permission denied). It should be created by Docker volume mount."
        fi
      fi

      # Test if we can write to the directory
      if ! touch "$MODEL_DIR/.write_test" 2>/dev/null; then
        echo "Error: Cannot write to $MODEL_DIR. Please check volume permissions."
        echo "The directory might need to be writable by the container user."
        exit 1
      fi
      rm -f "$MODEL_DIR/.write_test"

      # Check if EasyOCR detector model exists
      NEEDS_DOWNLOAD=false
      if [ ! -f "$MODEL_DIR/EasyOcr/$EASYOCR_DETECTOR" ]; then
        echo "EasyOCR detector model missing. Will download all models."
        NEEDS_DOWNLOAD=true
      fi

      # Check if the models directory is empty
      if [ -z "$(ls -A $MODEL_DIR 2>/dev/null)" ]; then
        echo "Models directory is empty. Will download all models."
        NEEDS_DOWNLOAD=true
      fi

      if [ "$NEEDS_DOWNLOAD" = true ]; then
        echo "Downloading required models..."
        echo "Models to download: $REQUIRED_MODELS"

        # Download the required models
        docling-tools models download $REQUIRED_MODELS -o "$MODEL_DIR"

        if [ $? -eq 0 ]; then
          echo "Models downloaded successfully!"
        else
          echo "Error downloading models. Exiting..."
          exit 1
        fi
      else
        echo "All required models present in $MODEL_DIR, skipping download."
      fi
    }

    # Main execution
    echo "Starting Docling Serve initialization..."
    check_and_download_models

    # Execute the main docling-serve command
    echo "Starting Docling Serve..."
    exec docling-serve run "$@"
{{- end }}
