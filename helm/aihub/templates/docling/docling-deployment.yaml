{{- if .Values.docling.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aihub.fullname" (dict "component" "docling" "context" .) }}
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
    app.kubernetes.io/component: docling
spec:
  replicas: {{ .Values.docling.replicas }}
  selector:
    matchLabels:
      {{- include "aihub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: docling
  template:
    metadata:
      labels:
        {{- include "aihub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: docling
    spec:
      {{- include "aihub.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "aihub.podSecurityContext" . | nindent 8 }}
      containers:
      - name: docling
        image: {{ .Values.docling.image.repository }}:{{ .Values.docling.image.tag }}
        imagePullPolicy: {{ .Values.docling.image.pullPolicy }}
        securityContext:
          {{- include "aihub.securityContext" . | nindent 10 }}
        env:
        {{- include "aihub.commonEnv" . | nindent 8 }}
        envFrom:
        # Environment variables from Docling ConfigMap
        - configMapRef:
            name: {{ include "aihub.fullname" (dict "component" "docling-env" "context" .) }}
        ports:
        - containerPort: 5001
          name: docling
        volumeMounts:
        - name: docling-data
          mountPath: /models
        - name: docling-init
          mountPath: /docker-entrypoint.sh
          subPath: init-models.sh
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          {{- toYaml .Values.docling.resources | nindent 10 }}
      volumes:
      - name: docling-data
        persistentVolumeClaim:
          claimName: {{ include "aihub.fullname" (dict "component" "docling-data" "context" .) }}
      - name: docling-init
        configMap:
          name: {{ include "aihub.fullname" (dict "component" "docling-init" "context" .) }}
          defaultMode: 0755
{{- end }}
