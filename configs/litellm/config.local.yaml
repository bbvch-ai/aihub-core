model_list:
  - model_name: text-generation/small
    litellm_params:
      model: openai/gemma-3-4b
      api_base: http://llama-cpp:8182/
      api_key: XXX
    model_info:
      mode: chat

  - model_name: embedding
    litellm_params:
      model: openai/qwen-3-embedding
      api_base: http://llama-cpp-embedding:8182/
      api_key: XXX
    model_info:
      mode: embedding

  - model_name: reranking
    litellm_params:
      model: jina/qwen-3-reranking
      api_base: http://llama-cpp-reranking:8182/
      api_key: XXX
    model_info:
      mode: chat

  - model_name: whisper
    litellm_params:
      model: openai/whisper-small
      api_base: http://speaches:8000/
      api_key: XXX
    model_info:
      mode: audio_transcription
      base_model: openai/gpt-4o-mini-transcribe

  - model_name: kokoro
    litellm_params:
      model: openai/kokoro-82m
      api_base: http://speaches:8000/
      api_key: XXX
    model_info:
      mode: audio_speech
      base_model: openai/gpt-4o-mini-tts

guardrails:
  - guardrail_name: presidio-mask-guard
    litellm_params:
      guardrail: presidio
      default_on: true
      mode: pre_call
      presidio_language: de
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
      output_parse_pii: true
      pii_entities_config:
        PERSON: MASK
        EMAIL_ADDRESS: MASK

  - guardrail_name: presidio-block-guard
    litellm_params:
      guardrail: presidio
      default_on: true
      mode: pre_call
      presidio_language: de
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
      output_parse_pii: true
      pii_entities_config:
        CREDIT_CARD: BLOCK

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: 365d
  maximum_spend_logs_retention_interval: 30d

litellm_settings:
  callbacks: ["detect_prompt_injection", "otel"]
  default_fallbacks: ["text-generation/small"]
  telemetry: true
  json_logs: true

router_settings:
  routing_strategy: "usage-based-routing-v2"
  retry_policy:
    "TimeoutErrorRetries": 2
    "RateLimitErrorRetries": 3
    "InternalServerErrorRetries": 2
  allowed_fails: 3
  cooldown_time: 30