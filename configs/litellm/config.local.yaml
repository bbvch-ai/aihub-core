model_list:
  - model_name: text-generation/nano
    litellm_params:
      model: azure/gpt-5-nano
      api_base: https://aihub-dev-openai-swe-whisper.openai.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: "2025-01-01-preview"
    model_info:
      mode: chat
  - model_name: text-generation/mini
    litellm_params:
      model: azure/gpt-5-mini
      api_base: https://aihub-dev-openai-che.openai.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: "2025-04-01-preview"
    model_info:
      mode: chat

  - model_name: text-generation/large
    litellm_params:
      model: azure/gpt-5
      api_base: https://aihub-dev-openai-che.openai.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: "2025-01-01-preview"
    model_info:
      mode: chat

  - model_name: embedding/large
    litellm_params:
      model: azure/text-embedding-3-large
      api_base: https://aihub-dev-openai-che.openai.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY
      api_version: "2024-02-01"
    model_info:
      mode: embedding

  - model_name: image-generation
    litellm_params:
      model: azure/dall-e-3
      api_base: https://joelb-mdotxdzc-australiaeast.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY_IMAGE
      api_version: "2024-02-01"
    model_info:
      mode: image_generation
      base_model: azure/dall-e-3

  - model_name: transcription
    litellm_params:
      model: azure/gpt-4o-mini-transcribe
      api_base: https://joelb-mdpmzqib-eastus2.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY_AUDIO
      api_version: "2025-03-01-preview"
    model_info:
      mode: audio_transcription
      base_model: azure/gpt-4o-mini-transcribe

  - model_name: speech
    litellm_params:
      model: azure/gpt-4o-mini-tts
      api_base: https://joelb-mdpmzqib-eastus2.cognitiveservices.azure.com/
      api_key: os.environ/AZURE_OPENAI_KEY_AUDIO
      api_version: "2025-03-01-preview"
    model_info:
      mode: audio_speech
      base_model: azure/gpt-4o-mini-tts

guardrails:
  - guardrail_name: "presidio-mask-guard"
    litellm_params:
      guardrail: presidio
      default_on: true
      mode: "pre_call"
      presidio_language: ["en", "es", "fr", "de", "it"]
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
      output_parse_pii: true
      pii_entities_config:
        PERSON: "MASK"
        EMAIL_ADDRESS: "MASK"

  - guardrail_name: "presidio-block-guard"
    litellm_params:
      guardrail: presidio
      default_on: true
      mode: "pre_call"
      presidio_language: ["en", "es", "fr", "de", "it"]
      presidio_analyzer_api_base: os.environ/PRESIDIO_ANALYZER_API_BASE
      presidio_anonymizer_api_base: os.environ/PRESIDIO_ANONYMIZER_API_BASE
      output_parse_pii: true
      pii_entities_config:
        CREDIT_CARD: "BLOCK"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "365d"
  maximum_spend_logs_retention_interval: "30d"

litellm_settings:
  callbacks: ["detect_prompt_injection", "otel"]
  default_fallbacks: ["azure/gpt-4o-mini"]
  telemetry: true
  json_logs: true

router_settings:
  routing_strategy: "usage-based-routing-v2"
  retry_policy:
    "TimeoutErrorRetries": 2
    "RateLimitErrorRetries": 3
    "InternalServerErrorRetries": 2
  allowed_fails: 3
  cooldown_time: 30