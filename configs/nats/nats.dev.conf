# NATS Server Configuration for Node 1 (Seed)
debug: false
trace: false
trace_verbose: false
logtime: true

# Server identity
server_name: nats-1

# Client connections
listen: 0.0.0.0:4222

# Monitoring
http: 8222

# Performance settings
max_control_line: 4KB
max_payload: 1MB
max_pending: 1GB
max_connections: 128
ping_interval: "2m"
ping_max: 2
write_deadline: "10s"

# JetStream configuration
jetstream {
  store_dir: "/data/nats/js-store"
  domain: "dev"
  sync_interval: "2m"
}
