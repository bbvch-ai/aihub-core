receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    metrics: # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/dockerstatsreceiver/documentation.md
      container.cpu.utilization:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.cpu.logical.count:
        enabled: true
      container.memory.percent:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.network.io.usage.rx_dropped:
        enabled: true
      container.network.io.usage.tx_dropped:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.restarts:
        enabled: true

  # Docker container stdout/stderr (json-file driver)
  filelog/docker:
    include: [ /var/lib/docker/containers/*/*-json.log ]
    start_at: end
    poll_interval: 200ms
    operators:
      - id: docker-container
        type: container
        format: docker

  # Structured health_status events from sidecar
  filelog/docker_health_events:
    include: [ /var/log/docker-health/events.ndjson ]
    start_at: end
    operators:
      # Parse the JSON line and place fields directly into log attributes
      - type: json_parser
        parse_from: body
        parse_to: attributes
      # Tag these records so you can filter in SigNoz
      - type: add
        field: attributes.log_type
        value: docker_health_event

processors:
  batch: {}
  attributes/docker_common:
    actions:
      - key: telemetry.source
        value: docker
        action: upsert

  resourcedetection/docker:
    detectors: [env, docker]
    timeout: 2s
    override: false

  attributes/common:
    actions:
      - key: deployment.environment
        value: prod
        action: upsert
      - key: telemetry.source
        value: docker
        action: upsert

  resource/docker:
    attributes:
      - key: service.name
        from_attribute: container.name
        action: upsert
      - key: service.version
        from_attribute: container.image.tag
        action: upsert


exporters:
  otlp/signoz:
    endpoint: "${SIGNOZ_INGESTION_CLOUD_ENDPOINT}"
    headers:
      signoz-ingestion-key: "${SIGNOZ_INGESTION_KEY}"
    tls:
      insecure: false

  logging:
    loglevel: debug

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]
    metrics/docker:
      receivers: [ docker_stats ]
      processors: [ resourcedetection/docker, resource/docker, batch ]
      exporters: [ otlp/signoz ]
    logs/docker:
      receivers: [ filelog/docker, filelog/docker_health_events ]
      processors: [ attributes/docker_common, batch ]
      exporters: [ otlp ]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]