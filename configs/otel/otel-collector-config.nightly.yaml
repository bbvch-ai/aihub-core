receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    metrics: # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/dockerstatsreceiver/documentation.md
      container.cpu.utilization:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.cpu.logical.count:
        enabled: true
      container.memory.percent:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.network.io.usage.rx_dropped:
        enabled: true
      container.network.io.usage.tx_dropped:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.restarts:
        enabled: true
  exec/docker_events:
    commands:
      - name: docker_health_events
        command: ["/usr/bin/docker","events",
                  "--filter","type=container",
                  "--filter","event=health_status",
                  "--format","{{json .}}"]   # JSON lines
        restart: true
processors:
  batch:

  resourcedetection/docker:
    detectors: [env, docker]
    timeout: 2s
    override: false


  resource/docker:
    attributes:
      - key: service.name
        from_attribute: container.name
        action: upsert
      - key: service.version
        from_attribute: container.image.tag
        action: upsert

  transform/health_logs:
    log_statements:
      - context: log
        statements:
          - set(_raw, body)
          - set(body, parse_json(body)) where IsString(body) and len(body) > 0
          - set(attributes["container_name"], body["Actor"]["Attributes"]["name"]) where body != nil and body["Type"] == "container"
          - set(attributes["docker_action"], body["Action"])                      where body != nil and body["Type"] == "container"
          - set(attributes["event_type"], "docker_health")                         where body != nil and body["Type"] == "container"
          - set(severity_text, "INFO")
  resource/health_logs_service:
    attributes:
      - key: service.name
        value: docker-health-events
        action: upsert


exporters:
  otlp/signoz:
    endpoint: "${SIGNOZ_INGESTION_CLOUD_ENDPOINT}"
    headers:
      signoz-ingestion-key: "${SIGNOZ_INGESTION_KEY}"
    tls:
      insecure: false

  logging:
    loglevel: debug

extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]
    metrics/docker:
      receivers: [ docker_stats ]
      processors: [ resourcedetection/docker, resource/docker, batch ]
      exporters: [ otlp/signoz ]
    logs/docker_health:
      receivers: [exec/docker_events]
      processors: [resource/health_logs_service, transform/health_logs, batch]
      exporters: [logging, otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz]