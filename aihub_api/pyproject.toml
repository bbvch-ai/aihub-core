[tool.poetry]
name = "aihub_api"
version = "v0.153.0"
description = "api core"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
]
license = "Proprietary"

[tool.poetry.dependencies]
python = ">=3.11, <3.12"
pydantic = "^2.10.3"
nats-py = "^2.9.0"
colorlog = "^6.9.0"
fastapi = "^0.115.6"
cachetools = "^5.5.0"
mongoengine = "^0.29.1"
azure-identity = "^1.19.0"
azure-mgmt-cosmosdb = "^9.7.0"
azure-mgmt-resource = "^23.2.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
httpx = "^0.28.1"
cryptography = "^44.0.0"
pyjwt = "^2.10.1"
llama-index-embeddings-text-embeddings-inference = "^0.3.2"
python-multipart = "^0.0.20"
stringcase = "^1.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
isort = "^5.13.2"
mypy = "^1.13.0"
toml-sort = "^0.24.2"
black = { extras = ["jupyter"], version = "^24.10.0" }
pytest-bdd = "^8.1.0"
pytest-cov = "^6.0.0"
asgi-lifespan = "^2.1.0"

[tool.poetry.dependencies.aihub_lib]
git = "https://github.com/bbvch-ai/aihub-core.git"
tag = "v0.153.0"
subdirectory = "aihub_lib"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

