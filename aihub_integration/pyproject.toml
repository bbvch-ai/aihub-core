[tool.poetry]
name = "aihub-integrations"
version = "v0.1.0"
description = "aihub integrations"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
    "Noah Hermann <noah.hermann@bbv.ch>",
]
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13, <3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
mypy = "^1.13.0"
toml-sort = "^0.24.2"
black = { extras = ["jupyter"], version = "^25.1.0" }
pytest-bdd = "^8.1.0"
pytest-cov = "^6.0.0"
asgi-lifespan = "^2.1.0"
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mdformat]
extensions = ["vuepress", "frontmatter", "gfm", "myst"]
exclude = [
    "node_modules",
    ".pnpm",
    ".venv",
    "dist",
    "local_volumes",
    ".idea",
    "venv",
    ".git"
]
wrap = 120
number = true
end_of_line = "lf"