[tool.poetry]
name = "aihub_pipeline"
version = "v0.256.2"
description = "pipeline core"
authors = [
    "Joel Barmettler <joel.barmettler@bbv.ch>",
    "Marius Högger <marius.hoegger@bbv.ch>",
    "Michèle Fundneider <michele.fundneider@bbv.ch>",
    "Thomas Mannhart <thomas.mannhart@bbv.ch>",
    "Noah Hermann <noah.hermann@bbv.ch>",
]
license = "Proprietary"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13, <3.14"
dagster-webserver = "^1.11.2"
dagster-postgres = "^0.27.2"
dagster-azure = "^0.27.2"
dagster-aws = "^0.27.2"
llama-index-readers-file = "^0.4.1"
matplotlib = "^3.9.2"
adlfs = "^2024.12.0"
lxml = "^5.4.0"
s3fs = "^2024.12.0"
boto3 = "^1.35.0"

[tool.poetry.dependencies.aihub_lib]
git = "https://github.com/bbvch-ai/aihub-core.git"
tag = "v0.256.2"
subdirectory = "aihub_lib"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.1"
mypy = "^1.13.0"
pytest-cov = "^6.0.0"
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
