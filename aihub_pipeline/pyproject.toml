[project]
name = "aihub-pipeline"
version = "0.263.1"
description = "pipeline core"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "LicenseRef-Proprietary"
readme = "README.md"
dependencies = [
    "aihub-core",
    "dagster-webserver>=1.11.2",
    "dagster-postgres>=0.27.2",
    "dagster-azure>=0.27.2",
    "dagster-aws>=0.27.2",
    "llama-index-readers-file>=0.5.6",
    "matplotlib>=3.9.2",
    "adlfs>=2025.8.0",
    "lxml>=5.4.0",
    "s3fs>=2024.10.0,<2025.0.0",
    "boto3>=1.41.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.1",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "pip-licenses>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
aihub-core = { workspace = true }

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
