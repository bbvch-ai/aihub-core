sonar.projectKey=aihub-core_pipelines-core
sonar.organization=bbv-ai

# This is the name and version displayed in the SonarCloud UI
sonar.projectName=Pipelines Core
sonar.projectVersion=1.0

sonar.sources=swiss_ai_hub
sonar.tests=swiss_ai_hub
sonar.test.inclusions=**/test_*.py

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Suppress python:S1313 (hardcoded IP address) in test folders:
#  - e1: fakes and fixtures under tests/ are analysed as sources, since only test_*.py files
#    count as tests. They stub DNS with fixed addresses so SourceHostGuard sees a public or an
#    internal host; no such address is ever connected to.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**
