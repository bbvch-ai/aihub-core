[project]
name = "swiss-ai-hub-pipeline"
version = "0.291.9"
description = "Swiss AI Hub Pipeline SDK: Dagster-based document ingestion, parsing, embedding, and vector storage for RAG."
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swiss-ai-hub-core==0.291.9",
    "dagster-webserver>=1.11.2",
    "dagster-postgres>=0.27.2",
    "dagster-azure>=0.27.2",
    "dagster-aws>=0.27.2",
    "matplotlib>=3.9.2",
    "dagster-apprise>=0.0.2",
    "apprise>=1.9.9",
]

[dependency-groups]
dev = []

[project.urls]
Homepage = "https://github.com/bbvch-ai/aihub-core"
Repository = "https://github.com/bbvch-ai/aihub-core"
Documentation = "https://bbvch-ai.github.io/aihub-core/"
Issues = "https://github.com/bbvch-ai/aihub-core/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.pipeline"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
