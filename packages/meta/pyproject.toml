[project]
name = "swiss-ai-hub"
version = "0.292.1"
description = "Meta-package that installs the full Swiss AI Hub Python SDK (core, agent, api, bot, pipeline, process)."
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# swiss-ai-hub-backup is intentionally omitted: it is AGPL-3.0, and pulling it into the
# Apache-2.0 meta-package would propagate AGPL obligations to every consumer of `pip install
# swiss-ai-hub`. Install it explicitly with `pip install swiss-ai-hub-backup` when needed.
dependencies = [
    "swiss-ai-hub-core==0.292.1",
    "swiss-ai-hub-agent==0.292.1",
    "swiss-ai-hub-api==0.292.1",
    "swiss-ai-hub-bot==0.292.1",
    "swiss-ai-hub-pipeline==0.292.1",
    "swiss-ai-hub-process==0.292.1",
]

[project.urls]
Homepage = "https://github.com/bbvch-ai/aihub-core"
Repository = "https://github.com/bbvch-ai/aihub-core"
Documentation = "https://bbvch-ai.github.io/aihub-core/"
Issues = "https://github.com/bbvch-ai/aihub-core/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.meta"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
