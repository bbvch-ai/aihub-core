sonar.projectKey=aihub-core_api-core
sonar.organization=bbv-ai

# This is the name and version displayed in the SonarCloud UI
sonar.projectName=API Core
sonar.projectVersion=1.0

sonar.sources=swiss_ai_hub
sonar.tests=swiss_ai_hub
# Main and test files share one directory. Everything under a tests/ folder is test code, helpers and fixtures
# included, and translation catalogues are data: neither counts as main code (or towards the LOC limit).
# Test tooling that lives outside tests/ (test runners, simulation runners, client fixtures) is test code too.
sonar.test.inclusions=**/test_*.py,**/tests/**,**/*_test_runner.py,swiss_ai_hub/api/runners/simulation/**,swiss_ai_hub/api/testing/**
# The Process feature is dead code awaiting removal; it is kept out of the analysis (and the LOC limit) until then.
# Kept out to stay under the organization LOC limit, chosen for the least analysis lost per line: re-export __init__ modules and declarative Pydantic events, DTOs, models and configs.
sonar.exclusions=**/test_*.py,**/tests/**,**/i18n/translations/**,swiss_ai_hub/api/routes/process/**,swiss_ai_hub/api/runners/simulation/process/**,swiss_ai_hub/api/rpc/process_config_responder.py,swiss_ai_hub/api/runners/lifetime/process_root_rule_migration.py,swiss_ai_hub/api/services/process_endpoints_discovery_service.py,swiss_ai_hub/api/sockets/events/server_to_user/contextualized_process_event.py,**/*_test_runner.py,swiss_ai_hub/api/runners/simulation/**,swiss_ai_hub/api/testing/**,**/__init__.py,**/dto/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8
