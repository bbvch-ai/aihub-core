[project]
name = "swiss-ai-hub-api"
version = "0.291.0"
description = "api core"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "swiss-ai-hub-core",
    "azure-identity>=1.19.0",
    "azure-mgmt-cosmosdb>=9.7.0",
    "azure-mgmt-resource>=23.2.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.1",
    "llama-index-embeddings-text-embeddings-inference>=0.4.2",
    "python-multipart>=0.0.20",
    "stringcase>=1.2.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
    "fastmcp>=2.11.2",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "jambo",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.api"

[tool.uv.sources]
jambo = { git = "https://github.com/bbvch-ai/jambo.git" }

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
