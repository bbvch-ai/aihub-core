[project]
name = "swiss-ai-hub-api"
version = "0.295.3"
description = "Swiss AI Hub REST API, WebSocket gateway, and MCP server (FastAPI) for the Swiss AI Agent Protocol."
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swiss-ai-hub-core==0.295.3",
    "azure-identity>=1.19.0",
    "azure-mgmt-cosmosdb>=9.7.0",
    "azure-mgmt-resource>=23.2.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.1",
    "llama-index-embeddings-text-embeddings-inference>=0.4.2",
    "python-multipart>=0.0.20",
    "stringcase>=1.2.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1",
    "fastmcp>=2.11.2",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "starlette>=1.0.1",
    "swiss-ai-hub-jambo>=0.5.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/bbvch-ai/aihub-core"
Repository = "https://github.com/bbvch-ai/aihub-core"
Documentation = "https://bbvch-ai.github.io/aihub-core/"
Issues = "https://github.com/bbvch-ai/aihub-core/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.api"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
