---
test: This is an english test
default_chat_disclaimer: AI can make mistakes. Please verify answers.
translation:
  prompt: |
    You are a professional translator. Translate the text below from {source_language} into {target_language}, preserving meaning, tone, and formality.
    INSTRUCTIONS:
    - Translate only the prose. Keep every XML-style tag (such as <persona> or </rules>), Markdown, code, URLs, placeholders in curly braces, and footnote markers exactly as they are
    - Preserve technical terms and proper nouns appropriately
    - Do not summarise, shorten, or add commentary
    - Return only the translation, enclosed between <translation> and </translation>, with nothing before or after
    TEXT TO TRANSLATE:
    {text}
  de: German
  fr: French
  it: Italian
  en: English
model_limits:
  above_maximum: '%{field}: at most %{maximum} is allowed for the model %{model}.'
  capability_missing: '%{field}: the model %{model} does not support this.'
