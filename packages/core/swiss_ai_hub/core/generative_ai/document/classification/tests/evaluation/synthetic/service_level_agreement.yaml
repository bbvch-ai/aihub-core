      - innerhalb von 15 Minuten bestätigt
      - innerhalb von 2 Stunden behoben
      - täglich mit einer Aufbewahrung von 30 Tagen

- id: sla-de-3
  type: service_level_agreement
  title: SLA_Facility_Services_DV-2024-552.pdf
  note: Looks like a contract (parties, term, termination, signatures) but its substance is service levels and maluses for a service whose price is set in a separate contract, so it is primarily an SLA.
  text: |
    # Service Level Agreement Facility Services

    ## Vertragsparteien
    **Dienstleisterin:** Rheintal Facility Management AG, Salinenstrasse 60, 4310 Rheinfelden
    **Kundin:** Gesundheitszentrum Fricktal AG, Riburgerstrasse 12, 4310 Rheinfelden

    ## 1. Grundlage
    Dieses SLA konkretisiert die Leistungsqualität des Dienstleistungsvertrags DV-2024-552. Preise und Zahlungsbedingungen
    richten sich ausschliesslich nach dem Dienstleistungsvertrag.

    ## 2. Leistungsumfang
    Unterhaltsreinigung, Haustechnik (Heizung, Lüftung, Sanitär) und Winterdienst für das Areal Riburgerstrasse 12.

    ## 3. Service Levels
    1. Störungen der Haustechnik: Reaktionszeit 1 Stunde, rund um die Uhr.
    2. Behebung von Störungen der Lüftung in Operationsräumen innert 4 Stunden.
    3. Unterhaltsreinigung: Qualitätsgrad mindestens 90 % gemäss monatlicher Stichprobenkontrolle.
    4. Winterdienst: Zugänge und Notfallzufahrt bis 06:00 Uhr geräumt.

    ## 4. Malus
    Bei Unterschreitung eines Service Levels in zwei aufeinanderfolgenden Monaten reduziert sich die Monatspauschale um 3 %.

    ## 5. Reporting
    Die Dienstleisterin liefert bis zum 10. des Folgemonats einen Servicebericht.

    ## 6. Laufzeit und Kündigung
    Das SLA gilt vom 1. Januar 2026 bis 31. Dezember 2026 und kann mit einer Frist von 3 Monaten auf Ende eines
    Kalenderquartals gekündigt werden.

    Rheinfelden, 4. Dezember 2025

    | Rheintal Facility Management AG | Gesundheitszentrum Fricktal AG |
    |---|---|
    | Marcel Bühler, Geschäftsführer | Dr. Andrea Wyss, CEO |
