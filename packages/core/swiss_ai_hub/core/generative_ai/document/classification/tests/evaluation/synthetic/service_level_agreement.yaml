    # SCHEDULE 4 – SERVICE LEVELS
    to the Master Services Agreement MSA-2025-19

    between **Kestrel Support Services AG**, Seefeldstrasse 101, 8008 Zürich (the "Supplier")
    and **Aldridge Instruments AG**, Hohlstrasse 400, 8048 Zürich (the "Customer")

    ## 1. Scope
    This Schedule sets out the service levels for the IT service desk and on-site support provided under the Agreement.

    ## 2. Service Levels
    2.1 The service desk is available Monday to Friday, 07:00 to 19:00 CET.
    2.2 The Supplier shall respond to Priority 1 incidents within 20 minutes and resolve them within 6 hours.
    2.3 On-site support is provided at the Customer's premises within 4 business hours of a request.
    2.4 Customer satisfaction shall average at least 4.2 out of 5 per quarter.

    ## 3. Term and Termination
    This Schedule applies from 1 April 2026 until 31 March 2028. The Customer may terminate it separately on 60 days'
    written notice if service levels are missed in three consecutive months.

    Zürich, 18 March 2026
