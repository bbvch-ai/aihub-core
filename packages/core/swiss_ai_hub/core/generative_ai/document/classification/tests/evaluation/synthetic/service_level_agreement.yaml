- id: sla-de-2
  type: service_level_agreement
  title: SLA_Hosting_SLA-H-2026-04.pdf
  note: A stand-alone hosting SLA with its service levels in prose, a fixed term and a notice period for its renewal.
  text: |
    # Gotthard Datacenter AG
    Gotthardstrasse 52, 6490 Andermatt · UID CHE-462.200.774

    Weber & Söhne Treuhand AG
    Marktgasse 15
    9000 St. Gallen

    ## Service Level Agreement Managed Hosting
    SLA-Nr. SLA-H-2026-04

    ### 1. Leistung
    Gotthard Datacenter AG betreibt für Weber & Söhne Treuhand AG zwei virtuelle Server, den Mailserver und die
    Datensicherung in den Rechenzentren Andermatt und Altdorf.

    ### 2. Service Levels
    Die Hosting-Plattform erreicht eine Verfügbarkeit von 99,9 % im Kalendermonat, gemessen ohne angekündigte
    Wartungsfenster. Störungsmeldungen werden rund um die Uhr innerhalb von 15 Minuten bestätigt. Ein Totalausfall wird
    innerhalb von 2 Stunden behoben. Die Datensicherung erfolgt täglich mit einer Aufbewahrung von 30 Tagen.

    ### 3. Gutschriften
    Für jede angefangene Stunde ungeplanter Nichtverfügbarkeit über dem Zielwert erhält die Kundin eine Gutschrift von
    2 % der monatlichen Hostinggebühr, höchstens 30 %.

    ### 4. Laufzeit und Kündigung
    Laufzeit: 1. Januar 2026 bis 31. Dezember 2027. Das SLA verlängert sich danach jeweils um ein Jahr, sofern es nicht
    mit einer Frist von 3 Monaten auf das Ende der Laufzeit gekündigt wird.

    Andermatt, 12. Dezember 2025
  expected:
    document_date: "2025-12-12"
