    # Anhang 2: Service Level Agreement zum Rahmenvertrag RV-2025-031

    zwischen Brunnmatt Informatik AG, Brunnmattstrasse 21, 3007 Bern (Auftragnehmerin)
    und Stiftung Alterszentrum Lindenhof, Lindenweg 3, 3123 Belp (Auftraggeberin)

