  text: |
    # Mietvertrag für Geschäftsräume
    Mietvertrag Nr. MV-0457-12

    **Vermieterin:** Immobilien Seeblick AG, Haldenstrasse 40, 6006 Luzern
    **Mieterin:** Praxis Keller Physiotherapie GmbH, Hertensteinstrasse 18, 6004 Luzern

    ### 1. Mietobjekt
    Geschäftsräume im 1. Obergeschoss der Liegenschaft Hertensteinstrasse 18, 6004 Luzern, ca. 145 m², inkl. zwei
    Parkplätze in der Einstellhalle.

    ### 2. Mietdauer
    Das Mietverhältnis beginnt am 1. Juli 2025 und läuft auf unbestimmte Zeit. Es kann von beiden Parteien unter Einhaltung
    einer Kündigungsfrist von 6 Monaten auf Ende eines Kalenderquartals gekündigt werden, erstmals auf den 30. Juni 2030.

    ### 3. Mietzins
    | Position | Betrag pro Monat |
    |---|---:|
    | Nettomietzins | CHF 2'640.00 |
    | Nebenkosten (Akonto) | CHF 310.00 |
    | **Mietzins inkl. Nebenkosten** | **CHF 2'950.00** |

    Der Mietzins ist monatlich im Voraus auf den Ersten des Monats zahlbar.

    ### 4. Sicherheitsleistung
    Die Mieterin leistet eine Mietkaution von drei Bruttomonatsmieten auf ein Mietkautionskonto.

    Luzern, 15. Mai 2025

