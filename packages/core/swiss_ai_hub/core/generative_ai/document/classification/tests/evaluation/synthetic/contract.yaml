  text: |
    # Fiduciaire Lémanique Sàrl
    Avenue de Cour 61, 1007 Lausanne · IDE CHE-773.697.972

    ## Contrat de prestation de services comptables
    Contrat n° CP-2025-044

    Entre **Fiduciaire Lémanique Sàrl**, Avenue de Cour 61, 1007 Lausanne (ci-après « le Prestataire »)
    et **Boulangerie Favre SA**, Rue du Bourg 7, 1095 Lutry (ci-après « le Client »)

    ### Article 1 – Objet
    Le Prestataire tient la comptabilité financière du Client, établit les décomptes TVA trimestriels et prépare les
    comptes annuels.

    ### Article 2 – Durée
    Le présent contrat est conclu pour la période du 1er janvier 2026 au 31 décembre 2026. Il se renouvelle tacitement
    d'année en année, sauf résiliation par écrit moyennant un préavis de trois mois avant son échéance.

    ### Article 3 – Honoraires
    Les prestations sont rémunérées par un forfait annuel de CHF 18'600.00 hors TVA, facturé en quatre acomptes
    trimestriels.

    ### Article 4 – For
    Le contrat est soumis au droit suisse. Le for est à Lausanne.

    Fait à Lausanne, le 20 novembre 2025, en deux exemplaires.

    Le Prestataire : Fiduciaire Lémanique Sàrl — Le Client : Boulangerie Favre SA
