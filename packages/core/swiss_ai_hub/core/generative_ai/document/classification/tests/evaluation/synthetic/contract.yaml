- id: contract-de-1
  type: contract
  title: Rahmenvertrag_RV-2025-031_IT-Dienstleistungen.pdf
  note: An IT services framework agreement with a fixed term from start to end, a cost ceiling and the offer it is based on.
  text: |
    # Brunnmatt Informatik AG
    Brunnmattstrasse 21, 3007 Bern · UID CHE-026.583.164

    ## Rahmenvertrag über IT-Dienstleistungen
    Vertrags-Nr. RV-2025-031

    zwischen

    **Brunnmatt Informatik AG**, Brunnmattstrasse 21, 3007 Bern
    (nachfolgend «Auftragnehmerin»)

    und

    **Stiftung Alterszentrum Lindenhof**, Lindenweg 3, 3123 Belp
    (nachfolgend «Auftraggeberin»)

    ### 1. Gegenstand
    Die Auftragnehmerin erbringt für die Auftraggeberin IT-Dienstleistungen in den Bereichen Betrieb der Arbeitsplatzsysteme,
    Netzwerk und Anwenderunterstützung. Grundlage bildet die Offerte Nr. OF-2025-0912 vom 14. Oktober 2025.
    Einzelaufträge werden in schriftlichen Abrufen gestützt auf diesen Rahmenvertrag erteilt.

    ### 2. Vertragsdauer
    Vertragsdauer: 1. Januar 2026 bis 31. Dezember 2028. Während der festen Laufzeit ist eine ordentliche Kündigung
    ausgeschlossen; die Kündigung aus wichtigem Grund bleibt vorbehalten.

    ### 3. Vergütung
    | Leistung | Ansatz |
    |---|---:|
    | Systemtechniker | CHF 165.00 / Stunde |
    | Projektleitung | CHF 195.00 / Stunde |

    Für die gesamte Vertragsdauer gilt ein Kostendach von CHF 480'000.00 exkl. MWST.

    ### 4. Schlussbestimmungen
    Es gilt schweizerisches Recht. Gerichtsstand ist Bern.

    Bern, 28. November 2025

    | Brunnmatt Informatik AG | Stiftung Alterszentrum Lindenhof |
    |---|---|
    | Daniel Moser, CEO | Regula Iseli, Präsidentin des Stiftungsrats |
  expected:
    document_date: "2025-11-28"
