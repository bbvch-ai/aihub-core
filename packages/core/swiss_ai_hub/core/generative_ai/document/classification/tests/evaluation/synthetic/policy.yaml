# Policies, guidelines, directives, regulations, codes of conduct and general terms and conditions that set rules
# employees or customers must follow, in German, French, Italian and English. Every company and person is made up.
# `expected` holds each value as stored (ISO dates), and None where the document does not state it.

- id: policy-de-1
