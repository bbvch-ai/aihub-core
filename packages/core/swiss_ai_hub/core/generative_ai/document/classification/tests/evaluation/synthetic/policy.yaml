  title: Spesenreglement_2025.pdf
  text: |
    # Spesenreglement 2025
    Muster Treuhand GmbH

    1. Spesen werden nur gegen Originalbeleg (Quittung oder Rechnung) vergütet.
    2. Verpflegung auswärts: höchstens CHF 30.00 pro Mahlzeit.
    3. Bahnreisen: 2. Klasse; ab 2 Stunden Fahrzeit 1. Klasse.

    Gültig ab 1. Januar 2025.
  expected:
    document_date: "2025-01-01"
    document_reference_number: null
    document_issuer: Muster Treuhand GmbH

