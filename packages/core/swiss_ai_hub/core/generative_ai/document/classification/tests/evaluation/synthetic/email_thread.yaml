# Conversations of several e-mails, replies or forwards kept in one document, in German, French, Italian and English.
# Every company and person is made up. `expected` holds each value as stored (ISO dates, names as written), and None
# where the document does not state it. Participants are the people and organisations that send or receive a message,
# by the name a header or signature gives, with the organisation a signature names for a person; never an e-mail address
# or a domain.

- id: thread-de-1
  type: email_thread
