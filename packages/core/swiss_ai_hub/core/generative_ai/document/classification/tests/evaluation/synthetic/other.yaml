  text: |
    # Verbale della riunione di direzione
    Studio Bellavista Sagl · 17 giugno 2025 · Presenti: G. Bernasconi, P. Ferrari, L. Cattaneo

    1. **Contratto di manutenzione n. CM-2023-12 con Clivento SA**: il contratto scade il 31 dicembre 2025. Si decide
       di chiedere un'offerta a due altri fornitori prima di rinnovarlo. Responsabile: P. Ferrari.
    2. **Fattura 2025-0877 di Clivento SA** (CHF 3'412.50): l'intervento del 2 maggio è stato fatturato due volte.
       L. Cattaneo contesterà la fattura per iscritto e ne sospende il pagamento.
    3. **Inaugurazione dello studio**: data fissata al 23 ottobre 2025; inviti entro fine settembre.
    4. Prossima riunione: 8 luglio 2025.
