- id: manual-de-1
  type: other
  title: Bedienungsanleitung_Kaffeemaschine.pdf
  text: |
    # Bedienungsanleitung Kaffeevollautomat CV-500

    ## Inbetriebnahme
    1. Wassertank füllen.
    2. Bohnenbehälter füllen.
    3. Gerät mit der Taste ⏻ einschalten und Spülvorgang abwarten.

    ## Entkalken
    Das Gerät meldet „Entkalken", sobald nötig. Verwenden Sie nur das mitgelieferte Entkalkungsmittel.

- id: manual-en-1
  type: other
  title: VPN_Setup_Guide.pdf
  text: |
    # VPN Setup Guide

    1. Install the VPN client from the company portal.
    2. Enter the server address vpn.hooli.example.
    3. Sign in with your company account and approve the request on your phone.

    If the connection fails, restart the client and check that your clock is correct.

