  text: |
    # Gemeinde Hinterbrunnen
    Bauverwaltung · Dorfstrasse 2 · 5612 Hinterbrunnen

    ## Ausschreibung Unterhaltsreinigung Schulanlage 2026
    Einladungsverfahren · Dossier-Nr. HB-AUS-2025-09

    Die Gemeinde Hinterbrunnen lädt Sie ein, ein Angebot für die Unterhaltsreinigung der Schulanlage Hinterbrunnen
    für die Zeit vom 1. Januar bis 31. Dezember 2026 einzureichen.

    ### Leistungsverzeichnis
    | Pos | Leistung | Menge | Einheitspreis CHF | Betrag CHF |
    |---|---|---:|---:|---:|
    | 1 | Unterhaltsreinigung Schulhaus, 5 × pro Woche | 2'400 m² | | |
    | 2 | Unterhaltsreinigung Turnhalle, 3 × pro Woche | 800 m² | | |
    | 3 | Grundreinigung in den Sommerferien | pauschal | | |
    | | **Total exkl. MWST** | | | |

    ### Eingabe
    Eingabefrist: 15. Dezember 2025, 12:00 Uhr, bei der Bauverwaltung (Poststempel nicht massgebend).
    Zuschlagskriterien: Preis 60 %, Referenzen 25 %, Qualitätskonzept 15 %.

    Auskünfte: Martin Zbinden, Bauverwalter, 056 633 12 40

