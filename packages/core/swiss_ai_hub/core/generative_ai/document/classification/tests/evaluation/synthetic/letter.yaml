    Von: Petra Keller <p.keller@muster-treuhand.example>
    An: buchhaltung@alpenglueck.example
    Datum: 26.05.2025

    Guten Tag

    Auf Ihrer Rechnung 2025-1142 über CHF 1'082.08 sind vier Toner verrechnet, geliefert wurden aber nur drei.
    Können Sie das bitte prüfen und uns eine korrigierte Rechnung senden?

    Besten Dank und freundliche Grüsse
    Petra Keller
  expected:
    document_date: "2025-05-26"
    document_reference_number: null
    document_issuer: Petra Keller
    document_recipient: null
    document_related_references: ["2025-1142"]

- id: letter-fr-2
  type: letter
  title: confirmation_resiliation_CM-2022-117.pdf
  note: The letter's "Notre référence" is its own number; the contract it names is a related reference.
  text: |
    # Gérance Lavaux SA
    Chemin des Vignes 5 · 1095 Lutry · Tél. 021 791 44 20

    Boulangerie Rochat Sàrl
    À l'att. de M. Julien Rochat
    Rue du Bourg 12
    1003 Lausanne

    Notre référence : GL/2025/0418
    Votre lettre du : 28 octobre 2025

    Lutry, le 12 novembre 2025

    **Confirmation de la résiliation du contrat d'entretien n° CM-2022-117**

    Monsieur,

    Nous accusons réception de votre lettre du 28 octobre 2025 et vous confirmons la résiliation du contrat d'entretien
    n° CM-2022-117 pour les locaux de la Rue du Bourg 12. Le contrat prendra fin le 31 mars 2026, au terme du délai de
    préavis de trois mois. Les prestations restent dues jusqu'à cette date.

    Nous vous remercions de la confiance accordée et restons volontiers à votre disposition.

    Veuillez agréer, Monsieur, nos salutations distinguées.

    Gérance Lavaux SA
    Nathalie Chappuis, responsable clientèle
  expected:
    document_date: "2025-11-12"
    document_reference_number: GL/2025/0418
    document_issuer: Gérance Lavaux SA
    document_recipient: Boulangerie Rochat Sàrl
    document_related_references: [CM-2022-117]

- id: letter-it-2
