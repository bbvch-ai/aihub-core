    Da: Marco Rezzonico <m.rezzonico@fiduciaria-lepontia.example>
    A: Anna Lepori <anna.lepori@example.ch>
    Data: 04.03.2025

    Gentile signora Lepori,

    come concordato telefonicamente, le confermo l'appuntamento di martedì 11 marzo 2025 alle ore 14:30 presso il
    nostro ufficio per la compilazione della dichiarazione d'imposta 2024.

    La preghiamo di portare con sé il certificato di salario, gli estratti conto al 31.12.2024 e le ricevute delle
    spese mediche. Se l'orario non le dovesse convenire, ci contatti entro venerdì.

    Cordiali saluti

    Marco Rezzonico
    Fiduciaria Lepontia SA
    Via Nassa 15, 6900 Lugano
    Tel. 091 922 18 40
