    Chemin des Ateliers 7, 1110 Morges · IDE CHE-246.813.575 TVA

    Fondation Les Tilleuls
    Service administratif
    Route de Lausanne 40, 1110 Morges

    ## Facture d'annulation n° AN-2025-0042
    Morges, le 9 juillet 2025
    Annule la facture n° F-2025-0934 du 30 juin 2025

    La facture n° F-2025-0934 (impression de 500 brochures annuelles) a été établie par erreur en double et est
    annulée dans son intégralité.

    | Désignation | Montant CHF |
    |---|---:|
    | Annulation facture F-2025-0934 | -1'480.00 |
    | TVA 8,1 % | -119.88 |
