- id: credit-note-self-billing-de
  type: credit_note
  title: Gutschrift_GS-2025-0031.pdf
  note: >-
    A self-billing Gutschrift under § 14 UStG is a credit note whose issuer is the buyer who issues it; the
    USt-IdNr. shown is the supplier's, so the issuer has no tax ID.
  text: |
    # Nordlicht Software GmbH
    Leopoldstrasse 90, 80802 München

    An
    Studio Pixelwerk Inh. Lena Vogt
    Kastanienallee 3, 10435 Berlin
    USt-IdNr. des Leistenden: DE 284 519 377

    ## Gutschrift Nr. GS-2025-0031
    im Sinne des § 14 Abs. 2 Satz 2 UStG
    Datum: 31.01.2025
    Leistungszeitraum: Januar 2025

    Für die von Ihnen im Januar 2025 erbrachten Designleistungen schreiben wir Ihnen gut:

    | Leistung | Stunden | Satz EUR | Betrag EUR |
    |---|---:|---:|---:|
    | UI-Design Projekt „Atlas" | 42 | 85,00 | 3.570,00 |

    Nettobetrag EUR 3.570,00
    USt. 19 % EUR 678,30
    **Gutschriftsbetrag EUR 4.248,30**

    Der Betrag wird am 14.02.2025 auf Ihr Konto überwiesen.
  expected:
    document_date: "2025-01-31"
    document_reference_number: GS-2025-0031
    document_issuer: Nordlicht Software GmbH
    document_issuer_tax_id: null
    document_recipient: Studio Pixelwerk Inh. Lena Vogt
    document_total_amount: 4248.30
    document_currency: EUR
    document_due_date: "2025-02-14"
    document_period_start: "2025-01-01"
    document_period_end: "2025-01-31"
    document_related_references: null

