- id: report-de-1
  kind: easy_negative
  title: Jahresbericht_2024.pdf
  text: |
    # Jahresbericht 2024
    Bergwerk Bau AG

    ## Das Wichtigste in Kürze
    Der Umsatz stieg um 6 % auf CHF 48,2 Mio. Wir haben 14 Projekte abgeschlossen, darunter die Sanierung von drei
    Schulhäusern. Die Zahl der Mitarbeitenden wuchs auf 212.

    ## Ausblick
    Für 2025 erwarten wir eine stabile Auftragslage im öffentlichen Hochbau.

- id: report-en-1
  kind: easy_negative
  title: Data_Quality_Audit_Report.pdf
  text: |
    # Data Quality Audit – Final Report
    Prepared by Brightwater Analytics Ltd for Hooli AG · February 2025

    ## Findings
    1. 4.2% of customer records have no country code.
    2. Duplicate invoices were found in the ERP export for 2023 (37 cases).
    3. Order dates are missing on 1.1% of orders.

    ## Recommendations
    Introduce validation on entry and a monthly duplicate check.

