- id: manual-de-1
  kind: easy_negative
  title: Bedienungsanleitung_Kaffeemaschine.pdf
  text: |
    # Bedienungsanleitung Kaffeevollautomat CV-500

    ## Inbetriebnahme
    1. Wassertank füllen.
    2. Bohnenbehälter füllen.
    3. Gerät mit der Taste ⏻ einschalten und Spülvorgang abwarten.

    ## Entkalken
    Das Gerät meldet „Entkalken", sobald nötig. Verwenden Sie nur das mitgelieferte Entkalkungsmittel.

