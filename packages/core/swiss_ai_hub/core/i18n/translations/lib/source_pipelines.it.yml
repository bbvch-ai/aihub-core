---
manual_upload:
  display_name: Caricamento manuale
  description: I documenti vengono caricati a mano tramite le viste della conoscenza;
    nulla li sincronizza.
rclone:
  display_name: Sincronizzazione archivio cloud (rclone)
  description: Mantiene la base sincronizzata con una raccolta documenti SharePoint,
    un OneDrive, una cartella Google Drive o un bucket S3. Ogni cartella di primo
    livello diventa un namespace.
  config:
    backend_type:
      label: Backend di archiviazione
      help: Da quale tipo di sistema vengono recuperati i file.
      options:
        onedrive: OneDrive / SharePoint
        drive: Google Drive
        s3: Amazon S3 / compatibile S3
        azureblob: Azure Blob Storage
        sftp: SFTP
        local: Cartella locale
    root_path:
      label: Cartella radice
      help: Cartella della sorgente da sincronizzare. Ognuna delle sue cartelle di
        primo livello diventa un namespace; i file direttamente al suo interno non
        vengono sincronizzati.
    include_patterns:
      label: Pattern di inclusione
      help: Regole glob rclone; se impostate, vengono sincronizzati solo i file corrispondenti
        (es. *.pdf, reports/**).
    exclude_patterns:
      label: Pattern di esclusione
      help: Regole glob rclone per i file da saltare (es. **/~$*, drafts/**).
    onedrive:
      client_id:
        label: ID client
        help: ID applicazione (client) della registrazione app Entra ID.
      client_secret:
        label: Segreto client
        help: Segreto client della registrazione app. Archiviato cifrato.
      tenant:
        label: ID tenant
        help: ID del tenant (directory) Entra ID.
      drive_id:
        label: ID unità
        help: ID dell'unità da sincronizzare. Per SharePoint, l'unità della raccolta
          documenti, un ID che inizia con b! come Microsoft Graph lo elenca tra le
          unità del sito.
      drive_type:
        label: Tipo di unità
        help: personal, business o documentLibrary (SharePoint). rclone adotta alla
          connessione il valore che Microsoft Graph riporta per l'unità.
      region:
        label: Regione
        help: 'Cloud Microsoft: global, us, de o cn.'
      token:
        label: Token OAuth
        help: JSON del token rclone ottenuto in anticipo, in alternativa alle credenziali
          client. Archiviato cifrato.
    drive:
      client_id:
        label: ID client
        help: ID client OAuth del progetto Google Cloud.
      client_secret:
        label: Segreto client
        help: Segreto client OAuth. Archiviato cifrato.
      token:
        label: Token OAuth
        help: JSON del token rclone ottenuto in anticipo. Archiviato cifrato.
      service_account_credentials:
        label: File chiave dell'account di servizio
        help: File chiave JSON scaricato dalla console Google Cloud, in alternativa
          a un token OAuth. Archiviato cifrato.
      root_folder_id:
        label: ID cartella radice
        help: ID della cartella Drive da usare come radice; vuoto per tutta l'unità.
    s3:
      provider:
        label: Provider
        help: Nome del provider S3 rclone, es. AWS, Minio, Ceph.
      access_key_id:
        label: Access key ID
        help: Access key ID.
      secret_access_key:
        label: Secret access key
        help: Secret access key. Archiviata cifrata.
      region:
        label: Regione
        help: Regione, es. eu-central-1.
      endpoint:
        label: Endpoint
        help: URL dell'endpoint per provider non AWS.
    azureblob:
      account:
        label: Account di archiviazione
        help: Nome dell'account di archiviazione Azure.
      key:
        label: Chiave account
        help: Chiave dell'account di archiviazione. Archiviata cifrata.
      sas_url:
        label: URL SAS
        help: URL di firma di accesso condiviso, in alternativa a una chiave account.
          Archiviato cifrato.
      endpoint:
        label: Endpoint
        help: Endpoint personalizzato per cloud sovrani.
    sftp:
      host:
        label: Host
        help: Nome host o IP SFTP.
      port:
        label: Porta
        help: Porta SFTP.
      user:
        label: Utente
        help: Nome utente SFTP.
      password:
        label: Password
        help: Password, in alternativa a una chiave privata. Archiviata cifrata.
      key_pem:
        label: Chiave privata (PEM)
        help: Chiave privata in formato PEM, in alternativa a una password. Archiviata
          cifrata.
structured:
  display_name: Sincronizzazione di applicazioni aziendali
  description: Mantiene la base sincronizzata con i record di applicazioni aziendali
    come issue tracker e wiki. Ogni record diventa un documento markdown e il suo
    progetto o spazio diventa un namespace.
  config:
    source_kind:
      label: Sistema sorgente
      help: Applicazione da cui vengono letti i record. Le sue impostazioni compaiono
        una volta selezionata.
    jira:
      display_name: Jira
      base_url:
        label: URL di Jira
        help: L'indirizzo a cui apri Jira, ad es. https://acme.atlassian.net per Jira
          Cloud o https://jira.acme.ch/jira per Jira Data Center.
      deployment:
        label: Edizione di Jira
        help: Jira Cloud accede con l'e-mail di un account e un token API, Jira Data
          Center con un token di accesso personale.
        cloud: Jira Cloud
        data_center: Jira Data Center (11.3)
      email:
        label: E-mail dell'account
        help: E-mail dell'account Jira Cloud a cui appartiene il token API.
      api_token:
        label: Token
        help: Un token API di Jira Cloud senza ambiti, oppure un token di accesso
          personale di Jira Data Center. Salvato cifrato. La base contiene tutte le
          issue e i commenti che questo account può leggere, tranne i commenti riservati;
          usa quindi un account dedicato di sola lettura.
      project_keys:
        label: Progetti
        help: Chiavi dei progetti da sincronizzare, ad es. ABC. Ogni progetto diventa
          un namespace.
      jql:
        label: Filtro JQL aggiuntivo
        help: Facoltativo. Vengono sincronizzate solo le issue che soddisfano anche
          questo JQL, ad es. issuetype != "Service Request". Senza ORDER BY.
    confluence:
      display_name: Confluence
      base_url:
        label: URL di Confluence
        help: L'indirizzo a cui apri Confluence, ad es. https://acme.atlassian.net/wiki
          per Confluence Cloud o https://confluence.acme.ch per Confluence Data Center.
      deployment:
        label: Edizione di Confluence
        help: Confluence Cloud accede con l'e-mail di un account e un token API, Confluence
          Data Center con un token di accesso personale.
        cloud: Confluence Cloud
        data_center: Confluence Data Center
      email:
        label: E-mail dell'account
        help: E-mail dell'account Confluence Cloud a cui appartiene il token API.
      api_token:
        label: Token
        help: Un token API di Confluence Cloud senza ambiti, oppure un token di accesso
          personale di Confluence Data Center. Salvato cifrato. La base contiene tutte
          le pagine che questo account può leggere negli spazi indicati; usa quindi
          un account dedicato di sola lettura.
      space_keys:
        label: Spazi
        help: Chiavi degli spazi da sincronizzare, ad es. ENG. Ogni spazio diventa
          un namespace e il suo albero di pagine diventa cartelle.
      labels:
        label: Etichette
        help: Facoltativo. Vengono sincronizzate solo le pagine con almeno una di
          queste etichette.
      ancestor_page_ids:
        label: Pagine padre
        help: Facoltativo. Vengono sincronizzate solo queste pagine e le pagine sottostanti.
          L'ID di una pagina è il numero nel suo URL.
    mediawiki:
      display_name: MediaWiki
      base_url:
        label: URL del wiki
        help: La cartella che contiene il file api.php del wiki, ad es. https://wiki.acme.ch
          o https://acme.ch/w.
      auth_method:
        label: Accesso
        help: Come la pipeline accede al wiki. Scegli la pagina di accesso se il wiki
          autentica tramite un'estensione come LDAP o il single sign-on.
        bot_password: Password del bot
        web_form: Pagina di accesso
        oauth: Token di accesso OAuth
        anonymous: Senza accesso (wiki pubblico)
      username:
        label: Nome utente
        help: L'account con cui la pipeline legge; per una password del bot, Utente@NomeBot
          come indicato su Speciale:BotPasswords.
      password:
        label: Password
        help: La password del bot o quella dell'account. Salvata cifrata. La base
          contiene tutte le pagine che questo account può leggere nei namespace indicati;
          usa quindi un account dedicato di sola lettura.
      access_token:
        label: Token di accesso
        help: Il token di accesso di un consumer OAuth 2 riservato al proprietario,
          registrato su Speciale:OAuthConsumerRegistration con il diritto di base.
          Salvato cifrato. La base contiene tutte le pagine che l'account del token
          può leggere nei namespace indicati; registralo quindi per un account dedicato
          di sola lettura.
      namespaces:
        label: Namespace del wiki
        help: Facoltativo. Nomi o numeri dei namespace da sincronizzare, ad es. Main
          o Project. Solo il namespace principale se vuoto. Ogni namespace del wiki
          diventa un namespace della base.
      include_categories:
        label: Categorie
        help: Facoltativo. Vengono sincronizzate solo le pagine di almeno una di queste
          categorie.
      exclude_categories:
        label: Categorie escluse
        help: Facoltativo. Le pagine di una di queste categorie non vengono mai sincronizzate,
          ad es. una categoria che contrassegna le pagine da tenere lontane dagli
          assistenti IA.
      sync_documents:
        label: Sincronizza documenti
        help: Sincronizza anche i documenti mostrati o collegati dalle pagine sincronizzate
          (PDF, Word, PowerPoint, Excel e file di testo) nel namespace File. I vecchi
          formati Office (doc, ppt) e gli archivi sono esclusi.
      sync_images:
        label: Sincronizza immagini
        help: Sincronizza anche le immagini mostrate o collegate dalle pagine sincronizzate
          (PNG, JPEG, GIF, BMP, WebP, TIFF) nel namespace File. Le immagini mostrate
          da un template, come loghi e icone, sono escluse, così come i file SVG.
      max_file_size_mb:
        label: Dimensione massima del file (MB)
        help: I file più grandi sono esclusi. Durante il salvataggio viene tenuto
          in memoria un file alla volta.
      min_image_pixels:
        label: Dimensione minima dell'immagine (px)
        help: Le immagini più strette o più basse sono escluse come icone. 0 mantiene
          tutte le immagini.
