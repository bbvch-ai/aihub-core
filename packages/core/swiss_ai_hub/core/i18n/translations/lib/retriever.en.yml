---
config:
  list_help: The knowledge databases this agent searches for every question. Add one
    entry per database; each has its own settings for how many documents to retrieve
    and how to search.
  index_namespaces:
    label: Index namespaces
    help: Comma-separated list of namespaces to retrieve from. Leave empty to retrieve
      from all namespaces.
  retrieve_k:
    label: Documents to retrieve
    help: Number of documents to retrieve from the vector store.
  query_mode:
    label: Query mode
    help: Specifies how the vector store should be queried.
  min_similarity:
    label: Minimum similarity
    help: Results less similar to the question than this are dropped before reranking.
      Applies to the Default query mode; 0 keeps every result.
  node_types:
    label: Node types
    help: Types of nodes to retrieve from the index.
