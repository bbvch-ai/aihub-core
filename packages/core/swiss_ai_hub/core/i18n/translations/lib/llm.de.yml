---
config:
  model:
    label: LLM-Modell
    help: Wählen Sie das Sprachmodell für die Antwortgenerierung. Verschiedene Modelle
      haben unterschiedliche Fähigkeiten und Kosten.
  temperature:
    label: Temperatur
    help: 'Steuert Zufälligkeit: 0 = deterministisch, 2 = sehr kreativ. Niedrigere
      Werte für sachliche Aufgaben. Hilfsschritte (z. B. Prüfungen, Titel) verwenden
      0, solange hier kein Wert gesetzt ist.'
    toggle_label: Standard-Temperatur des Modells überschreiben
  top_p:
    label: Breite der Wortauswahl (top_p)
    help: 'Wie viele Alternativen das Modell für jedes nächste Wort in Betracht zieht:
      nur die wahrscheinlichsten Wörter, die zusammen diese Wahrscheinlichkeit erreichen.
      Niedrigere Werte ergeben fokussiertere und vorhersehbarere Antworten, höhere
      Werte vielfältigere.'
    toggle_label: Standard-Breite der Wortauswahl (top_p) des Modells überschreiben
  accept_images:
    label: Bilder akzeptieren
    help: Bilder in der Unterhaltung an das Modell weitergeben. Nur für Modelle verfügbar,
      die Bildeingaben unterstützen.
  logprobs:
    label: Log-Wahrscheinlichkeiten zurückgeben
    help: Token-Level Log-Wahrscheinlichkeiten in der Antwort einschliessen. Nützlich
      zur Analyse der Modellkonfidenz.
  top_logprobs:
    label: Top-Log-Wahrscheinlichkeiten
    help: Anzahl der wahrscheinlichsten Tokens, für die Wahrscheinlichkeiten zurückgegeben
      werden (0-20). Erfordert aktivierte Log-Wahrscheinlichkeiten.
  timeout:
    label: Zeitüberschreitung (Sekunden)
    help: Maximale Wartezeit auf eine Antwort vom LLM. Bei komplexen Anfragen oder
      langsamen Verbindungen erhöhen.
