---
manual_upload:
  display_name: Téléversement manuel
  description: Les documents sont téléversés à la main via les vues de connaissances
    ; rien ne les synchronise.
rclone:
  display_name: Synchronisation de stockage cloud (rclone)
  description: Maintient la base synchronisée avec une bibliothèque de documents SharePoint,
    un OneDrive, un dossier Google Drive ou un bucket S3. Chaque dossier de premier
    niveau devient un espace de noms.
  config:
    backend_type:
      label: Backend de stockage
      help: Type de système d'où les fichiers sont récupérés.
      options:
        onedrive: OneDrive / SharePoint
        drive: Google Drive
        s3: Amazon S3 / compatible S3
        azureblob: Azure Blob Storage
        sftp: SFTP
        local: Dossier local
    root_path:
      label: Dossier racine
      help: Dossier de la source à synchroniser. Chacun de ses dossiers de premier
        niveau devient un espace de noms ; les fichiers placés directement dedans
        ne sont pas synchronisés.
    include_patterns:
      label: Motifs d'inclusion
      help: Règles glob rclone ; si définies, seuls les fichiers correspondants sont
        synchronisés (p. ex. *.pdf, reports/**).
    exclude_patterns:
      label: Motifs d'exclusion
      help: Règles glob rclone pour les fichiers à ignorer (p. ex. **/~$*, drafts/**).
    onedrive:
      client_id:
        label: ID client
        help: ID d'application (client) de l'inscription d'application Entra ID.
      client_secret:
        label: Secret client
        help: Secret client de l'inscription d'application. Stocké chiffré.
      tenant:
        label: ID de tenant
        help: ID du tenant (annuaire) Entra ID.
      drive_id:
        label: ID de lecteur
        help: ID du lecteur à synchroniser. Pour SharePoint, le lecteur de la bibliothèque
          de documents, un ID commençant par b! tel que Microsoft Graph le liste parmi
          les lecteurs du site.
      drive_type:
        label: Type de lecteur
        help: personal, business ou documentLibrary (SharePoint). rclone reprend à
          la connexion la valeur que Microsoft Graph indique pour le lecteur.
      region:
        label: Région
        help: 'Cloud Microsoft : global, us, de ou cn.'
      token:
        label: Jeton OAuth
        help: JSON de jeton rclone préobtenu, en alternative aux identifiants client.
          Stocké chiffré.
    drive:
      client_id:
        label: ID client
        help: ID client OAuth de votre projet Google Cloud.
      client_secret:
        label: Secret client
        help: Secret client OAuth. Stocké chiffré.
      token:
        label: Jeton OAuth
        help: JSON de jeton rclone préobtenu. Stocké chiffré.
      service_account_credentials:
        label: Fichier de clé du compte de service
        help: Fichier de clé JSON téléchargé depuis la console Google Cloud, en alternative
          à un jeton OAuth. Stocké chiffré.
      root_folder_id:
        label: ID du dossier racine
        help: ID du dossier Drive à traiter comme racine ; vide pour tout le lecteur.
    s3:
      provider:
        label: Fournisseur
        help: Nom du fournisseur S3 rclone, p. ex. AWS, Minio, Ceph.
      access_key_id:
        label: ID de clé d'accès
        help: ID de clé d'accès.
      secret_access_key:
        label: Clé d'accès secrète
        help: Clé d'accès secrète. Stockée chiffrée.
      region:
        label: Région
        help: Région, p. ex. eu-central-1.
      endpoint:
        label: Point de terminaison
        help: URL du point de terminaison pour les fournisseurs non AWS.
    azureblob:
      account:
        label: Compte de stockage
        help: Nom du compte de stockage Azure.
      key:
        label: Clé de compte
        help: Clé du compte de stockage. Stockée chiffrée.
      sas_url:
        label: URL SAS
        help: URL de signature d'accès partagé, en alternative à une clé de compte.
          Stockée chiffrée.
      endpoint:
        label: Point de terminaison
        help: Point de terminaison personnalisé pour les clouds souverains.
    sftp:
      host:
        label: Hôte
        help: Nom d'hôte ou IP SFTP.
      port:
        label: Port
        help: Port SFTP.
      user:
        label: Utilisateur
        help: Nom d'utilisateur SFTP.
      password:
        label: Mot de passe
        help: Mot de passe, en alternative à une clé privée. Stocké chiffré.
      key_pem:
        label: Clé privée (PEM)
        help: Clé privée au format PEM, en alternative à un mot de passe. Stockée
          chiffrée.
structured:
  display_name: Synchronisation d'applications métier
  description: Maintient la base synchronisée avec les enregistrements d'applications
    métier comme les outils de suivi de tickets et les wikis. Chaque enregistrement
    devient un document markdown, et son projet ou espace devient un espace de noms.
  config:
    source_kind:
      label: Système source
      help: Application d'où les enregistrements sont lus. Ses paramètres s'affichent
        une fois qu'elle est sélectionnée.
    jira:
      display_name: Jira
      base_url:
        label: URL de Jira
        help: L'adresse à laquelle vous ouvrez Jira, p. ex. https://acme.atlassian.net
          pour Jira Cloud ou https://jira.acme.ch/jira pour Jira Data Center.
      deployment:
        label: Édition de Jira
        help: Jira Cloud se connecte avec l'e-mail d'un compte et un jeton d'API,
          Jira Data Center avec un jeton d'accès personnel.
        cloud: Jira Cloud
        data_center: Jira Data Center (11.3)
      email:
        label: E-mail du compte
        help: E-mail du compte Jira Cloud auquel appartient le jeton d'API.
      api_token:
        label: Jeton
        help: Un jeton d'API Jira Cloud sans portées, ou un jeton d'accès personnel
          Jira Data Center. Stocké chiffré. La base contient tous les tickets et commentaires
          que ce compte peut lire, sauf les commentaires restreints ; utilisez donc
          un compte dédié en lecture seule.
      project_keys:
        label: Projets
        help: Clés des projets à synchroniser, p. ex. ABC. Chaque projet devient un
          espace de noms.
      jql:
        label: Filtre JQL supplémentaire
        help: Facultatif. Seuls les tickets qui correspondent aussi à ce JQL sont
          synchronisés, p. ex. issuetype != "Service Request". Sans ORDER BY.
    confluence:
      display_name: Confluence
      base_url:
        label: URL de Confluence
        help: L'adresse à laquelle vous ouvrez Confluence, p. ex. https://acme.atlassian.net/wiki
          pour Confluence Cloud ou https://confluence.acme.ch pour Confluence Data
          Center.
      deployment:
        label: Édition de Confluence
        help: Confluence Cloud se connecte avec l'e-mail d'un compte et un jeton d'API,
          Confluence Data Center avec un jeton d'accès personnel.
        cloud: Confluence Cloud
        data_center: Confluence Data Center
      email:
        label: E-mail du compte
        help: E-mail du compte Confluence Cloud auquel appartient le jeton d'API.
      api_token:
        label: Jeton
        help: Un jeton d'API Confluence Cloud sans portées, ou un jeton d'accès personnel
          Confluence Data Center. Stocké chiffré. La base contient toutes les pages
          que ce compte peut lire dans les espaces indiqués ; utilisez donc un compte
          dédié en lecture seule.
      space_keys:
        label: Espaces
        help: Clés des espaces à synchroniser, p. ex. ENG. Chaque espace devient un
          espace de noms, et son arborescence de pages des dossiers.
      labels:
        label: Étiquettes
        help: Facultatif. Seules les pages portant au moins une de ces étiquettes
          sont synchronisées.
      ancestor_page_ids:
        label: Pages parentes
        help: Facultatif. Seules ces pages et les pages situées en dessous sont synchronisées.
          L'ID d'une page est le nombre figurant dans son URL.
    mediawiki:
      display_name: MediaWiki
      base_url:
        label: URL du wiki
        help: Le dossier contenant le fichier api.php du wiki, p. ex. https://wiki.acme.ch
          ou https://acme.ch/w.
      auth_method:
        label: Connexion
        help: Comment le pipeline se connecte au wiki. Choisissez la page de connexion
          si le wiki connecte ses utilisateurs via une extension comme LDAP ou l'authentification
          unique.
        bot_password: Mot de passe de robot
        web_form: Page de connexion
        oauth: Jeton d'accès OAuth
        anonymous: Sans connexion (wiki public)
      username:
        label: Nom d'utilisateur
        help: Le compte avec lequel le pipeline lit ; pour un mot de passe de robot,
          Utilisateur@NomDuRobot tel qu'affiché sur Spécial:Mots de passe de robots.
      password:
        label: Mot de passe
        help: Le mot de passe de robot ou celui du compte. Stocké chiffré. La base
          contient toutes les pages que ce compte peut lire dans les espaces de noms
          indiqués ; utilisez donc un compte dédié en lecture seule.
      access_token:
        label: Jeton d'accès
        help: Le jeton d'accès d'un consommateur OAuth 2 réservé au propriétaire,
          enregistré sur Spécial:OAuthConsumerRegistration avec le droit de base.
          Stocké chiffré. La base contient toutes les pages que le compte du jeton
          peut lire dans les espaces de noms indiqués ; enregistrez-le donc pour un
          compte dédié en lecture seule.
      namespaces:
        label: Espaces de noms
        help: Facultatif. Noms ou numéros des espaces de noms à synchroniser, p. ex.
          Main ou Project. Seul l'espace principal si vide. Chaque espace de noms
          du wiki devient un espace de noms de la base.
      include_categories:
        label: Catégories
        help: Facultatif. Seules les pages d'au moins une de ces catégories sont synchronisées.
      exclude_categories:
        label: Catégories exclues
        help: Facultatif. Les pages de l'une de ces catégories ne sont jamais synchronisées,
          p. ex. une catégorie marquant les pages à tenir à l'écart des assistants
          IA.
      include_subcategories:
        label: Inclure les sous-catégories
        help: Une catégorie compte aussi les pages de toutes les catégories en dessous
          d'elle, pour les catégories incluses et exclues.
      sync_documents:
        label: Synchroniser les documents
        help: Synchronise aussi les documents affichés ou liés par les pages synchronisées
          (PDF, Word, PowerPoint, Excel et fichiers texte) dans l'espace de noms File.
          Les anciens formats Office (doc, ppt) et les archives sont exclus.
      sync_images:
        label: Synchroniser les images
        help: Synchronise aussi les images affichées ou liées par les pages synchronisées
          (PNG, JPEG, GIF, BMP, WebP, TIFF) dans l'espace de noms File. Les images
          qu'un modèle affiche, comme les logos et les icônes, sont exclues, de même
          que les fichiers SVG.
      max_file_size_mb:
        label: Taille de fichier maximale (Mo)
        help: Les fichiers plus volumineux sont exclus. Un seul fichier à la fois
          est gardé en mémoire pendant son enregistrement.
      min_image_pixels:
        label: Taille d'image minimale (px)
        help: Les images plus étroites ou moins hautes sont exclues comme icônes.
          0 garde toutes les images.
      user_agent:
        label: User-Agent
        help: Facultatif. Envoyé avec chaque requête au wiki, p. ex. un nom et une
          adresse de contact. Les wikis de Wikimedia en demandent un et peuvent bloquer
          la valeur par défaut. Vide garde la valeur par défaut.
