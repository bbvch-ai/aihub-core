---
config:
  name:
    label: Nom du serveur
    help: Un nom logique pour identifier cette connexion au serveur MCP.
  url:
    label: URL du serveur
    help: L'URL HTTP du point de terminaison du serveur MCP (ex. https://mcp.example.com/mcp).
  auth_mode:
    label: Mode d'authentification
    help: Comment les agents s'authentifient auprès du serveur MCP. « Jeton utilisateur
      » transmet le jeton de l'utilisateur appelant et ne fonctionne que pour les
      exécutions de chat initiées par un utilisateur.
    none_label: Aucune
    api_key_label: Clé API
    user_token_label: Jeton utilisateur
  api_key:
    label: Clé API
    help: Clé API statique pour le serveur MCP — utilisée uniquement lorsque le mode
      d'authentification est « Clé API ».
  timeout:
    label: Délai d'attente (secondes)
    help: Temps maximum d'attente pour une réponse du serveur MCP.
  forward_tenant_id_header:
    label: En-tête d'ID de mandant à transmettre
    help: Optionnel. Si défini, l'ID d'origine du mandant actif est envoyé à chaque requête MCP
      sous ce nom d'en-tête, de sorte qu'un seul profil serve tous les mandants (chacun isolé).
      Laisser vide pour désactiver. Exemple - X-LCDM-Tenant.
