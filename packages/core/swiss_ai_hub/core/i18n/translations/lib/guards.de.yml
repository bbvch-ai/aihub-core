---
agent_description_guard:
  prompt: |
    Die Beschreibung eines Agenten lautet wiefolgt:
    <Agentenbeschreibung>
    {agent_description}
    </Agentenbeschreibung>
    Der Agent hat eventuell Zugriff auf weitere Informationsquellen, die ihm bei der Beantwortung der Frage helfen könnten.
    Entscheide, ob die vom Benutzer gestellte Frage im Kontext des Gespräches diesem Agenten gestellt werden soll. Lasse alle Fragen zu, die
    möglicherweise in den Themenbereich des Agenten fallen. Blockiere alle Fragen, die ganz offensichtlich
    überhaupt nichts mit dem Agenten zu tun haben. Im zweifelsfall entscheide dich für das Zulassen der Frage.
    <Benutzer Anfrage>
    {user_query}
    </Benutzer Anfrage>
    <vergangener Gesprächsverlauf>
    {history}
    </vergangener Gesprächsverlauf>
    Ihre finale Ausgabe muss ausschliesslich ein JSON-Objekt mit genau den beiden Schlüsseln "success" und "reasoning" sein. Wiederholen Sie nicht das gesamte JSON-Schema oder fügen zusätzliche Meta-Informationen hinzu.
  user_message: |
    <Benutzer>
    {user}
    </Benutzer>
  agent_message: |
    <Agent>
    {agent}
    </Agent>
  reason: |
    Begründung der getroffenen Entscheidung.
  success: |
    true wenn die Antwort gegeben werden kann, false wenn nicht
  docstring: |
    Datenmodel für die Entscheidung ob eine Antwort gegeben werden kann.
few_shot_guard:
  prompt: |
    Sie erhalten mehrere Beispiele, die zeigen, welche Benutzeranfragen erlaubt sind und welche nicht. Jede Beispielantwort besteht aus zwei Schlüsseln:
    "success": ein Boolean (true oder false), der angibt, ob die Anfrage zulässig ist.
    "reasoning": ein String, der die Begründung für diese Entscheidung enthält.
    Wichtig:
    Ihre finale Ausgabe muss ausschliesslich ein JSON-Objekt mit genau den beiden Schlüsseln "success" und "reasoning" sein. Wiederholen Sie nicht das gesamte JSON-Schema oder fügen zusätzliche Meta-Informationen hinzu.
    Ihre Aufgabe ist es, zu bestimmen, ob eine neue Benutzeranfrage basierend auf diesen Beispielen zulässig ist.
    **Beispiele:**
    <Examples>
    {examples}
    </Examples>
    **Benutzeranfrage:**
    <Benutzer>
    {user_query}
    </Benutzer>
  user_message: |
    <Benutzer>
    {user}
    </Benutzer>
  success_message: |
    <Agent>
    ```{ "success": {success},
  reason_message: |
    "reasoning": "{reason}" }```
    </Agent>
  success: |
    true, wenn die Benutzeranfrage zulässig ist, false, wenn die Anfrage nicht erlaubt ist.
  reason: |
    Begründung für die getroffene Entscheidung.
  docstring: |
    Datenmodell für die Entscheidung, ob die Anfrage akzeptabel ist oder nicht.
context_sufficient_guard:
  doc_string: |
    Ergebnis der Auswertung, ob der Kontext ausreicht, um die Benutzeranfrage zu beantworten.
  reason: |
    Begründung, warum der Kontext ausreichend ist oder nicht.
  success: |
    true, wenn der Kontext für die Beantwortung der Benutzeranfrage ausreicht, false, wenn er nicht ausreicht.
  new_query: |
    Eine überarbeitete Abfrage, um bessere Suchergebnisse zu erhalten, wenn der Kontext unzureichend war, wobei darauf zu achten ist, dass sich die Abfrage ausreichend 
    von den bestehenden Abfragen unterscheiden.
  prompt: |
    Frage:
    <Question>
    {user_query}
    </Question>
    Vorherige Abfragen:
    <Previous_Queries>
    {prev_queries}
    <\Previous_Queries>
    Gesprächsverlauf (enthält alle als Systemnachrichten eingefügten Benutzer- oder Organisationsspeicher — behandle sie als zusätzlichen Kontext, der die Frage bereits beantworten kann):
    <Chat_History>
    {chat_history}
    </Chat_History>
    Kontext:
    <Context>
    {context}
    </Context>
    ---
    ANWEISUNGEN:
    Entscheide, ob die Frage mit Gesprächsverlauf und/oder Kontext beantwortet werden kann.
    - Wenn ja → success=True.
    - Wenn nein → success=False und erzeuge eine new_query für weitere Informationen. Leitfaden für new_query:
      1. PRIORISIERE ÜBERGEORDNETE KONZEPTE: Gehe in der Begriffshierarchie nach oben zu breiteren Domänen (z. B. „neuronale Netze“ → „Methoden des maschinellen Lernens“).
      2. Vermeide Wiederholungen oder geringfügige Variationen einer vorherigen Abfrage.
      3. Wurden übergeordnete Konzepte bereits erforscht, versuche verwandte Felder, grundlegende Konzepte, übergeordnete Kategorien, breitere Prinzipien oder interdisziplinäre Verbindungen.
      4. new_query MUSS sich klar von jeder vorherigen Abfrage unterscheiden.
      5. Jede nachfolgende Abfrage sollte einen grösseren konzeptionellen Sprung darstellen als die vorherige.
    WICHTIG: Du MUSST über den bereitgestellten strukturierten Ausgabe-Tool antworten. Antworte NICHT in Klartext. Gib genau einen Tool-Aufruf mit deiner Entscheidung zurück.
  reason_no_hops: |
    Begründung, warum der Kontext ausreichend ist oder nicht (keine zusätzlichen Sprünge verfügbar).
  success_no_hops: |
    true, wenn der Kontext für die Beantwortung der Benutzeranfrage ausreicht, false, wenn er nicht ausreicht (keine zusätzlichen Sprünge verfügbar).
  docstring_no_hops: |
    Ergebnis der Auswertung, ob der Kontext ausreicht, um die Benutzeranfrage zu beantworten (keine zusätzlichen Sprünge verfügbar).
sensitive_info_guard:
  prompt: |
    Sie sind ein Sicherheitswächter, der für den Schutz sensibler Unternehmensinformationen verantwortlich ist. Ihre Aufgabe ist es, die folgende Antwort zu analysieren und zu bestimmen, ob sie sensible Informationen enthält, die nicht extern geteilt werden sollten.
    Suchen Sie nach:
    - Internen Unternehmensprozessen, -verfahren oder -richtlinien
    - Vertraulichen Geschäftsstrategien oder -plänen
    - Mitarbeiternamen, E-Mail-Adressen oder persönlichen Informationen
    - Finanzdaten, Budgets oder Preisinformationen
    - Technischen Spezifikationen oder proprietären Methoden
    - Kundendaten oder vertraulichen Kundeninformationen
    - Internen Systemdetails, Servernamen oder Infrastrukturinformationen
    - Allen Informationen, die als vertraulich oder nur intern markiert sind
    Wenn Sie sensible Informationen finden, stellen Sie eine bereinigte Version der Antwort zur Verfügung, bei der die sensiblen Teile entfernt oder verallgemeinert wurden.
    <Zu analysierende Antwort>
    {answer}
    </Zu analysierende Antwort>
    Ihre Ausgabe muss ein JSON-Objekt mit genau drei Schlüsseln sein:
    - "success": true, wenn keine sensiblen Informationen gefunden wurden, false, wenn sensible Informationen erkannt wurden
    - "reasoning": Erklärung Ihrer Entscheidung
    - "cleaned_answer": wenn sensible Informationen gefunden wurden, stellen Sie eine bereinigte Version zur Verfügung; andernfalls null
  reason: |
    Erklärung, ob sensible Informationen erkannt wurden und welche Maßnahmen ergriffen wurden.
  success: |
    true, wenn keine sensiblen Informationen gefunden wurden, false, wenn sensible Informationen erkannt und bereinigt wurden.
  cleaned_answer: |
    Die überarbeitete Antwort mit entfernten oder geschwärzten sensiblen Informationen, falls zutreffend.
  docstring: |
    Ergebnis der Analyse einer Antwort auf sensible Informationen, die nicht extern geteilt werden sollten.
few_shot_example:
  user:
    label: Benutzernachricht
    help: Eine beispielhafte Benutzeranfrage oder Nachricht, die ausgewertet wird.
  success:
    label: Anfrage akzeptieren
    help: Aktivieren, wenn dieses Beispiel akzeptiert werden soll, deaktivieren wenn
      abgelehnt.
  reason:
    label: Grund
    help: Erklärung, warum die Anfrage akzeptiert oder abgelehnt wird.
