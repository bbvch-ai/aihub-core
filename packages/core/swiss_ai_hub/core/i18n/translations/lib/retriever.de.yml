---
config:
  list_help: Die Wissensdatenbanken, die dieser Agent bei jeder Frage durchsucht.
    Pro Datenbank ein Eintrag; jeder hat eigene Einstellungen dafür, wie viele Dokumente
    abgerufen werden und wie gesucht wird.
  index_namespaces:
    label: Index-Namespaces
    help: Kommagetrennte Liste der Namespaces für den Abruf. Leer lassen, um aus allen
      Namespaces abzurufen.
  retrieve_k:
    label: Abzurufende Dokumente
    help: Anzahl der aus dem Vektorspeicher abzurufenden Dokumente.
  query_mode:
    label: Abfragemodus
    help: Legt fest, wie der Vektorspeicher abgefragt werden soll.
  min_similarity:
    label: Mindestähnlichkeit
    help: Ergebnisse, die der Frage weniger ähnlich sind, werden vor dem Reranking
      verworfen. Gilt für den Abfragemodus Default; 0 behält alle Ergebnisse.
  node_types:
    label: Knotentypen
    help: Arten von Knoten, die aus dem Index abgerufen werden sollen.
