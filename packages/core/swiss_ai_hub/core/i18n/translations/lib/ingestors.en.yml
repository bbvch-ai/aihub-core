---
config:
  name:
    label: Name
    placeholder: My knowledge database
  description:
    label: Description
    placeholder: Describe what this knowledge database contains and who it is for...
document_ingestion:
  display_name: Generic Document Ingestion Pipeline
  description: Parses, chunks and embeds uploaded documents for semantic retrieval.
  config:
    llm_model:
      label: Text Model
      help: Writes summaries, refines tables and describes figures.
    embedding_model:
      label: Embedding Model
      help: Embeds the chunks of this database. Cannot be changed after creation.
    vision_model:
      label: Vision Model
      help: Describes figures and images. Leave empty to use the text model.
    with_summary_nodes:
      label: Generate summaries
      help: Hierarchical summaries improve retrieval on long documents at the cost
        of extra model calls.
    with_table_refinement:
      label: Refine tables
      help: Detect table structure and split merged tables with the text model.
    with_figure_descriptions:
      label: Describe figures
      help: Generate a textual description for every figure and image.
