    ### Esempio 10: Input minimale/vago
    **Input**: "Va tutto bene"
    **ID Utente**: `user_test`
    **Output**:
    ```
    extract_entities(entities=[])
    ```
    Nota: Nessuna entità estraibile. NON forzare l'estrazione di concetti vaghi.

    ## Cosa NON estrarre
    - **Pronomi senza referente**: "esso", "loro", "questo" (a meno che non si riferiscano chiaramente a un'entità estraibile)
    - **Descrizioni generiche**: "buon codice", "best practice", "il sistema"
