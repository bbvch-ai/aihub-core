    ### Tipi specifici del dominio
    Per domini non coperti sopra, deriva il nome del tipo dalle convenzioni Wikidata:
    - Usa nomi singolari: `disease` non `diseases`
    - Usa minuscolo: `chemical_compound` non `Chemical_Compound`
    - Sii abbastanza specifico da essere utile: `gene` non `biological_entity`

    ## Esempi

    ### Esempio 1: Impiego semplice
    **Input**: "Lavoro presso Google come senior software engineer"
    **ID Utente**: `user_alice`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_alice", "entity_type": "person"}, {"entity": "google", "entity_type": "organization"}, {"entity": "senior_software_engineer", "entity_type": "role"}])
    ```

    ### Esempio 2: Stack tecnologico
    **Input**: "Il nostro backend usa Python 3.11 con FastAPI, PostgreSQL, e gira su AWS Lambda"
    **ID Utente**: `user_bob`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_bob", "entity_type": "person"}, {"entity": "python_3", "entity_type": "programming_language"}, {"entity": "fastapi", "entity_type": "framework"}, {"entity": "postgresql", "entity_type": "database"}, {"entity": "aws_lambda", "entity_type": "platform"}])
    ```
    Nota: "3.11" normalizzato a "3" poiché le versioni minori raramente contano per scopi del grafo.

    ### Esempio 3: Eventi con date
    **Input**: "Ho partecipato alla .NET Conference 2023 a Seattle e andrò anche alla .NET Conference 2024"
    **ID Utente**: `user_carol`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_carol", "entity_type": "person"}, {"entity": "dotnet_conference_2023", "entity_type": "event"}, {"entity": "seattle", "entity_type": "city"}, {"entity": "dotnet_conference_2024", "entity_type": "event"}])
    ```
    Nota: Le due conferenze sono entità DIVERSE perché l'anno differisce.

    ### Esempio 4: Persone e relazioni
    **Input**: "La mia manager Sarah Chen mi ha presentato al Dr. James Wilson del team sicurezza"
    **ID Utente**: `user_dave`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_dave", "entity_type": "person"}, {"entity": "sarah_chen", "entity_type": "person"}, {"entity": "james_wilson", "entity_type": "person"}, {"entity": "security_team", "entity_type": "team"}])
    ```
    Nota: I titoli (Dr.) vengono rimossi dai nomi.

    ### Esempio 5: Progetto con cronologia
    **Input**: "Il progetto di migrazione è iniziato nel Q1 2024 e dovrebbe terminare entro marzo 2025"
    **ID Utente**: `user_eve`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_eve", "entity_type": "person"}, {"entity": "migration_project", "entity_type": "project"}, {"entity": "2024_q1", "entity_type": "date"}, {"entity": "2025_03", "entity_type": "date"}])
    ```

    ### Esempio 6: Input non inglese
    **Input**: "Lavoro presso la Deutsche Bank a Francoforte"
    **ID Utente**: `user_franz`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_franz", "entity_type": "person"}, {"entity": "deutsche_bank", "entity_type": "organization"}, {"entity": "frankfurt", "entity_type": "city"}])
    ```
    Nota: I nomi delle entità rimangono riconoscibili ma normalizzati.

    ### Esempio 7: Entità ambigue
    **Input**: "Uso Spring Boot per il rilascio Primavera 2024 del nostro prodotto"
    **ID Utente**: `user_grace`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_grace", "entity_type": "person"}, {"entity": "spring_boot", "entity_type": "framework"}, {"entity": "2024_spring", "entity_type": "date"}, {"entity": "product", "entity_type": "product"}])
    ```
    Nota: "Spring Boot" (framework) vs "Primavera 2024" (stagione) sono correttamente distinti.

    ### Esempio 8: Specifico del dominio (Medico)
    **Input**: "Al paziente è stato diagnosticato il diabete di tipo 2 e gli è stata prescritta la Metformina"
    **ID Utente**: `user_doctor`
    **Output**:
    ```
    extract_entities(entities=[{"entity": "user_doctor", "entity_type": "person"}, {"entity": "patient", "entity_type": "person"}, {"entity": "type_2_diabetes", "entity_type": "disease"}, {"entity": "metformin", "entity_type": "medication"}])
    ```

    ### Esempio 9: Specifico del dominio (Legale)
    **Input**: "Il contratto ricade sotto la giurisdizione svizzera secondo l'Articolo 5 della Convenzione di Lugano"
    **ID Utente**: `user_lawyer`
    **Output**:
