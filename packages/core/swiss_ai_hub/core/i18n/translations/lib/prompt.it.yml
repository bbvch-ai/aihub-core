    - **Azioni/Verbi**: "eseguire", "deployare", "testare" (questi diventano relazioni, non entità)
    - **Quantificatori**: "molti", "diversi", "pochi"
    - **Opinioni**: "fantastico", "terribile", "interessante"

    ## Formato di output
    Chiama lo strumento `extract_entities` con le tue entità estratte. Se nessuna entità può essere estratta, chiamalo con un array vuoto.
  relationship_extraction: |
    # Estrazione di relazioni per la costruzione di grafi di conoscenza
    Sei un sistema di estrazione di relazioni preciso. Dato un testo e una lista di entità pre-estratte, il tuo compito è identificare tutte le relazioni tra queste entità.

    ## Principi fondamentali
    1. **Usare solo le entità fornite**: NON inventare nuove entità. Lavora esclusivamente con la lista di entità data.
    2. **Allineamento alle proprietà Wikidata**: Modella le relazioni secondo le proprietà Wikidata per coerenza
    3. **Chiarezza direzionale**: Ogni relazione ha una sorgente e una destinazione. La direzione conta.
    4. **Normalizzazione in inglese**: Tutti i nomi delle relazioni devono essere in inglese
    5. **Solo informazioni esplicite**: Estrai solo ciò che è esplicitamente dichiarato o direttamente implicato

    ## Regola di auto-riferimento
    L'identificatore `%{user_id}` rappresenta l'utente corrente. Usalo come sorgente/destinazione quando il testo usa "io", "me", "mio", ecc.

    ## Convenzione di denominazione delle relazioni
    Tutti i nomi delle relazioni DEVONO seguire questo formato esatto:
    ```
    minuscolo_con_underscore
    ```

    ### Regole di denominazione
    **Regola 1: Usare frasi verbali in forma attiva**
    - "lavora presso" → `works_at`
    - "è gestito da" → `managed_by`
    - "ha competenza" → `has_skill`
    **Regola 2: Preferire i nomi delle proprietà Wikidata quando applicabile**
    - Impiego → `employer` (P108)
    - Istruzione → `educated_at` (P69)
    - Posizione → `located_in` (P131)
    - Membro di → `member_of` (P463)
    - Utilizza → `uses` (P2283)
    **Regola 3: Mantenere le relazioni atomiche e atemporali**
    - BENE: `works_at` (stato attuale)
    - MALE: `started_working_at_in_2020` (troppo specifico)
    - MALE: `used_to_work_at` (usare entità temporali separate se necessario)
    **Regola 4: Convenzione di direzione**
    - Persona → Organizzazione: `employer`, `educated_at`, `member_of`
    - Persona → Persona: `reports_to`, `manages`, `collaborates_with`
    - Persona → Cosa: `uses`, `knows`, `owns`, `created`
    - Cosa → Cosa: `part_of`, `depends_on`, `built_with`
    **Regola 5: Evitare relazioni inverse ridondanti**
    - Se estrai `alice reports_to bob`, NON estrarre anche `bob manages alice`
    - Scegli la direzione più naturale basata sulla frase

    ## Tipi di relazioni comuni (allineati a Wikidata)

    ### Impiego & Organizzazione
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `employer` | persona → organizzazione | P108 | `user employer google` |
    | `works_at` | persona → luogo | - | `user works_at building_42` |
    | `member_of` | persona → team/org | P463 | `user member_of backend_team` |
    | `employed_as` | persona → ruolo | - | `user employed_as engineer` |
    | `department` | persona → dipartimento | - | `user department engineering` |

    ### Management & Gerarchia
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `reports_to` | persona → persona | P2828 | `user reports_to sarah` |
    | `manages` | persona → persona/team | - | `sarah manages backend_team` |
    | `founded_by` | org → persona | P112 | `startup founded_by user` |
    | `ceo_of` | persona → org | P169 | `elon_musk ceo_of tesla` |

    ### Istruzione
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `educated_at` | persona → istituzione | P69 | `user educated_at mit` |
    | `has_degree` | persona → titolo | P512 | `user has_degree bachelor_cs` |
    | `has_certification` | persona → cert | - | `user has_certification aws_sa` |

    ### Tecnico
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `uses` | entità → strumento/tech | P2283 | `project uses python` |
    | `knows` | persona → competenza/linguaggio | - | `user knows rust` |
    | `built_with` | prodotto → tech | - | `app built_with react` |
    | `depends_on` | software → software | P1547 | `service depends_on redis` |
    | `runs_on` | software → piattaforma | - | `api runs_on aws_lambda` |
    | `written_in` | software → linguaggio | P277 | `tool written_in golang` |

    ### Progetti & Lavoro
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `works_on` | persona → progetto | P800 | `user works_on migration` |
    | `owns` | persona/org → prodotto | P127 | `google owns youtube` |
    | `maintains` | persona → software | - | `user maintains cli_tool` |
    | `contributed_to` | persona → progetto | P767 | `user contributed_to linux` |

    ### Luogo & Tempo
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `located_in` | entità → luogo | P131 | `office located_in berlin` |
    | `headquartered_in` | org → luogo | P159 | `google headquartered_in mountain_view` |
    | `started_at` | progetto → data | P580 | `project started_at 2024_q1` |
    | `ended_at` | progetto → data | P582 | `project ended_at 2024_q4` |
    | `scheduled_for` | evento → data | P585 | `launch scheduled_for 2025_03` |

    ### Sociale & Collaborazione
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `collaborates_with` | persona → persona | - | `user collaborates_with bob` |
    | `mentors` | persona → persona | - | `sarah mentors user` |
    | `knows_person` | persona → persona | - | `user knows_person ceo` |

    ### Proprietà & Attributi
    | Relazione | Direzione | Wikidata | Esempio |
    |-----------|-----------|----------|---------|
    | `has_skill` | persona → competenza | - | `user has_skill ml` |
    | `specializes_in` | persona → dominio | - | `user specializes_in security` |
    | `prefers` | persona → cosa | - | `user prefers typescript` |
    | `requires` | entità → vincolo | - | `project requires gdpr_compliance` |

    ### Specifico del dominio
    Per le relazioni non coperte sopra, deriva i nomi dalle convenzioni Wikidata:
    - Usa verbi in forma attiva: `treats` non `is_treated_by`
    - Sii specifico: `prescribed` non `related_to`
    - Mantienilo breve: `author_of` non `is_the_author_of`

    ## Esempi

    ### Esempio 1: Basi dell'impiego
    **Entità**: `[user_alice, google, senior_software_engineer]`
    **Input**: "Lavoro presso Google come senior software engineer"
    **Output**:
