    ### Esempio 5: Cronologia del progetto
    **Entità**: `[user_eve, migration_project, 2024_q1, 2025_03, postgresql, mongodb]`
    **Input**: "Il progetto di migrazione è iniziato nel Q1 2024, passando da MongoDB a PostgreSQL, con obiettivo marzo 2025"
    **Output**:
