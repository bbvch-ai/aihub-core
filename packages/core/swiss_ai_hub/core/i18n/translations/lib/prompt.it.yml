---
condenser:
  standalone_question: |
    <role_and_task>
    Sei un esperto di ottimizzazione delle query di ricerca.
    Il tuo compito è riformulare **l'ultimo messaggio dell'utente** in questa chat in una domanda completamente autonoma.
    </role_and_task>
    <chat_history>
    {chat_history}
    </chat_history>
    <instructions>
    Il messaggio dell'utente contiene testo ed eventualmente un'immagine.
    1. **Risolvere il contesto dalla cronologia**: Sostituisci i pronomi o i riferimenti che si riferiscono a messaggi precedenti nella cronologia della chat con i termini concreti dalla cronologia.
    2. **Riferimenti all'immagine**: SOLO se l'utente fa esplicitamente riferimento a un'immagine (ad es. "Cos'è **questo**?", "Cosa vedi **qui**?"), sostituisci il pronome con una breve descrizione dell'oggetto visibile.
    3. **Non aggiungere nuove informazioni**: Non aggiungere MAI dettagli che non sono presenti nella domanda originale. La domanda riformulata deve essere semanticamente equivalente all'originale.
    4. **Output**: Restituisci SOLO la nuova frase.
    </instructions>
rag:
  context_prompt: |
    {% chat role="user" %}
    Ti vengono fornite informazioni di contesto aggiuntive sotto forma di documenti strutturati. Ogni documento segue 
    un formato coerente, iniziando con `<REFERENCE_DOCUMENT [metadata]>` e terminando con `</REFERENCE_DOCUMENT>`. Questi documenti 
    contengono dettagli essenziali che devono essere utilizzati per comprendere e rispondere con precisione alla domanda dell'utente.
    Ogni documento include metadati come fonte, namespace, tipo, lingua, versione e timestamp. Il contenuto di questi 
    documenti fornisce approfondimenti cruciali pertinenti al contesto fornito.
    Di seguito sono riportati i documenti rilevanti:
    <context_documents>
    {% for block in context_blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url.__str__() | image}}
    {% endif %}
    {% endfor %}
    </context_documents>
    Istruzione: Utilizza le informazioni dai documenti forniti per generare una risposta dettagliata e ben strutturata 
    alla domanda dell'utente.
    {% endchat %}
router:
  selection_option_index: Index of the selected option (0-based)
  reason: Detailed explanation of why this option is the most appropriate
  routing_prompt: |
    {% chat role="system" %}
    <task>
    Select the most appropriate routing option based on the given instructions.
    </task>
    <instructions>
    {{ instructions }}
    </instructions>
    <available_options>
    {% for route in routes %}
    <option id="{{ loop.index0 }}">
      <name>{{ route.name }}</name>
      <description>{{ route.description }}</description>
      <selection_criteria>{{ route.instructions }}</selection_criteria>
    </option>
    {% endfor %}
    </available_options>
    <selection_requirements>
    1. Analyze the instructions carefully
    2. Compare against each option's selection criteria
    3. Choose exactly one option that best matches
    4. Provide the option index (0 to {{ routes|length - 1 }})
    5. Explain your reasoning in detail
    </selection_requirements>
    {% endchat %}
  instructions:
    context_sufficient: |
      Determine whether the user's query can be fulfilled given the available chat history.
      <chat_history>
      {% for message in chat_history %}
      <message role="{{ message.role.value }}">
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      </message>
      {% endfor %}
      </chat_history>
      <user_query>
      {{ query }}
      </user_query>
      <fulfillment_criteria>
      <can_fulfill>
      A query CAN be fulfilled if ANY of the following are true:
      * All information required to fulfill the query is present in the chat history
      * No specific information is required to fulfill the query (e.g., summarizing already provided content)
      * The information required is trivial knowledge that most people would know (e.g., "the sky is blue")
      * There is no information in the chat history, but the query also does not require any specific information
      </can_fulfill>
      <cannot_fulfill>
      A query CANNOT be fulfilled if ANY of the following are true:
      * It explicitly asks for information not provided in the chat history and not trivially available
      * It requires a task that would need more knowledge than what is available in the context
      * The query can only be insufficiently or partially answered given the available context
      </cannot_fulfill>
      </fulfillment_criteria>
      Analyze the user query carefully in relation to the chat history. Determine whether the query can be fulfilled based on the criteria above. Provide a clear yes/no decision with detailed reasoning.
    expert_answer_sufficient: |
      La risposta dell'esperto risponde alla domanda dell'utente?
      <conversation_history>
      {% for message in chat_history %}
      {% if message.role.value == 'assistant' %}
      [Domanda dell'agente]:
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% elif message.role.value == 'user' %}
      [Risposta dell'esperto]:
      {% for block in message.blocks %}
      {% if block.block_type == 'text' %}
      {{ block.text }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      </conversation_history>
      <user_question>
      {{ query }}
      </user_question>
      Concentrati sull'ULTIMA risposta dell'esperto nella cronologia della conversazione sopra.
      La domanda È risposta se l'ultima risposta dell'esperto fornisce informazioni che rispondono direttamente a TUTTE le parti di ciò che è stato chiesto.
      La domanda NON è risposta se:
      - L'ultima risposta dell'esperto dice esplicitamente che non sa o rifiuta di rispondere
      - La domanda ha più parti e l'ultima risposta ne copre solo alcune
      Analizza attentamente la cronologia della conversazione prestando particolare attenzione all'ultima risposta dell'esperto. Determina se la domanda è stata sufficientemente risposta. Fornisci una decisione chiara con un ragionamento dettagliato.
memory:
  user_memory_system_message: |
    <user_context>
    ## Contesto di Memoria Utente
    **Informazioni Utente Corrente:**
    - ID Utente: {{ user.id }}
    - Nome: {{ user.name }}
    - E-mail: {{ user.email }}
    Le seguenti informazioni sono state apprese dalle conversazioni passate di **questo utente specifico** con te. Queste sono preferenze personali, contesto lavorativo e modelli comportamentali specifici di questo utente.
    **Linee Guida Importanti:**
    - Queste memorie sono **contesto opzionale** - fai riferimento ad esse solo se pertinenti alla query corrente
    - **NON forzare** queste memorie nella tua risposta se non si applicano naturalmente
    - L'utente potrebbe aver dimenticato di aver condiviso queste informazioni o potrebbero essere obsolete
    - Se una memoria contraddice la conversazione corrente, dai priorità al contesto corrente
    - **Non sei obbligato** a menzionare o riconoscere queste memorie a meno che non aggiungano valore
    {% if memories %}
    **Fatti Specifici dell'Utente:**
    {% for memory in memories %}
    - {{ memory.memory }}
    {% endfor %}
    {% endif %}
    {% if relations %}
    **Relazioni del Grafo della Conoscenza:**
    {% for relation in relations %}
    - {{ relation.source }} {{ relation.relation }} {{ relation.target }}
    {% endfor %}
    {% endif %}
    </user_context>
  organization_memory_system_message: |
    <organizational_context>
    ## Contesto di Memoria Organizzativa
    Le seguenti informazioni rappresentano **fatti espliciti sull'organizzazione** (politiche, stack tecnologico, processi, convenzioni) condivisi tra tutti gli utenti in questa organizzazione.
    **Linee Guida Importanti:**
    - Queste memorie sono **contesto opzionale** - fai riferimento ad esse solo se pertinenti alla query corrente
    - **NON forzare** fatti organizzativi nella tua risposta se non si applicano naturalmente
    - Questi sono fatti organizzativi generali e potrebbero non applicarsi a ogni team o individuo
    - Se la memoria organizzativa contraddice informazioni specifiche dell'utente, considera entrambi i contesti
    - **Non sei obbligato** a menzionare o riconoscere queste memorie a meno che non aggiungano valore
    {% if memories %}
    **Fatti Organizzativi:**
    {% for memory in memories %}
    - {{ memory.memory }}
    {% endfor %}
    {% endif %}
    {% if relations %}
    **Relazioni del Grafo della Conoscenza:**
    {% for relation in relations %}
    - {{ relation.source }} {{ relation.relation }} {{ relation.target }}
    {% endfor %}
    {% endif %}
    </organizational_context>
  fact_extraction: |
    Sei un assistente specializzato nell'estrazione di memoria per l'agente %{agent_name}.

    ## Contesto dell'agente
    - **Nome dell'agente:** %{agent_name}
    - **Scopo dell'agente:** %{agent_description}
    - **Data corrente:** %{current_date}

    ## Il tuo compito
    Estrai fatti rilevanti sull'UTENTE dalle conversazioni tra l'utente e il %{agent_name}.
    Questi fatti saranno memorizzati e recuperati successivamente quando lo stesso utente interagirà nuovamente con il %{agent_name}.

    ## Regole critiche
    1. Estrai fatti SOLO dai messaggi dell'UTENTE, MAI dai messaggi dell'assistente/agente
    2. Estrai fatti RILEVANTI per lo scopo del %{agent_name}
    3. Estrai SOLO fatti utili per conversazioni future
    4. I fatti devono essere ATOMICI e AUTONOMI (comprensibili senza contesto)
    5. Puoi DEDURRE fatti da domande, contesto e interazioni multi-turno
    6. Massimo 10 fatti per estrazione (dai priorità ai più importanti)
    7. Ogni fatto dovrebbe essere sotto i 150 caratteri quando possibile

    ## Cosa estrarre
    | Categoria | Descrizione | Esempi |
    |-----------|-------------|--------|
    | Background | Nome, professione, formazione, esperienza | "Ingegnere backend senior presso Stripe" |
    | Preferenze | Gusti, avversioni, strumenti/approcci preferiti | "Preferisce la programmazione funzionale" |
    | Contesto | Background che aiuta l'agente a servirli meglio | "Sta costruendo uno strumento di collaborazione in tempo reale" |
    | Requisiti | Necessità, vincoli, criteri | "Richiede conformità GDPR" |
    | Storico | Decisioni passate, esperienze | "Migrato da MongoDB a PostgreSQL" |
    | Stile | Preferenze di comunicazione | "Preferisce spiegazioni tecniche concise" |

    ## Cosa NON estrarre
    - Conoscenze generali (es. "Python è un linguaggio di programmazione")
    - Capacità o funzionalità dell'agente
    - Saluti senza sostanza
    - Informazioni dai messaggi di sistema o dell'assistente
    - Informazioni irrilevanti per lo scopo del %{agent_name}
    - Affermazioni vaghe o generiche (es. "Mi piace il codice buono")
    - Fatti non atomici privi di contesto (es. "Il team ha 5 membri" - quale team?)
    - Informazioni incerte o speculative ("Potrei passare a...", "Sto considerando...")

    ## Formato di output
    Restituisci un oggetto JSON con una chiave "facts" contenente un array di stringhe di fatti estratti:
    ```json
    {
      "facts": ["fatto uno", "fatto due"]
    }
    ```
    **Regole dello schema:**
    - `facts` deve essere un array di stringhe (può essere vuoto)
    - Ogni fatto: una frase, tempo presente, specifico, atomico
    - Un array vuoto `{"facts": []}` è valido quando non esistono fatti rilevanti
    - Estrai i fatti nella stessa lingua dell'input dell'utente
    **Output non validi:**
    - `{"facts": null}`
    - `{"fact": [...]}`
    - `["fact1", "fact2"]`

    ## Esempi

    ### Background dell'utente
    **Estrazione da singolo messaggio:**
    User: "Sono un ingegnere backend senior presso Stripe, lavoro lì da 3 anni concentrandomi sull'infrastruttura dei pagamenti"
    Assistant: "È un'ottima esperienza! L'infrastruttura dei pagamenti su larga scala deve comportare sfide interessanti."
    ```json
    {
      "facts": [
        "L'utente è un ingegnere backend senior presso Stripe",
        "L'utente lavora presso Stripe da 3 anni",
        "L'utente è specializzato nell'infrastruttura dei pagamenti"
      ]
    }
    ```
    > Ogni fatto è atomico e autonomo. Le conversazioni future possono fare riferimento alla loro esperienza in Stripe o competenza nei pagamenti.
    **Dedotto da una domanda:**
    User: "Come posso ottimizzare le query del database per milioni di transazioni al secondo?"
    Assistant: "Per quella scala, vorrai considerare lo sharding, le repliche di lettura e le strategie di caching..."
    ```json
    {
      "facts": [
        "L'utente lavora con sistemi che gestiscono milioni di transazioni al secondo",
        "L'utente ha responsabilità di ottimizzazione del database"
      ]
    }
    ```
    > La domanda specifica rivela scala e responsabilità senza dichiarazione esplicita.

    ### Preferenze dell'utente
    **Estrazione multi-turno:**
    User: "Qual è il modo migliore per strutturare un'app React?"
    Assistant: "Ci sono diversi approcci: cartelle basate sulle funzionalità, atomic design o struttura orientata al dominio. Quanto è grande la tua applicazione?"
    User: "È una grande app enterprise, e odio la struttura predefinita di Create React App. Uso sempre cartelle per funzionalità con test collocati"
    ```json
    {
      "facts": [
        "L'utente lavora su grandi applicazioni React enterprise",
        "L'utente non ama la struttura predefinita di Create React App",
        "L'utente preferisce l'organizzazione a cartelle basata sulle funzionalità",
        "L'utente colloca i test insieme alle funzionalità"
      ]
    }
    ```
    > Le preferenze emergono attraverso la conversazione. Ogni fatto è specifico e azionabile.
    **Esempio negativo - troppo generico:**
    User: "Mi piace il codice pulito"
    Assistant: "Il codice pulito è sicuramente importante! Quali pratiche specifiche segui?"
    ```json
    {
      "facts": []
    }
    ```
    > "Gli piace il codice pulito" è troppo generico e non azionabile.

    ### Contesto dell'utente
    **Contesto multi-turno ricco:**
    User: "Stiamo costruendo uno strumento di collaborazione in tempo reale come Figma"
    Assistant: "È entusiasmante! La collaborazione in tempo reale richiede un'architettura attenta. Qual è il vostro stack tecnologico?"
    User: "Usiamo Elixir con Phoenix Channels, ma abbiamo difficoltà con la risoluzione dei conflitti quando più utenti modificano simultaneamente"
    ```json
    {
      "facts": [
        "L'utente sta costruendo uno strumento di collaborazione in tempo reale simile a Figma",
        "Il prodotto dell'utente utilizza Elixir e Phoenix Channels",
        "L'utente sta affrontando sfide di risoluzione dei conflitti nell'editing multi-utente"
      ]
    }
    ```
    > Il contesto si costruisce attraverso i messaggi. Ogni fatto fornisce un background utile per future discussioni tecniche.
    **Dedotto dalla descrizione del problema:**
    User: "Il nostro cluster Kubernetes continua a esaurire la memoria anche se abbiamo impostato i limiti delle risorse. Abbiamo circa 200 microservizi"
    Assistant: "Con 200 microservizi, la gestione delle risorse diventa complessa..."
    ```json
    {
      "facts": [
        "L'utente gestisce un cluster Kubernetes con circa 200 microservizi",
        "L'utente sta riscontrando problemi di gestione della memoria in Kubernetes",
        "L'utente ha responsabilità DevOps o di platform engineering"
      ]
    }
    ```
    > La descrizione del problema rivela scala, tecnologia e ruolo.

    ### Requisiti dell'utente
    **Chiarimento multi-turno:**
    User: "Ho bisogno di una coda di messaggi per il nostro sistema"
    Assistant: "Quali sono i tuoi requisiti principali? Throughput, durabilità, garanzie di ordinamento?"
    User: "Deve gestire 100k messaggi/secondo, non mi interessa l'ordinamento, ma assolutamente non può perdere messaggi. Inoltre, siamo su AWS e non possiamo usare servizi gestiti per conformità"
    ```json
    {
      "facts": [
        "L'utente ha bisogno di una coda di messaggi che gestisca 100k messaggi al secondo",
        "L'utente non richiede ordinamento dei messaggi",
        "L'utente richiede consegna garantita dei messaggi senza perdite",
        "L'infrastruttura dell'utente è su AWS",
        "L'utente non può usare servizi gestiti per requisiti di conformità"
      ]
    }
    ```
    > I requisiti si cristallizzano attraverso la conversazione. Ogni vincolo è atomico e chiaro.
    **Esempio negativo - solo esplorazione:**
    User: "Quali code di messaggi sono disponibili?"
    Assistant: "Le opzioni popolari includono RabbitMQ, Kafka, AWS SQS, Redis Pub/Sub..."
    ```json
    {
      "facts": [
        "L'utente sta esplorando le opzioni di code di messaggi"
      ]
    }
    ```
    > Estrai solo che stanno esplorando, non requisiti specifici che non hanno dichiarato.

    ### Storico dell'utente
    **Storia multi-turno:**
    User: "Abbiamo provato GraphQL ma siamo tornati a REST"
    Assistant: "Cosa ha portato a questa decisione?"
    User: "I dev junior lo trovavano troppo complesso, e la nostra app mobile aveva problemi di performance con l'over-fetching nonostante i vantaggi di GraphQL. Ci sono voluti 6 mesi per tornare indietro"
    ```json
    {
      "facts": [
        "Il team dell'utente ha tentato l'adozione di GraphQL ma è tornato a REST",
        "Il team dell'utente include sviluppatori junior che hanno trovato GraphQL complesso",
        "L'utente ha riscontrato problemi di performance dell'app mobile con GraphQL",
        "L'utente ha impiegato 6 mesi per migrare da GraphQL a REST"
      ]
    }
    ```
    > L'esperienza storica fornisce contesto per future discussioni architetturali.
    **Livello di esperienza dedotto:**
    User: "Perché qualcuno dovrebbe usare SOAP nel 2024? Mi ricordo di aver implementato WS-Security ai tempi"
    Assistant: "SOAP ha ancora usi di nicchia nei sistemi enterprise, anche se REST e gRPC dominano ora."
    ```json
    {
      "facts": [
        "L'utente ha esperienza nell'implementazione di SOAP e WS-Security",
        "L'utente ha lavorato nello sviluppo software durante l'era SOAP",
        "L'utente considera SOAP una tecnologia obsoleta"
      ]
    }
    ```
    > La domanda rivela esperienza storica e opinioni attuali.

    ### Stile dell'utente
    **Dichiarazione diretta:**
    User: "Puoi spiegare ma saltare le basi? Preferisco spiegazioni tecniche concise con esempi di codice piuttosto che teoria"
    Assistant: "Certo, manterrò tutto tecnico e focalizzato sul codice."
    ```json
    {
      "facts": [
        "L'utente preferisce saltare le spiegazioni di base",
        "L'utente vuole spiegazioni tecniche concise",
        "L'utente preferisce esempi di codice alle spiegazioni teoriche"
      ]
    }
    ```
    > Preferenze di comunicazione chiare che plasmano tutte le interazioni future.
    **Dedotto da una correzione:**
    User: "Qual è il TL;DR?"
    Assistant: "Ecco una panoramica completa: [lunga spiegazione]"
    User: "No, intendevo tipo 2-3 punti massimo. Non ho tempo per i saggi"
    ```json
    {
      "facts": [
        "L'utente preferisce riassunti molto brevi (2-3 punti)",
        "L'utente ha tempo limitato per spiegazioni dettagliate"
      ]
    }
    ```
    > Le preferenze di stile emergono dalle correzioni.

    ### Multi-turno complesso
    **Costruzione di contesto ricco:**
    User: "Come gestite l'autenticazione nei microservizi?"
    Assistant: "I pattern comuni includono auth via API Gateway, service mesh o token distribuiti. Qual è il vostro setup attuale?"
    User: "Abbiamo 50 servizi, attualmente usiamo secret JWT condivisi ma è un incubo. Il nostro team di sicurezza spinge per mTLS"
    Assistant: "mTLS sarebbe sicuramente più sicuro. Potreste implementarlo gradualmente con Istio o Linkerd."
    User: "Istio sembra eccessivo per noi. Siamo una startup fintech con 12 ingegneri, non Google"
    ```json
    {
      "facts": [
        "L'utente lavora in una startup fintech",
        "L'azienda dell'utente ha 12 ingegneri",
        "L'utente gestisce 50 microservizi",
        "L'utente attualmente usa JWT con secret condivisi per l'autenticazione",
        "L'utente considera il setup JWT attuale problematico",
        "Il team di sicurezza dell'utente raccomanda mTLS",
        "L'utente considera Istio troppo complesso per le dimensioni del loro team"
      ]
    }
    ```
    > Più turni rivelano contesto aziendale, setup tecnico, dimensioni del team, punti dolenti e fattori decisionali.

    ### Esempi negativi
    **Fatto non atomico (contesto mancante):**
    User: "Il nostro team è troppo piccolo per questo"
    Assistant: "Quante persone ci sono nel tuo team?"
    User: "Cinque sviluppatori"
    ```json
    {
      "facts": []
    }
    ```
    > "Team di 5 sviluppatori" senza sapere quale team/azienda non è utile.
    **Incerto/speculativo:**
    User: "Sto pensando di passare forse a Rust un giorno"
    Assistant: "Rust è fantastico per la programmazione di sistema!"
    ```json
    {
      "facts": []
    }
    ```
    > Non confermato, solo speculazione. Non estrarre.
    **Decisione confermata:**
    User: "Ho deciso di passare a Rust il mese scorso e lo adoro"
    Assistant: "Ottima scelta!"
    ```json
    {
      "facts": [
        "L'utente è passato a Rust il mese scorso",
        "L'utente ama programmare in Rust"
      ]
    }
    ```
    > Un'azione confermata può essere estratta.

    ## Promemoria finali
    - Un array di fatti vuoto è valido quando non esistono informazioni rilevanti
    - Concentrati sui fatti che aiutano il %{agent_name} a servire meglio l'utente
    - Un'informazione per fatto
    - Non duplicare informazioni tra i fatti
    - In caso di dubbio, non estrarre
  memory_update: |
    Sei un sistema di gestione della memoria per l'agente %{agent_name}.

    ## Contesto dell'agente
    - **Nome dell'agente:** %{agent_name}
    - **Scopo dell'agente:** %{agent_description}

    ## Il tuo compito
    Confronta i fatti appena estratti con i ricordi esistenti per determinare lo stato ottimale della memoria.
    Decidi se AGGIUNGERE, AGGIORNARE, ELIMINARE o mantenere (NESSUNO) ogni informazione.

    ## Principi fondamentali
    1. **Atomicità:** Ogni ricordo contiene UNA sola informazione
    2. **Specificità:** Non perdere mai dettagli durante l'aggiornamento—aggiungi dettagli o mantieni separati
    3. **Consapevolezza temporale:** Le informazioni recenti aggiornano quelle più vecchie dello stesso tipo
    4. **Deduplicazione semantica:** Evita di memorizzare la stessa informazione con parole diverse
    5. **Preservazione del contesto:** Gli aggiornamenti dovrebbero arricchire, non ridurre le informazioni

    ## Operazioni

    ### ADD
    Crea un nuovo ricordo quando il fatto è un'informazione VERAMENTE NUOVA non coperta dai ricordi esistenti.
    **Usa quando:**
    - L'informazione non è coperta da alcun ricordo esistente
    - Correlata ma abbastanza distinta per una memorizzazione separata
    - Aggiunge una nuova dimensione alla conoscenza esistente
    **Scenario di esempio:**
    - Esistente: "Usa Python per lo sviluppo backend"
    - Nuovo fatto: "Usa TypeScript per lo sviluppo frontend"
    - Decisione: ADD (dimensione diversa—backend vs frontend)

    ### UPDATE
    Arricchisci un ricordo esistente quando il fatto affina o aggiunge specificità.
    **Usa quando:**
    - Il fatto aggiunge specificità al ricordo esistente
    - Il fatto fornisce uno stato più recente dello stesso attributo
    - Il fatto chiarisce senza cambiare il significato principale
    **Regola:** Il ricordo aggiornato deve contenere TUTTE le informazioni sia dal vecchio che dal nuovo.
    **Scenario di esempio:**
    - Esistente: "Lavora in una startup fintech"
    - Nuovo fatto: "Lavora nella startup fintech Stripe"
    - Decisione: UPDATE a "Lavora nella startup fintech Stripe"

    ### DELETE
    Rimuovi un ricordo esistente quando è ora incorretto o obsoleto.
    **Usa quando:**
    - Il fatto nega esplicitamente la vecchia informazione
    - La vecchia informazione è ora incorretta
    - L'utente indica un cambiamento ("Non lavoro più...", "Sono passato da...")
    **Regola:** Elimina solo quando sei certo che la vecchia informazione sia sbagliata.
    **Scenario di esempio:**
    - Esistente: "Preferisce il lavoro da remoto"
    - Nuovo fatto: "È passato all'ibrido e preferisce la collaborazione in ufficio"
    - Decisione: DELETE vecchia preferenza

    ### NONE
    Mantieni il ricordo esistente invariato quando non è necessaria alcuna azione.
    **Usa quando:**
    - Il fatto è già completamente catturato nel ricordo esistente
    - Il fatto è meno specifico del ricordo esistente
    - Il fatto è un sottoinsieme della conoscenza esistente
    **Scenario di esempio:**
    - Esistente: "Usa React 18 con TypeScript"
    - Nuovo fatto: "Usa React"
    - Decisione: NONE (già conosciuto, meno specifico)

    ## Regole di deduplicazione semantica
    | Scenario | Azione | Ragionamento |
    |----------|--------|--------------|
    | Stesso significato, parole diverse | NONE | "Sviluppa app mobile" = "Costruisce applicazioni mobili" |
    | Sottoinsieme dell'esistente | NONE | "Conosce Python" è sottoinsieme di "Conosce Python, JS, Go" |
    | Sovrainsieme dell'esistente | UPDATE | "Conosce Python, JS, Go" espande "Conosce Python" |
    | Correlato ma dimensione diversa | ADD | "5 anni di esperienza Python" ≠ "Python è il linguaggio preferito" |

    ## Gestione temporale
    | Scenario | Azione |
    |----------|--------|
    | Cambio di stato esplicito | DELETE vecchio + ADD nuovo |
    | Progressione di competenza | UPDATE ("Sta imparando Rust" → "Competente in Rust") |
    | Aggiunta storica | ADD ("Ha lavorato precedentemente in Amazon") |

    ## Formato di output
    Restituisci un oggetto JSON con una chiave "memory" contenente un array di oggetti operazione:
    ```json
    {
      "memory": [
        {"id": "0", "text": "contenuto del ricordo", "event": "NONE"},
        {"id": "1", "text": "contenuto aggiornato", "event": "UPDATE", "old_memory": "contenuto precedente"},
        {"id": "2", "text": "contenuto eliminato", "event": "DELETE"},
        {"id": "new_1", "text": "nuovo contenuto del ricordo", "event": "ADD"}
      ]
    }
    ```
    **Requisiti dei campi:**
    | Campo | Richiesto | Descrizione |
    |-------|-----------|-------------|
    | `id` | Sempre | ID esistente per UPDATE/DELETE/NONE, placeholder qualsiasi per ADD |
    | `text` | Sempre | Il contenuto del ricordo (atomico, autonomo) |
    | `event` | Sempre | Esattamente "ADD", "UPDATE", "DELETE" o "NONE" |
    | `old_memory` | Solo UPDATE | Il contenuto precedente del ricordo aggiornato |
    **Regole ID:**
    - UPDATE/DELETE/NONE: Usa l'ID ESATTO dalla lista dei ricordi esistenti
    - ADD: Usa qualsiasi placeholder (es. "new_1", "new_2")—il sistema genera l'ID reale

    ## Esempi

    ### Preservazione dell'atomicità
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Usa React per lo sviluppo frontend"},
      {"id": "1", "text": "Usa Node.js per lo sviluppo backend"}
    ]
    ```json
    **Nuovi fatti:** `["Sviluppatore full-stack che usa lo stack MERN"]`
    **Output:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Usa React per lo sviluppo frontend", "event": "NONE"},
        {"id": "1", "text": "Usa Node.js per lo sviluppo backend", "event": "NONE"},
        {"id": "new_1", "text": "Sviluppatore full-stack che usa lo stack MERN", "event": "ADD"}
      ]
    }
    ```
    > Mantieni i fatti tech specifici, aggiungi il contesto del ruolo come nuovo ricordo.

    ### Aggiornamento per raffinamento
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Gestisce l'infrastruttura con Terraform"},
      {"id": "1", "text": "Usa AWS per l'hosting cloud"}
    ]
    ```json
    **Nuovi fatti:** `["Gestisce l'infrastruttura AWS con Terraform e CloudFormation"]`
    **Output:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Gestisce l'infrastruttura AWS con Terraform e CloudFormation",
          "event": "UPDATE",
          "old_memory": "Gestisce l'infrastruttura con Terraform"
        },
        {"id": "1", "text": "Usa AWS per l'hosting cloud", "event": "NONE"}
      ]
    }
    ```
    > L'aggiornamento aggiunge la specificità AWS e lo strumento CloudFormation.

    ### Progressione temporale
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Sviluppatore junior presso TechCorp"},
      {"id": "1", "text": "Ha 2 anni di esperienza"}
    ]
    ```json
    **Nuovi fatti:** `["Promosso a sviluppatore senior presso TechCorp", "Ha 4 anni di esperienza"]`
    **Output:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Sviluppatore senior presso TechCorp (promosso da junior)",
          "event": "UPDATE",
          "old_memory": "Sviluppatore junior presso TechCorp"
        },
        {
          "id": "1",
          "text": "Ha 4 anni di esperienza",
          "event": "UPDATE",
          "old_memory": "Ha 2 anni di esperienza"
        }
      ]
    }
    ```
    > Progressione di carriera preservata nell'aggiornamento. Durata dell'esperienza aggiornata.

    ### Deduplicazione semantica
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Preferisce i paradigmi di programmazione funzionale"},
      {"id": "1", "text": "Scrive test con Jest"}
    ]
    ```json
    **Nuovi fatti:** `["Gli piace la programmazione funzionale", "Usa Jest per i test unitari"]`
    **Output:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Preferisce i paradigmi di programmazione funzionale", "event": "NONE"},
        {"id": "1", "text": "Scrive test con Jest", "event": "NONE"}
      ]
    }
    ```
    > Stesso significato con parole diverse. Nessun cambiamento necessario.

    ### Aggiornamento multi-fatto complesso
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Lavora su progetti di machine learning"},
      {"id": "1", "text": "Usa Python per la data science"},
      {"id": "2", "text": "Ha interesse per il NLP"}
    ]
    ```json
    **Nuovi fatti:**
    ```json
    [
      "Guida il team ML focalizzato su NLP presso Scale AI",
      "Ha pubblicato 3 paper sui modelli transformer",
      "Usa esclusivamente PyTorch per il deep learning"
    ]
    ```json
    **Output:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Guida il team ML focalizzato su NLP presso Scale AI",
          "event": "UPDATE",
          "old_memory": "Lavora su progetti di machine learning"
        },
        {"id": "1", "text": "Usa Python per la data science", "event": "NONE"},
        {
          "id": "2",
          "text": "Specializzato in NLP con focus sui modelli transformer",
          "event": "UPDATE",
          "old_memory": "Ha interesse per il NLP"
        },
        {"id": "new_1", "text": "Ha pubblicato 3 paper sui modelli transformer", "event": "ADD"},
        {"id": "new_2", "text": "Usa esclusivamente PyTorch per il deep learning", "event": "ADD"}
      ]
    }
    ```
    > Ruolo aggiornato con l'azienda. Interesse promosso a specializzazione. Nuovi fatti aggiunti.

    ### Gestione delle contraddizioni
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Preferisce il lavoro da remoto"},
      {"id": "1", "text": "Vive a San Francisco"},
      {"id": "2", "text": "Evita le riunioni prima delle 10"}
    ]
    ```json
    **Nuovi fatti:** `["Si è trasferito ad Austin per un nuovo ruolo ibrido", "Ora preferisce la collaborazione in ufficio"]`
    **Output:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Preferisce il lavoro da remoto", "event": "DELETE"},
        {"id": "1", "text": "Vive a San Francisco", "event": "DELETE"},
        {"id": "2", "text": "Evita le riunioni prima delle 10", "event": "NONE"},
        {"id": "new_1", "text": "Vive ad Austin", "event": "ADD"},
        {"id": "new_2", "text": "Lavora in modalità ibrida", "event": "ADD"},
        {"id": "new_3", "text": "Preferisce la collaborazione in ufficio", "event": "ADD"}
      ]
    }
    ```
    > Fatti contraddetti eliminati. Fatto non correlato mantenuto. Nuovi fatti aggiunti.

    ### Preservazione del percorso di apprendimento
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Ha difficoltà con il networking Kubernetes"}
    ]
    ```json
    **Nuovi fatti:** `["Ha finalmente capito il networking Kubernetes dopo 6 mesi di pratica"]`
    **Output:**
    ```json
    {
      "memory": [
        {
          "id": "0",
          "text": "Comprende il networking Kubernetes dopo 6 mesi di difficoltà iniziali",
          "event": "UPDATE",
          "old_memory": "Ha difficoltà con il networking Kubernetes"
        }
      ]
    }
    ```
    > Mostra la progressione preservando il contesto di apprendimento per risposte empatiche.

    ### Inizializzazione memoria vuota
    **Ricordo esistente:** `[]`
    **Nuovi fatti:**
    ```json
    [
      "Sviluppatore iOS senior presso Apple",
      "Specializzato in SwiftUI e Combine",
      "Preferisce i pattern UI dichiarativi",
      "Ha pubblicato 3 app sull'App Store"
    ]
    ```json
    **Output:**
    ```json
    {
      "memory": [
        {"id": "new_1", "text": "Sviluppatore iOS senior presso Apple", "event": "ADD"},
        {"id": "new_2", "text": "Specializzato in SwiftUI e Combine", "event": "ADD"},
        {"id": "new_3", "text": "Preferisce i pattern UI dichiarativi", "event": "ADD"},
        {"id": "new_4", "text": "Ha pubblicato 3 app sull'App Store", "event": "ADD"}
      ]
    }
    ```
    > Tutti i nuovi fatti diventano nuovi ricordi.

    ### Decisioni di granularità
    **Ricordo esistente:**
    ```json
    [
      {"id": "0", "text": "Ha la certificazione AWS Solutions Architect"},
      {"id": "1", "text": "Ha la certificazione Google Cloud Professional"}
    ]
    ```json
    **Nuovi fatti:** `["Ha la certificazione Azure Administrator", "Certificato in tutte le principali piattaforme cloud"]`
    **Output:**
    ```json
    {
      "memory": [
        {"id": "0", "text": "Ha la certificazione AWS Solutions Architect", "event": "NONE"},
        {"id": "1", "text": "Ha la certificazione Google Cloud Professional", "event": "NONE"},
        {"id": "new_1", "text": "Ha la certificazione Azure Administrator", "event": "ADD"},
        {"id": "new_2", "text": "Certificato in tutte le principali piattaforme cloud (AWS, GCP, Azure)", "event": "ADD"}
      ]
    }
    ```
    > Mantieni i dettagli specifici E aggiungi un riepilogo utile.

    ## Linee guida decisionali
    1. **In caso di dubbio, mantieni separato:** Meglio due fatti correlati che informazioni perse
    2. **Preserva i percorsi:** Non limitarti a cambiare "scarso in X" in "bravo in X"—mostra la progressione
    3. **Rimani azionabile:** Ogni ricordo dovrebbe aiutare a personalizzare le interazioni future
    4. **Rispetta l'atomicità:** Un ricordo = un fatto autonomo
    5. **Considera il recupero:** Sarà trovabile e utile in seguito?

    ## Promemoria finali
    - L'output deve essere JSON valido (nessun commento, nessuna virgola finale)
    - Ogni ricordo esistente deve apparire nell'output con l'evento appropriato
    - I nuovi fatti possono risultare in zero, uno o più nuovi ricordi
    - Mantieni la coerenza linguistica con i ricordi esistenti
  entity_extraction: |
    # Estrazione di entità per la costruzione di grafi di conoscenza
    Sei un sistema di estrazione di entità preciso. Il tuo compito è identificare tutte le entità menzionate nel testo dell'utente e classificarle per tipo. Questo è un passaggio di pre-elaborazione critico per la costruzione di grafi di conoscenza.

    ## Principi fondamentali
    1. **Denominazione canonica**: Ogni entità deve avere esattamente UNA rappresentazione canonica
    2. **Allineamento Wikidata**: Usa il modello concettuale di Wikidata come guida per i tipi di entità
    3. **Normalizzazione in inglese**: Tutti i nomi delle entità devono essere in inglese, anche se il testo sorgente è in un'altra lingua
    4. **Output deterministico**: Lo stesso input deve sempre produrre gli stessi nomi di entità

    ## Regola di auto-riferimento
    **CRITICO**: Quando l'utente si riferisce a se stesso usando "io", "me", "mio", "mia", "noi", "nostro", ecc., DEVI usare l'identificatore `%{user_id}` come nome dell'entità.
    Questo non è negoziabile.

    ## Convenzione di denominazione delle entità
    Tutti i nomi delle entità DEVONO seguire questo formato esatto:
    ```
    minuscolo_con_underscore
    ```

    ### Regole di denominazione (Applicare in ordine)
    **Regola 1: Tutto in minuscolo**
    - "Google" → `google`
    - "MIT" → `mit`
    - "John Smith" → `john_smith`
    **Regola 2: Sostituire spazi e caratteri speciali con underscore**
    - "New York" → `new_york`
    - "C++" → `cpp`
    - "Node.js" → `nodejs`
    - ".NET" → `dotnet`
    - "Vue.js 3" → `vuejs_3`
    **Regola 3: Rimuovere i suffissi aziendali**
    - "Google Inc." → `google`
    - "Apple LLC" → `apple`
    - "Microsoft Corporation" → `microsoft`
    - "BMW AG" → `bmw`
    **Regola 4: Usare nomi canonici completi per le persone**
    - "Dr. Sarah Chen" → `sarah_chen`
    - "Prof. Smith" → (necessario nome completo, estrai come `smith` solo se nome completo sconosciuto)
    - "Bob" → `bob` (se nessun cognome disponibile)
    - "Robert 'Bob' Johnson" → `robert_johnson`
    **Regola 5: Le date usano un formato ispirato a ISO**
    - "Gennaio 2024" → `2024_01`
    - "Q3 2024" → `2024_q3`
    - "2024" → `2024`
    - "15 Marzo 2024" → `2024_03_15`
    - "Estate 2023" → `2023_summer`
    - "Lunedì scorso" → (NON estrarre - troppo relativo)
    **Regola 6: I numeri di versione fanno parte del nome quando semanticamente distinti**
    - "Python 3" → `python_3` (se la versione è importante nel contesto)
    - "Python" → `python` (se la versione non è importante)
    - ".NET Conference 2023" → `dotnet_conference_2023`
    - ".NET Conference 2024" → `dotnet_conference_2024`
    - "iPhone 15" → `iphone_15`
    - "GPT-4" → `gpt_4`
    **Regola 7: Gli acronimi rimangono acronimi (minuscolo)**
    - "NASA" → `nasa`
    - "FBI" → `fbi`
    - "AWS" → `aws`
    - "API" → `api`
    - "CEO" → `ceo` (quando si riferisce al ruolo)
    **Regola 8: Tradurre il non-inglese in inglese**
    - "München" → `munich`
    - "东京" (Tokyo) → `tokyo`
    - "Société Générale" → `societe_generale`
    **Regola 9: I concetti composti usano underscore**
    - "apprendimento automatico" → `machine_learning`
    - "intelligenza artificiale" → `artificial_intelligence`
    - "scienza dei dati" → `data_science`
    **Regola 10: Disambiguare quando necessario**
    - "Apple" (azienda) → `apple` (il contesto è solitamente sufficiente)
    - "mela" (frutto) → `apple_fruit` (solo se esiste ambiguità nello stesso grafo)
    - "Java" (linguaggio) → `java`
    - "Java" (isola) → `java_island`

    ## Tipi di entità (allineati a Wikidata)
    Usa questi nomi di tipo. In caso di dubbio, fai riferimento a cosa userebbe Wikidata.

    ### Persone & Organizzazioni
    | Tipo | Descrizione | Rif Wikidata | Esempi |
    |------|-------------|--------------|--------|
    | `person` | Individui umani | Q5 | `john_smith`, `sarah_chen` |
    | `organization` | Aziende, istituzioni, ONG | Q43229 | `google`, `mit`, `unesco` |
    | `team` | Gruppi di lavoro, squadre sportive | Q327245 | `backend_team`, `lakers` |
    | `department` | Suddivisioni organizzative | Q2366457 | `engineering`, `hr` |

    ### Ruoli & Professioni
