---
config:
  name:
    label: Servername
    help: Ein logischer Name zur Identifikation dieser MCP-Serververbindung.
  url:
    label: Server-URL
    help: Die HTTP-URL des MCP-Server-Endpunkts (z.B. https://mcp.example.com/mcp).
  auth_mode:
    label: Authentifizierungsmodus
    help: |
      Wie sich Agenten beim MCP-Server authentifizieren. "Statischer API-Schlüssel" verwendet einen
      hier hinterlegten gemeinsamen Schlüssel; "Benutzer-Token" leitet das Token der anfragenden Person
      weiter, sodass externe Aktionen ihr zugeordnet werden.
    static_api_key_label: Statischer API-Schlüssel
    user_token_label: Benutzer-Token
  api_key:
    label: API-Schlüssel
    help: Optionaler API-Schlüssel für authentifizierte MCP-Server.
  timeout:
    label: Zeitlimit (Sekunden)
    help: Maximale Wartezeit auf eine Antwort vom MCP-Server.
