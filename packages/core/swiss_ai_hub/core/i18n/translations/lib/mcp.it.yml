---
config:
  name:
    label: Nome del server
    help: Un nome logico per identificare questa connessione al server MCP.
  url:
    label: URL del server
    help: L'URL HTTP dell'endpoint del server MCP (es. https://mcp.example.com/mcp).
  auth_mode:
    label: Modalità di autenticazione
    help: |
      Come gli agenti si autenticano al server MCP. "Nessuna" non invia credenziali. "Chiave API"
      usa una chiave condivisa configurata di seguito. "Token utente" inoltra il token bearer
      dell'utente richiedente in modo che le azioni esterne gli vengano attribuite — funziona solo
      per esecuzioni di chat-completion avviate dall'utente che inoltrano un header
      X-AIHub-User-Token. Le esecuzioni pianificate, avviate da un processo, da un canale bot o da
      agente ad agente non inoltrano un token utente e falliranno in questa modalità.
    none_label: Nessuna
    api_key_label: Chiave API
    user_token_label: Token utente
  api_key:
    label: Chiave API
    help: Chiave API statica per il server MCP — usata solo quando la modalità di
      autenticazione è "Chiave API".
  timeout:
    label: Timeout (secondi)
    help: Tempo massimo di attesa per una risposta dal server MCP.
