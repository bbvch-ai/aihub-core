---
tenant_id:
  label: ID du locataire
  help: Identifiant de locataire utilisé pour restreindre les lectures et écritures
    de la mémoire organisationnelle.
allowed_tenant_namespaces:
  label: Espaces de noms autorisés
  help: Liste des espaces de noms autorisés pour les lectures/écritures de la mémoire
    organisationnelle. Laisser vide pour autoriser tous les espaces de noms.
  placeholder: Saisir un espace de noms et appuyer sur Entrée pour ajouter
rerank_organization_memory:
  label: Reclasser la mémoire organisationnelle
  help: Reclasser les résultats de recherche de mémoire organisationnelle avec le
    reranker configuré pour une meilleure pertinence. Augmente la latence et le coût.
default_tenant_namespace:
  label: Espace de noms de mémoire organisationnelle par défaut
  help: Espace de noms utilisé pour les écritures dans la mémoire organisationnelle
    (et pour les lectures lorsque l'événement ne fournit pas de remplacement). Laisser
    vide pour utiliser la valeur par défaut de la plateforme.
