---
config:
  host:
    label: Hôte IMAP
    help: Nom d'hôte du serveur IMAP (par ex. imap.example.com).
  port:
    label: Port IMAP
    help: Port du serveur IMAP. Utiliser 993 pour le TLS implicite.
  username:
    label: Nom d'utilisateur
    help: Identifiant de la boîte aux lettres, généralement l'adresse e-mail complète.
  password:
    label: Mot de passe
    help: Mot de passe de la boîte aux lettres ou jeton spécifique à l'application.
  use_tls:
    label: Utiliser TLS
    help: Se connecter via TLS implicite. À désactiver uniquement pour les serveurs
      de test en clair.
  inbox_folder:
    label: Dossier de réception
    help: Dossier de la boîte aux lettres à partir duquel lire les e-mails entrants.
  max_messages:
    label: Nombre max d'e-mails non lus
    help: Nombre maximal de messages non lus répertoriés par exécution.
  drafts_folder:
    label: Dossier des brouillons
    help: Dossier de la boîte aux lettres où les brouillons sont écrits.
  enable_move:
    label: Déplacer l'e-mail récupéré
    help: Si activé, le mail récupéré est déplacé dans le dossier traité après sa
      lecture. Si désactivé, l'étape de déplacement est ignorée et le mail reste dans
      la boîte de réception.
  processed_folder:
    label: Dossier traité
    help: Dossier de la boîte aux lettres où un mail traité est déplacé lorsque le
      déplacement est activé.
