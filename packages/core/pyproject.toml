[project]
name = "swiss-ai-hub-core"
version = "0.315.0"
description = "Foundational shared library for the Swiss AI Hub platform: event-driven Swiss AI Agent Protocol, auth, and AI/ML utilities."
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mongoengine>=0.29.1",
    "llama-index-core>=0.14.12,<0.15",
    "azure-ai-documentintelligence>=1.0.2",
    "pydantic-settings>=2.7.0",
    "python-i18n>=0.3.9",
    "nats-py>=2.9.0",
    "pyyaml>=6.0.2",
    "llama-index-vector-stores-milvus>=0.9.4",
    "fsspec>=2024.10.0",
    "llama-index-readers-file>=0.5.6",
    "colorlog>=6.9.0",
    "openinference-instrumentation>=0.1.38",
    "openinference-instrumentation-llama-index>=4.2.1",
    "openinference-semantic-conventions>=0.1.21",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-instrumentation>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-semantic-conventions>=0.60b1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "pydantic>=2.10.3",
    "llama-index-storage-docstore-mongodb>=0.4.1",
    "llama-index-llms-openai-like>=0.5.3",
    "transformers>=4.57.3",
    "fastapi>=0.128.0",
    "azure-storage-file-datalake>=12.22.0",
    "adlfs>=2025.8.0",
    "redis>=5.2.1",
    "openai>=1.76.2",
    "cachetools>=5.5.2",
    "markitdown[docx,outlook,pptx,xlsx]>=0.1.4",
    "boto3>=1.41.5",
    "llama-index-embeddings-openai-like>=0.2.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-requests>=0.60b1",
    "opentelemetry-instrumentation-pymongo>=0.60b1",
    "opentelemetry-instrumentation-jinja2>=0.60b1",
    "opentelemetry-instrumentation-asyncio>=0.60b1",
    "opentelemetry-instrumentation-redis>=0.60b1",
    "opentelemetry-instrumentation-botocore>=0.60b1",
    "opentelemetry-instrumentation-milvus>=0.47.0",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "opentelemetry-instrumentation-aiohttp-client>=0.60b1",
    "llama-index-postprocessor-cohere-rerank>=0.5.1",
    "lxml>=5.4.0",
    "html5lib>=1.1",
    "pypdf>=6.1.3",
    "boto3-stubs[s3]>=1.42.30",
    "langfuse>=3.14.1",
    "s3fs>=2024.10.0,<2025.0.0",
    "tabulate>=0.9.0",
    "pyjwt>=2.11.0",
    "blinker>=1.9.0",
    "scim2-client>=0.7.5",
    "python-keycloak>=7.1.1",
    "apprise>=1.9.9",
    "pillow>=12.1.1",
    "imagehash>=4.3.2",
    "mem0ai>=1.0.2,<2",
    "langchain-neo4j>=0.4.0",
    "neo4j>=5.23.1",
    "rank-bm25>=0.2.2",
    "starlette>=1.0.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.1",
    "pandas-stubs>=2.3.3.251201",
    "types-pyyaml>=6.0.12.20240917",
]

[project.urls]
Homepage = "https://github.com/bbvch-ai/aihub-core"
Repository = "https://github.com/bbvch-ai/aihub-core"
Documentation = "https://bbvch-ai.github.io/aihub-core/"
Issues = "https://github.com/bbvch-ai/aihub-core/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.core"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E501"]


[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "slow: mark a test as slow",
    "unit: hermetic test using fakes; safe to run anywhere",
    "integration: requires real external services; opt-in",
]
addopts = "--strict-markers"
pythonpath = ["."]
