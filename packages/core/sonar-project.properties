sonar.projectKey=aihub-core_lib-core
sonar.organization=bbv-ai

# This is the name and version displayed in the SonarCloud UI
sonar.projectName=Lib Core
sonar.projectVersion=1.0

sonar.sources=swiss_ai_hub
sonar.tests=swiss_ai_hub
sonar.test.inclusions=**/test_*.py

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Suppress python:S1192 (duplicated string literals):
#  - e1..e6: lazy-import __init__ barrels — repeating the literal module paths
#    keeps the lazy-import dicts trivially greppable and avoids extra indirection
#    through module-level constants.
#  - e7, e8: MongoDB aggregation pipelines — the $-prefixed operators and field
#    references are MongoDB's own query language (not exposed as constants by
#    pymongo or mongoengine). Keeping them as literals matches MongoDB docs /
#    shell / Compass and preserves pipeline readability.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=swiss_ai_hub/core/events/agent/__init__.py
