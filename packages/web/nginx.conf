server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Long-term caching for hashed static assets with aihub prefix
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent nginx from generating absolute redirects with wrong scheme behind reverse proxy
    absolute_redirect off;

    # Runtime config: generated per-deployment by envsubst at container start.
    # Must never be cached, and must be served as the actual file (not the SPA
    # index.html fallback), so declare it before `location /`.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # Handle the aihub application routes (SPA: all non-file routes serve index.html).
    # index.html must NOT be cached: after a redeploy the shell references new hashed
    # /_nuxt chunks, and a browser that cached the old shell requests dead chunk hashes
    # (404) so the app half-loads (e.g. login provider buttons never render). This bites
    # every browser after every deploy. Hashed assets under /_nuxt stay immutable-cached.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
