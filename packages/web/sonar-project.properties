sonar.projectKey=aihub-core_aihub-web
sonar.organization=bbv-ai

# This is the name and version displayed in the SonarCloud UI
sonar.projectName=Web Core
sonar.projectVersion=1.0

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.*

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Exclude generated sdk
sonar.exclusions=sdk/**,node_modules/**,.nuxt/**,.output/**,.app/.nuxt/**,.app/.output/**

# Per-rule false-positive suppressions:
#   - docker:S6505 trips on `pnpm install --frozen-lockfile` even though that flag locks versions to
#     pnpm-lock.yaml — Sonar's Dockerfile analyzer doesn't recognise pnpm's flag.
#   - javascript:S7779 trips on package.json because the lockfile lives at the pnpm workspace root,
#     outside this Sonar project's scan dir (.).
#   - Web:ItemTagNotWithinContainerTagCheck trips on Notification/Item.vue because its <li> root
#     has no <ul>/<ol> parent in the same file — the parent <ul> lives in the call sites
#     (NotificationsOverlay.vue and pages/[tenant]/notifications/index.vue). Sonar can't see across
#     components.
sonar.issue.ignore.multicriteria=lockfile_dockerfile,lockfile_packagejson,notification_item_li
sonar.issue.ignore.multicriteria.lockfile_dockerfile.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.lockfile_dockerfile.resourceKey=Dockerfile
sonar.issue.ignore.multicriteria.lockfile_packagejson.ruleKey=javascript:S7779
sonar.issue.ignore.multicriteria.lockfile_packagejson.resourceKey=package.json
sonar.issue.ignore.multicriteria.notification_item_li.ruleKey=Web:ItemTagNotWithinContainerTagCheck
sonar.issue.ignore.multicriteria.notification_item_li.resourceKey=**/Notification/Item.vue
