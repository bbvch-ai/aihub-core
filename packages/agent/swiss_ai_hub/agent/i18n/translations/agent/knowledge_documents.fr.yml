---
config:
  enabled:
    label: Travailler sur des documents entiers
    help: Le modèle peut lister les documents des collections de connaissances, chercher
      des termes exacts dans leur texte et les lire en entier.
  path_glob:
    label: Filtre des chemins de documents
    help: Uniquement les documents dont le chemin dans leur collection correspond
      à ce motif, p. ex. invoices/2025/** ou **/*.pdf. S'applique aux outils de documents
      seulement, pas à la recherche de connaissances. Laisser vide pour tous les documents.
  discovery:
    label: "Mode découverte"
    help: "Désactivé : chaque document des collections et du filtre de chemin est lu, aucun n'est donc oublié ; l'utilisateur précise en nommant des dossiers, des fichiers ou des années. Activé : le modèle trouve d'abord les documents, en cherchant par mots-clés ce que la demande nomme exactement (un fournisseur, un numéro, un dossier) et en classant par le sens ce qu'elle décrit seulement ; seuls les documents qu'il sélectionne sont lus. C'est plus rapide sur de grandes collections mais peut oublier des documents. Le formulaire de la demande demande alors aussi des mots-clés exacts et sémantiques. La durée de la recherche est fixée par Décisions maximales et Appels d'outils maximaux sous Tools."
tools:
  rank_knowledge_documents:
    label: Classer les documents de connaissances
    approval: Classer les documents de connaissances selon leur proximité avec « {query}
      »
  list_knowledge_documents:
    label: Lister les documents de connaissances
    approval: Lister les documents de connaissances correspondant à {path_glob}
  search_knowledge_content:
    label: Chercher dans les documents de connaissances
    approval: Chercher « {query} » dans les documents de connaissances
  read_knowledge_document:
    label: Lire un document de connaissances
    approval: Lire le document de connaissances {document_id}
