---
metadata:
  name: Teachable Assistant
  description: AI assistant that learns from examples you provide to understand how
    you want it to respond
config:
  number_of_input_tokens:
    label: Max Input Tokens
    help: Maximum number of tokens allowed in the input context
steps:
  limit_chat_history:
    name: Limit Chat History
    description: Truncates incoming chat messages to fit within the configured token
      limit.
  agent_suitability_guard:
    name: Agent Suitability Guard
    description: Checks whether the agent is suitable for handling the user's request.
  condense_standalone_question:
    name: Condense Standalone Question
    description: Condenses the chat history and user query into a standalone question.
  create_few_shot_examples:
    name: Create Few-Shot Examples
    description: Prepares few-shot examples and creates the full context for LLM.
  respond_with_llm:
    name: Respond with LLM
    description: Generates a response using the LLM based on few-shot examples.
  reject_unsuitable_request:
    name: Reject Unsuitable Request
    description: Ends the run with a streamed refusal when the suitability guard rejects
      the request.
thoughts:
  input_too_large: 'The input does not fit the model context window: about %{tokens}
    tokens against a usable budget of %{budget}. Refusing instead of calling the model.'
messages:
  input_too_large: This message is too long for me to process. I answer from my configured
    examples and do not read attached documents. For questions about a file, please
    use an assistant built for documents.
  unsuitable_request: I am not the right assistant for this request, so I cannot answer
    it. %{reason}
