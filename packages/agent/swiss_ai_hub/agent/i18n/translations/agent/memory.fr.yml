---
steps:
  recall_as_tool:
    name: "Rappeler la mémoire comme outil"
    description: "Cherche dans la mémoire ce que le modèle a demandé"
  answer_tool_call:
    name: "Rendre les souvenirs au modèle"
    description: "Renvoie ce que contient la mémoire à la boucle d'outils du modèle"
  recall:
    name: Rappeler la mémoire
    description: Recherche les mémoires de l'utilisateur et de l'organisation pour la requête
      du tour et les transmet comme blocs de contexte.
  store_user_memory:
    name: Stocker la mémoire utilisateur
    description: Persiste les apprentissages de la conversation dans la mémoire utilisateur
      à long terme pour les interactions futures
config:
  enable_user_memory_retrieval:
    label: Activer la récupération de mémoire utilisateur
    help: Récupérer les mémoires spécifiques à l'utilisateur pour un contexte personnalisé.
  rerank_user_memory:
    label: Reclasser la mémoire utilisateur
    help: Reclasser les résultats de recherche de mémoire utilisateur avec le reranker configuré
      pour une meilleure pertinence. Augmente la latence et le coût.
  enable_user_memory_storage:
    label: Activer le stockage de mémoire utilisateur
    help: Stocker les nouvelles mémoires des conversations pour une récupération future.
  memory_llm:
    label: Modèle de mémoire
    help: Modèle qui extrait et réconcilie les mémoires utilisateur. L'extraction est courte
      et mécanique, un modèle plus petit suffit généralement. Laisser désactivé pour utiliser
      le modèle par défaut de la plateforme ; l'activer part de ce même modèle.
tool:
  label: "Rappeler la mémoire"
  approval_summary: "Rappeler ce qui est mémorisé sur « {query} »"
  description: "Recherche ce dont on se souvient sur l'utilisateur et l'organisation : préférences, faits et décisions de conversations précédentes. Utilise-le lorsque la réponse peut dépendre de qui est l'utilisateur ou de quelque chose convenu auparavant. Il contient de brefs faits mémorisés, pas des documents ni des fichiers ; pour ceux-ci, utilise les outils de connaissances ou de fichiers."
  query: "Ce qu'il faut rappeler, sous forme de courte question autonome ou de mots-clés."
  nothing_remembered: "Rien n'est mémorisé à ce sujet."
