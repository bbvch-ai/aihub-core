---
steps:
  read_as_tool:
    name: Lire les fichiers joints comme outil
    description: Lit les fichiers joints choisis par le modèle
  answer_tool_call:
    name: Rendre les fichiers au modèle
    description: Renvoie ce qui a été lu à la boucle d'outils du modèle
  read_attached_files:
    name: Lire les fichiers joints
    description: Lit les fichiers que l'utilisateur a joints à la conversation et
      ajoute leur texte au contexte du modèle
prompt:
  context: |
    {% chat role="system" %}
    L'utilisateur a joint les fichiers suivants à cette conversation. Lorsque la question s'y rapporte, répondez à partir de leur contenu et nommez le fichier utilisé. Chaque fichier est un bloc `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>`, ses sections sous leurs titres.
    <attached_files>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </attached_files>
    {% endchat %}
  excerpted: Seules les parties de « %{filename} » les plus pertinentes pour la question
    tiennent dans votre contexte. Indiquez à l'utilisateur que votre réponse repose
    sur des extraits de ce fichier.
  truncated: Seul le début de « %{filename} » a tenu dans ton contexte. Indique à
    l'utilisateur que ta réponse repose sur une partie de ce fichier.
  unreadable: L'utilisateur a joint « %{filename} », mais ce fichier n'a pas pu être
    lu (%{error}). Indique-lui que ce fichier n'a pas pu être lu et propose de le
    joindre dans un autre format ou d'en coller le texte.
  pages: Voici les pages %{first} à %{last} de « %{filename} », qui compte %{total}
    pages.
  pages_cut: Seules les pages %{first} à %{shown} des pages demandées %{first} à %{last}
    de « %{filename} » tiennent dans ton contexte. Dis-le à l'utilisateur et propose
    de continuer à partir de la page %{next}.
  pages_missing: « %{filename} » ne compte que %{total} pages, il n'y a donc pas de
    page %{first}. Dis-le à l'utilisateur.
  pages_unknown: Les pages de « %{filename} » ne sont pas connues, les pages demandées
    n'ont donc pas pu être isolées. Dis à l'utilisateur que ta réponse ne repose pas
    uniquement sur ces pages.
tool:
  structured_hint: "(tableur, présentation ou CSV : traite-le avec du code lorsqu'un outil de code est proposé)"
  label: Lire les fichiers joints
  approval_summary: Lire les fichiers joints
  description: "Lit les fichiers que l'utilisateur a joints à cette conversation et renvoie leur texte converti en Markdown, avec des identifiants à citer. Lis ici les documents comme les fichiers PDF et Word. Les tableurs, les présentations et les fichiers CSV perdent leur structure en Markdown : lorsqu'un outil de code est proposé, traite-les plutôt avec du code, où chaque fichier joint se trouve tel quel dans le dossier de la conversation. Pour un fichier trop grand pour être lu en entier, renvoie les sections les plus pertinentes pour la requête. Pour lire certaines pages d'un document, indique first_page et last_page. Fichiers joints :\n%{files}"
  files: Les fichiers à lire, par identifiant ; omettre pour les lire tous.
  query: Ce que tu cherches dans les fichiers, pour qu'un long fichier garde les sections
    qui en parlent.
  first_page: La première page à lire, comptée à partir de 1, quand la question porte
    sur certaines pages. Les pages sont alors lues dans l'ordre au lieu d'être cherchées
    selon la requête.
  last_page: La dernière page à lire ; à omettre pour ne lire que la première page.
  nothing_readable: Aucun des fichiers choisis n'a pu être lu.
  unknown_files: "Aucun des ids indiqués n'est un fichier joint. Fichiers joints :\
    \ %{files}"
