---
config:
  number_of_input_tokens:
    label: Token di input max
    help: Quanta cronologia e contesto riceve al massimo il modello. Senza un limite
      proprio, l'agente usa la finestra di input del modello (meno un margine); un
      limite più basso riduce i costi.
    toggle_label: Imposta un limite di input proprio
  condense_question:
    label: Condensa la domanda
    help: Riformula l'ultimo messaggio in una domanda autonoma a partire dalla conversazione,
      prima di consultare la memoria, il retrieval e altro contesto. Disattivato,
      l'ultimo messaggio viene usato così com'è.
steps:
  derive_query:
    name: Deriva la query
    description: Determina la domanda a cui questo turno risponde, l'ultimo messaggio
      così com'è oppure condensato dalla conversazione.
  compose_context:
    name: Componi il contesto
    description: Unisce i blocchi di contesto richiesti, come le memorie, nella cronologia
      della chat entro il budget di input del modello.
  complete:
    name: Completa la conversazione
    description: Suggerisce domande di follow-up dalla risposta e termina l'esecuzione
      con l'evento di stop richiesto.
  limit_chat_history:
    name: Limita cronologia chat
    description: Tronca i messaggi di chat in arrivo per rispettare il limite di token
      configurato.
  gather_context:
    name: Raccogli il contesto
    description: "Richiede alle capacità il contesto del turno: le memorie dell'utente\
      \ e dell'organizzazione e i file allegati."
  assemble_prompt:
    name: Assembla il prompt
    description: Richiede la cronologia della chat con il contesto richiamato unito.
thoughts:
  condensation_empty: Il condensatore non ha prodotto alcuna domanda autonoma, quindi
    questo turno non ha una query utilizzabile. La richiesta viene rifiutata invece
    di usare il messaggio grezzo.
  input_too_large: "L'input non rientra nella finestra di contesto del modello: circa\
    \ %{tokens} token a fronte di un budget utilizzabile di %{budget}. La chiamata\
    \ al modello viene rifiutata."
  images_not_accepted: Il messaggio contiene %{images} immagini, ma questo assistente
    non passa immagini al suo modello %{model}. Rifiuto invece di chiamare il modello.
  too_many_images: Il messaggio contiene %{images} immagini, più delle %{max_images}
    che il modello %{model} accetta per richiesta. Rifiuto invece di chiamare il modello.
messages:
  images_not_accepted: Questo assistente non può guardare immagini. Descrivi a parole
    il contenuto dell'immagine, oppure passa a un assistente il cui modello supporta
    le immagini.
  too_many_images: Hai inviato %{images} immagini, ma posso guardarne al massimo %{max_images}
    alla volta. Invia meno immagini per messaggio.
  condensation_empty: Non sono riuscito a capire cosa cercare da questo messaggio.
    Riformula la domanda e riprova.
  input_too_large: Questo file è troppo grande perché io possa leggerlo in una volta
    sola. Carica un file più piccolo, dividilo in parti, oppure passa a un assistente
    che usa un modello con una finestra di contesto più ampia.
