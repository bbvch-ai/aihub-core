---
config:
  check_context_sufficiency:
    label: Kontext-Suffizienz prüfen
    help: Führe vor der Antwortgenerierung eine Guard-LLM aus, um zu entscheiden,
      ob der abgerufene Kontext zur Beantwortung der Benutzerfrage ausreicht.
  max_hops:
    label: Maximale Abruf-Sprünge
    help: Maximale Anzahl von Abruf-Iterationen, wenn der Guard den aktuellen Kontext
      ablehnt. Höhere Werte können Antworten verbessern, erhöhen aber die Latenz.
  max_non_system_messages_in_guard:
    label: Max. Nachrichten im Guard
    help: Maximale Anzahl aktueller Benutzer-/Assistent-Nachrichten, die an den Guard-Prompt
      weitergegeben werden. Speicher (System-Nachrichten) wird immer einbezogen. Kleinere
      Werte verkürzen den Guard-Prompt und verbessern die Zuverlässigkeit strukturierter
      Ausgabe bei Open-Weight-Modellen.
  context_insufficient_prompt:
    label: Unzureichender-Kontext-Prompt
    help: Nachricht, die angezeigt wird, wenn der Agent nicht genügend Informationen
      findet. Leitet, wie der Agent Einschränkungen kommuniziert.
    default: 'Informiere den Benutzer, dass du die Frage nicht beantworten kannst,
      aufgrund des folgenden Grundes:'
