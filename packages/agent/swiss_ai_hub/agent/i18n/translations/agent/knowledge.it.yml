---
steps:
  search_knowledge:
    name: "Cerca la conoscenza indicata"
    description: "Cerca nelle raccolte di conoscenza indicate dall'utente e aggiunge i risultati al contesto del modello"
prompt:
  context: |
    {% chat role="system" %}
    L'utente ha indicato le seguenti raccolte di conoscenza in questa conversazione. Rispondi basandoti su questi documenti quando riguardano la domanda. Ogni documento è un blocco `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>`, con le sezioni sotto i loro titoli.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: "L'utente ha indicato %{collections}, ma queste raccolte non gli sono accessibili, quindi lì non è stata effettuata alcuna ricerca. Di' all'utente che non hai potuto usare queste raccolte."
  nothing_found: "L'utente ha indicato delle raccolte di conoscenza, ma nulla corrispondeva alla domanda. Diglielo se la domanda dipendeva da esse."
