---
steps:
  recall_as_tool:
    name: "Erinnerung als Werkzeug abrufen"
    description: "Durchsucht das Gedächtnis nach dem, was das Modell gefragt hat"
  answer_tool_call:
    name: "Erinnerungen an das Modell zurückgeben"
    description: "Gibt zurück, was das Gedächtnis enthält, an die Werkzeugschleife des Modells"
  recall:
    name: Erinnerungen abrufen
    description: Durchsucht die Erinnerungen des Benutzers und der Organisation zur Anfrage
      des Zugs und übergibt sie als Kontextblöcke.
  store_user_memory:
    name: Benutzergedächtnis speichern
    description: Speichert Erkenntnisse aus dem Gespräch im Langzeit-Benutzergedächtnis für
      zukünftige Interaktionen
config:
  enable_user_memory_retrieval:
    label: Benutzergedächtnis-Abruf aktivieren
    help: Ob benutzerspezifische Erinnerungen für personalisierten Kontext abgerufen werden
      sollen.
  rerank_user_memory:
    label: Benutzergedächtnis neu ordnen
    help: Ergebnisse der Benutzergedächtnis-Suche mit dem konfigurierten Reranker neu ordnen,
      um die Relevanz zu erhöhen. Erhöht Latenz und Kosten.
  enable_user_memory_storage:
    label: Benutzergedächtnis-Speicherung aktivieren
    help: Ob neue Erinnerungen aus Gesprächen für zukünftigen Abruf gespeichert werden sollen.
  memory_llm:
    label: Speichermodell
    help: Modell, das Benutzererinnerungen extrahiert und abgleicht. Die Extraktion ist kurz
      und mechanisch, daher genügt in der Regel ein kleineres Modell. Deaktiviert lassen,
      um den Plattformstandard zu verwenden; beim Aktivieren ist genau dieses Modell der Startpunkt.
tool:
  label: "Erinnerung abrufen"
  approval_summary: "Abrufen, was zu \"{query}\" erinnert wird"
  description: "Durchsucht, was über den Benutzer und die Organisation erinnert wird: Vorlieben, Fakten und Entscheidungen aus früheren Gesprächen. Verwende es, wenn die Antwort davon abhängen kann, wer der Benutzer ist, oder von etwas früher Vereinbartem."
  query: "Was abgerufen werden soll, als kurze eigenständige Frage oder Stichworte."
  nothing_remembered: "Dazu ist nichts erinnert."
