---
metadata:
  name: Assistant Instruit
  description: Assistant IA qui suit vos instructions en texte clair pour vous aider
    dans vos tâches et répondre aux questions
config:
  system_prompt:
    label: Invite système
    help: Instructions pour l'agent lors de l'utilisation d'exemples few-shot
steps:
  limit_chat_history:
    name: Limiter l'historique du chat
    description: Tronque les messages du chat entrants pour respecter la limite de
      jetons configurée.
  start:
    name: Traiter le message de l'utilisateur
    description: Transmet le message de l'utilisateur au LLM et diffuse la réponse
      en continu.
thoughts:
  input_too_large: "L'entrée ne tient pas dans la fenêtre de contexte du modèle :\
    \ environ %{tokens} jetons pour un budget utilisable de %{budget}. L'appel au\
    \ modèle est refusé."
messages:
  input_too_large: Ce fichier est trop volumineux pour que je le lise en une seule
    fois. Veuillez téléverser un fichier plus petit, le diviser en parties, ou utiliser
    un assistant dont le modèle dispose d'une fenêtre de contexte plus grande.
