---
metadata:
  name: Assistant d'Intelligence Documentaire
  description: Assistant IA qui recherche et analyse vos documents pour fournir des
    réponses éclairées et contextuelles
config:
  number_of_input_tokens:
    label: Tokens d'entrée max
    help: Nombre maximum de tokens autorisés dans l'entrée du LLM. Limite la taille
      du contexte pour gérer les coûts et éviter de dépasser les limites du modèle.
  system_prompt:
    label: Prompt système
    help: Instructions définissant la personnalité, le rôle et les directives de comportement
      de l'agent. Définit le ton général et les capacités.
    default: "<persona>\nVous êtes RAG Agent, un assistant de récupération de connaissances.\
      \ Votre mission principale est de fournir des réponses précises en utilisant\
      \ uniquement les informations des documents récupérés.\n</persona>\n\n<rules>\n\
      - DOIT : Répondre en utilisant UNIQUEMENT le contexte et les documents récupérés\n\
      - DOIT : Citer des passages spécifiques soutenant votre réponse\n- JAMAIS :\
      \ Utiliser des connaissances générales au-delà du contexte fourni\n- INTERDIT\
      \ : Spéculations ou suppositions non présentes dans les documents récupérés\n\
      </rules>\n\n<instructions>\nSuivez ce processus :\n    1. Analysez le contexte\
      \ récupéré\n    2. Identifiez les passages pertinents\n    3. Extrayez les informations\
      \ clés\n    4. Fournissez une réponse avec des citations directes.\nLorsque\
      \ le contexte est insuffisant, indiquez que vous ne pouvez pas répondre à la\
      \ question avec les informations disponibles.\n</instructions>\n"
  context_prompt:
    label: Prompt de contexte
    help: Modèle pour présenter les documents récupérés au LLM. Utilisez des espaces
      réservés comme {context} pour injecter le contenu récupéré.
    default: "{% chat role=\"user\" %}\nVous disposez d'informations contextuelles\
      \ supplémentaires sous forme de documents structurés. Chaque document suit un\n\
      format cohérent, commençant par `<REFERENCE_DOCUMENT [metadata]>` et se terminant\
      \ par `</REFERENCE_DOCUMENT>`. Ces documents contiennent\ndes détails essentiels\
      \ qui doivent être utilisés pour comprendre et répondre précisément à la requête\
      \ de l'utilisateur.\n\nChaque document comprend des métadonnées telles que la\
      \ source, l'espace de noms, le type, la langue, la version et les horodatages.\
      \ Le contenu\nde ces documents fournit des informations cruciales pertinentes\
      \ pour le contexte donné.\n\nVoici les documents pertinents :\n\n<context_documents>\n\
      {% for block in context_blocks %}\n{% if block.block_type == 'text' %}\n{{ block.text }}\n\
      {% endif %}\n{% if block.block_type == 'image' %}\n{{ block.url.__str__() | image}}\n\
      {% endif %}\n{% endfor %}\n</context_documents>\n\nInstruction : En utilisant\
      \ les informations des documents fournis, générez une réponse détaillée et bien\
      \ structurée\nà la question de l'utilisateur.\n{% endchat %}\n"
  context_insufficient_prompt:
    label: Prompt contexte insuffisant
    help: Message affiché lorsque l'agent ne trouve pas suffisamment d'informations.
      Guide la façon dont l'agent communique ses limitations.
    default: "Informez l'utilisateur que vous ne pouvez pas répondre à la question\
      \ pour la raison suivante :"
  reranking_enabled:
    label: Activer le reclassement
    help: Utilisez un modèle de reclassement pour améliorer la pertinence des documents
      récupérés avant de les transmettre au LLM.
  enable_organization_memory:
    label: Activer la mémoire organisationnelle
    help: Récupérer les mémoires organisationnelles (connaissances d'experts partagées
      entre utilisateurs) pour le contexte.
  tenant_namespace:
    label: Espace de noms du locataire
    help: Espace de noms pour l'isolation de la mémoire au niveau départemental. Laisser
      vide pour la portée organisationnelle par défaut.
  enable_user_memory_retrieval:
    label: Activer la récupération de mémoire utilisateur
    help: Récupérer les mémoires spécifiques à l'utilisateur pour un contexte personnalisé.
  enable_user_memory_storage:
    label: Activer le stockage de mémoire utilisateur
    help: Stocker les nouvelles mémoires des conversations pour une récupération future.
steps:
  retrieve_user_memory:
    name: Récupérer la mémoire utilisateur
    description: Récupère les mémoires spécifiques à l'utilisateur pour un contexte
      personnalisé
  retrieve_organization_memory:
    name: Récupérer la mémoire organisationnelle
    description: Récupère les mémoires organisationnelles pertinentes (connaissances
      d'experts) basées sur la requête utilisateur
  add_memory_to_context:
    name: Ajouter la mémoire au contexte
    description: Injecte les mémoires utilisateur et organisationnelles dans l'historique
      du chat comme messages système
  limit_chat_history:
    name: Limiter l'historique du chat
    description: Tronque les messages de chat entrants pour respecter la limite de
      tokens configurée
  condense_standalone_question:
    name: Condenser la question autonome
    description: Condense l'historique du chat et la requête utilisateur en une question
      autonome.
  few_shot_guard:
    name: Garde Few-Shot
    description: Protège la question pour s'assurer qu'elle est appropriée pour l'agent.
  retrieve_nodes:
    name: Récupérer les nœuds
    description: Récupère les nœuds pertinents des sources de connaissances.
  rerank_nodes:
    name: Reclasser les nœuds récupérés
    description: Reclasse les documents récupérés avec un modèle de reclassement pour
      une meilleure pertinence
  order_nodes:
    name: Ordonner les nœuds par documents
    description: Ordonne les nœuds récupérés par leurs documents sources.
  context_sufficient_guard:
    name: Garde de contexte suffisant
    description: Protège le contexte pour s'assurer qu'il est suffisant pour générer
      une réponse.
  limit_chat_history_with_context:
    name: Limiter l'historique avec contexte
    description: Inclut le contexte combiné et tronque à nouveau l'historique du chat.
  respond_with_llm:
    name: Répondre avec LLM
    description: Génère une réponse en utilisant le LLM configuré.
  store_user_memory:
    name: Stocker la mémoire utilisateur
    description: Persiste les apprentissages de la conversation dans la mémoire utilisateur
      à long terme pour les interactions futures
  stop:
    name: Arrêt
    description: Termine le workflow après l'achèvement de toutes les étapes requises
