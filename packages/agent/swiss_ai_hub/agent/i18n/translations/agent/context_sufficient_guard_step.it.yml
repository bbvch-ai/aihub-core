---
config:
  check_context_sufficiency:
    label: Verifica sufficienza del contesto
    help: Esegue un LLM guard prima della generazione per decidere se il contesto
      recuperato è sufficiente per rispondere alla domanda dell'utente.
  max_hops:
    label: Salti di recupero max
    help: Numero massimo di iterazioni di recupero quando il guard rifiuta il contesto
      attuale. Valori più alti possono migliorare le risposte ma aumentano la latenza.
  max_non_system_messages_in_guard:
    label: Max turni di conversazione nel guard
    help: Numero massimo di messaggi utente/assistente recenti inoltrati al prompt
      del guard. La memoria (messaggi di sistema) è sempre inclusa. Valori più bassi
      accorciano il prompt del guard e migliorano l'affidabilità dell'output strutturato
      per modelli open-weight.
