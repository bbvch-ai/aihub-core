---
steps:
  search_knowledge:
    name: "Referenziertes Wissen durchsuchen"
    description: "Durchsucht die Wissenssammlungen, auf die der Benutzer verwiesen hat, und ergänzt den Kontext des Modells um die Fundstellen"
prompt:
  context: |
    {% chat role="system" %}
    Der Benutzer hat in dieser Unterhaltung auf die folgenden Wissenssammlungen verwiesen. Beantworte die Frage anhand dieser Dokumente, soweit sie dafür relevant sind. Jedes Dokument ist ein Block `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>`, seine Abschnitte stehen unter ihren Überschriften.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: "Der Benutzer hat auf %{collections} verwiesen, aber diese Sammlungen stehen ihm nicht zur Verfügung, daher wurde dort nichts gesucht. Sage dem Benutzer, dass du diese Sammlungen nicht verwenden konntest."
  nothing_found: "Der Benutzer hat auf Wissenssammlungen verwiesen, aber nichts darin passte zur Frage. Sage dem Benutzer das, wenn die Frage davon abhing."
