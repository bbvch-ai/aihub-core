---
steps:
  search_knowledge:
    name: "Referenziertes Wissen durchsuchen"
    description: "Durchsucht die Wissenssammlungen, auf die der Benutzer verwiesen hat, und ergänzt den Kontext des Modells um die Fundstellen"
  search_as_tool:
    name: "Wissen als Werkzeug durchsuchen"
    description: "Führt die vom Modell gewählte Wissenssuche aus"
  answer_tool_call:
    name: "Wissen an das Modell zurückgeben"
    description: "Gibt die Fundstellen an die Werkzeugschleife des Modells zurück"
prompt:
  context: |
    {% chat role="system" %}
    Die folgenden Dokumente stammen aus unseren Wissenssammlungen. Beantworte die Frage anhand dieser Dokumente, soweit sie dafür relevant sind. Jedes Dokument ist ein Block `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>`, seine Abschnitte stehen unter ihren Überschriften.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: "%{collections} konnten nicht durchsucht werden, weil diese Sammlungen dem Benutzer nicht zur Verfügung stehen. Sage dem Benutzer, dass du sie nicht verwenden konntest."
  nothing_found: "Nichts in den durchsuchten Wissenssammlungen passte zur Frage. Sage dem Benutzer das, wenn die Frage davon abhing."
tool:
  description: "Durchsucht unsere Wissenssammlungen und liefert die relevantesten Dokumentabschnitte mit zitierbaren IDs. Verwende es, wenn die Frage mit den Dokumenten der Organisation beantwortet werden kann. Verfügbare Sammlungen:\n%{collections}"
  query: "Wonach gesucht wird, als kurze eigenständige Frage oder Stichworte."
  collections: "Die zu durchsuchenden Sammlungen nach Kennung; weglassen, um alle zu durchsuchen."
