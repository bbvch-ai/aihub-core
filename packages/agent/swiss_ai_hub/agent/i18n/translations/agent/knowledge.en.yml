---
steps:
  search_knowledge:
    name: "Search Referenced Knowledge"
    description: "Searches the knowledge collections the user referenced and adds what it finds to the model's context"
  search_as_tool:
    name: "Search Knowledge as a Tool"
    description: "Runs the knowledge search the model chose"
  answer_tool_call:
    name: "Return Knowledge to the Model"
    description: "Hands what the search found back to the model's tool loop"
prompt:
  context: |
    {% chat role="system" %}
    The following documents come from our knowledge collections. Answer from them where they bear on the question. Each document is a `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>` block, its sections under their headings.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: "%{collections} could not be searched, because these collections are not available to the user. Tell the user that you could not use them."
  nothing_found: "Nothing in the searched knowledge collections matched the question. Tell the user so if the question depended on them."
tool:
  description: "Searches our knowledge collections and returns the most relevant document sections, with ids to cite. Use it when the question may be answered by the organisation's documents. Available collections:\n%{collections}"
  query: "What to search for, as a short standalone question or keywords."
  collections: "The collections to search, by identifier; leave out to search all of them."
