---
steps:
  search_knowledge:
    name: Search Referenced Knowledge
    description: Searches the knowledge collections the user referenced and adds what
      it finds to the model's context
  search_as_tool:
    name: Search Knowledge as a Tool
    description: Runs the knowledge search the model chose
  answer_tool_call:
    name: Return Knowledge to the Model
    description: Hands what the search found back to the model's tool loop
prompt:
  context: |
    {% chat role="system" %}
    The following documents come from our knowledge collections. Answer from them where they bear on the question. Each document is a `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>` block, its sections under their headings.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: '%{collections} could not be searched, because these collections are not
    available to the user. Tell the user that you could not use them.'
  nothing_found: Nothing in the searched knowledge collections matched the question.
    Tell the user so if the question depended on them.
tool:
  label: Search our knowledge
  approval_summary: Search our knowledge for "{query}"
  description: "Searches our knowledge collections and returns the most relevant document\
    \ sections, with ids to cite. Use it when the question may be answered by the\
    \ organisation's documents, such as policies, handbooks, reports or contracts.\
    \ It returns excerpts, not whole documents: for a broad question, search several\
    \ times with narrow queries. Files the user attached are not in these collections;\
    \ read them with the tool for attached files. An empty result means the collections\
    \ do not cover the question. Available collections:\n%{collections}"
  query: What to search for, as a short standalone question or keywords.
  collections: The collections to search, by identifier; leave out to search all of
    them.
config:
  retrieve_k:
    label: Sections per Database
    help: How many sections each searched database returns before the reranker keeps
      the best.
  every_readable_collection:
    label: Every Collection the User Can Read
    help: Let the model search every knowledge collection the asking user may read,
      instead of the ones listed below.
  source:
    label: Knowledge Database
    help: A database the model may search, whole or narrowed to some of its collections.
