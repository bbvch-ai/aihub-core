---
metadata:
  name: Agente Coordinatore di Esperti
  description: Agente autonomo che coordina con esperti umani per raccogliere ed estrarre
    conoscenze specializzate
config:
  channel_type:
    label: Tipo di canale
    help: Seleziona il canale di comunicazione per l'escalation agli esperti
    teams_label: Microsoft Teams
    slack_label: Slack
  loop_max:
    label: Loop massimi
  insight_namespace:
    label: Namespace insights
  org_memory_format:
    label: Formato memoria dell'organizzazione
    help: Modello per il frammento di domanda/risposta archiviato nella memoria dell'organizzazione.
      Usa {question} e {answer} come segnaposto.
    default: "Domanda: {question}\n\nRisposta dell'esperto: {answer}"
routes:
  answer_sufficient: L'esperto ha risposto alla domanda. Scegli questo se l'esperto
    ha fornito QUALSIASI risposta diretta.
  answer_insufficient: L'esperto NON ha risposto. Scegli questo SOLO se l'esperto
    ha detto 'Non lo so' o ha rifiutato di rispondere.
thoughts:
  asking_question: "Porre una domanda all'esperto: '%{question}'."
  expert_responded: "L'esperto ha risposto: '%{response}'."
  determine_sufficient: Verificare se la risposta dell'esperto è sufficiente.
  answer_sufficient: La risposta dell'esperto è sufficiente.
  max_questions_reached: Raggiunto il numero massimo di domande di follow-up.
  returning_insufficient: Ritorno all'utente con una risposta insufficiente.
  answer_not_sufficient: La risposta non è sufficiente, formulazione di una domanda
    di follow-up.
follow_up_question: "All'esperto è stato chiesto: \"{{ question }}\"\n\nLa sua risposta:\n\
  {% for message in chat_history %}\n{% if message.role.value == 'user' %}\n{% for\
  \ block in message.blocks %}\n{% if block.block_type == 'text' %}\n{{ block.text }}\n\
  {% endif %}\n{% endfor %}\n{% endif %}\n{% endfor %}\n\nL'esperto ha detto che non\
  \ sa, non ha risposto, o ha risposto solo a parte della domanda.\nChiedi le informazioni\
  \ specifiche mancanti. Sii breve e cortese. Chiedi solo ciò che è stato originariamente\
  \ richiesto ma non ancora risposto.\n"
steps:
  invoke_expert:
    name: Invoca esperto
    description: Pone una domanda a un gruppo di esperti.
  expert_response:
    name: Risposta esperto
    description: Elabora la risposta dell'esperto.
  response_sufficient_router:
    name: Router risposta sufficiente
    description: Verifica se l'esperto ha risposto sufficientemente alla domanda.
  follow_up_question:
    name: Domanda di follow-up
    description: Pone una domanda di follow-up all'esperto poiché la risposta non
      è ancora sufficiente.
