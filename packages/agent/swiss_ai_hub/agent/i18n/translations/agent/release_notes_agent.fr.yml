---
metadata:
  name: Assistant de notes de version
  description: Rédige des notes de version à partir des tickets Jira d'une version
    corrigée, regroupés par type et dans chaque langue configurée.
changelog:
  title: Notes de version %{version}
  sections:
    features: Nouvelles fonctionnalités
    fixes: Corrections
    improvements: Améliorations
    other: Autres modifications
messages:
  version_missing: 'Pour quelle version dois-je rédiger les notes ? Indiquez une version
    corrigée, par exemple : %{recent}.'
  version_missing_no_versions: Jira ne liste aucune version corrigée dans %{projects}
    ; il n'y a donc pas encore de version pour laquelle rédiger des notes.
  version_several: 'Votre message cite plusieurs versions : %{names}. Pour laquelle
    dois-je rédiger les notes ?'
  version_unknown: 'Je n''ai trouvé aucune version corrigée %{requested} dans %{projects}.
    Vouliez-vous dire : %{suggestions} ?'
  version_unknown_recent: 'Je n''ai trouvé aucune version corrigée %{requested}
    dans %{projects}. Les versions récentes sont : %{recent}.'
  version_unknown_no_versions: Je n'ai trouvé aucune version corrigée %{requested}
    dans %{projects} ; Jira n'y liste encore aucune version corrigée.
  no_tickets: Je n'ai trouvé aucun ticket pour la version corrigée %{version} dans
    %{projects} ; il n'y a donc rien à inclure dans des notes de version.
  release_too_large: Cette version compte plus de %{limit} tickets, plus que je ne
    peux en traiter à la fois dans des notes de version. Un administrateur peut la
    restreindre avec le filtre JQL de cet assistant.
  jira_authentication: Jira a refusé les identifiants de cet assistant ; je ne peux
    donc pas lire les tickets. Veuillez demander à un administrateur de vérifier le
    jeton Jira.
  jira_project_not_found: Le projet Jira %{project} n'existe pas, ou le compte Jira
    de cet assistant ne peut pas le voir. Veuillez demander à un administrateur de
    vérifier les projets configurés.
  jira_project_renamed: Le projet Jira %{project} a été renommé en %{renamed}. Veuillez
    demander à un administrateur de mettre à jour les projets configurés.
  jira_invalid_query: Jira a refusé le filtre JQL de cet assistant ; je ne peux donc
    pas lire les tickets. Veuillez demander à un administrateur de le corriger.
  jira_configuration: La connexion Jira de cet assistant n'est pas correctement configurée.
    Veuillez demander à un administrateur de la vérifier.
  jira_unavailable: Je n'ai pas pu lire les tickets dans Jira pour le moment. Veuillez
    réessayer plus tard ; si le problème persiste, contactez un administrateur.
