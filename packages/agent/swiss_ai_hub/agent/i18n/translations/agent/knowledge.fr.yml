---
steps:
  search_knowledge:
    name: "Rechercher les connaissances référencées"
    description: "Recherche dans les collections de connaissances référencées par l'utilisateur et ajoute les résultats au contexte du modèle"
prompt:
  context: |
    {% chat role="system" %}
    L'utilisateur a référencé les collections de connaissances suivantes dans cette conversation. Réponds à partir de ces documents lorsqu'ils concernent la question. Chaque document est un bloc `<REFERENCE_DOCUMENT [metadata]>` … `</REFERENCE_DOCUMENT>`, ses sections sous leurs titres.
    <referenced_knowledge>
    {% for block in context_blocks %}{% if block.block_type == 'text' %}{{ block.text }}{% endif %}{% endfor %}
    </referenced_knowledge>
    {% endchat %}
  refused: "L'utilisateur a référencé %{collections}, mais ces collections ne lui sont pas accessibles, donc aucune recherche n'y a été effectuée. Dis à l'utilisateur que tu n'as pas pu utiliser ces collections."
  nothing_found: "L'utilisateur a référencé des collections de connaissances, mais rien ne correspondait à la question. Dis-le à l'utilisateur si la question en dépendait."
