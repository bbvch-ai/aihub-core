---
metadata:
  name: Instruierter Assistent
  description: KI-Assistent, der Ihren Anweisungen in Klartext folgt, um bei Aufgaben
    zu helfen und Fragen zu beantworten
config:
  system_prompt:
    label: Systemaufforderung
    help: Anweisungen für den Agenten bei der Verwendung von Few-Shot-Beispielen
steps:
  limit_chat_history:
    name: Chat-Verlauf begrenzen
    description: Kürzt eingehende Chat-Nachrichten, um innerhalb des konfigurierten
      Token-Limits zu bleiben.
  start:
    name: Benutzernachricht verarbeiten
    description: Leitet die Benutzernachricht an das LLM weiter und streamt die Antwort.
thoughts:
  input_too_large: 'Die Eingabe passt nicht in das Kontextfenster des Modells: rund
    %{tokens} Token gegenüber einem nutzbaren Budget von %{budget}. Der Aufruf des
    Modells wird abgelehnt.'
messages:
  input_too_large: Diese Datei ist zu gross, als dass ich sie auf einmal lesen könnte.
    Bitte laden Sie eine kleinere Datei hoch, teilen Sie sie auf, oder wechseln Sie
    zu einem Assistenten mit einem Modell mit grösserem Kontextfenster.
