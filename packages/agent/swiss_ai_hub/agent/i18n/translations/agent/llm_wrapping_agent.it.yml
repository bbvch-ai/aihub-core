---
metadata:
  name: Assistente Istruito
  description: Assistente IA che segue le tue istruzioni in testo semplice per aiutarti
    con le attività e rispondere alle domande
config:
  system_prompt:
    label: Prompt di sistema
    help: Istruzioni per l'agente quando si utilizzano esempi few-shot
steps:
  limit_chat_history:
    name: Limita cronologia chat
    description: Tronca i messaggi della chat in arrivo per rispettare il limite di
      token configurato.
  start:
    name: Elabora messaggio utente
    description: Inoltra il messaggio dell'utente al LLM e trasmette la risposta in
      streaming.
thoughts:
  input_too_large: "L'input non rientra nella finestra di contesto del modello: circa\
    \ %{tokens} token a fronte di un budget utilizzabile di %{budget}. La chiamata\
    \ al modello viene rifiutata."
messages:
  input_too_large: Questo file è troppo grande perché io possa leggerlo in una volta
    sola. Carica un file più piccolo, dividilo in parti, oppure passa a un assistente
    che usa un modello con una finestra di contesto più ampia.
