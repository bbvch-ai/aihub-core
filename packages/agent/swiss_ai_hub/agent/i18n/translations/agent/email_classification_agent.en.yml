---
metadata:
  name: Email Classification Agent
  description: Reads every unread message in a mailbox, decides which category it
    belongs to, and files it into that category's folder. Mail it is unsure about
    goes to a fallback folder. It never sends. Replies are drafted for the categories
    that ask for one and left in the drafts folder.
steps:
  list_unread:
    name: List unread mail
  classify_and_file:
    name: Classify and file
  draft_replies:
    name: Draft replies
  finish:
    name: Finish
  request_grounded_drafts:
    name: Ask the knowledge agent
  collect_and_draft:
    name: Draft replies
config:
  rag_agent:
    label: Knowledge Agent
    help: RAG agent that answers a message from its category's collection. Required
      as soon as any category names a collection.
    class_placeholder: Select an agent type
    id_placeholder: Select an agent
