---
config:
  check_context_sufficiency:
    label: Check context sufficiency
    help: Run a guard LLM before generation to decide whether the retrieved context
      is enough to answer the user's question.
  max_hops:
    label: Max retrieval hops
    help: Maximum number of retrieval iterations when the guard rejects the current
      context. Higher values may improve answers but increase latency.
  context_insufficient_prompt:
    label: Context insufficient prompt
    help: Message shown when the agent cannot find sufficient information to answer.
      Guides how the agent communicates limitations.
    default: 'Inform the user that you can not answer the question due to the following
      reason:'
