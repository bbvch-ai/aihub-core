---
steps:
  title:
    name: Générer le titre de la conversation
    description: Génère un titre court et stable résumant le sujet de la conversation
      dès le premier tour du fil de discussion.
  follow_ups:
    name: Suggérer des questions de suivi
    description: Suggère des questions de suivi que l'utilisateur pourrait vouloir
      poser ensuite, en fonction de la dernière réponse.
thoughts:
  generating_title: Je réfléchis à un titre pour cette conversation
  generating_follow_ups: Je réfléchis à des questions de suivi
default_title: Nouvelle conversation
prompts:
  title: |
    {% chat role="user" %}
    Génère un titre concis (3-6 mots) résumant le sujet de la conversation suivante. Rédige le titre
    dans la langue de la conversation. N'utilise pas de guillemets ni de ponctuation finale. Produis
    toujours un titre simple et naturel, même si la conversation n'est qu'une salutation ou une
    banalité — par exemple une simple salutation peut être titrée "Salutation" ou "Conversation
    informelle". Ne renvoie jamais un titre vide.
    <Conversation>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
    {% for block in message.blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url | string | image }}
    {% endif %}
    {% endfor %}
    </message>
    {% endfor %}
    </Conversation>
    Réponds en invoquant l'outil de sortie structurée fourni.
    {% endchat %}
  follow_ups: |-
    {% chat role="user" %}
    À partir de la conversation suivante, suggère entre une et trois questions de suivi que
    l'utilisateur pourrait vouloir poser ensuite. Formule-les du point de vue de l'utilisateur et dans
    la langue de la conversation. Renvoie une liste vide si aucune question de suivi utile n'existe.
    <Conversation>
    {% for message in chat_history %}
    <message role="{{ message.role.value }}">
    {% for block in message.blocks %}
    {% if block.block_type == 'text' %}
    {{ block.text }}
    {% endif %}
    {% if block.block_type == 'image' %}
    {{ block.url | string | image }}
    {% endif %}
    {% endfor %}
    </message>
    {% endfor %}
    </Conversation>
    Réponds en invoquant l'outil de sortie structurée fourni.
    {% endchat %}
