---
metadata:
  name: Assistant de Navigation Documentaire
  description: Assistant IA qui vous aide à trouver et sélectionner les bonnes sources
    de connaissances pour vos questions
config:
  bucket_names:
    label: Bases de connaissances
    help: Sélectionnez les bases de connaissances à interroger
  max_conversation_history_entries:
    label: Max entrées historique
  approval_message_template:
    label: Modèle de message d'approbation
defaults:
  approval_message_template: "Sur la base de votre demande, je suggère d'interroger\
    \ les sources de connaissances suivantes :\n\n{namespaces}\n\nApprouvez-vous cette\
    \ sélection ?\n"
delegation_config:
  rag_agent:
    label: Agent RAG
    help: Sélectionnez l'agent RAG auquel transmettre les requêtes
    class_placeholder: Sélectionner le type d'agent
    id_placeholder: Sélectionner l'instance de l'agent
thoughts:
  fetching_namespaces: Recherche des sources de connaissances disponibles
  starting_determination: Détermination des sources à consulter
  analyzing_request: Compréhension de votre demande
  llm_decision: '%{reasoning}'
  processing_follow_up: Traitement de votre réponse
  selection_approved: Sources confirmées
  selection_rejected: Recherche de sources alternatives
  forwarding_to_rag: Recherche d'informations pertinentes
  rag_error: "Une erreur s'est produite lors de la recherche : %{error_message}"
messages:
  determination_failed: Je n'ai pas pu déterminer quelles sources de connaissances
    consulter pour cette demande. Pourriez-vous la reformuler ou m'indiquer le sujet
    qui vous intéresse ?
  default_follow_up: Pourriez-vous fournir plus de détails sur votre demande afin
    que je puisse déterminer les sources de connaissances les plus pertinentes ?
  user_rejected_selection: J'ai rejeté la sélection de namespaces proposée. Veuillez
    suggérer d'autres namespaces.
  rag_error: Une erreur s'est produite lors du traitement de votre demande. Veuillez
    réessayer.
  invalid_selection: 'Votre sélection était invalide. Vous avez sélectionné : %{selected}.
    Les namespaces disponibles sont : %{available_namespaces}. Veuillez sélectionner
    uniquement parmi les namespaces disponibles listés.'
prompts:
  determination: "Vous êtes un assistant de sélection de namespaces. Votre tâche est\
    \ d'analyser la demande d'un utilisateur et de déterminer quelles sources de connaissances\
    \ (namespaces) seraient les plus pertinentes pour répondre à sa requête.\n\nHistorique\
    \ de la conversation :\n<conversation_history>\n{{ conversation_history }}\n</conversation_history>\n\
    \n<available_namespaces>\n{{ available_namespaces }}\n</available_namespaces>\n\
    \nInstructions :\n1. Si l'intention de l'utilisateur est suffisamment claire pour\
    \ sélectionner des namespaces spécifiques, définissez has_enough_information=true\
    \ et fournissez selected_namespaces en associant chaque bucket à exactement un\
    \ namespace.\n2. Si vous avez besoin de plus d'informations, définissez has_enough_information=false\
    \ et posez une follow_up_question.\n\nCONTRAINTES CRITIQUES :\n- Chaque bucket\
    \ DOIT avoir exactement UN namespace sélectionné - ni plus, ni moins.\n- Votre\
    \ follow_up_question DOIT lister les noms exacts des namespaces de <available_namespaces>\
    \ ci-dessus comme options.\n- N'inventez PAS de noms - utilisez uniquement les\
    \ noms réels affichés ci-dessus.\n- Incluez TOUJOURS les quatre champs - has_enough_information,\
    \ selected_namespaces, follow_up_question and reasoning - même lorsqu'une valeur\
    \ est null. N'omettez jamais un champ.\n"
steps:
  initialize_determination:
    name: Initialiser la détermination de namespace
    description: Récupère les namespaces et initialise la boucle de détermination
  determine_namespaces:
    name: Déterminer les namespaces
    description: Le LLM analyse la conversation pour déterminer les namespaces
  process_follow_up:
    name: Traiter le suivi
    description: Traite la réponse de suivi de l'utilisateur et continue la détermination
  process_approval_approved:
    name: Traiter l'approbation - Approuvé
    description: Enregistre la sélection et transmet à l'agent RAG
  process_approval_rejected:
    name: Traiter l'approbation - Rejeté
    description: Ajoute le rejet à la conversation et revient à la boucle
  rag_response:
    name: Réponse RAG
    description: Gère la réponse de l'agent RAG
  rag_error:
    name: Erreur RAG
    description: Gère l'erreur de l'agent RAG
  forward_to_rag:
    name: Transmettre au RAG
    description: Transmet la requête à l'agent RAG avec la sélection de namespace
