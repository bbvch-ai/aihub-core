---
metadata:
  name: Document Intelligence Assistant
  description: AI assistant that searches and analyzes your documents to provide informed,
    context-aware answers
config:
  number_of_input_tokens:
    label: Max input tokens
    help: Maximum number of tokens allowed in the LLM input. Limits context size to
      manage costs and avoid exceeding model limits.
  system_prompt:
    label: System prompt
    help: Instructions defining the agent's personality, role, and behavior guidelines.
      Sets the overall tone and capabilities.
    default: "<persona>\nYou are RAG Agent, a knowledge retrieval assistant. Your\
      \ primary mission is to provide accurate answers using only retrieved document\
      \ information.\n</persona>\n\n<rules>\n- MUST: Answer using ONLY retrieved context\
      \ and documents\n- MUST: Quote specific passages supporting your answer\n- NEVER:\
      \ Use general knowledge beyond provided context\n- FORBIDDEN: Speculation or\
      \ assumptions not in retrieved documents\n</rules>\n\n<instructions>\nFollow\
      \ this process:\n    1. Analyze retrieved context\n    2. Identify relevant\
      \ passages\n    3. Extract key information\n    4. Provide answer with direct\
      \ quotes.\nWhen context is insufficient, state that you cannot answer the question\
      \ with available information.\n</instructions>\n"
  context_prompt:
    label: Context prompt
    help: Template for presenting retrieved documents to the LLM. Use placeholders
      like {context} to inject retrieved content.
    default: "{% chat role=\"user\" %}\nYou are provided with additional context information\
      \ in the form of structured documents. Each document follows a\nconsistent format,\
      \ beginning with `<REFERENCE_DOCUMENT [metadata]>` and ending with `</REFERENCE_DOCUMENT>`.\
      \ These documents contain\nessential details that should be utilized to accurately\
      \ understand and respond to the user's query.\n\nEach document includes metadata\
      \ such as source, namespace, type, language, version, and timestamps. The content\n\
      within these documents provides crucial insights relevant to the given context.\n\
      \nBelow are the relevant documents:\n\n<context_documents>\n{% for block in\
      \ context_blocks %}\n{% if block.block_type == 'text' %}\n{{ block.text }}\n\
      {% endif %}\n{% if block.block_type == 'image' %}\n{{ block.url | string | image}}\n\
      {% endif %}\n{% endfor %}\n</context_documents>\n\nInstruction: Using the information\
      \ from the provided documents, generate a detailed and well-structured response\n\
      to the user's question.\n{% endchat %}\n"
  enable_user_memory_retrieval:
    label: Enable user memory retrieval
    help: Whether to retrieve user-specific memories for personalized context.
  rerank_user_memory:
    label: Rerank user memory
    help: Rerank user memory search results using the configured reranker for higher
      relevance. Adds latency and cost.
  enable_user_memory_storage:
    label: Enable user memory storage
    help: Whether to store new memories from conversations for future retrieval.
steps:
  retrieve_user_memory:
    name: Retrieve User Memory
    description: Retrieves relevant user-specific memories for personalized context
  retrieve_organization_memory:
    name: Retrieve Organization Memory
    description: Retrieves relevant organization memories (expert knowledge) based
      on user query
  add_memory_to_context:
    name: Add Memory to Context
    description: Injects user and organization memories into chat history as system
      messages
  limit_chat_history:
    name: Limit Chat History
    description: Truncates incoming chat messages to fit within the configured token
      limit
  condense_standalone_question:
    name: Condense Standalone Question
    description: Condenses the chat history and user query into a standalone question.
  few_shot_guard:
    name: Few Shot Guard
    description: Guards the question to ensure it is appropriate for the agent to
      answer.
  retrieve_nodes:
    name: Retrieve Nodes
    description: Retrieves relevant nodes from knowledge sources.
  rerank_nodes:
    name: Rerank Retrieved Nodes
    description: Reranks retrieved documents using a dedicated reranking model for
      improved relevance
  order_nodes:
    name: Order Nodes by Documents
    description: Orders the retrieved nodes by their source documents.
  context_sufficient_guard:
    name: Context Sufficient Guard
    description: Guards the context to ensure it is sufficient for generating a response.
  persist_grounding_nodes:
    name: Persist Grounding Nodes
    description: Persists this turn's top grounding documents so a follow-up question
      can reuse them.
  limit_chat_history_with_context:
    name: Limit Chat History with Context
    description: Includes the combined context and truncates chat history again.
  respond_with_llm:
    name: Respond with LLM
    description: Generates a response using the configured LLM.
  store_user_memory:
    name: Store User Memory
    description: Persists conversation learnings to long-term user memory for future
      interactions
  stop:
    name: Stop
    description: Completes the workflow after all required steps are done
