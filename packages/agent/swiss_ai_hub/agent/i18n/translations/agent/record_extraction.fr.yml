---
steps:
  plan:
    name: Planifier le tableau
    description: Détermine les documents sélectionnés et conçoit les colonnes du tableau
  extract:
    name: Extraire d'un document
    description: Lit un document et en extrait les lignes
  assemble:
    name: Assembler le tableau
    description: Réunit les lignes de tous les documents en un seul tableau
  extract_as_tool:
    name: Extraire un tableau comme outil
    description: Exécute l'extraction de tableau choisie par le modèle
  answer_tool_call:
    name: Renvoyer le tableau au modèle
    description: Renvoie le résumé du tableau à la boucle d'outils du modèle
config:
  extraction_model_name:
    label: Modèle d'extraction
    help: Le modèle qui lit chaque document et en extrait les lignes. Vide utilise
      le modèle principal.
  max_files:
    label: Fichiers par réponse
    help: Le nombre maximal de documents dont une réponse extrait. S'il y en a plus,
      l'utilisateur voit un échantillon et peut préciser sa demande ou continuer partie
      par partie.
  minutes_per_turn:
    label: Minutes par réponse
    help: Durée approximative d'extraction d'une réponse avant que le reste soit proposé
      en parties suivantes. Elle est estimée d'après la taille des documents.
  max_documents_total:
    label: Documents correspondants au maximum
    help: Au-delà, l'utilisateur est seulement invité à préciser sa demande; l'extraction
      partie par partie n'est pas proposée.
  max_rows:
    label: Lignes du tableau
    help: Le nombre maximal de lignes qu'une réponse affiche. Les autres apparaissent
      quand l'utilisateur continue; rien n'est perdu.
  max_document_chars:
    label: Document le plus long lu entièrement (caractères)
    help: Les documents plus longs ne sont lus que dans leurs parties pertinentes,
      et leurs lignes sont marquées comme partiellement lues.
  max_parallel_extractions:
    label: Appels au modèle simultanés
    help: Combien d'appels d'extraction une instance de l'agent fait en même temps.
      À réduire quand la passerelle des modèles est chargée.
tools:
  extract:
    label: Extraire un tableau
    approval: 'Extraire un tableau avec ces colonnes des documents de connaissances
      : {fields}'
    description: Extrait un tableau de nombreux documents de connaissances, une ligne
      par enregistrement trouvé, chaque ligne nommant son fichier. Utilise-le quand
      l'utilisateur veut rassembler des enregistrements à travers des documents, comme
      chaque position matérielle sur les factures 2025 d'un fournisseur ; pas pour
      une question à laquelle un document ou la recherche de connaissances répond.
      Trouve d'abord les documents avec les outils de liste et de recherche et vérifie-les
      avec select_knowledge_documents ; appelle ensuite cet outil avec les mêmes conditions.
      L'utilisateur voit le tableau directement ; tu reçois son résumé. Si plus de
      documents correspondent qu'une réponse n'en extrait, l'utilisateur reçoit un
      échantillon et décide ; ne continue que s'il est d'accord, avec continue_pending
      à true.
  select:
    label: Sélectionner des documents
    approval: 'Sélectionner des documents de connaissances pour un tableau avec ces
      colonnes : {fields}'
table:
  match: Correspondance
  match_yes: oui
  match_unsure: incertain, à vérifier
  partly_read: (lu en partie)
  collection: Collection
  path: Chemin
  filename: Fichier
summary:
  no_rows: '**Aucune ligne de :** %{files}'
  unsure: '**Incertain :** %{count} lignes ne remplissent peut-être pas la condition
    ; elles sont gardées et marquées dans la colonne Correspondance pour que vous
    les vérifiiez.'
  partly_read: '**Lu en partie (des lignes peuvent manquer) :** %{files}'
  counts: '**Fichiers :** %{files} · **Lignes trouvées :** %{rows} · **Fichiers en
    échec :** %{failed}'
  sample_counts: '**Échantillon :** %{files} des %{total} documents correspondants
    · **Lignes trouvées :** %{rows}'
  sample_counts_ceiling: '**Échantillon :** %{files} de plus de %{total} documents
    correspondants · **Lignes trouvées :** %{rows}'
  criteria: '**Sélection :** %{criteria}'
  document_rows_cut: '**Lignes omises (trop nombreuses dans un document pour une réponse)
    :** %{files}'
  document_rows_entry: '%{file} (%{count} lignes)'
  listed_more: et %{count} autres
  failed_files: "**Fichiers qui n'ont pas pu être extraits :**"
  failed_more: …et %{count} autres fichiers qui n'ont pas pu être extraits.
  no_documents: Aucun document ne correspond à la sélection, rien n'a donc été extrait.
  not_started: "Le tableau n'a pas pu être extrait : %{reason}"
  too_broad: "**%{total} documents correspondent**, plus qu'une réponse n'en extrait\
    \ (environ %{minutes} minutes au total)."
  too_broad_ceiling: '**Plus de %{total} documents correspondent.**'
  options_parts: Précisez la demande, par exemple à l'un des dossiers ou l'une des
    années ci-dessus, ou répondez *continuer* pour extraire les %{total} documents
    en %{parts} parties d'environ %{minutes} minutes chacune.
  options_narrow: "Veuillez préciser la demande, par exemple à l'un des dossiers ou\
    \ l'une des années ci-dessus : autant de documents ne sont pas extraits partie\
    \ par partie."
  part: '**Partie %{part} sur %{parts} :** documents %{first}–%{last} sur %{total}.'
  continue_parts: Répondez *continuer* pour les %{files} documents suivants (environ
    %{minutes} minutes).
  rows_follow: '%{count} autres lignes suivent ; répondez *continuer* pour les voir.'
  more_rows: '**Autres lignes** de la réponse précédente.'
  done: '**Les %{total} documents sont extraits** en %{parts} parties : %{rows} lignes
    trouvées, %{files} fichiers en échec.'
  done_short: '**%{extracted} documents sur %{total} sont extraits** en %{parts} parties
    : %{rows} lignes trouvées, %{files} fichiers en échec ; les autres ne sont plus
    disponibles dans cette conversation.'
  nothing_pending: Il n'y a aucune extraction de tableau à poursuivre dans cette conversation.
  gone: '%{count} documents ne sont plus disponibles dans cette conversation et ont
    été omis.'
  scope_changed: Les collections dont ce tableau a été extrait ne sont plus toutes
    disponibles dans cette conversation, l’extraction a donc été arrêtée. Demandez
    à nouveau pour extraire à partir de ce qui est disponible.
facets:
  folders: '**Par dossier :** %{entries}'
  years: '**Par année dans le chemin :** %{entries}'
  collections: '**Par collection :** %{entries}'
  first: Ce sont les dossiers et années des %{total} premiers documents par chemin
    ; il y en a d’autres.
progress:
  partial: '%{path} est long : seules ses parties pertinentes sont lues.'
  plan: Extraction de %{fields} de %{files} documents, environ %{minutes} minutes
    (%{criteria}).
  sample: "%{total} documents correspondent ; extraction d'un échantillon de %{files}\
    \ d'entre eux (%{fields})."
  part: 'Extraction de la partie %{part} sur %{parts} : %{files} documents, environ
    %{minutes} minutes (%{fields}).'
  extracted: '%{done} sur %{files} · %{path} : %{rows} lignes'
  failed: '%{done} sur %{files} · %{path} : échec, %{reason}'
