---
metadata:
  name: Assistant Enseignable
  description: Assistant IA qui apprend des exemples que vous fournissez pour comprendre
    comment vous souhaitez qu'il réponde
config:
  number_of_input_tokens:
    label: Tokens d'entrée max
    help: Nombre maximum de tokens autorisés dans le contexte d'entrée
steps:
  limit_chat_history:
    name: Limiter l'historique du chat
    description: Tronque les messages du chat entrants pour respecter la limite de
      jetons configurée.
  agent_suitability_guard:
    name: Vérification de l'adéquation de l'agent
    description: Vérifie si l'agent est adapté pour traiter la demande de l'utilisateur.
  condense_standalone_question:
    name: Condenser la question autonome
    description: Condense l'historique du chat et la requête de l'utilisateur en une
      question autonome.
  create_few_shot_examples:
    name: Créer des exemples Few-Shot
    description: Prépare les exemples Few-Shot et crée le contexte complet pour le
      LLM.
  respond_with_llm:
    name: Répondre avec LLM
    description: Génère une réponse en utilisant le LLM basé sur des exemples Few-Shot.
  reject_unsuitable_request:
    name: Refuser une demande inadaptée
    description: Termine l'exécution par un refus diffusé lorsque le garde d'adéquation
      rejette la demande.
thoughts:
  input_too_large: "L'entrée ne tient pas dans la fenêtre de contexte du modèle :\
    \ environ %{tokens} jetons pour un budget utilisable de %{budget}. L'appel au\
    \ modèle est refusé."
messages:
  input_too_large: "Ce message est trop long pour que je puisse le traiter. Veuillez\
    \ le raccourcir ou joindre plutôt le texte sous forme de fichier : je lis moi-même\
    \ les fichiers joints et j'utilise les parties utiles à votre question."
  unsuitable_request: Je ne suis pas le bon assistant pour cette demande, je ne peux
    donc pas y répondre. %{reason}
