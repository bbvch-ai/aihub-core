---
steps:
  title:
    name: Genera titolo della conversazione
    description: Genera un titolo breve e stabile che riassume l'argomento della conversazione
      non appena un argomento diventa identificabile.
  tags:
    name: Genera tag della conversazione
    description: Genera tag di categoria che descrivono la conversazione, aggiornati
      a ogni turno per seguire i cambiamenti di argomento.
  follow_ups:
    name: Suggerisci domande di approfondimento
    description: Suggerisce domande di approfondimento che l'utente potrebbe voler
      porre in seguito, in base all'ultima risposta.
thoughts:
  generating_title: Sto pensando a un titolo per questa conversazione
  generating_tags: Sto categorizzando questa conversazione
  suggesting_follow_ups: Sto pensando a domande di approfondimento
prompts:
  title: |
    Genera un titolo conciso (3-6 parole) che riassume l'argomento della seguente conversazione.
    Scrivi il titolo nella lingua della conversazione. Non usare virgolette o punteggiatura finale.
    Se la conversazione non ha ancora un argomento identificabile — per esempio contiene solo saluti o
    convenevoli — restituisci null invece di indovinare.
    Conversazione:
    {conversation}
  tags: |
    Genera da una a cinque brevi tag di categoria che descrivono l'argomento della seguente
    conversazione. Scrivi i tag nella lingua della conversazione. Ogni tag dovrebbe essere di una o
    due parole.
    Se la conversazione non ha ancora un argomento identificabile — per esempio contiene solo saluti o
    convenevoli — restituisci una lista vuota invece di indovinare.
    Conversazione:
    {conversation}
  follow_ups: |
    In base alla seguente conversazione, suggerisci da una a tre domande di approfondimento che
    l'utente potrebbe voler porre in seguito. Formulale dal punto di vista dell'utente e nella lingua
    della conversazione.
    Restituisci una lista vuota se non esiste alcuna domanda di approfondimento utile.
    Conversazione:
    {conversation}
config:
  generate_title:
    label: Genera titolo della conversazione
    help: Consente all'agente di generare un titolo stabile per la conversazione.
      Il titolo viene impostato una volta che un argomento è identificabile e quindi
      mantenuto per la conversazione.
  generate_tags:
    label: Genera tag della conversazione
    help: Consente all'agente di generare tag di categoria che descrivono la conversazione.
      I tag vengono aggiornati a ogni turno per riflettere i cambiamenti di argomento.
  suggest_follow_ups:
    label: Suggerisci domande di approfondimento
    help: Consente all'agente di suggerire domande di approfondimento che l'utente
      potrebbe voler porre in seguito dopo ogni risposta.
