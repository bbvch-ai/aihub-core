---
steps:
  detect:
    name: Rileva meta-domanda
    description: Classifica se il messaggio dell'utente è una domanda sull'assistente
      stesso (identità, capacità o comportamento) anziché un'attività da eseguire.
  answer:
    name: Rispondi a meta-domanda
    description: Risponde a una domanda sull'assistente utilizzando la propria configurazione
      e la definizione del flusso di lavoro.
thought:
  detecting: Sto verificando se questa è una domanda su di me
  answering: Sto rispondendo a una domanda su me stesso
detect:
  is_meta: Vero se l'utente sta chiedendo dell'assistente stesso — la sua identità,
    cosa può fare o perché si è comportato in un certo modo — anziché chiedergli di
    eseguire un'attività.
  category: L'aspetto dell'assistente a cui si riferisce la domanda - identità, capacità
    o comportamento. Nullo quando il messaggio non è una meta-domanda.
  reasoning: Breve giustificazione della classificazione.
  prompt: |
    Sei un classificatore che decide se il messaggio di un utente è una "meta-domanda"
    sull'assistente IA stesso, anziché una normale attività per l'assistente.

    Una meta-domanda è una delle seguenti:
    - identity: chi o cosa è l'assistente (es. "chi sei?", "come ti chiami?")
    - capabilities: cosa può fare l'assistente (es. "cosa puoi fare?", "puoi aiutarmi con X?")
    - behavior: perché l'assistente ha fatto qualcosa (es. "perché l'hai fatto?")

    Un messaggio NON è una meta-domanda quando chiede all'assistente di eseguire
    un'attività, rispondere a una domanda di dominio o elaborare contenuti — anche
    se contiene le parole "tu" o "fare" (es. "cosa posso fare con questo documento?"
    è un'attività normale).

    Classifica il seguente messaggio.

    Messaggio: {user_query}
answer:
  prompt: |
    Sei {agent_name}. {agent_description}

    L'utente sta facendo una domanda su di te (in particolare sulla tua {category}).
    Rispondi in modo utile e conciso, in prima persona, basandoti solo sui fatti
    seguenti. Non inventare capacità che non hai. Se non puoi rispondere sulla base
    di questi fatti, dillo chiaramente.

    Il tuo flusso di lavoro — i passaggi che esegui per gestire una richiesta — è:
    {workflow}

    Rispondi nella lingua del messaggio dell'utente.
