---
config:
  enabled:
    label: Lavorare su documenti interi
    help: Il modello può elencare i documenti delle raccolte di conoscenza, cercare
      termini esatti nel loro testo e leggerli per intero.
  path_glob:
    label: Filtro dei percorsi dei documenti
    help: Solo i documenti il cui percorso nella raccolta corrisponde a questo modello,
      ad es. invoices/2025/** o **/*.pdf. Vale solo per gli strumenti dei documenti,
      non per la ricerca nella conoscenza. Lasciare vuoto per tutti i documenti.
  semantic_search:
    label: Ordina i documenti per significato
    help: Il modello può anche ordinare per significato i documenti del filtro dei
      percorsi, e trova così documenti scritti con altre parole o in un'altra lingua
      rispetto alla richiesta.
  discovery:
    label: Cercare prima i documenti
    help: "Disattivato: viene letto ogni documento delle raccolte e del filtro di\
      \ percorso, quindi nessuno viene tralasciato; l'utente restringe nominando cartelle,\
      \ file o anni. Attivato: il modello cerca prima i documenti e vengono letti\
      \ solo quelli selezionati, il che è più veloce su raccolte grandi ma può tralasciare\
      \ documenti. Quanto a lungo può cercare lo stabiliscono Decisioni massime e\
      \ Chiamate massime sotto Tools."
tools:
  rank_knowledge_documents:
    label: Ordina documenti di conoscenza
    approval: Ordinare i documenti di conoscenza secondo quanto corrispondono a «{query}»
  list_knowledge_documents:
    label: Elenca documenti di conoscenza
    approval: Elencare i documenti di conoscenza che corrispondono a {path_glob}
  search_knowledge_content:
    label: Cerca nei documenti di conoscenza
    approval: Cercare «{query}» nei documenti di conoscenza
  read_knowledge_document:
    label: Leggi documento di conoscenza
    approval: Leggere il documento di conoscenza {document_id}
