---
steps:
  plan:
    name: Pianificare la tabella
    description: Determina i documenti selezionati e progetta le colonne della tabella
  extract:
    name: Estrarre da un documento
    description: Legge un documento ed estrae le sue righe
  assemble:
    name: Comporre la tabella
    description: Unisce le righe di tutti i documenti in un'unica tabella
  extract_as_tool:
    name: Estrarre una tabella come strumento
    description: Esegue l'estrazione di tabella scelta dal modello
  answer_tool_call:
    name: Restituire la tabella al modello
    description: Restituisce il riepilogo della tabella al ciclo di strumenti del
      modello
config:
  extraction_model_name:
    label: Modello di estrazione
    help: Il modello che legge ogni documento ed estrae le sue righe. Vuoto usa il
      modello principale.
  max_files:
    label: File per risposta
    help: Il numero massimo di documenti da cui una risposta estrae. Se ne corrispondono
      di più, l'utente vede un campione e può restringere la richiesta o continuare
      parte per parte.
  minutes_per_turn:
    label: Minuti per risposta
    help: Per quanto tempo circa una risposta può estrarre prima che il resto sia
      proposto in parti successive. Il tempo è stimato dalla dimensione dei documenti.
  max_documents_total:
    label: Documenti corrispondenti al massimo
    help: Oltre questo numero l'utente viene solo invitato a restringere la richiesta;
      l'estrazione parte per parte non viene proposta.
  max_rows:
    label: Righe della tabella
    help: Il numero massimo di righe che una risposta mostra. Le altre compaiono quando
      l'utente continua; nulla va perso.
  max_document_chars:
    label: Documento più lungo letto per intero (caratteri)
    help: I documenti più lunghi vengono letti solo nelle parti pertinenti, e le loro
      righe sono segnate come lette in parte.
  max_parallel_extractions:
    label: Chiamate al modello contemporanee
    help: Quante chiamate di estrazione un'istanza dell'agente fa allo stesso tempo.
      Ridurre quando il gateway dei modelli è occupato.
tools:
  extract:
    label: Estrai una tabella
    approval: 'Estrarre una tabella con queste colonne dai documenti di conoscenza:
      {fields}'
    description: Estrae una tabella da molti documenti di conoscenza, una riga per
      ogni record trovato, ogni riga con il suo file. Usalo quando l'utente vuole
      raccogliere record da più documenti, come ogni posizione hardware sulle fatture
      2025 di un fornitore; non per una domanda a cui risponde un documento o la ricerca
      nella conoscenza. Trova prima i documenti con gli strumenti di elenco e ricerca
      e verificali con select_knowledge_documents; poi chiama questo con le stesse
      condizioni. L'utente vede direttamente la tabella; tu ricevi il suo riepilogo.
      Se corrispondono più documenti di quanti una risposta ne estrae, l'utente riceve
      un campione e decide; continua solo se è d'accordo, con continue_pending impostato
      a true.
  select:
    label: Seleziona documenti
    approval: 'Selezionare documenti di conoscenza per una tabella con queste colonne:
      {fields}'
table:
  match: Corrispondenza
  match_yes: sì
  match_unsure: incerto, da verificare
  partly_read: (letto in parte)
  collection: Raccolta
  path: Percorso
  filename: File
summary:
  no_rows: '**Nessuna riga da:** %{files}'
  unsure: '**Incerto:** %{count} righe potrebbero non soddisfare la condizione; sono
    mantenute e segnate nella colonna Corrispondenza perché possiate verificarle.'
  partly_read: '**Letto in parte (alcune righe possono mancare):** %{files}'
  counts: '**File:** %{files} · **Righe trovate:** %{rows} · **File non riusciti:**
    %{failed}'
  sample_counts: '**Campione:** %{files} di %{total} documenti corrispondenti · **Righe
    trovate:** %{rows}'
  sample_counts_ceiling: '**Campione:** %{files} di oltre %{total} documenti corrispondenti
    · **Righe trovate:** %{rows}'
  criteria: '**Selezione:** %{criteria}'
  document_rows_cut: '**Righe omesse (troppe in un documento per una risposta):**
    %{files}'
  document_rows_entry: '%{file} (%{count} righe)'
  listed_more: e altri %{count}
  failed_files: '**File che non è stato possibile estrarre:**'
  failed_more: …e altri %{count} file che non è stato possibile estrarre.
  no_documents: Nessun documento corrisponde alla selezione, quindi non è stato estratto
    nulla.
  not_started: 'Non è stato possibile estrarre la tabella: %{reason}'
  too_broad: '**%{total} documenti corrispondono**, più di quanti una risposta ne
    estragga (circa %{minutes} minuti in totale).'
  too_broad_ceiling: '**Più di %{total} documenti corrispondono.**'
  options_parts: Restringete la richiesta, per esempio a una delle cartelle o degli
    anni sopra, oppure rispondete *continua* per estrarre tutti i %{total} documenti
    in %{parts} parti di circa %{minutes} minuti ciascuna.
  options_narrow: 'Restringete la richiesta, per esempio a una delle cartelle o degli
    anni sopra: così tanti documenti non vengono estratti parte per parte.'
  part: '**Parte %{part} di %{parts}:** documenti %{first}–%{last} di %{total}.'
  continue_parts: Rispondete *continua* per i prossimi %{files} documenti (circa %{minutes}
    minuti).
  rows_follow: Seguono altre %{count} righe; rispondete *continua* per vederle.
  more_rows: '**Altre righe** della risposta precedente.'
  done: '**Tutti i %{total} documenti sono estratti** in %{parts} parti: %{rows} righe
    trovate, %{files} file non riusciti.'
  done_short: '**%{extracted} documenti su %{total} sono estratti** in %{parts} parti:
    %{rows} righe trovate, %{files} file non riusciti; gli altri non sono più disponibili
    in questa conversazione.'
  nothing_pending: In questa conversazione non c'è nessuna estrazione di tabella da
    continuare.
  gone: '%{count} documenti non sono più disponibili in questa conversazione e sono
    stati tralasciati.'
  scope_changed: Le raccolte da cui è stata estratta questa tabella non sono più tutte
    disponibili in questa conversazione, quindi l’estrazione è stata interrotta. Chiedi
    di nuovo per estrarre da ciò che è ora disponibile.
facets:
  folders: '**Per cartella:** %{entries}'
  years: '**Per anno nel percorso:** %{entries}'
  collections: '**Per collezione:** %{entries}'
  first: Sono le cartelle e gli anni dei primi %{total} documenti per percorso; ce
    ne sono altri.
progress:
  partial: '%{path} è lungo: vengono lette solo le parti pertinenti.'
  plan: Estrazione di %{fields} da %{files} documenti, circa %{minutes} minuti (%{criteria}).
  sample: '%{total} documenti corrispondono; estrazione di un campione da %{files}
    di essi (%{fields}).'
  part: 'Estrazione della parte %{part} di %{parts}: %{files} documenti, circa %{minutes}
    minuti (%{fields}).'
  extracted: '%{done} di %{files} · %{path}: %{rows} righe'
  failed: '%{done} di %{files} · %{path}: non riuscito, %{reason}'
