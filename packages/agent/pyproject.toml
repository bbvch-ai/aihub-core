[project]
name = "swiss-ai-hub-agent"
version = "0.301.3"
description = "Swiss AI Hub Agent SDK: build transparent, workflow-based, event-driven AI agents."
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "swiss-ai-hub-core==0.301.3",
    "fastmcp>=3.0.0",
    "llama-index-llms-openai>=0.6.12",
    "llama-index-llms-azure-openai>=0.4.2",
    "stringcase>=1.2.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/bbvch-ai/aihub-core"
Repository = "https://github.com/bbvch-ai/aihub-core"
Documentation = "https://bbvch-ai.github.io/aihub-core/"
Issues = "https://github.com/bbvch-ai/aihub-core/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.agent"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "self_hosted: mark tests that use self hosted services",
    "slow: mark a test as slow",
    "integration: mark a test as an integration test",
    "experimental: mark a test as experimental",
    "flaky: mark a test as flaky (may fail intermittently)",
]
addopts = "--strict-markers"
