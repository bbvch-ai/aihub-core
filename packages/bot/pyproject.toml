[project]
name = "swiss-ai-hub-bot"
version = "0.289.21"
description = "bots core"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
    { name = "Noah Hermann", email = "noah.hermann@bbv.ch" },
]
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "swiss-ai-hub-core",
    "azure-identity>=1.19.0",
    "azure-mgmt-cosmosdb>=9.7.0",
    "azure-mgmt-resource>=23.2.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.1",
    "microsoft-agents-hosting-core>=0.5.0",
    "microsoft-agents-hosting-aiohttp>=0.5.0",
    "microsoft-agents-activity>=0.5.0",
    "microsoft-agents-authentication-msal>=0.5.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.bot"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.ty
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
markers = [
    "flaky: Tests that are unreliable or timing-dependent (skipped in CI)",
]
