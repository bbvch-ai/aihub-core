[project]
name = "swiss-ai-hub-backup"
version = "0.290.2"
description = "Backup and restore orchestration for AI-Hub data services"
requires-python = ">=3.13, <3.14"
authors = [
    { name = "Joel Barmettler", email = "joel.barmettler@bbv.ch" },
    { name = "Marius Högger", email = "marius.hoegger@bbv.ch" },
    { name = "Michèle Fundneider", email = "michele.fundneider@bbv.ch" },
    { name = "Thomas Mannhart", email = "thomas.mannhart@bbv.ch" },
]
license = "AGPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "boto3>=1.41.5",
    "clickhouse-connect>=0.15.1",
    "dagster>=1.11.2",
    "dagster-webserver>=1.11.2",
    "docker>=7.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.13.1",
    "pymilvus>=2.6.9",
    "redis>=7.3.0",
    "sqlalchemy>=2.0.48",
]

[dependency-groups]
dev = [
    "dagster-graphql>=1.12.18",
    "pymongo>=4.16.0",
    "pytest>=8.4.1",
    "pytest-postgresql>=8.0.0",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "ruff>=0.8.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "swiss_ai_hub.backup"

[tool.ruff]
line-length = 120
target-version = 'py313'

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: hermetic test using fakes; safe to run anywhere",
    "integration: requires real external services; opt-in",
]
